const STORE='b2_beruf_intensiv_de_v6';
const defaultState=()=>({startDate:new Date().toISOString().slice(0,10),xp:0,streak:1,lastStudy:null,stats:{},mastery:{},wrong:{},review:{},daily:{},writing:{},settings:{rate:1.0,intensity:75,audioMode:'natural',voiceURI:''},diagnosticDone:false});
let state=load();
let session={tasks:[],index:0,correct:0,answered:false,mode:'daily',returnView:'today'};
let currentView='home';
let speechToken=0;
let examState=null;
let timerHandle=null;

function load(){try{return Object.assign(defaultState(),JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){return defaultState()}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}refreshTop()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sample(a,n){return shuffle(a).slice(0,Math.min(n,a.length))}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function todayISO(){return new Date().toISOString().slice(0,10)}
function dayDiff(a,b){return Math.floor((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)}
function planDay(){return clamp(dayDiff(state.startDate,todayISO())+1,1,15)}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600)}
function show(id){stopSpeech();document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.v===id));currentView=id;scrollTo({top:0,behavior:'smooth'});if(id==='home')renderHome()}
function refreshTop(){const a=overallAccuracy();document.getElementById('topProgress').textContent=a.attempts?`${a.pct}% sicher`:`Tag ${planDay()}/15`}
function markStudy(){const t=todayISO();if(state.lastStudy!==t){if(state.lastStudy){const d=dayDiff(state.lastStudy,t);state.streak=d===1?(state.streak||0)+1:1}else state.streak=1;state.lastStudy=t;save()}}
function addDaysISO(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function record(cat,id,ok){markStudy();const s=state.stats[cat]||(state.stats[cat]={a:0,c:0});s.a++;if(ok)s.c++;const before=state.mastery[id]||0;state.mastery[id]=clamp(before+(ok?1:-1),0,5);state.review=state.review||{};const rv=state.review[id]||{interval:0,due:todayISO()};if(ok){const next=[1,1,2,4,7,10][state.mastery[id]]||7;rv.interval=next;rv.due=addDaysISO(todayISO(),next);if(state.mastery[id]>=2)delete state.wrong[id];state.xp+=5}else{rv.interval=0;rv.due=todayISO();state.wrong[id]=(state.wrong[id]||0)+1;state.xp+=1}state.review[id]=rv;save()}
function dueCount(){state.review=state.review||{};return Object.values(state.review).filter(x=>x&&x.due<=todayISO()).length}
function isDue(id){const r=state.review&&state.review[id];return !!(r&&r.due<=todayISO())}
function overallAccuracy(){let a=0,c=0;Object.values(state.stats).forEach(x=>{a+=x.a||0;c+=x.c||0});return{attempts:a,correct:c,pct:a?Math.round(c/a*100):0}}
function catAccuracy(cat){const s=state.stats[cat]||{a:0,c:0};return{s:s.a,pct:s.a?Math.round(s.c/s.a*100):0}}
function masteryPct(prefix){let arr=[];for(const [id,m] of Object.entries(state.mastery))if(!prefix||id.startsWith(prefix))arr.push(m);return arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/(arr.length*5)*100):0}
function dayProgress(d){const x=state.daily[d]||{};const done=Object.values(x.blocks||{}).filter(Boolean).length;return{done,total:4,pct:Math.round(done/4*100)}}
function setBlock(day,key,val=true){state.daily[day]=state.daily[day]||{blocks:{}};state.daily[day].blocks=state.daily[day].blocks||{};state.daily[day].blocks[key]=val;save()}
function phaseFor(d){if(d<=4)return'Fundament';if(d<=8)return'Anwendung';if(d<=12)return'Integration';return'Prüfungsmodus'}

function renderHome(){const d=planDay(),p=PLAN[d-1],acc=overallAccuracy(),dp=dayProgress(d),weak=getWeakAreas(),due=dueCount();document.getElementById('home').innerHTML=`
<div class="hero"><span class="eyebrow">Tag ${d} von 15 · ${phaseFor(d)}</span><h1>${esc(p.title)}</h1><p>${esc(p.focus)}. Ziel: in 15 Tagen möglichst viel sicher abrufen und unter Prüfungsdruck anwenden.</p><div class="hero-row"><button class="btn white" onclick="openToday()">▶ Tagestraining starten</button><button class="btn" style="background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.16)" onclick="startProduction(10,'home')">✎ 10-Minuten-Aktivmodus</button></div><div class="focus-strip"><div class="focus-step"><b>1</b>Wiederholen</div><div class="focus-step"><b>2</b>Abrufen</div><div class="focus-step"><b>3</b>Anwenden</div><div class="focus-step"><b>4</b>Prüfen</div></div></div>
<div class="section quick-grid"><div class="card primary-focus"><div class="section-head"><div><span class="phase-pill">Heute · ${state.settings.intensity} Min</span><h2 style="margin-top:8px">${esc(p.title)}</h2><p>${dp.done}/4 Blöcke abgeschlossen</p></div><span class="tag">${dp.pct}%</span></div><div class="bar green"><span style="width:${dp.pct}%"></span></div><div class="toolbar"><button class="btn primary" onclick="openToday()">Weiterlernen</button>${due?`<button class="btn soft" onclick="startWrongSession()">${due} fällige Wiederholungen</button>`:''}</div></div><div class="grid g2"><div class="card stat"><div><div class="metric">${acc.attempts?acc.pct+'%':'–'}</div><div class="metric-label">Trefferquote</div></div></div><div class="card stat"><div><div class="metric">${Object.keys(state.wrong).length}</div><div class="metric-label">offene Fehler</div></div></div><div class="card stat"><div><div class="metric">${due}</div><div class="metric-label">heute fällig</div></div></div><div class="card stat"><div><div class="metric">${state.streak||0}</div><div class="metric-label">Tage in Folge</div></div></div></div></div>
<div class="section"><div class="section-head"><div><h2>Schwächen zuerst</h2><p>Diese Bereiche bekommen im adaptiven Training automatisch mehr Gewicht.</p></div></div><div class="grid g3">${weak.map(w=>`<div class="card"><span class="tag">${w.pct===null?'Diagnose offen':w.pct+'%'}</span><h3 style="margin:10px 0 5px">${esc(w.label)}</h3><p class="subtle">${esc(w.hint)}</p></div>`).join('')}</div></div>
<div class="section"><div class="section-head"><div><h2>15-Tage-Sprint</h2><p>Fortschritt statt Stoffmenge: sichere Anwendung ist wichtiger als einmaliges Durchsehen.</p></div></div><div class="card"><div class="timeline">${PLAN.map((x,i)=>{let n=i+1,pr=dayProgress(n);return`<button class="dotday ${n<d||pr.pct===100?'done':''} ${n===d?'now':''}" onclick="openPlanDay(${n})">${n}</button>`}).join('')}</div></div></div>`;refreshTop()}
function getWeakAreas(){const cats=[['VerbPräp','Verben + Präpositionen','Präposition und Kasus aktiv abrufen.'],['Wortschatz','Wortschatz','Definitionen und typische Verwendung.'],['Grammatik','Grammatik','Satzbau, Konnektoren und Formen.'],['Kollokation','Nomen-Verb-Verbindungen','Feste berufliche Verbindungen automatisieren.'],['Lesen','Lesen','Schlüsselwörter, Details und Zuordnung.'],['Schreiben','Schreiben','Aufgabenpunkte, Kohärenz und B2-Strukturen aktiv anwenden.']];return cats.map(([c,l,h])=>{const a=catAccuracy(c);return{cat:c,label:l,hint:h,pct:a.s?a.pct:null,attempts:a.s}}).sort((a,b)=>(a.pct??101)-(b.pct??101)).slice(0,3)}
function openPlanDay(d){const p=PLAN[d-1],pr=dayProgress(d);document.getElementById('modalBody').innerHTML=`<div class="section-head"><div><span class="tag">Tag ${d} · ${phaseFor(d)}</span><h2 style="margin-top:8px">${esc(p.title)}</h2><p>${esc(p.focus)}</p></div><button class="back" onclick="closeModal()">×</button></div><div class="bar"><span style="width:${pr.pct}%"></span></div><div class="list" style="margin-top:14px">${p.blocks.map((b,i)=>`<div class="card" style="box-shadow:none"><b>${i+1}. ${esc(b)}</b></div>`).join('')}</div>${d===planDay()?`<div class="toolbar"><button class="btn primary" onclick="closeModal();openToday()">Heutigen Plan öffnen</button></div>`:''}`;openModal()}

return[
{key:'review',icon:'↻',min:15,title:'1 · Wiederholen',desc:dueCount()?`${dueCount()} fällige oder fehlerhafte Inhalte zuerst festigen.`:'Kurze Wiederholung bekannter Strukturen.',action:`${Object.keys(state.wrong).length?'startWrongSession()':'startAdaptive(10,\'today\')'};setBlock(${d},'review')`},
{key:'adaptive',icon:'⚡',min:25,title:'2 · Aktiv abrufen',desc:'Mischtraining mit sofortiger Rückmeldung. Ein Teil der Aufgaben muss geschrieben werden.',action:`startAdaptive(20,'today');setBlock(${d},'adaptive')`},

const MODULES=[
{id:'vp',title:'Verben + Präpositionen',icon:'🔗',count:()=>LEARN.verbPrep.length,desc:'Präposition, Kasus und da-/wo-Wörter.',prefix:'vp'},
{id:'zu',title:'zu-Infinitiv',icon:'→',count:()=>LEARN.zuInf.length,desc:'Verben, Nomen und Adjektive mit zu.',prefix:'z'},
{id:'vocab',title:'Wortschatz B2 Beruf',icon:'Aa',count:()=>LEARN.vocab.length,desc:'Arbeitswelt, Kundenservice, Personal, Logistik und mehr.',prefix:'v'},
{id:'coll',title:'Nomen-Verb-Verbindungen',icon:'◇',count:()=>LEARN.collocations.length,desc:'Feste Verbindungen für Schreiben und Sprechen.',prefix:'nv'},
{id:'grammar',title:'Grammatik B2',icon:'§',count:()=>LEARN.grammar.length,desc:'Modalverben, Konnektoren, TeKaMoLo und Präpositionen.',prefix:'g'},
{id:'modal',title:'Modalverben',icon:'M',count:()=>LEARN.modals.length,desc:'Bedeutung, Negation und typische Verwendung.',prefix:'m'}];
function openLearn(){show('learn');document.getElementById('learn').innerHTML=`<div class="backrow"><button class="back" onclick="show('home')">←</button><div><h1>Lernen</h1><div class="sub">Verstehen, dann sofort aktiv anwenden.</div></div></div><div class="grid g3">${MODULES.map(m=>`<div class="card module"><div class="ico">${m.icon}</div><h3>${m.title}</h3><p>${m.desc}</p><div class="bar" style="margin:10px 0"><span style="width:${masteryPct(m.prefix)}%"></span></div><div class="minirow"><button class="btn ghost sm" onclick="openLearnDetail('${m.id}')">Überblick</button><button class="btn primary sm" onclick="startModule('${m.id}',16)">Üben</button></div></div>`).join('')}</div><div class="section"><div class="card"><div class="section-head"><div><h2>Intelligente Wiederholung</h2><p>Offene Fehler werden häufiger abgefragt, sichere Inhalte seltener.</p></div></div><div class="toolbar"><button class="btn dark" onclick="startProduction(14,'learn')">Aktiv produzieren</button><button class="btn ghost" onclick="startWrongSession()" ${Object.keys(state.wrong).length?'':'disabled'}>${Object.keys(state.wrong).length?Object.keys(state.wrong).length+' offene Fehler wiederholen':'Noch keine offenen Fehler'}</button></div></div></div>`}
function moduleItems(id){return id==='vp'?LEARN.verbPrep:id==='zu'?LEARN.zuInf:id==='vocab'?LEARN.vocab:id==='coll'?LEARN.collocations:id==='grammar'?LEARN.grammar:LEARN.modals}
function openLearnDetail(id){show('learnDetail');const m=MODULES.find(x=>x.id===id),items=moduleItems(id);document.getElementById('learnDetail').innerHTML=`<div class="backrow"><button class="back" onclick="openLearn()">←</button><div><h1>${m.title}</h1><div class="sub">${m.desc}</div></div></div><div class="card"><div class="toolbar"><input id="learnSearch" oninput="filterLearn('${id}')" placeholder="Suchen …" style="flex:1;border:1px solid var(--line);border-radius:12px;padding:11px"><button class="btn primary sm" onclick="startModule('${id}',20)">Jetzt üben</button></div><div id="learnList" class="list">${items.slice(0,80).map(x=>learnRow(id,x)).join('')}</div></div>`}
function learnRow(id,x){if(id==='vp')return`<div class="learn-row"><div><h4>${esc(x.verb)} <span style="color:#315bd6">${esc(x.prep)}</span></h4><p>${esc(x.example)}</p></div><span class="case">${esc(x.case)}</span></div>`;if(id==='zu')return`<div class="learn-row"><div><h4>${esc(x.word)}</h4><p>${esc(x.example)}</p></div><span class="case">${esc(x.kind)}</span></div>`;if(id==='vocab')return`<div class="learn-row"><div><h4>${esc(x.de)}</h4><p>${esc(x.definition)}<br><i>${esc(x.example)}</i></p></div><span class="case">${esc(x.cat)}</span></div>`;if(id==='coll')return`<div class="learn-row"><div><h4>${esc(x.de)}</h4><p>${esc(x.example)}</p></div></div>`;if(id==='grammar')return`<div class="learn-row"><div><h4>${esc(x.topic)}</h4><p>${esc(x.prompt)} · ${esc(x.explain)}</p></div></div>`;return`<div class="learn-row"><div><h4>${esc(x.word)}</h4><p>${esc(x.rule)}<br>${x.examples.map(esc).join(' · ')}</p></div></div>`}
function filterLearn(id){const q=document.getElementById('learnSearch').value.toLowerCase(),items=moduleItems(id).filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('learnList').innerHTML=items.slice(0,100).map(x=>learnRow(id,x)).join('')}

function prepOptions(correct){const all=[...new Set(LEARN.verbPrep.map(x=>x.prep))];return shuffle([correct,...sample(all.filter(x=>x!==correct),3)]) }
function wordOptions(correct,arr,key='de'){return shuffle([correct,...sample(arr.map(x=>x[key]).filter(x=>x!==correct),3)])}
function replaceFirstWord(sentence,word,repl='___'){const w=word.replace(/^(der|die|das|den|dem|des|ein|eine|einen|einem|einer)\s+/i,'');let r=new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');return sentence.replace(r,repl)}
function splitColl(s){let a=s.trim().split(/\s+/);return{stem:a.slice(0,-1).join(' '),verb:a[a.length-1]}}
const daMap={an:['woran','daran'],auf:['worauf','darauf'],aus:['woraus','daraus'],bei:['wobei','dabei'],für:['wofür','dafür'],gegen:['wogegen','dagegen'],in:['worin','darin'],mit:['womit','damit'],nach:['wonach','danach'],über:['worüber','darüber'],von:['wovon','davon'],vor:['wovor','davor'],zu:['wozu','dazu']};
function makeVpTask(x,variant){if(variant%3===0)return{id:'t-'+x.id+'-p',cat:'VerbPräp',kind:'Präposition',prompt:`Welche Präposition gehört in dieser Bedeutung zu „${x.verb}“?`,example:x.example,options:prepOptions(x.prep),answer:x.prep,explain:`${x.verb} ${x.prep} + ${x.case}`};if(variant%3===1)return{id:'t-'+x.id+'-k',cat:'VerbPräp',kind:'Kasus',prompt:`Welchen Kasus verlangt „${x.verb} ${x.prep}“?`,example:x.example,options:shuffle(['Akkusativ','Dativ']),answer:x.case,explain:`Die feste Verbindung lautet: ${x.verb} ${x.prep} + ${x.case}.`};let dm=daMap[x.prep];if(dm)return{id:'t-'+x.id+'-d',cat:'VerbPräp',kind:'da-/wo-Wort',prompt:`Bei einer Sache: Welche Frageform gehört zu „${x.prep}“?`,example:`${x.verb} ${x.prep} …`,options:shuffle([dm[0],...sample(Object.values(daMap).map(v=>v[0]).filter(v=>v!==dm[0]),3)]),answer:dm[0],explain:`Frage: ${dm[0]} …? · Antwort: ${dm[1]} …`};return makeVpTask(x,0)}
function makeVocabTask(x,variant){if(variant%2===0)return{id:'t-'+x.id+'-d',cat:'Wortschatz',kind:x.cat,prompt:x.definition,options:wordOptions(x.de,LEARN.vocab),answer:x.de,explain:x.example};let cl=replaceFirstWord(x.example,x.de);return{id:'t-'+x.id+'-c',cat:'Wortschatz',kind:x.cat,prompt:'Welcher Begriff passt in den Beispielsatz?',example:cl,options:wordOptions(x.de,LEARN.vocab),answer:x.de,explain:`${x.de}: ${x.definition}`}}
function makeCollTask(x){const s=splitColl(x.de),verbs=LEARN.collocations.map(y=>splitColl(y.de).verb);return{id:'t-'+x.id,cat:'Kollokation',kind:'Nomen-Verb-Verbindung',prompt:`Ergänzen Sie die feste Verbindung: ${s.stem} ___`,example:x.example,options:shuffle([s.verb,...sample(verbs.filter(v=>v!==s.verb),3)]),answer:s.verb,explain:x.de}}
function makeZuTask(x){const pool=LEARN.zuInf.filter(y=>y.kind===x.kind);return{id:'t-'+x.id,cat:'Grammatik',kind:'zu-Infinitiv',prompt:`Welches ${x.kind.toLowerCase()} passt zu diesem Beispielsatz?`,example:x.example,options:wordOptions(x.word,pool,'word'),answer:x.word,explain:`${x.word} + zu-Infinitiv`}}
function makeGrammarTask(x){return{id:'t-'+x.id,cat:'Grammatik',kind:x.topic,prompt:x.prompt,options:x.options,answer:x.answer,explain:x.explain}}
function makeModalTask(x){const others=LEARN.modals.filter(y=>y.id!==x.id);return{id:'t-'+x.id,cat:'Grammatik',kind:'Modalverben',prompt:x.rule,example:x.examples[0],options:shuffle([x.word,...sample(others.map(y=>y.word),3)]),answer:x.word,explain:x.examples.join(' · ')}}
function allGeneratedTasks(){let a=[];LEARN.verbPrep.forEach((x,i)=>a.push(makeVpTask(x,i)));LEARN.vocab.forEach((x,i)=>a.push(makeVocabTask(x,i)));LEARN.collocations.forEach(x=>a.push(makeCollTask(x)));LEARN.zuInf.forEach(x=>a.push(makeZuTask(x)));LEARN.grammar.forEach(x=>a.push(makeGrammarTask(x)));LEARN.modals.forEach(x=>a.push(makeModalTask(x)));return a}
function productionTasks(){let a=[];LEARN.verbPrep.forEach(x=>a.push({id:'prod-'+x.id,cat:'VerbPräp',kind:'Aktiv produzieren',prompt:`Ergänzen Sie nur die Präposition: ${x.verb} ___`,example:x.example,input:true,answer:x.prep,explain:`${x.verb} ${x.prep} + ${x.case}`}));LEARN.collocations.forEach(x=>{const s=splitColl(x.de);a.push({id:'prod-'+x.id,cat:'Kollokation',kind:'Aktiv produzieren',prompt:`Ergänzen Sie das Verb: ${s.stem} ___`,example:x.example,input:true,answer:s.verb,explain:x.de})});LEARN.vocab.forEach(x=>a.push({id:'prod-'+x.id,cat:'Wortschatz',kind:'Aktiv produzieren',prompt:x.definition,example:'Schreiben Sie den deutschen Begriff.',input:true,answer:x.de,explain:x.example}));return a}
function startProduction(n=14,ret='today'){startSession(weightedTasks(productionTasks(),n),'production',ret)}
function weightedTasks(pool,n){return shuffle(pool).sort((a,b)=>{const sa=(state.mastery[a.id]||0)+(state.wrong[a.id]?-4:0)+(isDue(a.id)?-3:0),sb=(state.mastery[b.id]||0)+(state.wrong[b.id]?-4:0)+(isDue(b.id)?-3:0);return sa-sb}).slice(0,n)}
function startAdaptive(n=20,ret='today'){let rec=weightedTasks(allGeneratedTasks(),Math.ceil(n*.65)),prod=weightedTasks(productionTasks(),Math.floor(n*.35));startSession(shuffle([...rec,...prod]),'daily',ret)}
function startModule(id,n=16){let items=moduleItems(id),tasks=[];if(id==='vp')items.forEach((x,i)=>tasks.push(makeVpTask(x,i)));else if(id==='vocab')items.forEach((x,i)=>tasks.push(makeVocabTask(x,i)));else if(id==='coll')items.forEach(x=>tasks.push(makeCollTask(x)));else if(id==='zu')items.forEach(x=>tasks.push(makeZuTask(x)));else if(id==='grammar')items.forEach(x=>tasks.push(makeGrammarTask(x)));else items.forEach(x=>tasks.push(makeModalTask(x)));startSession(weightedTasks(tasks,n),'module','learn')}
function startWrongSession(){const ids=new Set(Object.keys(state.wrong));let pool=allGeneratedTasks().filter(t=>ids.has(t.id)||[...ids].some(id=>t.id.includes(id.replace(/^t-/,''))));if(!pool.length)pool=weightedTasks(allGeneratedTasks(),12);startSession(pool.slice(0,20),'wrong',currentView==='home'?'home':'today')}
function startDiagnostic(){let pool=[...sample(LEARN.verbPrep,5).map((x,i)=>makeVpTask(x,i)),...sample(LEARN.vocab,5).map((x,i)=>makeVocabTask(x,i)),...sample(LEARN.collocations,3).map(makeCollTask),...sample(LEARN.grammar,5).map(makeGrammarTask),...sample(LEARN.zuInf,2).map(makeZuTask)];startSession(shuffle(pool),'diagnostic','today')}
function startSession(tasks,mode='daily',ret='today'){session={tasks,index:0,correct:0,answered:false,mode,returnView:ret};show('session');renderSession()}
function renderSession(){const root=document.getElementById('session');if(session.index>=session.tasks.length){const pct=session.tasks.length?Math.round(session.correct/session.tasks.length*100):0;if(session.mode==='diagnostic'){state.diagnosticDone=true;save()}root.innerHTML=`<div class="session-shell"><div class="qcard" style="text-align:center"><span class="tag">Training beendet</span><div class="score">${pct}%</div><h2>${session.correct} von ${session.tasks.length} richtig</h2><div class="mini-kpi" style="justify-content:center"><span>${Object.keys(state.wrong).length} offene Fehler</span><span>${dueCount()} heute fällig</span><span>+${session.correct*5} Lernpunkte möglich</span></div><p class="subtle">Die App plant schwierige Inhalte automatisch früher wieder ein. Heute falsch beantwortete Inhalte werden noch einmal priorisiert.</p><div class="toolbar" style="justify-content:center"><button class="btn primary" onclick="${session.returnView==='home'?"show('home')":session.returnView==='learn'?"openLearn()":"openToday()"}">Weiter</button>${Object.keys(state.wrong).length?`<button class="btn ghost" onclick="startWrongSession()">Fehler wiederholen</button>`:''}</div></div></div>`;return}const t=session.tasks[session.index],pct=Math.round(session.index/session.tasks.length*100);root.innerHTML=`<div class="session-shell"><div class="backrow"><button class="back" onclick="${session.returnView==='home'?"show('home')":session.returnView==='learn'?"openLearn()":"openToday()"}">←</button><div style="flex:1"><b>${session.mode==='diagnostic'?'Standortbestimmung':session.mode==='production'?'Produktivtraining':'Aktives Training'}</b><div class="sub">Erst abrufen, dann Rückmeldung. Keine Lösung vor der eigenen Antwort.</div></div><span class="tag">${session.index+1}/${session.tasks.length}</span></div><div class="session-top"><div class="bar"><span style="width:${pct}%"></span></div></div><div class="qcard"><div class="qmeta"><span class="qkind">${esc(t.kind)}</span><span class="qcount">${esc(t.cat)}</span></div><div class="question">${esc(t.prompt)}</div>${t.example?`<div class="example">${esc(t.example)}</div>`:''}${t.input?`<div class="text-answer"><input id="prodInput" class="prod-input" autocomplete="off" autocapitalize="none" placeholder="Antwort eingeben …" onkeydown="if(event.key==='Enter')answerTextTask()"><button class="btn primary" onclick="answerTextTask()">Prüfen</button></div><div class="session-note">Tipp: Schreiben zwingt zum aktiven Abruf und wird deshalb häufiger eingesetzt, sobald ein Inhalt bekannt ist.</div>`:`<div class="options">${t.options.map((o,i)=>`<button class="opt" onclick="answerTask(${i})"><span class="ol">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div>`}<div id="feedback" class="feedback"></div><div id="nextbar" class="nextbar"><button class="btn primary" onclick="nextTask()">Weiter →</button></div></div></div>`;if(t.input)setTimeout(()=>document.getElementById('prodInput')?.focus(),80)}
function answerTextTask(){if(session.answered)return;const inp=document.getElementById('prodInput');const val=inp.value.trim();if(!val)return;session.answered=true;const t=session.tasks[session.index],ok=norm(val)===norm(t.answer);if(ok)session.correct++;inp.disabled=true;inp.style.borderColor=ok?'#30a780':'#df6b7d';const f=document.getElementById('feedback');f.className='feedback show '+(ok?'ok':'no');f.innerHTML=`<b>${ok?'Richtig':'Noch nicht'}</b>${ok?'':`Ihre Antwort: ${esc(val)}<br>`}${esc(t.explain||('Lösung: '+t.answer))}`;document.getElementById('nextbar').classList.add('show');record(t.cat,t.id,ok)}
function answerTask(i){if(session.answered)return;session.answered=true;const t=session.tasks[session.index],opts=[...document.querySelectorAll('#session .opt')],chosen=t.options[i],ok=norm(chosen)===norm(t.answer);if(ok)session.correct++;opts.forEach((b,idx)=>{b.disabled=true;if(norm(t.options[idx])===norm(t.answer))b.classList.add('correct');else if(idx===i)b.classList.add('wrong')});const f=document.getElementById('feedback');f.className='feedback show '+(ok?'ok':'no');f.innerHTML=`<b>${ok?'Richtig':'Noch nicht'}</b>${esc(t.explain||('Lösung: '+t.answer))}`;document.getElementById('nextbar').classList.add('show');record(t.cat,t.id,ok)}
function nextTask(){session.index++;session.answered=false;renderSession()}
function norm(s){return String(s??'').trim().toLowerCase().replace(/[.!,;:]/g,'').replace(/\s+/g,' ')}

let hPart='teil1',hEx=0,hTrack=0,hAnswered={};
function openHoeren(part='teil1'){show('hoeren');hPart=part;hEx=0;hTrack=0;hAnswered={};renderHoerenShell()}
function renderHoerenShell(){const root=document.getElementById('hoeren');root.innerHTML=`<div class="backrow"><button class="back" onclick="show('home')">←</button><div><h1>Hören</h1><div class="sub">Natürliche Gerätestimme zuerst · Offline-Audio nur als Reserve.</div></div></div><div class="card voice-panel" style="margin-bottom:12px"><div class="voice-grid"><div><span class="audio-ok natural">● Natürlich</span><h3 style="margin:8px 0 4px">Deutsch hören wie im Alltag</h3><div class="audio-help">Die App nutzt bevorzugt die beste deutsche Stimme Ihres Geräts. Falls keine gute Stimme verfügbar ist, bleibt das integrierte Offline-Audio als Reserve erhalten.</div></div><div class="voice-controls"><label class="voice-label">Audiomodus<select id="audioModeSelect" class="select" onchange="setAudioMode(this.value)"><option value="natural" ${state.settings.audioMode!=='offline'?'selected':''}>Natürlich · Gerätestimme</option><option value="offline" ${state.settings.audioMode==='offline'?'selected':''}>Offline · Reserve</option></select></label><label class="voice-label">Deutsche Stimme<select id="voiceSelect" class="select" onchange="setVoice(this.value)"><option>Stimmen werden geladen …</option></select></label><div class="toolbar" style="margin:0"><button class="btn dark sm" onclick="testNaturalVoice()">▶ Stimme testen</button><button class="btn ghost sm" onclick="playOfflineTest()">Offline testen</button></div></div></div><div id="voiceStatus" class="voice-status"></div></div><div class="tabs">${['teil1','teil2','teil3','teil4','telefonnotiz'].map(k=>`<button class="tab ${hPart===k?'active':''}" onclick="hPart='${k}';hEx=0;hTrack=0;hAnswered={};renderHoerenShell()">${hLabel(k)}</button>`).join('')}</div><div class="hearing-tools"><button class="hearing-tool" onclick="renderHBody()"><b>Prüfungstraining</b><span>Audio → Antwort → Transkript</span></button><button class="hearing-tool" onclick="toast('Nach der Auswertung: Transkript öffnen und direkt mitsprechen.')"><b>Shadowing</b><span>Hören + gleichzeitig nachsprechen</span></button><button class="hearing-tool" onclick="toast('Beim ersten Hören nur 3–5 Schlüsselwörter notieren.')"><b>Notiztechnik</b><span>Details filtern statt alles verstehen</span></button></div><div id="hbody"></div>`;renderHBody();setTimeout(populateVoiceSelect,80);setTimeout(populateVoiceSelect,900)}
function hLabel(k){return({teil1:'Teil 1',teil2:'Teil 2',teil3:'Teil 3',teil4:'Teil 4',telefonnotiz:'Telefonnotiz'})[k]}
function navSet(arr){return`<div class="toolbar"><button class="btn ghost sm" onclick="hEx=Math.max(0,hEx-1);hTrack=0;hAnswered={};renderHBody()">← Vorherige</button><span class="tag">Variante ${hEx+1}/${arr.length}</span><button class="btn ghost sm" onclick="hEx=Math.min(${arr.length-1},hEx+1);hTrack=0;hAnswered={};renderHBody()">Nächste →</button></div>`}
function renderHBody(){stopSpeech();const root=document.getElementById('hbody'),arr=HOEREN[hPart];if(hPart==='telefonnotiz'){const ex=arr[hEx],akey=`telefonnotiz-${hEx}-0`;root.innerHTML=navSet(arr)+`<div class="qcard"><div class="qmeta"><span class="qkind">Telefonnotiz</span><span class="qcount">Quelle: Seite ${ex.page}</span></div>${audioBox(ex.transcript,'tn',akey)}<p class="subtle">Notieren Sie Name, Telefonnummer, wichtige Informationen und die zu erledigende Aufgabe.</p><textarea id="tnNote" class="writing" placeholder="Name:\nTelefonnummer:\nWeitere Informationen:\n• …\nZu erledigen: …"></textarea><div class="toolbar"><button class="btn primary" onclick="revealPhone()">Mit Muster vergleichen</button></div><div id="tnSolution" class="source locked"></div></div>`;return}
const ex=arr[hEx];if(hPart==='teil3'){const akey=`teil3-${hEx}-0`;root.innerHTML=navSet(arr)+`<div class="qcard"><div class="qmeta"><span class="qkind">${hLabel(hPart)}</span><span class="qcount">Seiten ${ex.pages.join('–')}</span></div>${audioBox(ex.transcript,'h3',akey)}<div class="notice">Erstes Hören: nur Kernaussagen. Zweites Hören im Training: Details prüfen. Im Prüfungsmodus gelten die dortigen Regeln.</div>${ex.questions.map(q=>hQuestion(q,'h3:'+q.n)).join('')}<div id="trWrap" class="locked"><div class="divider"></div><button class="btn ghost sm" onclick="toggleTranscript()">Transkript ein-/ausblenden</button><button class="btn soft sm" onclick="toggleTranscript();playBestAudio('${akey}','h3')">▶ Shadowing</button><div id="transcript" class="source locked" style="margin-top:10px">${esc(ex.transcript)}</div></div></div>`;return}
const tracks=ex.tracks||[],tr=tracks[hTrack],akey=`${hPart}-${hEx}-${hTrack}`;root.innerHTML=navSet(arr)+`<div class="qcard"><div class="qmeta"><span class="qkind">${hLabel(hPart)}</span><span class="qcount">Audio ${hTrack+1}/${tracks.length}</span></div>${audioBox(tr.transcript,'htrack',akey)}${hPart==='teil2'?`<div class="question" style="font-size:18px">Welche Aussage passt am besten?</div>${hOptionsQuestion(tr,ex.options,'ht:'+tr.n)}`:hPart==='teil1'?tr.questions.map(q=>hQuestion(q,'ht:'+q.n)).join(''):hQuestion(tr.question,'ht:'+tr.n)}<div id="trWrap" class="locked"><div class="divider"></div><button class="btn ghost sm" onclick="toggleTranscript()">Transkript ein-/ausblenden</button><button class="btn soft sm" onclick="toggleTranscript();playBestAudio('${akey}','htrack')">▶ Shadowing</button><div id="transcript" class="source locked" style="margin-top:10px">${esc(tr.transcript)}</div></div><div class="toolbar"><button class="btn ghost sm" onclick="hTrack=Math.max(0,hTrack-1);renderHBody()">← Audio</button><button class="btn primary sm" onclick="hTrack=Math.min(${tracks.length-1},hTrack+1);renderHBody()">Nächstes Audio →</button></div></div>`}
function audioBox(text,id,key){const has=!!AUDIO_DATA[key],mode=state.settings.audioMode||'natural';return`<div class="audio-box ${mode==='natural'?'natural-mode':''}" id="audio-${id}" data-text="${escAttr(text)}" data-key="${key}"><div class="audio-native"><div class="audio-main"><button id="play-${id}" class="btn dark sm audio-play" onclick="playBestAudio('${key}','${id}')">▶ Abspielen</button><button class="btn ghost sm" onclick="pauseAudio('${id}')">Ⅱ Pause</button><select class="select" onchange="setAudioRate('${id}',this.value);state.settings.rate=Number(this.value);save()"><option value="0.9" ${state.settings.rate===.9?'selected':''}>0,9×</option><option value="1" ${state.settings.rate===1?'selected':''}>1,0×</option><option value="1.1" ${state.settings.rate===1.1?'selected':''}>1,1×</option></select><span class="audio-ok" id="mode-${id}">${mode==='natural'?'Gerätestimme':(has?'offline':'TTS')}</span></div><div class="audio-main"><div class="audio-track"><span id="ap-${id}"></span></div><span class="audio-time" id="at-${id}">${mode==='natural'?'Natürlich':'00:00 / --:--'}</span></div><audio id="player-${id}" preload="metadata" ${has?`src="${AUDIO_DATA[key]}"`:''}></audio></div></div>`}
function escAttr(x){return String(x??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'&#10;')}
function fmtTime(x){if(!isFinite(x))return'--:--';const m=Math.floor(x/60),s=Math.floor(x%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function bindPlayer(id,a){if(a.dataset.bound)return;a.dataset.bound='1';a.onloadedmetadata=()=>{document.getElementById('at-'+id).textContent=`00:00 / ${fmtTime(a.duration)}`};a.ontimeupdate=()=>{const p=a.duration?(a.currentTime/a.duration*100):0;const bar=document.getElementById('ap-'+id);if(bar)bar.style.width=p+'%';const t=document.getElementById('at-'+id);if(t)t.textContent=`${fmtTime(a.currentTime)} / ${fmtTime(a.duration)}`};a.onplay=()=>document.getElementById('audio-'+id)?.classList.add('playing');a.onpause=()=>document.getElementById('audio-'+id)?.classList.remove('playing');a.onended=()=>document.getElementById('audio-'+id)?.classList.remove('playing')}
let naturalVoiceStarted=false,naturalVoiceTimer=null,naturalSpeakerVoices=[];
function getGermanVoices(){if(!('speechSynthesis' in window))return[];return speechSynthesis.getVoices().filter(v=>/^de([_-]|$)/i.test(v.lang||''))}
function voiceScore(v){const n=(v.name||'').toLowerCase();let x=0;if(/google/.test(n))x+=50;if(/microsoft/.test(n))x+=45;if(/neural|natural|premium|enhanced/.test(n))x+=40;if(/samsung/.test(n))x+=28;if(/anna|katja|conrad|vicki|markus|petra/.test(n))x+=22;if(v.lang==='de-DE')x+=15;if(v.localService===false)x+=8;if(/espeak|pico|festival/.test(n))x-=80;return x}
function sortedGermanVoices(){return getGermanVoices().sort((a,b)=>voiceScore(b)-voiceScore(a))}
function preferredVoice(){const vs=sortedGermanVoices();if(!vs.length)return null;const saved=state.settings.voiceURI;return vs.find(v=>v.voiceURI===saved)||vs[0]}
function populateVoiceSelect(){const el=document.getElementById('voiceSelect'),st=document.getElementById('voiceStatus');if(!el)return;const vs=sortedGermanVoices();el.innerHTML='';if(!vs.length){el.innerHTML='<option value="">Keine deutsche Gerätestimme gefunden</option>';if(st)st.innerHTML='<b>Hinweis:</b> Die App kann weiterhin das Offline-Audio verwenden. Für eine natürlichere Stimme können Sie in den Android-Einstellungen unter Sprachausgabe eine deutsche Stimme installieren.';return}vs.forEach((v,i)=>{const o=document.createElement('option');o.value=v.voiceURI;o.textContent=(i===0?'★ ':'')+v.name+' · '+v.lang;el.appendChild(o)});const pv=preferredVoice();if(pv)el.value=pv.voiceURI;if(st)st.innerHTML=`Gefunden: <b>${vs.length}</b> deutsche Stimme${vs.length===1?'':'n'}. Bevorzugt: <b>${esc(pv?.name||'')}</b>.`}
function setAudioMode(v){state.settings.audioMode=v;save();stopSpeech();renderHBody();toast(v==='natural'?'Natürliche Gerätestimme aktiviert.':'Offline-Audio aktiviert.')}
function setVoice(uri){state.settings.voiceURI=uri;save();toast('Stimme gespeichert.')}
function testNaturalVoice(){stopSpeech();const text='Guten Tag. Dies ist ein Test der natürlichen deutschen Stimme. Heute trainieren wir Hörverstehen für den Beruf.';speakNatural(text,'naturaltest','system-test')}
function playOfflineTest(){state.settings.audioMode='offline';save();playAudioKey('system-test','systemtest',true);setTimeout(()=>{state.settings.audioMode='natural';save()},50)}
function playBestAudio(key,id){stopSpeech();const box=document.getElementById('audio-'+id),text=box?.dataset.text||'';if((state.settings.audioMode||'natural')==='natural'&&text){speakNatural(text,id,key);return}playAudioKey(key,id,true)}
function splitSpeech(text){const raw=String(text||'').split(/\n+/).map(x=>x.trim()).filter(Boolean),out=[];for(const line of raw){const m=line.match(/^([^:]{1,28}):\s*(.+)$/);const speaker=m?m[1].trim():'';const body=m?m[2].trim():line;const sentences=body.match(/[^.!?]+[.!?]?/g)||[body];for(const sent of sentences){const t=sent.trim();if(t)out.push({speaker,text:t})}}return out}
function speakNatural(text,id,fallbackKey){if(!('speechSynthesis'in window)){playAudioKey(fallbackKey,id,true);return}const vs=sortedGermanVoices();if(!vs.length){playAudioKey(fallbackKey,id,true);return}const chunks=splitSpeech(text);if(!chunks.length)return;naturalVoiceStarted=false;naturalSpeakerVoices=[];const speakers=[...new Set(chunks.map(c=>c.speaker).filter(Boolean))];speakers.forEach((sp,i)=>naturalSpeakerVoices.push([sp,vs[i%Math.min(vs.length,3)]]));const chosen=preferredVoice()||vs[0],box=document.getElementById('audio-'+id),mode=document.getElementById('mode-'+id),tm=document.getElementById('at-'+id);if(box)box.classList.add('playing');if(mode)mode.textContent='natürlich';if(tm)tm.textContent=chosen.name||'Deutsch';let ended=0;chunks.forEach((c,idx)=>{const u=new SpeechSynthesisUtterance(c.text);u.lang='de-DE';const mapped=naturalSpeakerVoices.find(x=>x[0]===c.speaker)?.[1];u.voice=mapped||chosen;u.rate=Math.max(.82,Math.min(1.15,(state.settings.rate||1)*.97));u.pitch=c.speaker&&speakers.length>1?(speakers.indexOf(c.speaker)%2?1.04:.98):1;u.volume=1;u.onstart=()=>{naturalVoiceStarted=true;if(naturalVoiceTimer){clearTimeout(naturalVoiceTimer);naturalVoiceTimer=null}};u.onend=()=>{ended++;if(ended>=chunks.length){box?.classList.remove('playing');if(tm)tm.textContent='Natürlich'}};u.onerror=()=>{if(!naturalVoiceStarted){speechSynthesis.cancel();playAudioKey(fallbackKey,id,true)}};speechSynthesis.speak(u)});naturalVoiceTimer=setTimeout(()=>{if(!naturalVoiceStarted){try{speechSynthesis.cancel()}catch(e){}playAudioKey(fallbackKey,id,true);toast('Gerätestimme nicht verfügbar · Offline-Audio verwendet.')}},2200)}
function playAudioKey(key,id,forceOffline=false){stopSpeech(false);const a=document.getElementById('player-'+id);if(a&&AUDIO_DATA[key]){bindPlayer(id,a);a.playbackRate=state.settings.rate||1;const mode=document.getElementById('mode-'+id),tm=document.getElementById('at-'+id);if(mode)mode.textContent='offline';a.play().catch(()=>toast('Audio konnte nicht gestartet werden. Bitte Medienlautstärke prüfen.'));return}if(AUDIO_DATA[key]){const temp=new Audio(AUDIO_DATA[key]);temp.playbackRate=state.settings.rate||1;temp.play().catch(()=>toast('Audio konnte nicht gestartet werden.'));window.__tempAudio=temp;return}toast('Für dieses Audio ist keine Datei verfügbar.')}
function pauseAudio(id){if('speechSynthesis'in window)speechSynthesis.pause();const a=document.getElementById('player-'+id);if(a)a.pause();if(window.__tempAudio)window.__tempAudio.pause();document.getElementById('audio-'+id)?.classList.remove('playing')}
function setAudioRate(id,val){const a=document.getElementById('player-'+id);if(a)a.playbackRate=Number(val)}
function speakText(text,id){speakNatural(text,id,'system-test')}
function stopSpeech(cancelAll=true){if(naturalVoiceTimer){clearTimeout(naturalVoiceTimer);naturalVoiceTimer=null}if('speechSynthesis'in window){try{speechSynthesis.cancel()}catch(e){}}document.querySelectorAll('audio').forEach(a=>{try{a.pause()}catch(e){}});if(window.__tempAudio){try{window.__tempAudio.pause()}catch(e){}}document.querySelectorAll('.audio-box').forEach(x=>x.classList.remove('playing'))}
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=()=>populateVoiceSelect()}
function hQuestion(q,key){if(q.type==='tf')return`<div style="margin-top:16px"><div class="question" style="font-size:18px">${q.n}. ${esc(q.text)}</div><div class="options"><button class="opt" onclick="answerH('${key}','richtig','${q.answer}',this)"><span class="ol">R</span>Richtig</button><button class="opt" onclick="answerH('${key}','falsch','${q.answer}',this)"><span class="ol">F</span>Falsch</button></div><div id="fb-${cssKey(key)}" class="feedback"></div></div>`;return`<div style="margin-top:16px"><div class="question" style="font-size:18px">${q.n}. ${esc(q.text)}</div><div class="options">${q.options.map((o,i)=>`<button class="opt" onclick="answerH('${key}','${o.key}','${q.answer}',this)"><span class="ol">${o.key.toUpperCase()}</span>${esc(o.text)}</button>`).join('')}</div><div id="fb-${cssKey(key)}" class="feedback"></div></div>`}
function hOptionsQuestion(tr,opts,key){return`<div class="options">${opts.map(o=>`<button class="opt" onclick="answerH('${key}','${o.key}','${tr.answer}',this)"><span class="ol">${o.key.toUpperCase()}</span>${esc(o.text)}</button>`).join('')}</div><div id="fb-${cssKey(key)}" class="feedback"></div>`}
function cssKey(k){return k.replace(/[^a-zA-Z0-9_-]/g,'_')}
function answerH(key,val,answer,el){if(hAnswered[key])return;hAnswered[key]=true;const box=el.parentElement,buttons=[...box.querySelectorAll('.opt')],clicked=el,ok=norm(val)===norm(answer);buttons.forEach(b=>{b.disabled=true;const txt=b.querySelector('.ol')?.textContent.toLowerCase();let bv=txt==='r'?'richtig':txt==='f'?'falsch':txt;if(norm(bv)===norm(answer))b.classList.add('correct')});if(!ok)clicked.classList.add('wrong');const f=document.getElementById('fb-'+cssKey(key));f.className='feedback show '+(ok?'ok':'no');f.innerHTML=`<b>${ok?'Richtig':'Noch nicht'}</b>Lösung: ${esc(String(answer).toUpperCase())}`;const totalFb=document.querySelectorAll('#hbody .feedback').length,doneFb=document.querySelectorAll('#hbody .feedback.show').length;if(totalFb&&doneFb===totalFb)document.getElementById('trWrap')?.classList.add('open');record('Hören','hear-'+hPart+'-'+hEx+'-'+key,ok)}
function toggleTranscript(){document.getElementById('transcript')?.classList.toggle('open')}
function revealPhone(){const note=document.getElementById('tnNote').value.trim();if(note.length<15){toast('Notieren Sie zuerst die wichtigsten Informationen.');return}const ex=HOEREN.telefonnotiz[hEx],sol=document.getElementById('tnSolution');sol.textContent=ex.solution;sol.classList.add('open');record('Hören','phone-'+ex.id,note.length>40)}

const OMAP={l1:['Lesen Teil 1',()=>DATA.lesen1],l2:['Lesen Teil 2',()=>DATA.lesen2],l3:['Lesen Teil 3',()=>DATA.lesen3],l4:['Lesen Teil 4',()=>DATA.lesen4],bl:['Beschwerde Lesen',()=>DATA.beschwerdeLesen],sb1:['Sprachbausteine 1',()=>DATA.sprach1],sb2:['Sprachbausteine 2',()=>DATA.sprach2]};
function renderOriginal(){const [label,fn]=OMAP[origPart],arr=fn(),ex=arr[origIndex];document.getElementById('original').innerHTML=`<div class="backrow"><button class="back" onclick="openExam()">←</button><div><h1>${label}</h1><div class="sub">Originalmaterial aus der hochgeladenen Prüfungssammlung. Quelle und Seite bleiben sichtbar.</div></div></div><div class="tabs">${Object.keys(OMAP).map(k=>`<button class="tab ${origPart===k?'active':''}" onclick="origPart='${k}';origIndex=0;origAnswers={};renderOriginal()">${OMAP[k][0]}</button>`).join('')}</div><div class="toolbar"><button class="btn ghost sm" onclick="origIndex=Math.max(0,origIndex-1);origAnswers={};renderOriginal()">← Vorherige</button><span class="tag">${origIndex+1}/${arr.length}</span><button class="btn ghost sm" onclick="origIndex=Math.min(${arr.length-1},origIndex+1);origAnswers={};renderOriginal()">Nächste →</button></div>${renderOriginalExercise(ex)}`}
function renderOriginalExercise(ex){let page=ex.page||ex.pages?.join('–')||'–';if(origPart==='l1')return`<div class="grid g2"><div class="card"><span class="tag">Seite ${page}</span><h3>Situationen</h3>${ex.questions.map(q=>`<div style="padding:9px 0;border-top:1px solid var(--line)"><b>${q.n}.</b> ${esc(q.text)}<select class="select" style="float:right" onchange="origAnswers['${q.n}']=this.value"><option value="">–</option>${ex.texts.map(t=>`<option>${t.letter}</option>`).join('')}</select></div>`).join('')}<div class="toolbar"><button class="btn primary sm" onclick="checkOriginal()">Auswerten</button></div><div id="origResult"></div></div><div class="card"><h3>Texte</h3>${ex.texts.map(t=>`<div class="source" style="margin-bottom:9px"><b>${t.letter})</b> ${esc(t.text)}</div>`).join('')}</div></div>`;let body=ex.body||'';return`<div class="card"><span class="tag">Seite ${page}</span><div class="source compact" style="margin-top:10px">${esc(body)}</div><div style="margin-top:14px">${ex.questions.map(q=>origQuestion(q)).join('')}</div><div class="toolbar"><button class="btn primary sm" onclick="checkOriginal()">Auswerten</button></div><div id="origResult"></div></div>`}
function origQuestion(q){if(q.type==='tf')return`<div style="margin:14px 0"><b>${q.n}. ${esc(q.text)}</b><select class="select" style="display:block;margin-top:8px" onchange="origAnswers['${q.n}']=this.value"><option value="">–</option><option value="richtig">Richtig</option><option value="falsch">Falsch</option></select></div>`;return`<div style="margin:14px 0"><b>${q.n}. ${esc(q.text||'')}</b><div class="options" style="margin-top:8px">${(q.options||[]).map(o=>`<button class="opt" onclick="selectOrig('${q.n}','${o.key}',this)"><span class="ol">${o.key.toUpperCase()}</span>${esc(o.text)}</button>`).join('')}</div></div>`}
function selectOrig(n,v,el){origAnswers[n]=v;el.parentElement.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected'));el.classList.add('selected')}
function checkOriginal(){const ex=OMAP[origPart][1]()[origIndex],qs=ex.questions||[],sol=[];let ok=0;qs.forEach(q=>{let good=norm(origAnswers[q.n])===norm(q.answer);if(good)ok++;sol.push(`${q.n}: ${String(q.answer).toUpperCase()}`);record('Lesen','orig-'+origPart+'-'+(ex.id||origIndex)+'-'+q.n,good)});document.getElementById('origResult').innerHTML=`<div class="feedback show ${ok===qs.length?'ok':'no'}"><b>${ok} / ${qs.length} richtig</b>${esc(sol.join(' · '))}</div>`}

let speakIndex=0,recorder=null,chunks=[];
function openSpeak(){show('speak');speakIndex=0;renderSpeak()}
function renderSpeak(){const ex=DATA.speaking[speakIndex];document.getElementById('speak').innerHTML=`<div class="backrow"><button class="back" onclick="openExam()">←</button><div><h1>Sprechen</h1><div class="sub">Lösungswege diskutieren · laut sprechen, nicht nur lesen.</div></div></div><div class="toolbar"><button class="btn ghost sm" onclick="speakIndex=Math.max(0,speakIndex-1);renderSpeak()">←</button><span class="tag">${speakIndex+1}/${DATA.speaking.length}</span><button class="btn ghost sm" onclick="speakIndex=Math.min(${DATA.speaking.length-1},speakIndex+1);renderSpeak()">→</button></div><div class="grid g2"><div class="card"><span class="tag">Situation ${ex.n}</span><h2>${esc(ex.situation)}</h2>${ex.bullets.map(b=>`<div class="example">• ${esc(b)}</div>`).join('')}<div class="toolbar"><button class="btn dark sm" onclick="startTimer(240,'speakTimer')">4-Minuten-Timer</button><span id="speakTimer" class="timer">04:00</span><button class="btn primary sm" onclick="startRec()">● Aufnahme</button><button class="btn ghost sm" onclick="stopRec()">■ Stopp</button></div><div id="recOut"></div></div><div class="card"><h3>Redemittel</h3>${REDEMITTEL.sprechen.items.map(x=>`<div class="example">${esc(x)}</div>`).join('')}</div></div>`}
async function startRec(){try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{const url=URL.createObjectURL(new Blob(chunks,{type:'audio/webm'}));document.getElementById('recOut').innerHTML=`<audio controls style="width:100%;margin-top:12px" src="${url}"></audio>`;stream.getTracks().forEach(t=>t.stop());record('Sprechen','speak-'+speakIndex,true)};recorder.start();toast('Aufnahme läuft.')}catch(e){toast('Mikrofon ist in dieser Umgebung nicht verfügbar.')}}
function stopRec(){if(recorder&&recorder.state==='recording')recorder.stop()}
