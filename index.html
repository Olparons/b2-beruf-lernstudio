tarbeitenden in Ihrer Firma sollen zukünftig gemeinsam in einem Großraumbüro arbeiten. Einzelbüro wird es nicht mehr geben."},{"n":13,"title":"Überstunden. (Zweite Überstunden für 3 Monate)","prompt":"Die Geschäftsleitung plant, in Zukunft keine Überstunden mehr zu erlauben."},{"n":14,"title":"Homeoffice","prompt":"Alle Mitarbeitenden in Ihrer Firma sollen zukünftig 4 Tage pro Woche von Zuhause aus (im HO) arbeiten und nur noch einen Tag pro Woche in der Firma."},{"n":15,"title":"Kostenlos Mahlzeit am Samstag oder Feiertag.","prompt":""},{"n":16,"title":"Firmengarten","prompt":"Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollen die Möglichkeit haben, in einem Firmengarten Pause machen zu können. Die Firmenleitung schlägt vor, dass sie in ihrer Freizeit beim Anlegen und Pflegen des Gartens mithelfen."},{"n":17,"title":"Die Mitarbeiter sollen oft an anderen Firmen arbeiten.","prompt":""},{"n":18,"title":"Homeoffice und Büro ohne feste Arbeitsplätze","prompt":"Wir können ins Homeoffice oder ins Büro wechseln, aber wir werden kein mehr eigenes Büro in der Firma haben."},{"n":19,"title":"Kita 24/7","prompt":"Sie arbeiten als Schichtdienst und die Firma bietet 24 Stunden Kinderbetreuung."},{"n":20,"title":"Rückenfreundliche Bürostühle","prompt":"Für alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollen rückenfreundliche Bürostühle angeschafft werden. Die Hälfte der Anschaffungskosten sollen Sie selbst bezahlen."},{"n":21,"title":"Pausenräume sauber machen","prompt":"Alle Mitarbeitenden in Ihrer Firma sollen abwechselnd Putzdienst in den Pausenräumen übernehmen. Die nötigen Materialien werden zur Verfügung gestellt."},{"n":22,"title":"In den Büroräumen eine Klimaanlage eingebaut","prompt":"Alle Mitarbeitenden in Ihrer Firma sollen im Sommer gut arbeiten können, deshalb wird demnächst in allen Büroräumen eine Klimaanlage eingebaut. Dafür soll es dann kein kostenloses Mineralwasser mehr geben."},{"n":23,"title":"2 Mal pro Jahr Fortbildung","prompt":"Alle Mitarbeitende in Ihrer Firma sollen zweimal pro Jahr eine Weiterbildung machen, die von der Firma vorgegeben wird. Wünsche können nicht geäußert werden."},{"n":24,"title":"Nachtarbeit","prompt":"Ab dem kommenden Monat sollen die Mitarbeiter in der Produktion in allen Schichten arbeiten. Es gibt Früh-, Spät- und Nachtschicht. Dafür bekommen diese Mitarbeiter 2 Tage mehr Urlaub im Jahr."},{"n":25,"title":"Urlaubsplanung im Sommer nur für Mitarbeitern mit Kindern","prompt":"Alle Mitarbeitenden in Ihrer Firma sollen ihren Urlaub planen. In den Sommerferien sollen nur Mitarbeiter mit schulpflichtigen Kindern Urlaub bekommen. Mitarbeiter ohne Kinder müssen zu anderen Zeiten Urlaub machen."},{"n":26,"title":"Gesundheitskurse","prompt":"Die Geschäftsleitung möchte allen Mitarbeiterinnen und Mitarbeitern die Möglichkeit geben, am Fitness und Gesundheitskursen teilzunehmen mit Kostenbeteiligung."},{"n":27,"title":"Jobticket","prompt":"Ab dem kommenden Jahr sollen alle Mitarbeiterinnen und Mitarbeiter auf ihr Gehalt verzichten, um ein kostenloses Jobticket zu bekommen."},{"n":28,"title":"Workshop für das Zeitmanagement","prompt":"Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollen an einem Workshop für das Zeitmanagement teilnehmen, um ihre Arbeitsabläufe effizienter gestalten zu können."},{"n":29,"title":"Wieterbildung + Bonus","prompt":"Alle Mitarbeiterinnen und Mitarbeiter sollen Bonuszahlung in Höhe 50 Euro erhalten, wenn sie mindestens einmal pro Jahr an einer Weiterbildung außerhalb der Arbeitszeit teilgenommen haben."},{"n":30,"title":"Spanischkurs","prompt":"Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollen verpflichtet werden, einen Spanischkurs zu besuchen, weil das Unternehmen einen neuen Standort in Spanien eröffnet. Die Kursgebühren übernimmt die Firma."},{"n":31,"title":"Umweltschutz","prompt":"Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollen motiviert werden, aus Gründen des Umweltschutzes ab sofort das Auto stehenzulassen. Dafür erhalten sie ein kostenfreies Jahres-Abo für Bus und Bahn."},{"n":32,"title":"Italien / Auslandsdienst","prompt":"Alle Mitarbeitenden in Ihrer Firma sollen aus ihrer Abteilung einen Kollegen / eine Kollegin auswählen, der /die für 6 Monate nach Italien geht, um dort am Firmenstandort neue Kolleg*innen einzuarbeiten."},{"n":33,"title":"Soziales Engagement","prompt":"Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollen sich anstelle eines Betriebsausflugs dieses Jahr an einem sozialen Tag gemeinsam ehrenamtlich engagieren. Auch dieser Tag zählt als Arbeitszeit."},{"n":34,"title":"Zusätzliche Urlaubstage","prompt":"Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollen für besonders gute Arbeitsleistungen nicht mehr wie bisher Bonuszahlungen erhalten. Stattdessen bekomen sie zusätzliche Urlaubstage."},{"n":35,"title":"Fahrrad. Zuschuss für Reparaturen","prompt":"Die Firma möchte alle Mitarbeitern, die mit dem Fahrrad zur Arbeit kommen, ein Zuschus für die Reparaturen und Wartung erhalten. Autofahrer bekommen aber nichts."},{"n":36,"title":"Fortbildung","prompt":"Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollen ab dem kommenden Jahr für die Fortbildungen einen Urlaubstag nehmen. Bezahlt werden die Fortbildungen aber weiterhin von der Firma."},{"n":37,"title":"Attest bereits ab dem ersten Tag","prompt":"Alle Mitarbeiterinnen und Mitarbeiter sollen im Krankheitsfall schon ab dem ersten Tag eine ärztliche Krankmeldung vorlegen. Ansonsten gelten die Tage als Fehlzeit."},{"n":38,"title":"Kita am Freitag geschlossen","prompt":"Alle Mitarbeiter und Mitarbeiterinnen in Ihrer Firma sollen freitags für eine private Kinderbetreuung sorgen. Die Firmen-Kita ist ab sofort an diesem Tag wegen Personalmangels geschlossen."},{"n":39,"title":"Kostenlose Freizeitbadkarte","prompt":"Um unseren Stress zu senken, schenkt das Unternehmen allen Mitarbeitern jährlich eine kostenlose Freizeitbadkarte."},{"n":40,"title":"Firmenausflug mit eigenem Essen","prompt":"Wir planen einen Firmenausflug. Wir müssen das Essen , das wir gerne essen, selbst zubereiten und mitbringen."},{"n":41,"title":"Fahrgemeinschaft. Zuschuss für Benzingeld","prompt":"Alle Mitarbeitende, die eine Fahrgemeinschaft auf dem Weg zur Arbeit organisieren, bekommen einen Zuschuss von Benzingeld. Die einzelnen Fahrer erhalten keine Unterstützung. 42.Keine Überstunden : Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollen keine Überstunden machen. Nach 8 Stunden sollten sie automatisch vom Computer abgemeldet werden."},{"n":43,"title":"Englisch sprechen während der Arbeitszeit","prompt":"Alle Mitarbeitenden in Ihrer Firma sollen zukünftig ausschließlich Englisch miteinander sprechen. Das Unternehmen hat einen neuen Eigentümer aus Großbritannien. Intensive Englischkurse werden während der Arbeitszeit angeboten."},{"n":44,"title":"Geburtstagsgeschenke","prompt":"Alle Mitarbeitenden in Ihrer Firma sollen einen Betrag von 5 Euro monatlich zahlen. Das Geld wird für die Geburtstagsgeschenke finanziert."},{"n":45,"title":"Urlaubswünsche nur bis Oktober möglich","prompt":"Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollen bis spätestens Ende Oktober mitteilen , wann sie im kommenden Jahr Urlaub nehmen möchten. Wünsche , die nach Oktober eingereicht werden, können leider nicht mehr berücksichtigt werden."},{"n":46,"title":"Dienstkleidung in den Firmenfarben – Weiß und Rot","prompt":"Alle Mitarbeiterinnen und Mitarbeiter sollen während der Arbeitszeit Kleidung in den Firmenfarben Weiß und Rot tragen. Die passende Kleidung ist selbst zu besorgen ( müssen Mitarbeiter selbst auf eigene Kosten anschaffen.)"},{"n":47,"title":"Private Geräte verboten","prompt":"In eurer Firma wurde es verboten , private Geräte jeglicher Art zu benutzen oder sie über die Steckdosen der Firma aufzuladen. Es dürfen nur firmeneigene elektronische Geräte verwendet werden."},{"n":48,"title":"Innenhof gestalten","prompt":"Alle Mitarbeiter sollen dabei helfen, den Innenhof als Aufenthaltsbereich für die Pause zu gestalten. Sie sollen ihn am Wochenende und in ihrer Freizeit pflegen."},{"n":49,"title":"Spenderkleidung","prompt":"Alle Mitarbeiter können sich auf Wunsch an einer Sammelaktion für Kinderkleidung beteiligen. Der gesamte Erlös kommt einer Spende zugute."},{"n":50,"title":"Papierverbrauch","prompt":"Alle Mitarbeiter müssen Papier sparen. Bis dahin wird eine Begrenzung des Drucker- und Papierverbrauchs pro Person und pro Tag festgelegt."},{"n":51,"title":"Azubi-Betreuung","prompt":"Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollen ab sofort in die Betreuung der Auszubildenden aktiv eingebunden werden und dazu einen Plan erstellen , wer welche Aufgaben übernimmt."},{"n":52,"title":"Pausenhof statt Parkplatz","prompt":"Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollen demnächst nicht mehr im Innenhof parken können. Die Fläche soll bepflantz und mit Sitzgelegenheiten für die Pausen ausgestattet werden."},{"n":53,"title":"Hunde im Büro sind erlaubt","prompt":"Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollen ihre Hunde ins Büro mitbringen dürfen. Diese Regelung dient der Förderung des Betriebsklimas. Allerdings dürfen die Hunde andere Kolleg*innen nicht stören."},{"n":54,"title":"Privattelefonate nur in den Pausen","prompt":"Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollen ihre Mobiltelefone während der Arbeitszeit im Aufenthaltsraum aufbewahren. Privattelefone sind nur in den Pausen gestattet. Nur die leitenden Angestellten dürfen das."},{"n":55,"title":"Fitnessstudio 35 Euro","prompt":"Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollen 35 Euro weniger Gehalt bekommen. Dafür bezahlt die Firma Mitgliedschaft im Fitnessstudio."},{"n":56,"title":"An einen anderen Standort ziehen","prompt":"Alle Mitarbeiterinnen und Mitarbeiter müssen an einen anderen Standort ziehen. Die Firma unterstützt Sie dabei und gewährt einen zusätzlichen Urlaubstag."},{"n":57,"title":"Keine festangestellten Kollegen","prompt":"Alle Mitarbeiter in Ihrer Firma sollen keine festangestellten Kollegen erhalten. Die Firma leiht sich bei Bedarf Mitarbeiter von externen Firmen, um Stellen zu besetzen."},{"n":58,"title":"Energie sparen, Winterkleidung im Büro","prompt":"In der Firma soll Energie gespart und nicht mehr so viel geheizt werden. Im Winter können die Mitarbeitenden, wenn ihnen zu kalt ist, in Winterkleidung ( Fleecejacke von der Firma) im Büro arbeiten."},{"n":59,"title":"Kantinenschließung","prompt":"Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollen zukünftig nicht mehr in der Kantine essen können. Diese wird geschlossen. Stattdessen werden Essensmarken für verschiedene Restaurants in der Nähe ausgegeben."},{"n":60,"title":"Sparpläne","prompt":"Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollen zukünftig ihre Büros erst ab Oktober heizen und die Raumtemperatur auf maximal 19*C begrenzen. Das Unternehmen möchte damit die Energiekosten reduzieren."},{"n":61,"title":"Bürowände mit Glas","prompt":"Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma werden zukünftig ihre Einzelbüros mit gemauerten Bürowänden durch Büros mit Glas ersetzt. Das soll sich positiv auf das Betriebsklima auswirken."},{"n":62,"title":"Obst – 5 Euro monatlich","prompt":"Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollen künftig für das bisher kostenfreie Obst monatlich 5 Euro bezahlen. Sie befinden sich in der Teeküche. Damit möchte die Firma ( der Chef ) die regionale Landwirtschaft unterstützen."},{"n":63,"title":"Urlaub im August","prompt":"Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollten im August drei Woche Urlaub nehmen. Über die restliche Zeit können Sie selbst entscheiden."},{"n":64,"title":"Teambesprechungen und Wieterbildungen während der Elternzeit","prompt":"Allen Koleg*innen wurde mitgeteilt, dass sie während der Elternzeit entweder an Teambesprechungen oder an Wieterbildungen teilnehmen sollen. Der Grund dafür ist, dass sie den Kontakt zur Firma nicht verlieren."},{"n":65,"title":"Unternehmensvorstellung","prompt":"Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollen künftig in den Schulen der Region das Unternehmen vorstellen. Ziel dieser Maßnahme ist es, für das Ausbildungsangebot des Betriebs zu werben und neue Auszubildende zu gewinnen. Nicht alle im Team sind von dieser Idee begeistert."},{"n":66,"title":"Zigarettenpause","prompt":"In jedem Firmengebäude soll eine neue Regelung eingeführt werden : Mitarbeitende, die rauchen, dürfen ihre Zigarettenpause machen, ohne sich auszustempeln, müssen dafür aber 15 Minuten länger arbeiten."},{"n":67,"title":"Baumpflanz-Aktion","prompt":"Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollen nach Möglichkeit am kommenden Wochenende an einer Baumpflanz-Aktion im Stadtwald teilnehmen, um das Umweltengagement der Firma zu unterstützen."},{"n":68,"title":"Abdeckung zwischen Weihnachten und Neujahr","prompt":"Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollen auf 2 Tage ihres Urlaubs verzichten, damit alle Betriebsferien zwischen Weihnachten und Neujahr abgedeckt sind."},{"n":69,"title":"4- Tage-Woche – 10 Stunden pro Tag","prompt":"In Zukunft sollen alle Beschäftigten auf eine Vier-Tage-Woche umsteigen. Dafür wird der Arbeitstag zehn Stunden dauern."},{"n":70,"title":"Essverbot am Arbeitsplatz","prompt":"Am Arbeitsplatz soll Essen verboten sein , außer Schokolade."},{"n":71,"title":"Ausschließlich Online-Kurse für Weiterbildung","prompt":"Die Geschäftsleitung Ihrer Firma hat beschlossen, dass alle Mitarbeiterinnen und Mitarbeiter im nächsten Jahr an einer Weiterbildung teilnehmen sollen. Dabei werden ausschleißlich Online-Kurse berücksichtigt."}],"complaints":[{"id":"C-P63","page":63,"title":"Putzdienst / Reinigung","prompt":"Hallo Friederike,\ngerade habe ich die angehängte Mail von der Firma Huber GmbH gelesen und bin schockiert. Ich verstehe den\nÄrger von Herrn Lassner, kann aber kaum glauben, was er da schreibt. Bitte sprich mal mit unseren Leuten und\nkläre, was da los ist, und antworte dann Herrn Lassner. Es ist ganz wichtig, dass du ihm zusagst, dass so etwas nie\nwieder vorkommen wird. Gib ihm auch einen Rabatt auf die nächste Rechnung in Höhe von 20 %. Wir dürfen die\nFirma mit diesem großen Auftrag keinesfalls als Kunden verlieren.\nDanke dir und schönen Feierabend!\nGruß\nHeike\nSehr geehrte Frau Woller,\nleider muss ich mich heute mit einer Beschwerde an Sie wenden. Wir haben einen Vertrag mit Ihrer Firma für die\nReinigung unserer Büroräume. In diesem Vertrag sind täglich 3 Stunden Arbeit bei uns festgelegt, und zwar von\n6.00 Uhr bis 9.00 Uhr morgens.\nIn den letzten zwei Wochen war unsere Sekretärin einige Male bereits vor 9 Uhr im Büro, von Ihrem Putzdienst war\naber niemand zu sehen. Wie kann das sein?\nWenn wir 3 Stunden bezahlen, erwarten wir auch, dass Ihr Personal drei Stunden bei uns arbeitet. Wenn Sie für die\nReinigung unserer Räume weniger als die vereinbarte Zeit benötigen, sollten Sie uns darüber informieren, damit wir\nden Vertrag ändern.\nIch bitte um umgehende Stellungnahme und natürlich die Angleichung der Rechnung an die tatsächlich geleisteten\nArbeitsstunden.\nMit freundlichen Grüßen\nTheo Lassner","model":"Sehr geehrter Herr Lassner,\nvielen Dank für Ihre Rückmeldung von gestern. Wir bedauern die entstandenen Unannehmlichkeiten sehr und bitten\num Entschuldigung. Heute wurde mit unseren Mitarbeitern gesprochen und herausgefunden, dass der Grund dafür\nwar, dass unser Dienstfahrzeug in Inspektion war. Deswegen mussten die Mitarbeiter 15 Minuten früher die Arbeit\nverlassen, um die öffentlichen Verkehrsmittel nicht zu verpassen. Wir möchten Ihnen versichern, dass sich diese\nSituation nicht wiederholen wird. Natürlich möchten wir Sie als treuen Kunden behalten, deswegen bieten wir Ihnen\neinen Rabatt auf die nächste Rechnung in Höhe von 20% an.\nWir freuen uns weiterhin auf eine Zusammenarbeit.\nMit freundlichen Grüßen\nFriederike Baumann"},{"id":"C-P64","page":64,"title":"Tischlampe","prompt":"Lieber Herr Klein,\nich habe schon wieder eine Beschwerde einer Kundin vorliegen. Sie hat ihre bestellten Tischlampen nicht\nbekommen. Bitte antworten Sie Frau Berger und erklären Sie ihr, warum wir im Moment Lieferschwierigkeiten\nhaben. Versuchen Sie auch, sie davon zu überzeugen, noch bis nächste Woche zu warten und den Auftrag nicht zu\nstornieren. Bieten Sie ihr außerdem ein ähnliches Modell an, das wir auf Lager haben. Danke!\nHerzliche Grüße\nKnut Richter\nSehr geehrter Herr Richter,\nvergangene Woche habe ich bei Ihnen 25 Tischlampen Modell TS 13 150 07 für unsere neuen Büroräume bestellt.\nMir wurde telefonisch zugesagt, dass die Lampen noch diese Woche geliefert werden, aber jetzt ist schon\nFreitagnachmittag und sie sind leider noch immer nicht eingetroffen.\nDas ist ärgerlich, da wir am Wochenende unsere Renovierungsarbeiten beenden und die Büros dann vollständig neu\neinrichten werden. Dazu wurden natürlich auch die Lampen gehören, da wir am Montag unseren Bürobetrieb in\nfunktionstüchtigen Räumen wieder aufnehmen wollen. Ich habe bereits mehrfach versucht, Sie telefonisch zu\nerreichen, und habe Nachrichten auf Ihrem Anrufbeantworter hinterlassen, aber ich wurde leider nicht\nzurückgerufen. Inzwischen habe ich einen Lieferanten gefunden, der uns kurzfristig andere Tischlampen liefern\nkönnte.\nWenn Ihre Lampen also bis Montagmittag, 13:00 Uhr, nicht bei uns eingetroffen sind, werde ich die Bestellung bei\nIhnen stornieren. Ich bitte um eine schnelle Antwort!\nMit freundlichen Grüßen\nEvelyn Berger","model":"Sehr geehrte Frau Berger,\nvielen Dank für Ihre Rückmeldung von gestern. Wir bedauern die entstandenen Unannehmlichkeiten sehr und bitten\num Entschuldigung. Heute habe ich mit dem Hersteller gesprochen und ich habe herausgefunden, dass der Grund für\ndie Verzögerung unvorhergesehene Lieferschwierigkeiten sind. Ich möchte Ihnen versichern, dass in der\nVergangenheit solche Situationen in wenigen Tagen behoben waren. Deswegen bitten wir Sie noch um Geduld.\nFalls Ihre Bestellung bis nächste Woche Montag nicht geliefert wird, bieten wir Ihnen ein ähnliches Model, welches\nwir auf Lager haben, an. Wir hoffen, dass Sie mit dieser Lösung zufrieden sind und wieder bei uns bestellen werden.\nMit freundlichen Grüßen\nLukas Klein"},{"id":"C-P66","page":66,"title":"Webseite","prompt":"Hallo Frau Holsten,\nich habe heute Mittag die untenstehende Mail bekommen. Die vertauschten Namen sind unser Fehler und die\nverbessern wir auch. Bitte bestätigen Sie dem Kunden das. Aber mehr ist nun wirklich nicht drin. Das ist schon das\nfünfte Mal, dass er Korrekturwünsche hat, obwohl wir uns immer an die Vorgaben gehalten haben. So viele\nKorrekturen waren nicht vereinbart!\nWenn wir das noch machen sollten, geht das nur gegen zusätzliche Bezahlung. Ich rechne mit 200 (300) € extra.\nBitte teilen Sie ihm dies mit und lassen Sie sich von ihm sein Okay geben.\nDanke und viele Grüße\nJutta Spindler\nSehr geehrte Frau Spindler,\nvielen Dank für Ihren Entwurf für unsere neue Firmenwebseite. Ich habe ihn gemeinsam mit dem Team gesichtet\nund dabei ist uns aufgefallen, dass Ihre Agentur die Vorgaben an zwei Stellen leider nicht umgesetzt hat:\nZum einen hatten wir besprochen, dass das Farbschema grau-orange sein sollte. Da statt Grau Blau gewählt wurde,\nglaube ich, dass es zu einem Missverständnis gekommen ist. Zum anderen sind auf der Seite mit den\nAnsprechpartnern die Namen eigener Mitarbeiter vertauscht worden. Im Anhang schicke ich Ihnen noch einmal eine\nAuflistung der Namen mit den dazugehörigen Bildern. Könnten Sie diese beide Punkte bitte bis Anfang nächster\nWoche nachbessern? Eine kurze Rückmeldung wäre nett.\nMit freundlichen Grüßen\nFranz Stiller","model":"Sehr geehrter Herr Stiller,\nvielen Dank für Ihre Rückmeldung von heute. Wir bedauern die entstandenen Unannehmlichkeiten sehr und bitten\num Entschuldigung. Außerdem möchte ich Ihnen versichern, dass wir den Fehler im Nahmen bis Ende dieser\nWoche korrigieren werden. Bitte beachten Sie, dass das blau-orange Farbschema in unserem Vertrag vereinbart ist.\nZudem ist das schon die fünfte Bitte um Korrektur. So viele Korrekturen waren nicht vereinbart. Deswegen kostet\njede weitere Korrektur 200 (300) €. Wenn Sie mit dieser Lösung einverstanden sind, geben Sie mir bitte Bescheid.\nVielen Dank für Ihr Verständnis.\nMit freundlichen Grüßen\nMonika Holsten"},{"id":"C-P67","page":67,"title":"Spülmaschine","prompt":"Hallo Frau Retterstein,\nich habe gerade die unten stehende E-Mail von einem großen Kunden bekommen, der sich beschwert hat.\nOrganisieren Sie doch bitte so schnell wie möglich einen Techniker, der sich die Spülmaschine ansieht, und\nschreiben Sie Herrn Krüger.\nEntschuldigen Sie sich bitte für die Unannehmlichkeiten und sagen Sie ihm zu, dass wir seine Forderungen in seiner\nE-Mail prüfen werden.\nTeilen Sie Herrn Krüger aber bitte vorsorglich mit, dass die Reparatur eventuell nicht sofort durchgeführt werden\nkann, falls wir Ersatzteile bestellen müssen.\nDanke und viele Grüße\nDorothee Sturm\nSehr geehrte Frau Sturm,\nvor einer Woche haben wir bei Ihnen eine Spülmaschine für unsere Teeküche gekauft. Sie wurde sehr schnell\ngeliefert und auch gleich eingebaut. Leider muss ich Ihnen heute aber mitteilen, dass sie bereits defekt ist. Beim\nSpülen ist Wasser ausgelaufen und nun ist unser Parkett beschädigt.\nIch bitte Sie, uns umgehend einen Techniker zu schicken, der das Gerät repariert. Wir brauchen die Spülmaschine\nspätestens übermorgen, da wir ein großes Meeting unserer Außendienstmitarbeiter haben und viele Personen\nbewirten müssen.\nAußerdem müssen wir einen Teil des Parketts austauschen. Die Kosten dafür werden wir Ihnen in Rechnung stellen.\nBitte schicken Sie mir so schnell wie möglich einer Terminvorschlag für die Reparatur und eine Bestätigung der\nKostenübernahme. Vielen Dank!\nMit freundlichen Grüßen\nClaudio Krüger","model":"Sehr geehrter Herr Krüger,\nvielen Dank für Ihre Rückmeldung von gestern. Wir bedauern die entstandenen Unannehmlichkeiten sehr und bitten\num Entschuldigung. Unserer Techniker könnte am kommenden Montag 27.05.2024 um 8:00 Uhr kommen, um die\nSpülmaschine und das beschädigten Parkett zu überprüfen. Bitte teilen Sie uns mit, ob der Termin stattfinden kann.\nBeachten Sie, dass falls wir Ersatzteile für die Reparatur bestellen müssen, keine umgehende Reparatur möglich ist.\nDetaillierte Information können wir Ihnen nach der Überprüfung geben. Wir danken Ihnen für Ihr Verständnis.\nMit freundlichen Grüßen\nAnika Retterstein"},{"id":"C-P68","page":68,"title":"Umzug","prompt":"Hallo,\nbitte schauen Sie sich mal die untenstehende E-Mail an.\nDa ist wohl was schief gegangen. Bitte schreiben Sie Herrn Zaun und erklären Sie ihm, warum es zu den Fehlern\ngekommen ist. Sagen Sie ihm zu, dass am Mittwochmorgen pünktlich zwei Männer da sein werden, die alles fertig\nmachen.\nNatürlich übernehmen wir auch die Verantwortung für die entstandenen Schäden.\nDie Firma hat uns das erste Mal gebucht und ich würde ungern einen negativen Eindruck hinterlassen. Ich verlasse\nmich auf Sie.\nDanke und viele Grüße\nFrieda Börne / Sophia Prince\nSehr geehrte Frau Börne, / Prince\nam Wochenende ist unser Büro mit Hilfe Ihres Unternehmens von Hanau nach Frankfurt umgezogen. Leider waren\nwir mit Ihrem Service überhaupt nicht zufrieden.\nIhre Mitarbeiter kamen eine halbe Stunde zu spät und nur zu dritt statt wie vereinbart zu viert. Deshalb dauerte der\nganze Umzug natürlich länger als geplant und einige Arbeiten sind auch noch nicht abgeschlossen: Es sind noch\nnicht alle Möbel aufgebaut, deshalb konnten wir noch nicht unsere Sachen einräumen.\nBitte schicken Sie uns deshalb am Mittwochmorgen noch zwei Personen, die den Möbelaufbau erledigen. Des\nWeiteren sind Glasplatten zu Bruch gegangen und einige Schränke sind verkratzt. Ich gehe davon aus, dass Ihre\nFirma die Kosten dafür übernimmt.\nMit freundlichen Grüßen\nThomas Zaun / Matteo Lozano","model":"Sehr geehrter Herr Zaun, / Lozano\nvielen Dank für Ihre Rückmeldung von gestern. Wir bedauern die entstandenen Unannehmlichkeiten sehr und bitten\num Entschuldigung. Der Grund dafür war, dass unsere Mitarbeiter auf dem Weg zu Ihnen eine kleine Autopanne\nhatten. Außerdem hatten sich einige Mitarbeiter in der letzten Woche krank gemeldet, was zu Personalmangel\nführte. Wir möchten Ihnen versichern, dass diese Situation sich nicht wiederholen wird. Zudem werden zwei unserer\nMitarbeiter am Mittwochmorgen pünktlich bei Ihnen sein. Natürlich möchten wir Sie als Kunden zufriedenstellen,\ndeswegen übernehmen wir die Kosten für die beschädigten Möbel.\nWir freuen uns weiterhin auf eine Zusammenarbeit.\nMit freundlichen Grüßen\nMonika Kühne"},{"id":"C-P70","page":70,"title":"Der Drucker","prompt":"Guten Morgen,\nVor einer Stunde erhielt ich diese E-Mail von der Cavone GmbH.\nNach Angaben unseres Technikers lag der Fehler wiederum bei der Cavone GmbH. Bitte antworten Sie Frau Zeller\nund weisen Sie höflich darauf hin, dass es nicht in unserer Verantwortung liegt, das Problem zu lösen.\nDer Techniker kommt gerne wieder ins Unternehmen und führt die Mitarbeiter kostenlos durch den Prozess.\nBitte teilen Sie ihr außerdem mit, dass die Kosten für die Untersuchung des Geräts weiterhin von ihrem\nUnternehmen, der Cavone GmbH, getragen werden.\nDanke und viele Grüße\nPaco Brenner\nSehr geehrter Herr Brenner,\nvor drei Tagen hat einer Ihrer Mitarbeiter das neue ABC-Druck-, Kopier- und Faxgerät inspiziert.\nDies war das zweite Mal innerhalb einer Woche, dass beim Versenden eines Faxes ein Fehlerzeichen auftrat.\nLeider kam gestern wieder eine Fehlermeldung, und wir sollten einige wichtige Unterlagen zum Treffen per Fax\nverschicken. Wir konnten diese jedoch nicht rechtzeitig versenden. Deshalb haben wir einen für uns sehr wichtigen\nDeal verloren. Wir sehen derzeit von Schadensersatzansprüchen ab, bitten Sie jedoch, uns umgehend und auf Ihre\nKosten ein anderes Gerät zuzusenden.\nOffensichtlich handelt es sich hierbei um einen technischen Fehler, für den wir keine Verantwortung übernehmen.\nSelbstverständlich übernehmen wir auch keine Rechnungen für vorangegangene technische Arbeiten.\nIch hoffe, dass wir schnellstmöglich eine Antwort von Ihnen erhalten.\nMit freundlichen Grüßen\nVala Zeller\nNummer 21 Schreiben Sie eine E-Mail an den Kunden.","model":"Sehr geehrte Frau Zeller,\nvielen Dank für Ihre E-Mail und die Schilderung des Sachverhalts. Nach eingehender Prüfung des Problems durch\nunseren Techniker liegt die Ursache des Fehlers nicht in unserem Verantwortungsbereich, sondern bei der Cavone\nGmbH. Daher können wir Ihrem Wunsch nach einem kostenlosen Austausch des Geräts nicht entsprechen. Dennoch\nmöchten wir Ihnen entgegenkommen und bieten an, dass unser Techniker gerne bereit ist, Ihr Unternehmen erneut\nzu besuchen und Ihre Mitarbeiter kostenlos durch den Prozess zu führen, um mögliche Fehlerquellen auszuschließen\nund eine reibungslose Nutzung des Geräts sicherzustellen. Bitte beachten Sie zudem, dass die Kosten für die\nUntersuchung des Geräts gemäß unseren Vereinbarungen weiterhin von der Cavone GmbH zu tragen sind. Wir\nhoffen auf Ihr Verständnis und stehen Ihnen bei weiteren Fragen oder Anliegen jederzeit gerne zur Verfügung.\nMit freundlichen Grüßen"},{"id":"C-P71","page":71,"title":"Die Rechnung","prompt":"Hallo,\nich habe heute die unten stehende E-Mail erhalten. Bitte kümmern Sie sich darum und antworten Sie dem Kunden\nhöflich. Die Firma \"Meier\" ist ein langjähriger Kunde von uns. Wir können es uns nicht leisten, ihn zu verlieren.\nSchreiben Sie ihm bitte von unserem Computerproblem und wie wir es gelöst haben. Natürlich bekommt er den\nRabatt wie gewohnt.\nVielen Dank.\nAnna Hoffner\nSehr geehrte Frau Hoffner,\nwir haben Ihre Lieferung erhalten und sind mit allen Artikeln absolut zufrieden. Leider muss ich Sie darauf\nhinweisen, dass die Rechnung einige Unstimmigkeiten beinhaltet: Zunächst wurden statt 100 Stück Pinsel Größe M\n200 Stück berechnet. Außerdem wurden 20 Töpfe roter Farbe berechnet. Wir hatten aber grüne Farbe bestellt und\ngeliefert bekommen, die preislich niedriger liegt. Wir bitten Sie, dies zu korrigieren. Des Weiteren waren wir\nüberrascht, dass unser üblicher Rabatt von 10 % in dieser Rechnung nicht gewährt wurde. Das ist wahrscheinlich ein\nVersehen.\nWir bitten um Berichtigung der Rechnung und erneute Zusendung.\nMit freundlichen Grüßen\nKarl Schmidt\nNummer 21 Schreiben Sie eine E-Mail an den Kunden.","model":"Sehr geehrter Herr Friedrien,\nvielen Dank für Ihre E-Mail und Ihre Geduld. Wir entschuldigen uns aufrichtig für die Unannehmlichkeiten und die\nUnstimmigkeiten auf Ihrer Rechnung. Leider gab es ein Computerproblem, welches die fehlerhafte Berechnung\nverursacht hat. Dieses Problem wurde mittlerweile behoben.\nSelbstverständlich haben wir Ihren Auftrag überprüft und die erforderlichen Korrekturen vorgenommen. Die\nkorrekte Anzahl der Pinsel sowie die von Ihnen bestellte grüne Farbe wurden in der neuen Rechnung entsprechend\nangepasst. Auch Ihr üblicher Rabatt von 10 % wurde nun berücksichtigt.\nWir haben eine neue, korrigierte Rechnung an Sie gesendet. Bei weiteren Fragen oder Anliegen stehen wir Ihnen\njederzeit gerne zur Verfügung. Wir schätzen Ihre langjährige Partnerschaft und freuen uns auf die weitere\nZusammenarbeit mit Ihnen.\nMit freundlichen Grüßen"},{"id":"C-P73","page":73,"title":"Die mangelhafte Lieferung","prompt":"Hallo,\nmich erreichte die untenstehende E-Mail. Bitte kümmern Sie sich darum und antworten Sie dem Kunden höflich.\nEntschuldigen Sie sich für die verschmutzte Ware. Der geforderte Rabatt von 60% ist unverschämt. Bieten Sie ihm\neine andere Lösung an. Die Nachlieferung der T-Shirts ist leider wegen unserer Mitarbeitersituation erst bis zum\n12.05. möglich. Erklären Sie den Grund.\nVielen Dank\nSiegfried Mayer\nTeamleiter\nSehr geehrter Herr Mayer,\nleider müssen wir Ihnen mitteilen, dass Ihre Lieferung nicht zu unserer Zufriedenheit ausgefallen ist. Wir müssen\nzwei Punkte beanstanden. Erstens wurden die Verpackungen der Hosen (Größe M und L) beim Transport\nbeschädigt, sodass der Inhalt verschmutzt ist. In diesem Zustand können wir die Waren auf keinen Fall in den\nregulären Verkauf geben, sondern sie nur mit einem Rabatt anbieten. Wir halten daher einen Preisnachlass von 60%\nfür angemessen. Des Weiteren teilen wir Ihnen mit, dass von den T-Shirts mit Aufdruck statt der bezahlten 100\nStück nur die Hälfte geliefert wurde. Wegen der beginnenden Sommersaison bitten wir um schnellstmögliche\nNachlieferung der fehlenden Stückzahl auf Ihre Kosten spätestens bis zum 10.05. Wir hoffen, dass sich derartige\nVorkommnisse in Zukunft vermeiden lassen, und bitten um prompte Erledigung.\nMit freundlichen Grüßen\nMatthias Schramm\nNummer 21 Schreiben Sie eine E-Mail an den Kunden.\nSehr geehrter Herr Schramm,\nvielen Dank für Ihre E-Mail, in der Sie uns darüber informieren, dass Sie mit der gelieferten Ware nicht zufrieden\nsind. Wir entschuldigen uns für die verschmutzten Hosen, können Ihnen aber keinen Preisnachlass in Höhe von 60\nProzent geben. Bitte schicken Sie uns die Hosen zurück. Wir werden Ihnen die Hosen in Größe M und L erneut in\neinwandfreier Qualität schicken.\nAufgrund eines hohen Krankenstandes in unserer Firma ist die Nachlieferung der T-Shirts erst zum 12.05. möglich.\nIch hoffe, dass Sie damit einverstanden sind. Bitte lassen Sie uns wissen, ob Sie mit unserem Vorschlag\neinverstanden sind.\nMit freundlichen Grüßen","model":"Sehr geehrter Herr Schramm,\nvielen Dank für Ihre E-Mail und für die Hinweise zu unserer letzten Lieferung. Wir bedauern die\nUnannehmlichkeiten und entschuldigen uns für die verschmutzten Waren sowie die unvollständige Lieferung.\nZu den beschädigten Hosen bieten wir Ihnen einen Preisnachlass von 20 % an. Alternativ können Sie uns die Artikel\nzurücksenden, und wir liefern Ersatz. Der von Ihnen vorgeschlagene Nachlass von 60 % ist leider nicht möglich.\nDie fehlenden T-Shirts werden wir schnellstmöglich nachliefern, jedoch ist dies aufgrund unserer aktuellen\nPersonalsituation erst bis zum 12.05. realisierbar. Die zusätzlichen Versandkosten übernehmen selbstverständlich\nwir. Wir entschuldigen uns nochmals und danken Ihnen für Ihr Verständnis. Sollten Sie weitere Fragen haben,\nstehen wir Ihnen gerne zur Verfügung.\nMit freundlichen Grüßen"},{"id":"C-P74","page":74,"title":"Pflanzenlieferung","prompt":"Hallo,\ndie folgende E-Mail ist gestern bei mir eingegangen. Was war denn da los?\nBitte antworten Sie der Kundin höflich und machen Sie Vorschläge für unsere weitere Zusammenarbeit. Wir\nschätzen Frau Talheim als langjährige Kundin und möchten sie deshalb nicht verlieren. Teilen Sie ihr bitte auch mit,\nwas wir ihr als Entschädigung für die entstandenen Unannehmlichkeiten anbieten.\nVielen Dank und viele Grüße\nMichael Herrmann\nTeamleiter\nSehr geehrter Herr Herrmann,\nleider müssen wir Ihnen mitteilen, dass Ihre Pflanzen- und Blumenauswahl für unsere letzte Veranstaltung gänzlich\nunpassend war. Wie Sie wissen, war das Thema unserer Ausstellung in der vergangenen Woche:\n„Nachhaltigkeit & Umweltverträglichkeit im Gartenbau – Lokal und Regional“. Und Sie haben im Eingangsbereich\naus dem fernen Ausland importierte exotische Pflanzen platziert, was verständlicherweise zu Beschwerden von\nSeiten der Besucher geführt hat. Zudem wollten wir den diesjährigen Umweltpreis zusammen mit Blumensträußen\nvergeben. Diese waren aber mit Orchideen bestückt. Wie passt das zum Thema „regional“? In dieser Situation\nhaben wir daher entschieden, kurzfristigen Ersatz für die Sträuße von einem Aussteller zu beschaffen. Wir bitten\nSie, diese zusätzlichen Kosten zu ersetzen. Solche Vorkommnisse müssen in Zukunft unter allen Umständen\nvermieden werden. Wir erwarten Ihre Vorschläge und stehen für ein Gespräch jederzeit zur Verfügung.\nMit freundlichen Grüßen\nGabi Talheim","model":"Sehr geehrte Frau Talheim,\nwir bedanken uns für Ihre E-Mail sowie für den Hinweis auf unser Versehen beziehungsweise darauf,\ndass Sie statt der bestellten regionalen Blumen Orchideen erhalten haben. Im Namen des ganzen Teams\nentschuldigen wir uns für die entstandenen Unannehmlichkeiten. Der Grund der falschen Lieferung liegt\ndarin, dass die Artikelnummern während des Bestellprozesses verwechselt wurden. Dadurch haben wir\nexotische Blumen zukommen lassen, die nicht für das Thema Ihrer Ausstellung geeignet waren.\nBezüglich der Situation, dass Sie umgehend eine Ersatzlösung über einen anderen Lieferanten finden\nmussten, werden wir selbstverständlich die dadurch entstandenen Kosten übernehmen. Darüber hinaus\ngewähren wir Ihnen einen Preisnachlass von 15% auf die nächste Bestellung. Alternativ kann ein\nGutschein für zusätzliche Leistungen angeboten werden. Bitte lassen Sie uns wissen, welche Lösung Sie\nbevorzugen. Wir würden uns freuen, Sie weiterhin zu unseren zufriedenen Kunden zählen zu dürfen.\nMit freundlichen Grüßen"}],"phone":[{"id":"TN-P99","page":99,"title":"Telefonnotiz 1","transcript":"Guten Tag, hier spricht Adriane Schmid von der Autovermietung Klein.\nSie haben angerufen und um ein Angebot gebeten. Ich kann Ihnen dieses Mal einen Mittelklassewagen für Sie zum\nSonderpreis von 99 Euro pro Tag anbieten. Sonst tragen Sie ja immer einen Kleinwagen. Wir haben schon\nmehrmals über andere Optionen gesprochen. Sie können das Auto vollgetankt wieder abgeben oder wir machen\ndas kostenpflichtig für Sie. Außerdem wissen Sie ja, dass Sie mit uns die Versicherung bilden müssen. Bitte\nrufen Sie mich zurück und sagen Sie mir, ob Sie das Angebot so annehmen.\nIch wiederhole nochmal meinen Namen. Adriane Schmid, S-C-H-M-I-D Telefon 0173 721 572 6\nIch wünsche Ihnen noch einen schönen Tag und freue mich auf Ihren Anruf.","solution":"Angebot\nName: Schmid\nTelefonnummer: 0173 721 572 6\nWeitere Informationen:\n• 99 € pro Tag ein Mittelklassewagen\n• das Auto vollgetankt wieder abgeben oder sie machen das kostenpflichtig für uns\n• die Versicherung bilden müssen\nZu erledigen: Zurückrufen,ob wir das Angebot so annehmen.\n(\nGuten Tag, hier spricht Roman Schmitz von der Autovermietung Devid.\nSie hatten angerufen und um ein Angebot gebeten. Also, ich hätte dieses Mal leider nur einen kleinen Wagen für\nSie zum Sonderpreis von nur 55 Euro pro Tag. Sonst haben Sie immer einen Mittelklassewagen. Wir haben\nschon mehrmals über andere Optionen gesprochen. Sie können das Auto vollgetankt wieder abgeben oder wir\nmachen das kostenpflichtig für Sie. Außerdem wissen Sie ja, dass Sie mit uns die Versicherung regeln müssen.\nBitte rufen Sie mich zurück und sagen Sie mir, ob Sie das Angebot so annehmen.\nIch wiederhole nochmal meinen Namen. Roman Schmitz, S-C-H-M-I-T-Z. Telefon 0173 916 94 42.\nIch wünsche Ihnen noch einen schönen Tag und freue mich auf Ihren Anruf. Auf Wiederhören.\nAngebot\nName: Schmitz\nTelefonnummer: 0173 916 94 42\nWeitere Informationen:\n• 55 € pro Tag ein kleiner Wagen\n• Vollgetankt wieder abgeben\n• Oder sie machen das kostenpflichtig für uns\n• Die Versicherung regeln müssen\nZu erledigen: Zurückrufen, ob wir das Angebot so annehmen."},{"id":"TN-P100","page":100,"title":"Telefonnotiz 2","transcript":"Guten Tag. Hier spricht Dr. Mayer. Wir müssen dringend etwas klären. Wir hatten doch vor ein paar Tagen\nverabredet, dass Ihre Firma heute unsere Praxis streicht. Wir haben extra unsere Praxis geschlossen und alles für\nSie vorbereitet. Und jetzt höre ich von meinen Mitarbeitern, dass die Maler gar nicht gekommen sind. Wie stellen\nSie sich das jetzt vor? Wir haben zuletzt vor fünf Jahren streichen lassen. Da gab es solche Probleme gar nicht. Ach\nja? Sie denken auch daran, dass Sie weiße und grüne Farbe mitbringen. Ich erwarte, dass bis morgen Mittag die\nWände gestrichen sind. Ich bitte dringend um Rückruf. Mein Name ist Mayer. M-A-Y-E-R. Sie erreichen mich\nunter der Nummer 05123 72 85 618. Danke und auf Wiederhören.\nGuten Tag, hier ist Dr. Meyer. Wir müssen dringend etwas besprechen. Vor ein paar Tagen hatten wir vereinbart,\ndass Ihre Firma heute unsere Praxis streichen würde. Wir haben extra dafür die Praxis geschlossen und alles\nvorbereitet. Nun höre ich von meinen Mitarbeitern, dass die Maler überhaupt nicht erschienen sind. Wie\ngedenken Sie jetzt weiter vorzugehen?\nAls wir vor fünf Jahren das letzte Mal gestrichen haben, gab es solche Probleme nicht. Denken Sie auch daran,\nweiße und grüne Farbe mitzubringen. Ich erwarte, dass die Wände bis morgen um 13 Uhr fertig gestrichen\nsind. Bitte rufen Sie mich umgehend zurück. Mein Name ist Meyer, buchstabiert M-E-Y-E-R. Sie können mich\nunter der Nummer 0512 37 285 618 erreichen. Vielen Dank und auf Wiederhören.","solution":"Beschwerde\nName:Mayer/ Meyer\nTelefonnummer: 05123 72 85 618\nWeitere Informationen:\n• Heute Praxis streichen würde\n• Die Maler gar nicht gekommen sind / die Maler überhaupt nicht erschienen sind\n• Weiße und grüne Farbe mitbringen\n• Bis morgen Mittag die Wände gestrichen sind / bis morgen um 13 Uhr fertig gestrichen sind\nZu erledigen: dringend Rückruf / umgehend Zurückrufen.\nGuten Tag, hier ist Meier. Wir müssen dringend etwas besprechen. Vor ein paar Tagen hatten wir vereinbart, dass\nIhre Firma heute unser Geschäft streichen würde. Wir haben extra dafür das Geschäft geschlossen und alles\nvorbereitet. Nun höre ich von meinen Mitarbeitern, dass die Maler überhaupt nicht erschienen sind. Wie\ngedenken Sie jetzt weiter vorzugehen? Denken Sie auch daran, weiße und blaue Farbe mitzubringen. Ich erwarte,\ndass die Wände bis morgen Mittag fertig gestrichen sind. Bitte rufen Sie mich umgehend zurück. Mein Name\nist Meier, buchstabiert M-E-I-E-R. Sie können mich unter der Nummer 0512 37 285 618 erreichen. Vielen Dank\nund auf Wiederhören.\nBeschwerde\nName: Meier / Maier / Schröder\nTelefonnummer: 0512 37 285 618 / 0155 623 66 85\nWeitere Informationen:\n• Heute Geschäft streichen würde / Friseursalon\n• Die Maler überhaupt nicht erschienen sind / Maler sind nicht gekommen.\n• Weiße und blaue Farbe mitbringen / Wieße und grüne Farbe mitbringen / weiße und pinke Farbe\n• Bis morgen Mittag Wände streichen müssen / bis Montag Mittag\nZu erledigen: umgehend Zurückrufen."},{"id":"TN-P101","page":101,"title":"Telefonnotiz 3","transcript":"Guten Tag, hier spricht Herr Städtler, buchstabiert S-T-Ä-D-T-L-E-R. Ich habe kürzlich 180 Prospekte bei Ihnen\nbestellt. Allerdings sind nur 100 angekommen. Ich würde darum bitten, die fehlenden 80 Prospekte bis morgen\nzu liefern. Bitte rufen Sie mich zurück, um die Lieferung zu bestätigen.\nSie erreichen mich unter der Telefonnummer 0173 536 47 15. Vielen Dank und auf Wiederhören\n(\nGuten Tag, hier spricht Herr Hoffmann, buchstabiert H-O-F-F-M-A-N-N. Ich habe kürzlich 200 Prospekte bei\nIhnen bestellt, allerdings sind nur 120 angekommen. Ich würde darum bitten, die fehlenden 80 Prospekte bis\nmorgen zu liefern. Bitte rufen Sie mich zurück, um die Lieferung zu bestätigen.\nSie erreichen mich unter der Telefonnummer 0173 536 47 15.\nVielen Dank und auf Wiederhören.","solution":"Beschwerde\nName: Städtler / Hoffmann\nTelefonnummer: 0173 536 47 15\nWeitere Informationen:\n• 180 Prospekte bestellt und nur 100 angekommen /200 Prospekte bestellen und nur 120 angekommen\n• Die fehlenden 80 Prospekte bis morgen zu liefern\nZu erledigen: Zurückrufen, die Lieferung bestätigen.\n(\nGuten Morgen, hier spricht Paul Becker von der Firma KBL. Ich rufe wegen Ihrer Lieferung an. Wir hatten bei\nIhnen letzte Woche 200 Prospekthüllen bestellt. Wir kaufen ja oft Büromaterialien bei Ihnen ein. Gerade eben\nhabe ich die Lieferung bekommen und habe gesehen, dass in dem Paket nur insgesamt 150 Prospekthüllen sind.\nIch brauche die fehlenden Hüllen unbedingt übermorgen. Können Sie sie bitte spätestens morgen abschicken?\nBitte rufen Sie mich zurück. Mein Name ist\nBecker. B-E-C-K-E-R. Telefon 0175 933 797 6\nIch danke Ihnen. Auf Wiederhören.\nBeschwerde\nName: Becker / Brandt (\nTelefonnummer: 0175 933 797 6 / 015225173510\nWeitere Informationen:\n• Letzte Woche 200 Prospekthüllen bestellt haben / 200 Schnellhefter bestellt haben (200201)/ 500 Schnellhefter\n• In dem Paket nur insgesamt 150 Prospekthüllen sind / 100 Schnellhefter erhalten haben (200201)/ 400\nSchnellhefter\n• Brauchen die fehlenden Hüllen unbedingt übermorgen / unbedingt morgen (200201)\n• Spätestens morgen abschicken / sofort fehlende Schnellhefter abschicken (200201)\nZu erledigen: Zurückrufen."},{"id":"TN-P102","page":102,"title":"Telefonnotiz 4","transcript":"Guten Morgen. Hier spricht Eno Hofmann von der Firma Multico.\nIch rufe wegen Ihrer Lieferung an. Wir hatten bei Ihnen Anfang der Woche 200 Prospekthüllen bestellt. Wir\nkaufen ja oft Büromaterialen bei Ihnen ein.\nGerade eben habe ich die Lieferung bekommen und habe gesehen, dass in dem Paket nur insgesamt 80\nProspekthüllen sind. Ich brauche die fehlenden Hüllen unbedingt morgen.\nKönnen Sie sie bitte sofort losschicken?\nBitte rufen Sie mich zurück. Mein Name ist Hofmann, H-O-F-M-A-N-N. Telefon 0173 715 720 3.\nIch danke Ihnen. Auf Wiederhören.","solution":"Beschwerde\nName: Hofmann\nTelefonnummer: 0173 715 720 3\nWeitere Informationen:\n• Anfang der Woche 200 Prospekthüllen bestellt haben\n• In dem Paket nur insgesamt 80 Prospekthüllen sind\n• Brauchen die fehlenden Hüllen unbedingt morgen\n• Sofort losschicken\nZu erledigen: Zurückrufen.\n                             Telefonnotiz (\n(\nGuten Tag, hier spricht Herr Kienzle, buchstabiert K-I-E-N-Z-L-E.\nIch wollte Ihnen bezüglich Ihrer Visitenkartenbestellung ein Angebot unterbreiten.\nAktuell haben wir Premiumpapier im Angebot. 100 Stück für 60,99.\nDie Lieferung erfolgt innerhalb von zwei Tagen per Expressversand.\nBitte rufen Sie mich zurück, um die gewünschte Papiersorte zu bestätigen.\nSie erreichen mich unter der Telefonnummer 0179-335-36 37. Vielen Dank und auf Wiederhören.\nAngebot\nName: Kienzle / Strauß / Strauss\nTelefonnummer: 0179 335 36 37 / 01734174377\nWeitere Informationen:\n• Die Visitenkartenbestellung / 16 oder 20% Rabatt\n• Premiumpapier im Angebot 100 Stück für 60,99 / • Premiumpapier im Angebot 150 Stück für 90,99 / 16,99 für\n100 Stück Papier\n• Die Lieferung erfolgt innerhalb von zwei Tagen per Expressversand /• Expresslieferung / 2 Tage lieferbar\nZu erledigen: Zurückrufen und bestätigen die Papiersorte. / Zurückrufen und bestätigen."},{"id":"TN-P103","page":103,"title":"Telefonnotiz 5","transcript":"Guten Tag, hier spricht …. Walter von der Firma Groß und Co. Ich rufe wegen Ihrer Kopierpapierbestellung an.\nZu Ihren Fragen: Wir haben aktuell das Premiumpapier im Angebot. Sie nehmen ja immer unser Standardpapier.\nKopierpapier in Premiumqualität gibt es momentan Standard 4,49 € pro 500 Blatt. Wir können Ihnen das\nKopierpapier im Rahmen des Expressversands innerhalb eines Tages liefern. Wenn Sie bis 18:00 Uhr bestellen,\nkönnen wir Ihnen dieses garantieren.\nBitte rufen Sie mich zurück und bestätigen die Papiersorte. Mein Name ist Walter. W-A-L-T-E-R. Meine\nTelefonnummer ist die 0174 113 806 6. Ich wünsche Ihnen noch einen schönen Tag. Auf Wiederhören.","solution":"Angebot\nName: Walter\nTelefonnummer: 0174 113 806 6\nWeitere Informationen:\n• wegen der Kopierpapierbestellung\n• Premiumpapier im Angebot\n• 4,49 € pro 500 Blatt\n• Expressversand innerhalb eines Tages, wenn bis 18:00 Uhr bestellen\nZu erledigen: Zurückrufen und bestätigen die Papiersorte.\nGuten Tag, hier spricht Herr Walther .\nIch wollte Ihnen ein Angebot unterbreiten.\nKopierpapier aus Premiumpapier sind derzeit bereits ab 7,89 Euro für 500 Blatt erhältlich.\nWir bieten Ihnen einen Expressversand bis morgen an. Wenn Sie bis 15:00 Uhr bestellen, können wir Ihnen\ndiese Garantie bieten.\nBitte rufen Sie mich zurück, um die gewünschte Papiersorte zu bestätigen.\nSie erreichen mich unter der Telefonnummer 01734174737. Vielen Dank und auf Wiederhören.\nAngebot\nName: Walther\nTelefonnummer: 01734174737\nWeitere Informationen:\n• Kopeirpapier aus Premiumpapier\n• Ab 7,89 Euro für 500 Blatt\n• Expressversand bis morgen, wenn bis 15:00 Uhr bestellen\nZu erledigen: Zurückrufen und bestätigen die Papiersorte."},{"id":"TN-P104","page":104,"title":"Telefonnotiz 6","transcript":"Guten Tag, hier spricht Herr Messner, buchstabiert M-E-S-S-N-E-R. Ich möchte für kommenden Freitagabend,\nden 19.30 Uhr, eine Tischreservierung für fünf Personen vornehmen. Außerdem würde ich gerne wissen, ob für\nIhre Gäste Parkmöglichkeiten zur Verfügung stehen. Es wäre ideal, wenn Sie für unsere Gruppe das Menü Nr.\n1 vorbereiten könnten. Bitte bestätigen Sie mir die Reservierung sowie die Verfügbarkeit eines Parkplatzes.\nSie erreichen mich unter der Telefonnummer 041-337-843-009. Vielen Dank im Voraus für Ihre Rückmeldung. Auf\nWiederhören.\n(\nNikol Meßner, Firma Karcher & Söhne. Guten Tag. Wir waren letzte Woche bei Ihnen zum Essen, und ich muss\nsagen, es hat hervorragend geschmeckt. Derzeit würde ich jetzt gerne einen Tisch für fünf Personen reservieren.\nEs geht um ein Geschäftsessen für meinen Chef und vier Kunden, und zwar für Freitagabend um 19.30 Uhr. Ich\nbestelle auch jetzt gleich das Essen, damit dann alles problemlos funktioniert. Bitte bereiten Sie für alle das Menü 1\nvor. Haben Sie eigentlich einen Parkplatz für Gäste? Bitte rufen Sie mich zurück, um meine Reservierung zu\nbestätigen. Mein Name ist MEßNER, M-E-ß-N-E-R. Meine Telefonnummer lautet 0413 378 430 09. Vielen\nDank. Auf Wiedersehen.\n(\nGuten Tag, hier spricht Herr Herrmann. Ich möchte für kommenden Donnerstagabend um 18.30 eine\nTischreservierung für sechs Personen vornehmen. Es handelt sich dabei um fünf Kunden sowie mich als Leiter.\nDarüber hinaus würde ich gerne in Erfahrung bringen, ob für unsere Gäste Parkplätze zur Verfügung stehen.\nZudem bitte ich um Bestätigung, dass das Menü 2 für uns bereitgestellt wird. Ich wäre Ihnen sehr dankbar, wenn\nSie mir die Reservierung sowie die Verfügbarkeit des Parkplatzes telefonisch bestätigen könnten. Sie erreichen\nmich unter der Nummer 0172 439 378 6. Mein Name wird wie folgt buchstabiert H-E-RR-M-A-NN. Vielen Dank\nund auf Wiederhören.\nBuchung","solution":"Name: Messner / Meßner / Herrmanns / Lorenz\nTelefonnummer: 04133 784 30 09/0172 439 378 6 / 0157 340 4825\nWeitere Informationen:\n• Einen Tisch reservieren für 5 Personen / Einen Tisch reservieren für 5 Personen / für 6 Personen\n• Am Freitagabend um 19:30 Uhr / Am Donnerstagabend um 18:30 Uhr /am Mittwochabend um 18:00 Uhr\n• Haben Sie einen Parkplatz für Gäste?\n• Menu №1 vorbereiten / Menu №2 bestätigen / Menu №3\nZu erledigen: Rückruf und bestätigen die Reservierung und Parkplätze.\nBuchung\nName: Möller / Müller\nTelefonnummer: 0151 130 686 4\nWeitere Informationen:\n• Einen Tisch reservieren für 2 Personen\n• Am Freitagabend um 12:30\n• Haben Sie einen Parkplatz für Gäste?\n• Menu №4 vorbereiten\nZu erledigen: Rückruf und bestätigen die Reservierung und Parkplätze."},{"id":"TN-P105","page":105,"title":"Telefonnotiz 7","transcript":"Stefan Wolff, Restaurant Ätna, guten Tag. Wir haben für heute Getränke für eine Veranstaltung mit über 200\nPersonen bestellt, aber leider ist die Lieferung noch nicht da und es ist bereits 11 Uhr. Wir warten auf 50\nKästen Wasser und 15 gemischte Saftkisten. Die Sachen müssen bis spätestens 14:30 Uhr bei uns sein, da wir\nnoch alles vorbereiten müssen. Bitte schicken Sie so schnell wie möglich die bestellten Getränke oder geben Sie\nBescheid, wann wir mit der Lieferung rechnen können. Sollte ich bis 12 Uhr nichts von Ihnen gehört haben,\nmuss ich versuchen, die Sachen bei einem anderen Getränkemarkt zu bekommen. Das war dann aber auch unser\nletzter Auftrag für Sie. Sie erreichen mich unter der Nummer 0162 744 642 8. Mein Name ist Wolff. W-O-L-FF.","solution":"Beschwerde\nName: Wolff / Knopper / Knooper\nTelefonnummer: 0162 744 642 8\nWeiteren Informationen:\n• Getränke für die Veranstaltung mit über 200 / 100 Personen sind für heute bestellt\n• Die Lieferung um 11 Uhr ist nicht angekommen\n• Auf 50 Kästen Wasser und 15 gemischte Saftkisten warten / 30 Kisten Wasser und 10 Kisten gemischte Säfte\n• Die Sachen müssen bis spätestens 14:30 Uhr ankommen\n• Auf Rückruf bis 12 Uhr warten\nZu erledigen: Die Lieferung so schnell wie möglich schicken und bis 12 Uhr Bescheid sagen.\n                                  Telefonnotiz (\n(\nMein Name ist Anna Schulze, Firma Shell am Apparat. Ich habe mir Ihren defekten Kopierer angesehen. Es liegt\nein größeres Problem mit der Elektronik vor, dass man nur in unserer Werkstatt beheben kann.\nVor Ort konnte ich ihn nicht wieder zum Laufen bringen.\nEin Austausch würde ca. 4 Wochen dauern, da wir derzeit Probleme mit dem Lieferanten haben.\nWenn Sie sich für eine Reparatur entscheiden, müssten wir noch einen Ersatzteil bestellen. Das würde\ninsgesamt ca. 2 Werktage dauern.\nLeider haben wir zurzeit noch kein Gerät, deswegen Leihweite zur Verfügung stellen können. Die Reparatur\nwürde mein Kollege machen, da ich nächste Woche im Urlaub bin. Die Frage ist nun, ob wir den Kopierer\naustauschen oder die alte Reparatur besorgen.\nRufen Sie mich bitte bis morgen zurück. Schulze, SCH-U-L-Z-E. Meine Telefonnummer ist 0160 335 101 8.\nAngebot\nName: Schulze\nTelefonnummer: 0160 335 101 8\nWeiteren Informationen:\n• Defekter Kopierer hat ein großes Problem mit der Elektronik\n• Das Problem kann man nur in Werkstatt beheben / Reparatur nur in Werkstatt möglich\n• Austausch dauert 4 Wochen wegen Lieferschwierigkeiten / Austausch dauert ca. 4 Wochen\n• Für die Reparatur müssen Ersatzteile bestellt werden. Das wird ca. 2 Werktage dauern / Reparatur : 2 Werktage,\nErsatztteil nötig\n• zurzeit noch kein Gerät, deswegen Leihweite zur Verfügung stellen können / kein Leihgerät vorhanden\nZu erledigen: Bis morgen zurückrufen. Entscheidung : Reparatur oder Austausch.\nAngebot\nName: Scholtz\nTelefonnummer: 01740254831\nWeiteren Informationen:\n• Defekter Kopierer hat ein großes Problem mit der Elektronik\n• Das Problem kann nur in Werkstatt behoben werden\n• Austausch dauert 3 Wochen wegen Lieferschwierigkeiten\n• Für die Reparatur müssen Ersatzteile bestellt werden. Das wird 5 Tage dauern\n• Die Firma kann momentan keine Geräte zur Verfügung stellen\nZu erledigen: Zurückrufen. Entscheiden, ob Reparatur oder Austausch."}],"speaking":[{"n":1,"situation":"Sie arbeiten in einer Konditorei. Sie haben heute Morgen im Lager kleine Tierchen im Mehl entdeckt. Jetzt können Sie damit nicht backen, aber Sie haben wie immer viele Vorbestellungen für Kuchen.","bullets":["Chef*in: Wie kontaktieren?","Kund*innen: Wie informieren? Was anbieten?","Lager: Was tun?","Neues Mehl: Woher nehmen? Wo lagern?"]},{"n":2,"situation":"Sie sind in einem großen Produktionsbetrieb tätig. Ein bedeutender ausländischer Kunde plant nächsten Monat einen viertägigen Aufenthalt in Ihrer Stadt. Ihr Vorgesetzter hat Sie beauftragt, die Organisation dieses Aufenthalts zu übernehmen.","bullets":["Übernachtungsmöglichkeiten?","Wie abholen?","Wen treffen?","Was zeigen? Abendprogramm?"]},{"n":3,"situation":"Sie arbeiten zusammen in einer Bäckerei, und einer Ihrer Kolleginnen kommt morgens immer wieder zu spät, obwohl Sie sie bereits mehrmals darauf hingewiesen haben. Die Arbeit zu zweit zu bewältigen, wird dadurch zu einer Herausforderung.","bullets":["Kollegin: Was tun?","Chef*in: Wie Problem ansprechen?","Kurzfristig: Wie reagieren?","Arbeitsablauf: Was umorganisieren?","Langfristig: Was ändern?"]},{"n":4,"situation":"Sie arbeiten in einem großen Kaufhaus. Aufgrund von Krankheitsfällen stehen in den einzelnen Abteilungen zu wenig Mitarbeiterinnen und Mitarbeiter zur Verfügung, besonders in der beliebten Vorweihnachtszeit.","bullets":["Wie Personal bekommen?","Öffnungszeiten ändern?","Überstunden ändern?","Urlaubssperre?","Abteilung schließen?","Danke für Mitarbeiter?"]},{"n":5,"situation":"Ihre Firma plant, im nächsten Monat umzuziehen. Bedauerlicherweise ist das beauftragte Umzugsunternehmen insolvent und kann den Umzug nicht durchführen.","bullets":["Andere Umzugsfirmen?","Umzug anders organisieren?","Wer könnte helfen?","Vermieter kontaktieren?","Schadenersatz?"]},{"n":6,"situation":"Sie arbeiten in einer Großküche. Der Kühlraum funktioniert nicht. Weil es heiß ist, sind einige Lebensmittel schon schlecht geworden und der Rest muss schnell gekühlt werden.","bullets":["Kühlraum: Was tun? Wen kontaktieren?","Schlecht gewordene Lebensmittel: Woher Ersatz?","Andere Lebensmittel: Wie verwenden?","Langfristig: Welche Kühlalternativen möglich?"]},{"n":7,"situation":"Sie arbeiten in einer Bäckerei. Der Backofen funktioniert nicht und Sie können nicht backen.","bullets":["Was tun?","Laden heute öffnen?","Wen anrufen?","Was verkaufen?","Preise?","Langfristig: Welche andere Handwerksfirma?"]},{"n":8,"situation":"Sie arbeiten bei einer Möbelspedition und stellen beim Kunden fest, dass ein falsches Produkt geliefert wurde.","bullets":["Wer verantwortlich?","Wen informieren?","Wann richtige Lieferung möglich? Was Kunden anbieten?","Kosten für die zweite Lieferung?"]},{"n":9,"situation":"Sie arbeiten in einem Restaurant, und am Abend ist eine Großveranstaltung geplant. Leider gibt es einen Wasserschaden, weshalb die Veranstaltung abgesagt werden muss.","bullets":["Handwerker: Wie finden?","Gäste: Wie informieren? Was anbieten?","Eingekaufte Lebensmittel: Was damit tun?","Aushilfskräfte: Wie kontaktieren?"]},{"n":10,"situation":"Sie arbeiten in einem Altenheim, und der Essenslieferant bringt das Mittagessen für die Bewohner regelmäßig verspätet und kalt. Die Bewohner beschweren sich darüber.","bullets":["Lieferzeit: Wie ändern?","Essen: Wie aufwärmen?","Lieferanten: Wie kontaktieren? Was fordern?","Langfristig: Wie neuen Lieferanten finden?"]},{"n":11,"situation":"Sie arbeiten in der Physiotherapie-Abteilung eines Krankenhauses. Für die anstehenden Anwendungen sind verschiedene Salben und Öle erforderlich, die jedoch nicht geliefert wurden. Aber der Terminkalender ist voll.","bullets":["Kurzfristige Lösung: Wo Produkte kaufen?","Termine: Wie Patienten erreichen?","Lieferanten: Wie kontaktieren? Was fordern?","Langfristig: Wie neuen Lieferanten finden?"]},{"n":12,"situation":"Sie arbeiten in einem Hotel, und es kommt häufig vor, dass mehrere Buchungen für dasselbe Zimmer im gleichen Zeitraum vorgenommen werden.","bullets":["Doppelbuchungen: Was tun?","Gäste: Was anbieten?","Sofortmaßnahmen: Wie Ersatz organisieren?","Wie die nächsten Buchungen kontrollieren?","Langfristig: Wie in Zukunft vermeiden?"]},{"n":13,"situation":"Sie arbeiten in einem Supermarkt, und Ihre Kunden freuen sich jedes Jahr vor Ostern auf Schoko- Hasen, die Sie anbieten. Die Lieferung ist heute eingetroffen, aber leider sind alle Schoko-Hasen während des Transports zerbrochen.","bullets":["Schoko-Hasen: Was tun?","Kunden: Wie kommunizieren? Was anbieten?","Lieferanten: Wie kontaktieren? Was fordern?","Langfristig: Schoko-Hasen fürs nächste Jahr? Anderer Lieferant?"]},{"n":14,"situation":"Sie arbeiten in einem Supermarkt. Es ist Montagmorgen, und laut Prospekt sollten ab heute günstige Schreibwaren zum Schulanfang erhältlich sein. Leider sind diese nicht geliefert worden, obwohl viele Kunden bereits danach fragen.","bullets":["Kunden: Wie beruhigen? Was anbieten?","Lieferant: Wie kontaktieren? Was verlangen?","Langfristig: Lieferanten wechseln?"]},{"n":15,"situation":"Sie arbeiten in einem großen Möbelgeschäft am Stadtrand. Draußen hat es starken Eisregen gegeben, wodurch der Parkplatz so rutschig ist, dass die Kund*innen nicht mehr wegfahren können.","bullets":["Winterdienst informieren?","Wie Kund*innen beruhigen?","Was Kund*innen anbieten?","Was selbst tun?","Erste-Hilfe nötig?"]},{"n":16,"situation":"Sie arbeiten in einem Pizzaservice und haben seit einiger Zeit neue Transportboxen im Einsatz. Leider gehen diese während des Transports leicht auf, sodass das Essen kalt bei den Kunden ankommt.","bullets":["Kurzfristig: Wie Ware transportieren?","Kund*innen: Wie kontaktieren? Was anbieten?","Hersteller: Was verlangen?","Langfristig: Andere Transportboxen?"]},{"n":17,"situation":"Sie arbeiten als Koch in einem Restaurant. Sie arbeiten seit Kurzem mit einem regionalen Bauernhof und bekommen frisches Obst und Gemüse. Leider werden in der letzten Zeit die Lieferzeiten öfter nicht eingehalten, was regelmäßig zu Problemen führt.","bullets":["Obst/Gemüse heute nicht geliefert: Was machen?","Heute: Wie Ersatz anschaffen?","Lieferant: Wie kontaktieren? Was fordern?","Langfristig: Welcher Lieferant?"]}],"meta":{"source":"PRUFUNG.pdf","pages":177,"scoring":{"lesenTeil1":15,"lesenTeil2":12,"lesenTeil3":12,"lesenTeil4":15,"beschwerdeReading":6,"lesenTotal":60},"writing":{"beschwerde":7,"telefonnotiz":6,"sprach1":3,"sprach2":3,"forum":14,"grammar":27,"total":60},"speaking":{"teil1":12,"teil2":8,"teil3":10,"language":30,"total":60}},"beschwerdeLesen":[{"id":"BL-63","page":63,"title":"Originalaufgabe · Seite 63","body":"Hallo Friederike,\ngerade habe ich die angehängte Mail von der Firma Huber GmbH gelesen und bin schockiert. Ich verstehe den\nÄrger von Herrn Lassner, kann aber kaum glauben, was er da schreibt. Bitte sprich mal mit unseren Leuten und\nkläre, was da los ist, und antworte dann Herrn Lassner. Es ist ganz wichtig, dass du ihm zusagst, dass so etwas nie\nwieder vorkommen wird. Gib ihm auch einen Rabatt auf die nächste Rechnung in Höhe von 20 %. Wir dürfen die\nFirma mit diesem großen Auftrag keinesfalls als Kunden verlieren.\nDanke dir und schönen Feierabend!\nGruß\nHeike\nSehr geehrte Frau Woller,\nleider muss ich mich heute mit einer Beschwerde an Sie wenden. Wir haben einen Vertrag mit Ihrer Firma für die\nReinigung unserer Büroräume. In diesem Vertrag sind täglich 3 Stunden Arbeit bei uns festgelegt, und zwar von\n6.00 Uhr bis 9.00 Uhr morgens.\nIn den letzten zwei Wochen war unsere Sekretärin einige Male bereits vor 9 Uhr im Büro, von Ihrem Putzdienst war\naber niemand zu sehen. Wie kann das sein?\nWenn wir 3 Stunden bezahlen, erwarten wir auch, dass Ihr Personal drei Stunden bei uns arbeitet. Wenn Sie für die\nReinigung unserer Räume weniger als die vereinbarte Zeit benötigen, sollten Sie uns darüber informieren, damit wir\nden Vertrag ändern.\nIch bitte um umgehende Stellungnahme und natürlich die Angleichung der Rechnung an die tatsächlich geleisteten\nArbeitsstunden.\nMit freundlichen Grüßen\nTheo Lassner","questions":[{"n":19,"text":"Herr Lassner","options":[{"key":"a","text":"möchte seine Rechnung nicht begleichen."},{"key":"b","text":"ist mit der Sauberkeit im Büro nicht zufrieden."},{"key":"c","text":"will nur die geleisteten Stunden bezahlen."}],"answer":"b"},{"n":20,"text":"Der Putzdienst","options":[{"key":"a","text":"hält die Arbeitszeit ein. / hat flexible Einsatzzeiten."},{"key":"b","text":"hat zu wenig Stunden gearbeitet."},{"key":"c","text":"möchte einen neuen Vertrag. 20. Der Putzdienst"}],"answer":"b"}]},{"id":"BL-64","page":64,"title":"Originalaufgabe · Seite 64","body":"Lieber Herr Klein,\nich habe schon wieder eine Beschwerde einer Kundin vorliegen. Sie hat ihre bestellten Tischlampen nicht\nbekommen. Bitte antworten Sie Frau Berger und erklären Sie ihr, warum wir im Moment Lieferschwierigkeiten\nhaben. Versuchen Sie auch, sie davon zu überzeugen, noch bis nächste Woche zu warten und den Auftrag nicht zu\nstornieren. Bieten Sie ihr außerdem ein ähnliches Modell an, das wir auf Lager haben. Danke!\nHerzliche Grüße\nKnut Richter\nSehr geehrter Herr Richter,\nvergangene Woche habe ich bei Ihnen 25 Tischlampen Modell TS 13 150 07 für unsere neuen Büroräume bestellt.\nMir wurde telefonisch zugesagt, dass die Lampen noch diese Woche geliefert werden, aber jetzt ist schon\nFreitagnachmittag und sie sind leider noch immer nicht eingetroffen.\nDas ist ärgerlich, da wir am Wochenende unsere Renovierungsarbeiten beenden und die Büros dann vollständig neu\neinrichten werden. Dazu wurden natürlich auch die Lampen gehören, da wir am Montag unseren Bürobetrieb in\nfunktionstüchtigen Räumen wieder aufnehmen wollen. Ich habe bereits mehrfach versucht, Sie telefonisch zu\nerreichen, und habe Nachrichten auf Ihrem Anrufbeantworter hinterlassen, aber ich wurde leider nicht\nzurückgerufen. Inzwischen habe ich einen Lieferanten gefunden, der uns kurzfristig andere Tischlampen liefern\nkönnte.\nWenn Ihre Lampen also bis Montagmittag, 13:00 Uhr, nicht bei uns eingetroffen sind, werde ich die Bestellung bei\nIhnen stornieren. Ich bitte um eine schnelle Antwort!\nMit freundlichen Grüßen\nEvelyn Berger","questions":[{"n":19,"text":"Frau Berger","options":[{"key":"a","text":"beschwert sich über die Qualität des Produktes."},{"key":"b","text":"hat eine fehlerhafte Lieferung erhalten."},{"key":"c","text":"wartet dringend auf die Lieferung."}],"answer":"c"},{"n":20,"text":"Die Renovierungsarbeiten","options":[{"key":"a","text":"stehen kurz bevor."},{"key":"b","text":"verzögern sich."},{"key":"c","text":"sollen zeitnah abgeschlossen werden. Lieber Herr Klein, ich habe schon wieder eine Beschwerde einer Kundin vorliegen. Sie hat ihre bestellten Tischlampen nicht bekommen. Bitte antworten Sie Frau Berger und erklären Sie ihr, warum wir im Moment Lieferschwierigkeiten haben. Versuchen Sie auch, sie davon zu überzeugen, noch bis nächste Woche zu warten und den Auftrag nicht zu stornieren. Bieten Sie ihr außerdem ein ähnliches Modell an, das wir auf Lager haben. Danke! Herzliche Grüße Knut Richter Sehr geehrter Herr Richter, vergangene Woche habe ich bei Ihnen 25 Tischlampen Modell TS 13 150 07 für unsere neuen Büroräume bestellt. Mir wurde telefonisch zugesagt, dass die Lampen noch diese Woche geliefert werden, aber jetzt ist schon Freitagnachmittag und sie sind leider noch immer nicht eingetroffen. Das ist ärgerlich, da wir am Wochenende unsere Renovierungsarbeiten beenden und die Büros dann vollständig neu einrichten werden. Dazu wurden natürlich auch die Lampen gehören, da wir am Montag unseren Bürobetrieb in funktionstüchtigen Räumen wieder aufnehmen wollen. Ich habe bereits mehrfach versucht, Sie telefonisch zu erreichen, und habe Nachrichten auf Ihrem Anrufbeantworter hinterlassen, aber ich wurde leider nicht zurückgerufen. Inzwischen habe ich einen Lieferanten gefunden, der uns kurzfristig andere Tischlampen liefern könnte. Wenn Ihre Lampen also bis Montagmittag, 13:00 Uhr, nicht bei uns eingetroffen sind, werde ich die Bestellung bei Ihnen stornieren. Ich bitte um eine schnelle Antwort! Mit freundlichen Grüßen Evelyn Berger Sehr geehrte Frau Berger, vielen Dank für Ihre Rückmeldung von gestern. Wir bedauern die entstandenen Unannehmlichkeiten sehr und bitten um Entschuldigung. Heute habe ich mit dem Hersteller gesprochen und ich habe herausgefunden, dass der Grund für die Verzögerung unvorhergesehene Lieferschwierigkeiten sind. Ich möchte Ihnen versichern, dass in der Vergangenheit solche Situationen in wenigen Tagen behoben waren. Deswegen bitten wir Sie noch um Geduld. Falls Ihre Bestellung bis nächste Woche Montag nicht geliefert wird, bieten wir Ihnen ein ähnliches Model, welches wir auf Lager haben, an. Wir hoffen, dass Sie mit dieser Lösung zufrieden sind und wieder bei uns bestellen werden. Mit freundlichen Grüßen Lukas Klein"}],"answer":"c"}]},{"id":"BL-66","page":66,"title":"Originalaufgabe · Seite 66","body":"Hallo Frau Holsten,\nich habe heute Mittag die untenstehende Mail bekommen. Die vertauschten Namen sind unser Fehler und die\nverbessern wir auch. Bitte bestätigen Sie dem Kunden das. Aber mehr ist nun wirklich nicht drin. Das ist schon das\nfünfte Mal, dass er Korrekturwünsche hat, obwohl wir uns immer an die Vorgaben gehalten haben. So viele\nKorrekturen waren nicht vereinbart!\nWenn wir das noch machen sollten, geht das nur gegen zusätzliche Bezahlung. Ich rechne mit 200 (300) € extra.\nBitte teilen Sie ihm dies mit und lassen Sie sich von ihm sein Okay geben.\nDanke und viele Grüße\nJutta Spindler\nSehr geehrte Frau Spindler,\nvielen Dank für Ihren Entwurf für unsere neue Firmenwebseite. Ich habe ihn gemeinsam mit dem Team gesichtet\nund dabei ist uns aufgefallen, dass Ihre Agentur die Vorgaben an zwei Stellen leider nicht umgesetzt hat:\nZum einen hatten wir besprochen, dass das Farbschema grau-orange sein sollte. Da statt Grau Blau gewählt wurde,\nglaube ich, dass es zu einem Missverständnis gekommen ist. Zum anderen sind auf der Seite mit den\nAnsprechpartnern die Namen eigener Mitarbeiter vertauscht worden. Im Anhang schicke ich Ihnen noch einmal eine\nAuflistung der Namen mit den dazugehörigen Bildern. Könnten Sie diese beide Punkte bitte bis Anfang nächster\nWoche nachbessern? Eine kurze Rückmeldung wäre nett.\nMit freundlichen Grüßen\nFranz Stiller","questions":[{"n":19,"text":"Herr Stiller","options":[{"key":"a","text":"ist mit dem Entwurf der Agentur nicht einverstanden."},{"key":"b","text":"möchte, dass Frau Spindler sich einen Entwurf ansieht."},{"key":"c","text":"möchte wissen, wer den Entwurf überarbeiten kann."}],"answer":"a"},{"n":20,"text":"Die Agentur sagt, dass sie","options":[{"key":"a","text":"Änderungen nur gegen Aufpreis macht ."},{"key":"b","text":"keine Fehler gemacht hat."},{"key":"c","text":"keine Vorgaben von Herrn Stiller hatte. Hallo Frau Holsten, ich habe heute Mittag die untenstehende Mail bekommen. Die vertauschten Namen sind unser Fehler und die verbessern wir auch. Bitte bestätigen Sie dem Kunden das. Aber mehr ist nun wirklich nicht drin. Das ist schon das fünfte Mal, dass er Korrekturwünsche hat, obwohl wir uns immer an die Vorgaben gehalten haben. So viele Korrekturen waren nicht vereinbart! Wenn wir das noch machen sollten, geht das nur gegen zusätzliche Bezahlung. Ich rechne mit 200 (300) € extra. Bitte teilen Sie ihm dies mit und lassen Sie sich von ihm sein Okay geben. Danke und viele Grüße Jutta Spindler Sehr geehrte Frau Spindler, vielen Dank für Ihren Entwurf für unsere neue Firmenwebseite. Ich habe ihn gemeinsam mit dem Team gesichtet und dabei ist uns aufgefallen, dass Ihre Agentur die Vorgaben an zwei Stellen leider nicht umgesetzt hat: Zum einen hatten wir besprochen, dass das Farbschema grau-orange sein sollte. Da statt Grau Blau gewählt wurde, glaube ich, dass es zu einem Missverständnis gekommen ist. Zum anderen sind auf der Seite mit den Ansprechpartnern die Namen eigener Mitarbeiter vertauscht worden. Im Anhang schicke ich Ihnen noch einmal eine Auflistung der Namen mit den dazugehörigen Bildern. Könnten Sie diese beide Punkte bitte bis Anfang nächster Woche nachbessern? Eine kurze Rückmeldung wäre nett. Mit freundlichen Grüßen Franz Stiller Sehr geehrter Herr Stiller, vielen Dank für Ihre Rückmeldung von heute. Wir bedauern die entstandenen Unannehmlichkeiten sehr und bitten um Entschuldigung. Außerdem möchte ich Ihnen versichern, dass wir den Fehler im Nahmen bis Ende dieser Woche korrigieren werden. Bitte beachten Sie, dass das blau-orange Farbschema in unserem Vertrag vereinbart ist. Zudem ist das schon die fünfte Bitte um Korrektur. So viele Korrekturen waren nicht vereinbart. Deswegen kostet jede weitere Korrektur 200 (300) €. Wenn Sie mit dieser Lösung einverstanden sind, geben Sie mir bitte Bescheid. Vielen Dank für Ihr Verständnis. Mit freundlichen Grüßen Monika Holsten"}],"answer":"a"}]},{"id":"BL-67","page":67,"title":"Originalaufgabe · Seite 67","body":"Hallo Frau Retterstein,\nich habe gerade die unten stehende E-Mail von einem großen Kunden bekommen, der sich beschwert hat.\nOrganisieren Sie doch bitte so schnell wie möglich einen Techniker, der sich die Spülmaschine ansieht, und\nschreiben Sie Herrn Krüger.\nEntschuldigen Sie sich bitte für die Unannehmlichkeiten und sagen Sie ihm zu, dass wir seine Forderungen in seiner\nE-Mail prüfen werden.\nTeilen Sie Herrn Krüger aber bitte vorsorglich mit, dass die Reparatur eventuell nicht sofort durchgeführt werden\nkann, falls wir Ersatzteile bestellen müssen.\nDanke und viele Grüße\nDorothee Sturm\nSehr geehrte Frau Sturm,\nvor einer Woche haben wir bei Ihnen eine Spülmaschine für unsere Teeküche gekauft. Sie wurde sehr schnell\ngeliefert und auch gleich eingebaut. Leider muss ich Ihnen heute aber mitteilen, dass sie bereits defekt ist. Beim\nSpülen ist Wasser ausgelaufen und nun ist unser Parkett beschädigt.\nIch bitte Sie, uns umgehend einen Techniker zu schicken, der das Gerät repariert. Wir brauchen die Spülmaschine\nspätestens übermorgen, da wir ein großes Meeting unserer Außendienstmitarbeiter haben und viele Personen\nbewirten müssen.\nAußerdem müssen wir einen Teil des Parketts austauschen. Die Kosten dafür werden wir Ihnen in Rechnung stellen.\nBitte schicken Sie mir so schnell wie möglich einer Terminvorschlag für die Reparatur und eine Bestätigung der\nKostenübernahme. Vielen Dank!\nMit freundlichen Grüßen\nClaudio Krüger","questions":[{"n":19,"text":"Der Kunde","options":[{"key":"a","text":"fordert eine neue Spülmaschine."},{"key":"b","text":"hat einen Wasserschaden in der Küche."},{"key":"c","text":"beschwert sich über die Reparaturarbeiten."}],"answer":"b"},{"n":20,"text":"Die Firma Küchenbedarf soll","options":[{"key":"a","text":"die Reparatur der Spülmaschine in Rechnung stellen."},{"key":"b","text":"innerhalb von zwei Tagen die Spülmaschine reparieren."},{"key":"c","text":"das Parkett in der Teeküche umgehend ersetzen. Hallo Frau Retterstein, ich habe gerade die unten stehende E-Mail von einem großen Kunden bekommen, der sich beschwert hat. Organisieren Sie doch bitte so schnell wie möglich einen Techniker, der sich die Spülmaschine ansieht, und schreiben Sie Herrn Krüger. Entschuldigen Sie sich bitte für die Unannehmlichkeiten und sagen Sie ihm zu, dass wir seine Forderungen in seiner E-Mail prüfen werden. Teilen Sie Herrn Krüger aber bitte vorsorglich mit, dass die Reparatur eventuell nicht sofort durchgeführt werden kann, falls wir Ersatzteile bestellen müssen. Danke und viele Grüße Dorothee Sturm Sehr geehrte Frau Sturm, vor einer Woche haben wir bei Ihnen eine Spülmaschine für unsere Teeküche gekauft. Sie wurde sehr schnell geliefert und auch gleich eingebaut. Leider muss ich Ihnen heute aber mitteilen, dass sie bereits defekt ist. Beim Spülen ist Wasser ausgelaufen und nun ist unser Parkett beschädigt. Ich bitte Sie, uns umgehend einen Techniker zu schicken, der das Gerät repariert. Wir brauchen die Spülmaschine spätestens übermorgen, da wir ein großes Meeting unserer Außendienstmitarbeiter haben und viele Personen bewirten müssen. Außerdem müssen wir einen Teil des Parketts austauschen. Die Kosten dafür werden wir Ihnen in Rechnung stellen. Bitte schicken Sie mir so schnell wie möglich einer Terminvorschlag für die Reparatur und eine Bestätigung der Kostenübernahme. Vielen Dank! Mit freundlichen Grüßen Claudio Krüger Sehr geehrter Herr Krüger, vielen Dank für Ihre Rückmeldung von gestern. Wir bedauern die entstandenen Unannehmlichkeiten sehr und bitten um Entschuldigung. Unserer Techniker könnte am kommenden Montag 27.05.2024 um 8:00 Uhr kommen, um die Spülmaschine und das beschädigten Parkett zu überprüfen. Bitte teilen Sie uns mit, ob der Termin stattfinden kann. Beachten Sie, dass falls wir Ersatzteile für die Reparatur bestellen müssen, keine umgehende Reparatur möglich ist. Detaillierte Information können wir Ihnen nach der Überprüfung geben. Wir danken Ihnen für Ihr Verständnis. Mit freundlichen Grüßen Anika Retterstein"}],"answer":"b"}]},{"id":"BL-68","page":68,"title":"Originalaufgabe · Seite 68","body":"Hallo,\nbitte schauen Sie sich mal die untenstehende E-Mail an.\nDa ist wohl was schief gegangen. Bitte schreiben Sie Herrn Zaun und erklären Sie ihm, warum es zu den Fehlern\ngekommen ist. Sagen Sie ihm zu, dass am Mittwochmorgen pünktlich zwei Männer da sein werden, die alles fertig\nmachen.\nNatürlich übernehmen wir auch die Verantwortung für die entstandenen Schäden.\nDie Firma hat uns das erste Mal gebucht und ich würde ungern einen negativen Eindruck hinterlassen. Ich verlasse\nmich auf Sie.\nDanke und viele Grüße\nFrieda Börne / Sophia Prince\nSehr geehrte Frau Börne, / Prince\nam Wochenende ist unser Büro mit Hilfe Ihres Unternehmens von Hanau nach Frankfurt umgezogen. Leider waren\nwir mit Ihrem Service überhaupt nicht zufrieden.\nIhre Mitarbeiter kamen eine halbe Stunde zu spät und nur zu dritt statt wie vereinbart zu viert. Deshalb dauerte der\nganze Umzug natürlich länger als geplant und einige Arbeiten sind auch noch nicht abgeschlossen: Es sind noch\nnicht alle Möbel aufgebaut, deshalb konnten wir noch nicht unsere Sachen einräumen.\nBitte schicken Sie uns deshalb am Mittwochmorgen noch zwei Personen, die den Möbelaufbau erledigen. Des\nWeiteren sind Glasplatten zu Bruch gegangen und einige Schränke sind verkratzt. Ich gehe davon aus, dass Ihre\nFirma die Kosten dafür übernimmt.\nMit freundlichen Grüßen\nThomas Zaun / Matteo Lozano","questions":[{"n":19,"text":"Herr Zaun beschwert sich über 19. Beim Umzug","options":[{"key":"a","text":"die Mitarbeiter der Firma. a) haben vier Möbelpacker gearbeitet."},{"key":"b","text":"die Qualität von Produkten. b) kam es zu Verzögerungen ."},{"key":"c","text":"eine ausbleibende Lieferung. c) wurden nicht alle Möbel transportiert."}],"answer":"a"},{"n":20,"text":"Herr Zaun 20. Herr Lozano","options":[{"key":"a","text":"ist nach Hanau gezogen. a) musste seinen Umzug verschieben."},{"key":"b","text":"musste seinen Umzug verschieben. b) verlangt Schadensersatz."},{"key":"c","text":"verlangt Schadensersatz. c) ist nach Hanau gezogen. Hallo, bitte schauen Sie sich mal die untenstehende E-Mail an. Da ist wohl was schief gegangen. Bitte schreiben Sie Herrn Zaun und erklären Sie ihm, warum es zu den Fehlern gekommen ist. Sagen Sie ihm zu, dass am Mittwochmorgen pünktlich zwei Männer da sein werden, die alles fertig machen. Natürlich übernehmen wir auch die Verantwortung für die entstandenen Schäden. Die Firma hat uns das erste Mal gebucht und ich würde ungern einen negativen Eindruck hinterlassen. Ich verlasse mich auf Sie. Danke und viele Grüße Frieda Börne / Sophia Prince Sehr geehrte Frau Börne, / Prince am Wochenende ist unser Büro mit Hilfe Ihres Unternehmens von Hanau nach Frankfurt umgezogen. Leider waren wir mit Ihrem Service überhaupt nicht zufrieden. Ihre Mitarbeiter kamen eine halbe Stunde zu spät und nur zu dritt statt wie vereinbart zu viert. Deshalb dauerte der ganze Umzug natürlich länger als geplant und einige Arbeiten sind auch noch nicht abgeschlossen: Es sind noch nicht alle Möbel aufgebaut, deshalb konnten wir noch nicht unsere Sachen einräumen. Bitte schicken Sie uns deshalb am Mittwochmorgen noch zwei Personen, die den Möbelaufbau erledigen. Des Weiteren sind Glasplatten zu Bruch gegangen und einige Schränke sind verkratzt. Ich gehe davon aus, dass Ihre Firma die Kosten dafür übernimmt. Mit freundlichen Grüßen Thomas Zaun / Matteo Lozano Sehr geehrter Herr Zaun, / Lozano vielen Dank für Ihre Rückmeldung von gestern. Wir bedauern die entstandenen Unannehmlichkeiten sehr und bitten um Entschuldigung. Der Grund dafür war, dass unsere Mitarbeiter auf dem Weg zu Ihnen eine kleine Autopanne hatten. Außerdem hatten sich einige Mitarbeiter in der letzten Woche krank gemeldet, was zu Personalmangel führte. Wir möchten Ihnen versichern, dass diese Situation sich nicht wiederholen wird. Zudem werden zwei unserer Mitarbeiter am Mittwochmorgen pünktlich bei Ihnen sein. Natürlich möchten wir Sie als Kunden zufriedenstellen, deswegen übernehmen wir die Kosten für die beschädigten Möbel. Wir freuen uns weiterhin auf eine Zusammenarbeit. Mit freundlichen Grüßen Monika Kühne"}],"answer":"c"}]},{"id":"BL-71","page":71,"title":"Originalaufgabe · Seite 71","body":"Hallo,\nich habe heute die unten stehende E-Mail erhalten. Bitte kümmern Sie sich darum und antworten Sie dem Kunden\nhöflich. Die Firma \"Meier\" ist ein langjähriger Kunde von uns. Wir können es uns nicht leisten, ihn zu verlieren.\nSchreiben Sie ihm bitte von unserem Computerproblem und wie wir es gelöst haben. Natürlich bekommt er den\nRabatt wie gewohnt.\nVielen Dank.\nAnna Hoffner\nSehr geehrte Frau Hoffner,\nwir haben Ihre Lieferung erhalten und sind mit allen Artikeln absolut zufrieden. Leider muss ich Sie darauf\nhinweisen, dass die Rechnung einige Unstimmigkeiten beinhaltet: Zunächst wurden statt 100 Stück Pinsel Größe M\n200 Stück berechnet. Außerdem wurden 20 Töpfe roter Farbe berechnet. Wir hatten aber grüne Farbe bestellt und\ngeliefert bekommen, die preislich niedriger liegt. Wir bitten Sie, dies zu korrigieren. Des Weiteren waren wir\nüberrascht, dass unser üblicher Rabatt von 10 % in dieser Rechnung nicht gewährt wurde. Das ist wahrscheinlich ein\nVersehen.\nWir bitten um Berichtigung der Rechnung und erneute Zusendung.\nMit freundlichen Grüßen\nKarl Schmidt\nNummer 21 Schreiben Sie eine E-Mail an den Kunden.","questions":[{"n":19,"text":"Herr Schmidt","options":[{"key":"a","text":"hat falsche Waren vom Lieferanten erhalten."},{"key":"b","text":"meldet eine unvollständige Sendung."},{"key":"c","text":"weist auf falsche Posten in der Zahlungsaufforderung hin."}],"answer":"c"},{"n":20,"text":"Die Rechnung","options":[{"key":"a","text":"hat 100 Pinsel nicht aufgeführt."},{"key":"b","text":"ist ohne Preisnachlass ausgestellt worden."},{"key":"c","text":"wurde an einen falschen Adressaten geschickt. Hallo, ich habe heute die unten stehende E-Mail erhalten. Bitte kümmern Sie sich darum und antworten Sie dem Kunden höflich. Die Firma \"Meier\" ist ein langjähriger Kunde von uns. Wir können es uns nicht leisten, ihn zu verlieren. Schreiben Sie ihm bitte von unserem Computerproblem und wie wir es gelöst haben. Natürlich bekommt er den Rabatt wie gewohnt. Vielen Dank. Anna Hoffner Sehr geehrte Frau Hoffner, wir haben Ihre Lieferung erhalten und sind mit allen Artikeln absolut zufrieden. Leider muss ich Sie darauf hinweisen, dass die Rechnung einige Unstimmigkeiten beinhaltet: Zunächst wurden statt 100 Stück Pinsel Größe M 200 Stück berechnet. Außerdem wurden 20 Töpfe roter Farbe berechnet. Wir hatten aber grüne Farbe bestellt und geliefert bekommen, die preislich niedriger liegt. Wir bitten Sie, dies zu korrigieren. Des Weiteren waren wir überrascht, dass unser üblicher
