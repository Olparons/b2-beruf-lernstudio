 Rabatt von 10 % in dieser Rechnung nicht gewährt wurde. Das ist wahrscheinlich ein Versehen. Wir bitten um Berichtigung der Rechnung und erneute Zusendung. Mit freundlichen Grüßen Karl Schmidt Nummer 21 Schreiben Sie eine E-Mail an den Kunden. Sehr geehrter Herr Friedrien, vielen Dank für Ihre E-Mail und Ihre Geduld. Wir entschuldigen uns aufrichtig für die Unannehmlichkeiten und die Unstimmigkeiten auf Ihrer Rechnung. Leider gab es ein Computerproblem, welches die fehlerhafte Berechnung verursacht hat. Dieses Problem wurde mittlerweile behoben. Selbstverständlich haben wir Ihren Auftrag überprüft und die erforderlichen Korrekturen vorgenommen. Die korrekte Anzahl der Pinsel sowie die von Ihnen bestellte grüne Farbe wurden in der neuen Rechnung entsprechend angepasst. Auch Ihr üblicher Rabatt von 10 % wurde nun berücksichtigt. Wir haben eine neue, korrigierte Rechnung an Sie gesendet. Bei weiteren Fragen oder Anliegen stehen wir Ihnen jederzeit gerne zur Verfügung. Wir schätzen Ihre langjährige Partnerschaft und freuen uns auf die weitere Zusammenarbeit mit Ihnen. Mit freundlichen Grüßen"}],"answer":"b"}]},{"id":"BL-73","page":73,"title":"Originalaufgabe · Seite 73","body":"Hallo,\nmich erreichte die untenstehende E-Mail. Bitte kümmern Sie sich darum und antworten Sie dem Kunden höflich.\nEntschuldigen Sie sich für die verschmutzte Ware. Der geforderte Rabatt von 60% ist unverschämt. Bieten Sie ihm\neine andere Lösung an. Die Nachlieferung der T-Shirts ist leider wegen unserer Mitarbeitersituation erst bis zum\n12.05. möglich. Erklären Sie den Grund.\nVielen Dank\nSiegfried Mayer\nTeamleiter\nSehr geehrter Herr Mayer,\nleider müssen wir Ihnen mitteilen, dass Ihre Lieferung nicht zu unserer Zufriedenheit ausgefallen ist. Wir müssen\nzwei Punkte beanstanden. Erstens wurden die Verpackungen der Hosen (Größe M und L) beim Transport\nbeschädigt, sodass der Inhalt verschmutzt ist. In diesem Zustand können wir die Waren auf keinen Fall in den\nregulären Verkauf geben, sondern sie nur mit einem Rabatt anbieten. Wir halten daher einen Preisnachlass von 60%\nfür angemessen. Des Weiteren teilen wir Ihnen mit, dass von den T-Shirts mit Aufdruck statt der bezahlten 100\nStück nur die Hälfte geliefert wurde. Wegen der beginnenden Sommersaison bitten wir um schnellstmögliche\nNachlieferung der fehlenden Stückzahl auf Ihre Kosten spätestens bis zum 10.05. Wir hoffen, dass sich derartige\nVorkommnisse in Zukunft vermeiden lassen, und bitten um prompte Erledigung.\nMit freundlichen Grüßen\nMatthias Schramm\nNummer 21 Schreiben Sie eine E-Mail an den Kunden.\nSehr geehrter Herr Schramm,\nvielen Dank für Ihre E-Mail, in der Sie uns darüber informieren, dass Sie mit der gelieferten Ware nicht zufrieden\nsind. Wir entschuldigen uns für die verschmutzten Hosen, können Ihnen aber keinen Preisnachlass in Höhe von 60\nProzent geben. Bitte schicken Sie uns die Hosen zurück. Wir werden Ihnen die Hosen in Größe M und L erneut in\neinwandfreier Qualität schicken.\nAufgrund eines hohen Krankenstandes in unserer Firma ist die Nachlieferung der T-Shirts erst zum 12.05. möglich.\nIch hoffe, dass Sie damit einverstanden sind. Bitte lassen Sie uns wissen, ob Sie mit unserem Vorschlag\neinverstanden sind.\nMit freundlichen Grüßen","questions":[{"n":19,"text":"Herr Schramm","options":[{"key":"a","text":"bemängelt Qualität und Menge der Lieferung."},{"key":"b","text":"fand die gesamte Lieferung beschädigt vor."},{"key":"c","text":"verlangt wegen der Lieferungsverzögerung einen Rabatt."}],"answer":"a"},{"n":20,"text":"Die Nachlieferung","options":[{"key":"a","text":"bezahlt der Kunde."},{"key":"b","text":"kommt im Sommer."},{"key":"c","text":"umfasst 50 T-Shirts. Hallo, mich erreichte die untenstehende E-Mail. Bitte kümmern Sie sich darum und antworten Sie dem Kunden höflich. Entschuldigen Sie sich für die verschmutzte Ware. Der geforderte Rabatt von 60% ist unverschämt. Bieten Sie ihm eine andere Lösung an. Die Nachlieferung der T-Shirts ist leider wegen unserer Mitarbeitersituation erst bis zum 12.05. möglich. Erklären Sie den Grund. Vielen Dank Siegfried Mayer Teamleiter Sehr geehrter Herr Mayer, leider müssen wir Ihnen mitteilen, dass Ihre Lieferung nicht zu unserer Zufriedenheit ausgefallen ist. Wir müssen zwei Punkte beanstanden. Erstens wurden die Verpackungen der Hosen (Größe M und L) beim Transport beschädigt, sodass der Inhalt verschmutzt ist. In diesem Zustand können wir die Waren auf keinen Fall in den regulären Verkauf geben, sondern sie nur mit einem Rabatt anbieten. Wir halten daher einen Preisnachlass von 60% für angemessen. Des Weiteren teilen wir Ihnen mit, dass von den T-Shirts mit Aufdruck statt der bezahlten 100 Stück nur die Hälfte geliefert wurde. Wegen der beginnenden Sommersaison bitten wir um schnellstmögliche Nachlieferung der fehlenden Stückzahl auf Ihre Kosten spätestens bis zum 10.05. Wir hoffen, dass sich derartige Vorkommnisse in Zukunft vermeiden lassen, und bitten um prompte Erledigung. Mit freundlichen Grüßen Matthias Schramm Nummer 21 Schreiben Sie eine E-Mail an den Kunden. Sehr geehrter Herr Schramm, vielen Dank für Ihre E-Mail, in der Sie uns darüber informieren, dass Sie mit der gelieferten Ware nicht zufrieden sind. Wir entschuldigen uns für die verschmutzten Hosen, können Ihnen aber keinen Preisnachlass in Höhe von 60 Prozent geben. Bitte schicken Sie uns die Hosen zurück. Wir werden Ihnen die Hosen in Größe M und L erneut in einwandfreier Qualität schicken. Aufgrund eines hohen Krankenstandes in unserer Firma ist die Nachlieferung der T-Shirts erst zum 12.05. möglich. Ich hoffe, dass Sie damit einverstanden sind. Bitte lassen Sie uns wissen, ob Sie mit unserem Vorschlag einverstanden sind. Mit freundlichen Grüßen Sehr geehrter Herr Schramm, vielen Dank für Ihre E-Mail und für die Hinweise zu unserer letzten Lieferung. Wir bedauern die Unannehmlichkeiten und entschuldigen uns für die verschmutzten Waren sowie die unvollständige Lieferung. Zu den beschädigten Hosen bieten wir Ihnen einen Preisnachlass von 20 % an. Alternativ können Sie uns die Artikel zurücksenden, und wir liefern Ersatz. Der von Ihnen vorgeschlagene Nachlass von 60 % ist leider nicht möglich. Die fehlenden T-Shirts werden wir schnellstmöglich nachliefern, jedoch ist dies aufgrund unserer aktuellen Personalsituation erst bis zum 12.05. realisierbar. Die zusätzlichen Versandkosten übernehmen selbstverständlich wir. Wir entschuldigen uns nochmals und danken Ihnen für Ihr Verständnis. Sollten Sie weitere Fragen haben, stehen wir Ihnen gerne zur Verfügung. Mit freundlichen Grüßen"}],"answer":"c"}]},{"id":"BL-74","page":74,"title":"Originalaufgabe · Seite 74","body":"Hallo,\ndie folgende E-Mail ist gestern bei mir eingegangen. Was war denn da los?\nBitte antworten Sie der Kundin höflich und machen Sie Vorschläge für unsere weitere Zusammenarbeit. Wir\nschätzen Frau Talheim als langjährige Kundin und möchten sie deshalb nicht verlieren. Teilen Sie ihr bitte auch mit,\nwas wir ihr als Entschädigung für die entstandenen Unannehmlichkeiten anbieten.\nVielen Dank und viele Grüße\nMichael Herrmann\nTeamleiter\nSehr geehrter Herr Herrmann,\nleider müssen wir Ihnen mitteilen, dass Ihre Pflanzen- und Blumenauswahl für unsere letzte Veranstaltung gänzlich\nunpassend war. Wie Sie wissen, war das Thema unserer Ausstellung in der vergangenen Woche:\n„Nachhaltigkeit & Umweltverträglichkeit im Gartenbau – Lokal und Regional“. Und Sie haben im Eingangsbereich\naus dem fernen Ausland importierte exotische Pflanzen platziert, was verständlicherweise zu Beschwerden von\nSeiten der Besucher geführt hat. Zudem wollten wir den diesjährigen Umweltpreis zusammen mit Blumensträußen\nvergeben. Diese waren aber mit Orchideen bestückt. Wie passt das zum Thema „regional“? In dieser Situation\nhaben wir daher entschieden, kurzfristigen Ersatz für die Sträuße von einem Aussteller zu beschaffen. Wir bitten\nSie, diese zusätzlichen Kosten zu ersetzen. Solche Vorkommnisse müssen in Zukunft unter allen Umständen\nvermieden werden. Wir erwarten Ihre Vorschläge und stehen für ein Gespräch jederzeit zur Verfügung.\nMit freundlichen Grüßen\nGabi Talheim","questions":[{"n":19,"text":"Der Lieferant hat","options":[{"key":"a","text":"die Dekoration passend zum Thema ausgewählt."},{"key":"b","text":"die falsche Blumenauswahl getroffen."},{"key":"c","text":"Ersatzsträuße aus der Region bestellt."}],"answer":"b"},{"n":20,"text":"Der Veranstalter musste","options":[{"key":"a","text":"an einen Aussteller Blumen liefern."},{"key":"b","text":"auf die Beschwerden der Besucher reagieren."},{"key":"c","text":"den Umweltpreis ohne Blumen überreichen. Hallo, die folgende E-Mail ist gestern bei mir eingegangen. Was war denn da los? Bitte antworten Sie der Kundin höflich und machen Sie Vorschläge für unsere weitere Zusammenarbeit. Wir schätzen Frau Talheim als langjährige Kundin und möchten sie deshalb nicht verlieren. Teilen Sie ihr bitte auch mit, was wir ihr als Entschädigung für die entstandenen Unannehmlichkeiten anbieten. Vielen Dank und viele Grüße Michael Herrmann Teamleiter Sehr geehrter Herr Herrmann, leider müssen wir Ihnen mitteilen, dass Ihre Pflanzen- und Blumenauswahl für unsere letzte Veranstaltung gänzlich unpassend war. Wie Sie wissen, war das Thema unserer Ausstellung in der vergangenen Woche: „Nachhaltigkeit & Umweltverträglichkeit im Gartenbau – Lokal und Regional“. Und Sie haben im Eingangsbereich aus dem fernen Ausland importierte exotische Pflanzen platziert, was verständlicherweise zu Beschwerden von Seiten der Besucher geführt hat. Zudem wollten wir den diesjährigen Umweltpreis zusammen mit Blumensträußen vergeben. Diese waren aber mit Orchideen bestückt. Wie passt das zum Thema „regional“? In dieser Situation haben wir daher entschieden, kurzfristigen Ersatz für die Sträuße von einem Aussteller zu beschaffen. Wir bitten Sie, diese zusätzlichen Kosten zu ersetzen. Solche Vorkommnisse müssen in Zukunft unter allen Umständen vermieden werden. Wir erwarten Ihre Vorschläge und stehen für ein Gespräch jederzeit zur Verfügung. Mit freundlichen Grüßen Gabi Talheim Sehr geehrte Frau Talheim, wir bedanken uns für Ihre E-Mail sowie für den Hinweis auf unser Versehen beziehungsweise darauf, dass Sie statt der bestellten regionalen Blumen Orchideen erhalten haben. Im Namen des ganzen Teams entschuldigen wir uns für die entstandenen Unannehmlichkeiten. Der Grund der falschen Lieferung liegt darin, dass die Artikelnummern während des Bestellprozesses verwechselt wurden. Dadurch haben wir exotische Blumen zukommen lassen, die nicht für das Thema Ihrer Ausstellung geeignet waren. Bezüglich der Situation, dass Sie umgehend eine Ersatzlösung über einen anderen Lieferanten finden mussten, werden wir selbstverständlich die dadurch entstandenen Kosten übernehmen. Darüber hinaus gewähren wir Ihnen einen Preisnachlass von 15% auf die nächste Bestellung. Alternativ kann ein Gutschein für zusätzliche Leistungen angeboten werden. Bitte lassen Sie uns wissen, welche Lösung Sie bevorzugen. Wir würden uns freuen, Sie weiterhin zu unseren zufriedenen Kunden zählen zu dürfen. Mit freundlichen Grüßen"}],"answer":"b"}]}]},"learn":{"verbPrep":[{"id":"vp1","verb":"schmecken","prep":"nach","case":"Dativ","example":"Dieses Eis schmeckt nach Apfel."},{"id":"vp2","verb":"schimpfen","prep":"mit","case":"Dativ","example":"Bitte schimpf nicht mit mir! Ich kann nichts dafür!"},{"id":"vp3","verb":"schimpfen","prep":"über","case":"Akkusativ","example":"Sie schimpfte über den Lärm."},{"id":"vp4","verb":"schützen","prep":"vor","case":"Dativ","example":"Diese Jacke schützt vor Regen."},{"id":"vp5","verb":"sehen","prep":"nach","case":"Dativ","example":"Ich sehe mal schnell nach der noch fehlenden Kollegin."},{"id":"vp6","verb":"sorgen","prep":"für","case":"Akkusativ","example":"Ihr Auftritt sorgte für eine Überraschung."},{"id":"vp7","verb":"sprechen","prep":"mit","case":"Dativ","example":"Mit wem sprechen Sie?"},{"id":"vp8","verb":"sprechen","prep":"über","case":"Akkusativ","example ion":"Alle Maßnahmen zum Schutz der Beschäftigten vor Gefahren am Arbeitsplatz.","example":"Arbeitssicherheit hat in unserem Betrieb höchste Priorität."},{"id":"v75","de":"die Schutzkleidung","cat":"Sicherheit","definition":"Kleidung, die bei der Arbeit vor bestimmten Gefahren schützt.","example":"In der Werkstatt muss Schutzkleidung getragen werden."},{"id":"v76","de":"der Arbeitsunfall","cat":"Sicherheit","definition":"Ein Unfall, der während der Arbeit oder in engem Zusammenhang mit ihr passiert.","example":"Der Arbeitsunfall muss sofort gemeldet werden."},{"id":"v77","de":"die Berufsgenossenschaft","cat":"Sicherheit","definition":"Der Träger der gesetzlichen Unfallversicherung für Beschäftigte in Deutschland.","example":"Die Berufsgenossenschaft übernimmt bestimmte Behandlungskosten."},{"id":"v78","de":"der Datenschutz","cat":"Sicherheit","definition":"Regeln und Maßnahmen zum Schutz personenbezogener Informationen.","example":"Alle Mitarbeitenden werden zum Datenschutz geschult."},{"id":"v79","de":"die personenbezogenen Daten","cat":"Sicherheit","definition":"Informationen, die sich auf eine bestimmte oder bestimmbare Person beziehen.","example":"Personenbezogene Daten dürfen nicht unbefugt weitergegeben werden."},{"id":"v80","de":"die Besprechung","cat":"Besprechungen","definition":"Ein geplantes Gespräch mehrerer Personen zu beruflichen Themen.","example":"Die nächste Besprechung findet am Montag statt."},{"id":"v81","de":"das Protokoll","cat":"Besprechungen","definition":"Die schriftliche Dokumentation der wichtigsten Inhalte und Entscheidungen einer Sitzung.","example":"Das Protokoll wurde einstimmig genehmigt."},{"id":"v82","de":"die Tagesordnung","cat":"Besprechungen","definition":"Die geordnete Liste der Themen einer Sitzung.","example":"Die Tagesordnung enthält sechs Punkte."},{"id":"v83","de":"der Tagesordnungspunkt","cat":"Besprechungen","definition":"Ein einzelnes Thema auf der Tagesordnung.","example":"Dieser Tagesordnungspunkt wird auf die nächste Sitzung verschoben."},{"id":"v84","de":"die Abstimmung","cat":"Besprechungen","definition":"Eine Entscheidung, bei der mehrere Personen ihre Stimme abgeben.","example":"Der Vorschlag wurde in einer Abstimmung angenommen."},{"id":"v85","de":"der Vorschlag","cat":"Besprechungen","definition":"Eine Idee oder Möglichkeit, die zur Diskussion gestellt wird.","example":"Ich habe einen Vorschlag zur Verbesserung."},{"id":"v86","de":"die Maßnahme","cat":"Besprechungen","definition":"Eine konkrete Handlung, mit der ein Ziel erreicht werden soll.","example":"Die Maßnahmen werden ab sofort umgesetzt."},{"id":"v87","de":"die Umsetzung","cat":"Besprechungen","definition":"Die praktische Realisierung eines Plans oder einer Entscheidung.","example":"Die Umsetzung des Projekts dauert drei Monate."},{"id":"v88","de":"der Krankenstand","cat":"Personal","definition":"Der Anteil oder die Anzahl krankheitsbedingt fehlender Beschäftigter.","example":"Wegen des hohen Krankenstands fehlen viele Beschäftigte."},{"id":"v89","de":"der Personalmangel","cat":"Personal","definition":"Eine Situation, in der nicht genügend Personal zur Verfügung steht.","example":"Der Personalmangel führt zu Überstunden."},{"id":"v90","de":"die Unterbesetzung","cat":"Personal","definition":"Eine Situation, in der eine Abteilung weniger Personal hat als benötigt.","example":"Die Unterbesetzung in der Abteilung soll beendet werden."},{"id":"v91","de":"die Einstellung","cat":"Personal","definition":"Die Aufnahme einer neuen Person in ein Arbeitsverhältnis.","example":"Die Einstellung neuer Mitarbeitender ist geplant."},{"id":"v92","de":"die Entlassung","cat":"Personal","definition":"Die Beendigung eines Arbeitsverhältnisses durch den Arbeitgeber.","example":"Eine Entlassung ist für viele Menschen ein Schock."},{"id":"v93","de":"die Versetzung","cat":"Personal","definition":"Der Wechsel einer beschäftigten Person an einen anderen Arbeitsplatz oder in eine andere Abteilung.","example":"Die Versetzung in eine andere Abteilung wurde genehmigt."},{"id":"v94","de":"der Ruhestand","cat":"Personal","definition":"Die Lebensphase nach dem Ende der regulären Berufstätigkeit.","example":"Herr Wortmann geht nächstes Jahr in den Ruhestand."},{"id":"v95","de":"die Elternzeit","cat":"Personal","definition":"Eine gesetzlich geschützte berufliche Auszeit zur Betreuung eines Kindes.","example":"Nach der Geburt nimmt sie Elternzeit."},{"id":"v96","de":"der Mutterschutz","cat":"Personal","definition":"Besondere gesetzliche Schutzregeln rund um Schwangerschaft und Geburt.","example":"Vor der Geburt beginnt der Mutterschutz."},{"id":"v97","de":"die Dienstreise","cat":"Personal","definition":"Eine beruflich veranlasste Reise außerhalb des üblichen Arbeitsortes.","example":"Die Fahrt nach München ist eine Dienstreise."},{"id":"v98","de":"der Arbeitsweg","cat":"Personal","definition":"Der Weg zwischen Wohnung und Arbeitsplatz.","example":"Der Arbeitsweg dauert ungefähr 40 Minuten."}],"collocations":[{"id":"nv1","de":"eine Entscheidung treffen","example":"Wir müssen heute eine Entscheidung treffen."},{"id":"nv2","de":"einen Antrag stellen","example":"Sie möchte einen Antrag auf Teilzeit stellen."},{"id":"nv3","de":"eine Beschwerde einreichen","example":"Der Kunde hat eine Beschwerde eingereicht."},{"id":"nv4","de":"eine Frist einhalten","example":"Bitte halten Sie die vereinbarte Frist ein."},{"id":"nv5","de":"Verantwortung übernehmen","example":"Wir übernehmen die Verantwortung für den Schaden."},{"id":"nv6","de":"Maßnahmen ergreifen","example":"Die Firma muss dringend Maßnahmen ergreifen."},{"id":"nv7","de":"Rücksicht nehmen auf","example":"Bitte nehmen Sie Rücksicht auf Ihre Kolleginnen und Kollegen."},{"id":"nv8","de":"etwas in Anspruch nehmen","example":"Sie können unsere Beratung kostenlos in Anspruch nehmen."},{"id":"nv9","de":"zur Verfügung stehen","example":"Für Fragen stehe ich Ihnen gerne zur Verfügung."},{"id":"nv10","de":"zur Verfügung stellen","example":"Die Firma stellt einen Laptop zur Verfügung."},{"id":"nv11","de":"Kontakt aufnehmen mit","example":"Bitte nehmen Sie Kontakt mit dem Lieferanten auf."},{"id":"nv12","de":"eine Vereinbarung treffen","example":"Wir haben eine neue Vereinbarung getroffen."},{"id":"nv13","de":"einen Vorschlag machen","example":"Darf ich einen Vorschlag machen?"},{"id":"nv14","de":"einen Beitrag leisten","example":"Alle können einen Beitrag zum Umweltschutz leisten."},{"id":"nv15","de":"in Betracht ziehen","example":"Wir ziehen einen Lieferantenwechsel in Betracht."},{"id":"nv16","de":"zur Kenntnis nehmen","example":"Bitte nehmen Sie die neuen Regeln zur Kenntnis."},{"id":"nv17","de":"eine Rolle spielen","example":"Berufserfahrung spielt bei der Auswahl eine wichtige Rolle."},{"id":"nv18","de":"eine Lösung finden","example":"Wir müssen gemeinsam eine Lösung finden."},{"id":"nv19","de":"eine Bestellung aufgeben","example":"Wir haben gestern eine Bestellung aufgegeben."},{"id":"nv20","de":"einen Auftrag erteilen","example":"Die Geschäftsleitung hat einer Agentur den Auftrag erteilt."},{"id":"nv21","de":"eine Rechnung begleichen","example":"Bitte begleichen Sie die Rechnung innerhalb von 14 Tagen."},{"id":"nv22","de":"eine Zahlung leisten","example":"Der Kunde hat noch keine Zahlung geleistet."},{"id":"nv23","de":"eine Zusage machen","example":"Wir können Ihnen heute noch keine Zusage machen."},{"id":"nv24","de":"einen Termin vereinbaren","example":"Ich möchte einen Termin mit Ihnen vereinbaren."},{"id":"nv25","de":"Kritik üben an","example":"Die Mitarbeitenden übten Kritik an der neuen Regelung."},{"id":"nv26","de":"Einfluss nehmen auf","example":"Die Kosten können Einfluss auf die Entscheidung nehmen."},{"id":"nv27","de":"Fortschritte machen","example":"Beim Deutschlernen macht sie große Fortschritte."},{"id":"nv28","de":"eine Voraussetzung erfüllen","example":"Sie erfüllt alle Voraussetzungen für die Stelle."},{"id":"nv29","de":"einen Anspruch geltend machen","example":"Er möchte seinen Anspruch auf Urlaub geltend machen."},{"id":"nv30","de":"einen Fehler beheben","example":"Der Techniker konnte den Fehler schnell beheben."}],"grammar":[{"id":"g1","topic":"Modalverben","prompt":"Hier ___ man nicht rauchen. Es ist verboten.","options":["muss","darf","kann","will"],"answer":"darf","explain":"„nicht dürfen“ drückt ein Verbot aus."},{"id":"g2","topic":"Modalverben","prompt":"Der Arzt sagt, ich ___ nächste Woche noch einmal kommen.","options":["soll","will","mag","darf"],"answer":"soll","explain":"„sollen“ gibt hier eine Empfehlung oder Anweisung einer anderen Person wieder."},{"id":"g3","topic":"Modalverben","prompt":"Ohne Führerschein ___ man dieses Fahrzeug nicht fahren.","options":["kann","soll","will","mag"],"answer":"kann","explain":"„können“ beschreibt hier eine Möglichkeit bzw. Fähigkeit."},{"id":"g4","topic":"Modalverben","prompt":"Ich ___ morgen früher gehen. Mein Chef hat es erlaubt.","options":["darf","muss","soll","mag"],"answer":"darf","explain":"„dürfen“ bedeutet hier Erlaubnis."},{"id":"g5","topic":"Modalverben","prompt":"Du ___ morgen nicht kommen. Der Termin ist abgesagt.","options":["musst","darfst","sollst","willst"],"answer":"musst","explain":"„nicht müssen“ bedeutet: Es ist nicht notwendig."},{"id":"g6","topic":"Modalverben","prompt":"Du ___ mehr Pausen machen. Das wäre besser für dich.","options":["solltest","willst","darfst","magst"],"answer":"solltest","explain":"„solltest“ wird häufig für einen Rat verwendet."},{"id":"g7","topic":"Zeitangaben","prompt":"___ dem 1. Oktober gilt die neue Regelung.","options":["Ab","Seit","Bis","Während"],"answer":"Ab","explain":"„ab“ bezeichnet einen Beginn ab einem bestimmten Zeitpunkt."},{"id":"g8","topic":"Zeitangaben","prompt":"Wir sind ___ 9 ___ 17 Uhr erreichbar.","options":["von … bis","seit … bis","ab … über","bei … nach"],"answer":"von … bis","explain":"„von … bis“ begrenzt einen Zeitraum."},{"id":"g9","topic":"Zeitangaben","prompt":"Bitte antworten Sie ___ drei Tagen.","options":["innerhalb von","außerhalb","seit","bei"],"answer":"innerhalb von","explain":"„innerhalb von“ bezeichnet eine Frist."},{"id":"g10","topic":"Zeitangaben","prompt":"___ der Geschäftszeiten erreichen Sie unseren Notdienst.","options":["Außerhalb","Innerhalb","Seit","Ab"],"answer":"Außerhalb","explain":"„außerhalb“ bedeutet: nicht innerhalb des genannten Zeitraums."},{"id":"g11","topic":"Zeitangaben","prompt":"___ Montag warte ich auf die Ersatzteile.","options":["Seit","Ab","Über","Bis zum"],"answer":"Seit","explain":"„seit“ verbindet einen Beginn in der Vergangenheit mit der Gegenwart."},{"id":"g12","topic":"Zeitangaben","prompt":"Die Filiale bleibt ___ 5. Januar geschlossen.","options":["bis zum","seit","bei","über"],"answer":"bis zum","explain":"„bis zum“ markiert den Endpunkt eines Zeitraums."},{"id":"g13","topic":"Da-/Wo-Wörter","prompt":"Ich warte auf die Antwort. — ___ wartest du?","options":["Worauf","Wovon","Womit","Woran"],"answer":"Worauf","explain":"Bei Sachen wird „auf + was“ zu „worauf“."},{"id":"g14","topic":"Da-/Wo-Wörter","prompt":"Ich interessiere mich für das Projekt. — Ich interessiere mich ___.","options":["dafür","davon","daran","damit"],"answer":"dafür","explain":"„für + etwas“ wird im Verweis zu „dafür“."},{"id":"g15","topic":"Da-/Wo-Wörter","prompt":"Wir sprechen über die neue Regelung. — ___ sprecht ihr?","options":["Worüber","Wovon","Womit","Wofür"],"answer":"Worüber","explain":"„über + was“ wird zu „worüber“."},{"id":"g16","topic":"Da-/Wo-Wörter","prompt":"Sie träumt von einer Beförderung. — Sie träumt ___.","options":["davon","dafür","dazu","darüber"],"answer":"davon","explain":"„von + etwas“ wird zu „davon“."},{"id":"g17","topic":"Da-/Wo-Wörter","prompt":"Ich nehme an dem Seminar teil. — ___ nimmst du teil?","options":["Woran","Worauf","Womit","Wovon"],"answer":"Woran","explain":"„an + was“ wird zu „woran“."},{"id":"g18","topic":"Da-/Wo-Wörter","prompt":"Ich spreche mit meiner Chefin. — ___ sprichst du?","options":["Mit wem","Womit","Worüber","Woran"],"answer":"Mit wem","explain":"Bei Personen verwendet man Präposition + „wem/wen“, nicht da-/wo-Wörter."},{"id":"g19","topic":"TeKaMoLo","prompt":"Welche Reihenfolge ist im neutralen Satz am typischsten?","options":["temporal – kausal – modal – lokal","lokal – modal – temporal – kausal","kausal – lokal – modal – temporal"],"answer":"temporal – kausal – modal – lokal","explain":"Die Merkhilfe lautet Te-Ka-Mo-Lo."},{"id":"g20","topic":"TeKaMoLo","prompt":"Welcher Satz folgt der neutralen TeKaMoLo-Reihenfolge?","options":["Ich fahre morgen wegen eines Termins mit dem Zug nach Berlin.","Ich fahre mit dem Zug morgen nach Berlin wegen eines Termins.","Ich fahre wegen eines Termins nach Berlin morgen mit dem Zug."],"answer":"Ich fahre morgen wegen eines Termins mit dem Zug nach Berlin.","explain":"Temporal vor kausal vor modal vor lokal."},{"id":"g21","topic":"Konnektoren","prompt":"___ die Lieferung verspätet war, blieb der Kunde freundlich.","options":["Obwohl","Deshalb","Damit","Sodass"],"answer":"Obwohl","explain":"„obwohl“ leitet einen Nebensatz mit Gegensatz ein."},{"id":"g22","topic":"Konnektoren","prompt":"Die Lieferung war verspätet. ___ entschuldigten wir uns beim Kunden.","options":["Deshalb","Obwohl","Während","Falls"],"answer":"Deshalb","explain":"„deshalb“ drückt eine Folge aus; danach steht das finite Verb auf Position 2."},{"id":"g23","topic":"Konnektoren","prompt":"Wir bestellen früher, ___ die Ware rechtzeitig ankommt.","options":["damit","obwohl","dennoch","während"],"answer":"damit","explain":"„damit“ drückt einen Zweck aus."},{"id":"g24","topic":"Konnektoren","prompt":"Einerseits ist Homeoffice flexibel, ___ fehlt manchmal der direkte Austausch.","options":["andererseits","deshalb","damit","sodass"],"answer":"andererseits","explain":"Die typische Paarform lautet „einerseits … andererseits …“."},{"id":"g25","topic":"Konnektoren","prompt":"___ früher wir planen, ___ weniger Stress haben wir.","options":["Je … desto","Sowohl … als","Weder … noch","Nicht nur … sondern"],"answer":"Je … desto","explain":"„je … desto“ beschreibt eine proportionale Beziehung."},{"id":"g26","topic":"Konnektoren","prompt":"___ Sie Fragen haben, wenden Sie sich an die Personalabteilung.","options":["Falls","Obwohl","Während","Dennoch"],"answer":"Falls","explain":"„falls“ bedeutet „für den Fall, dass“."},{"id":"g27","topic":"Beschwerdemanagement","prompt":"Welche Formulierung ist in einer professionellen Beschwerdeantwort angemessen?","options":["Wir bedauern die entstandenen Unannehmlichkeiten.","Das ist nicht unser Problem.","Sie haben bestimmt etwas falsch gemacht.","Warten Sie einfach."],"answer":"Wir bedauern die entstandenen Unannehmlichkeiten.","explain":"Eine professionelle Antwort erkennt die Unannehmlichkeit sachlich an."},{"id":"g28","topic":"Beschwerdemanagement","prompt":"Welche Formulierung bittet professionell um Terminbestätigung?","options":["Bitte teilen Sie uns mit, ob der Termin für Sie passt.","Sie müssen den Termin nehmen.","Der Termin ist egal.","Melden Sie sich irgendwann."],"answer":"Bitte teilen Sie uns mit, ob der Termin für Sie passt.","explain":"Die Formulierung ist höflich, klar und handlungsorientiert."},{"id":"g29","topic":"Beschwerdemanagement","prompt":"Welches Verb passt zu „eine Beschwerde“?","options":["einreichen","fahren","schmecken","stellen auf"],"answer":"einreichen","explain":"Die feste Verbindung lautet „eine Beschwerde einreichen“."},{"id":"g30","topic":"Beschwerdemanagement","prompt":"Wir möchten uns ___ die Verzögerung entschuldigen.","options":["für","von","mit","an"],"answer":"für","explain":"Man entschuldigt sich „für“ etwas."},{"id":"g31","topic":"Verben mit Präpositionen","prompt":"Wir warten ___ die Rückmeldung des Kunden.","options":["auf","an","von","bei"],"answer":"auf","explain":"„warten auf“ steht mit Akkusativ."},{"id":"g32","topic":"Verben mit Präpositionen","prompt":"Sie nimmt ___ der Fortbildung teil.","options":["an","auf","für","über"],"answer":"an","explain":"„teilnehmen an“ steht mit Dativ."},{"id":"g33","topic":"Verben mit Präpositionen","prompt":"Wir müssen uns ___ das Gespräch vorbereiten.","options":["auf","von","mit","bei"],"answer":"auf","explain":"„sich vorbereiten auf“ steht mit Akkusativ."},{"id":"g34","topic":"Verben mit Präpositionen","prompt":"Die Firma verfügt ___ ausreichend Lagerfläche.","options":["über","von","zu","bei"],"answer":"über","explain":"„verfügen über“ steht mit Akkusativ."},{"id":"g35","topic":"Verben mit Präpositionen","prompt":"Bitte wenden Sie sich ___ den Betriebsrat.","options":["an","auf","von","bei"],"answer":"an","explain":"„sich wenden an“ steht mit Akkusativ."},{"id":"g36","topic":"zu + Infinitiv","prompt":"Wir planen, nächstes Jahr eine neue Filiale ___.","options":["zu eröffnen","eröffnen zu","eröffnet","zu eröffnet"],"answer":"zu eröffnen","explain":"Nach „planen“ kann ein Infinitivsatz mit „zu“ folgen."},{"id":"g37","topic":"zu + Infinitiv","prompt":"Es ist wichtig, die Frist ___.","options":["einzuhalten","zu einhalten","eingehalten","einhalten zu"],"answer":"einzuhalten","explain":"Bei trennbaren Verben steht „zu“ zwischen Vorsilbe und Verbstamm."},{"id":"g38","topic":"zu + Infinitiv","prompt":"Sie hat die Absicht, sich intern ___.","options":["zu bewerben","bewerben zu","beworben","zu beworben"],"answer":"zu bewerben","explain":"„die Absicht haben“ kann einen zu-Infinitiv einleiten."},{"id":"g39","topic":"Satzbau","prompt":"Welche Formulierung klingt im beruflichen Kontext präziser?","options":["Wir möchten eine Lösung finden.","Wir machen irgendwie etwas.","Das Ding ist nicht gut.","Mal sehen, was passiert."],"answer":"Wir möchten eine Lösung finden.","explain":"Im B2-Beruf-Kontext helfen klare, sachliche und zielorientierte Formulierungen."},{"id":"g40","topic":"Satzbau","prompt":"Welche Verbindung passt? „Wir ___ Kontakt mit dem Lieferanten ___.“","options":["nehmen … auf","machen … an","stellen … für","geben … bei"],"answer":"nehmen … auf","explain":"Die feste Verbindung lautet „Kontakt aufnehmen mit“."}]},"hoeren":{"teil1":[{"id":"H1V1","title":"Prüfungsvariante 1","pages":[108,109],"tracks":[{"id":"H1V1T1","transcript":"Chef: Hallo Zarif, ich würde gerne über unseren Dienstplan für den Rest der Woche sprechen. In der Spätschicht ist\nein Fahrer ausgefallen und wir suchen einen Ersatz.\nZarif: Für alle Tage?\nChef: Ja, von morgen, Mittwoch bis Samstag.\nZarif: Nun, ich habe noch nie Spätschicht gemacht. Aber mal sehen. Morgen, am Mittwoch habe ich ja frei, da\nkönnte ich auf jeden Fall einspringen. Eventuell könnte ich auch einmal an einem Tag früh und spät arbeiten. Ich\narbeite ja immer im Frühdienst.\nChef: Nein, das geht nicht. Das gibt es bei uns nicht. Nach sieben Stunden braucht jeder Fahrer eine Pause.\nZarif: Aber ich habe gestern mit Jasna gesprochen. Sie arbeitet ja nur in Teilzeit und hätte Interesse, weitere Dienste\nzu übernehmen.\nChef: Gut, danke für den Tipp. Dann werde ich sie mal kontaktieren. Aber für morgen haben wir es schon geklärt.\nDas ist ein Anfang.\nZarif: Muss ich dann in der Spätschicht noch etwas beachten?\nChef: Also, sie geht von 15-21 Uhr. Und es gibt noch eine Besonderheit. Wir bieten ja neuerdings den Service an,\ndass unsere Kunden und Kundinnen gegen eine geringe Gebühr ein konkretes Zeitfenster zwischen 19 und 21 Uhr\nbuchen können, in dem zugestellt wird. Wir kennzeichnen diese Sendungen dann mit dem Begriff: „Wunschzeit\ngebucht“.\nZarif: Dann müssen die Kunden also nicht stundenlang warten.\nChef: Genau. Dieser Service kostet die Kunden 8 Euro, wenn du also Sendungen im Wagen hast, die mit den\nWörtern „Wunschzeit gebucht“ gekennzeichnet sind, diese unbedingt zuerst ausliefern.\nZarif: Gut, habe ich verstanden. Ich übernehme also die Schicht Mittwochabend. Kann ich dann dafür einen\nFrühdienst in der nächsten Woche frei bekommen?","questions":[{"n":22,"type":"tf","text":"Der Vorgesetzte muss den Dienstplan ändern.","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"answer":"r"},{"n":23,"type":"mcq","text":"Zarif","options":[{"key":"a","text":"übernimmt eine Doppelschicht."},{"key":"b","text":"soll dafür sorgen, dass die Kunden für die Zustellung zahlen."},{"key":"c","text":"muss Regeln bei der Reihenfolge der Zustellungen beachten."}],"answer":"c"}]},{"id":"H1V1T2","transcript":"Frau Lohmann: Türenprofi GmbH, Lohmann. Was kann ich für Sie tun?\nAnita Li: Guten Tag, hier Anita Li von der Firma Cargo KG. Wir wollen unsere Geschäftsstelle neu gestalten und\nhaben uns überlegt, die Büroräume durch Glastüren voneinander zu trennen. Momentan haben wir Türen aus Holz\nund das gefällt uns nicht mehr. Wir haben also beschlossen, diese Türen zu entfernen, und sind auf der Suche nach\netwas Neuem.\nFrau Lohmann: Das kann ich gut verstehen. Räume werden durch Glastüren einfach heller und freundlicher. Wir\nbieten Türen aus verschiedenem Glas an, aus klarem Glas oder mit Motiven. Haben Sie sich unsere Webseite schon\neinmal angeschaut?\nAnita Li: Ja, natürlich. Es ist nur nicht einfach, eine Auswahl zu treffen. Auf Klarglas, also vollständig\ndurchsichtiges Glas, möchten wir verzichten. Unsere Mitarbeitenden sollten schon so arbeiten können, dass nicht\nKollegen und Kolleginnen aus dem Nebenraum sie rund um die Uhr beobachten können. Und Kunden bei uns am\nEmpfang sollen auch nicht alles sehen können, was in den Räumen, die vom Eingangsbereich abgehen, passiert.\nWelches Glas ist denn nicht vollständig durchsichtig, hat aber auf der anderen Seite trotzdem einen großen\nLichteffekt?\nFrau Lohmann: Das ist etwas schwer am Telefon zu klären. Am besten vereinbaren wir einen Beratungstermin bei\nuns, dann können wir Ihnen in unserer Ausstellung verschiedene Modelle zeigen.\nAnita Li: Ja gerne. Das wollte ich auch schon vorschlagen. Wäre es nicht besser, wenn Sie bei uns vorbeikommen?\nVielleicht haben Sie ja sofort einen passenden Vorschlag, wenn Sie unsere Räume vor Ort sehen.\nFrau Lohmann: Einverstanden, so können wir es auch machen. Dann können wir auch gleich die Maße aufnehmen\nusw. Um Ihnen dann unsere Modelle zu präsentieren, können Sie dann ja bei uns vorbeikommen.\nAnita Li: Das ist eine gute Idee. Sie können ja schlecht Ihre Modelle zu uns bringen.\nFrau Lohmann: Gut, Frau Li, wann würde es Ihnen passen?\n108","questions":[{"n":24,"type":"tf","text":"Frau Li von Cargo KG möchte Holztüren umtauschen.","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"answer":"f"},{"n":25,"type":"mcq","text":"Frau Li möchte","options":[{"key":"a","text":"Türen, die viel Licht durchlassen, bei denen die Privatsphäre der Mitarbeitenden trotzdem nicht verletzt wird."},{"key":"b","text":"helle Türen für den Eingangsbereich."},{"key":"c","text":"verschiedene Modelle als Muster bekommen."}],"answer":"a"}]},{"id":"H1V1T3","transcript":"Herr Juck: Hallo Frau Groß. Hier Juck, Filialleitung. Das Restaurant „Vier Jahreszeiten“ hat sich bei uns über eine\nfehlerhafte Lieferung beschwert.\nFrau Groß: Was ist passiert?\nHerr Juck: Es gab zwei falsche Lieferungen. Erstens haben sie einen Gasherd bestellt, wir haben den Elektroherd\nSurPlus geliefert. Und anstelle eines bestellten Geschirrspülers in der normalen Breite von 60 cm haben wir das\nGerät MiniAktiv, 45cm breit geschickt.\nFrau Groß: Das sind doch die Geräte aus unserer neuen Kollektion, die besonders gern gekauft werden.\nHerr Juck: Ja, stimmt schon, aber die hat der Kunde nicht bestellt. Der Fehler ist inzwischen behoben, wir haben\nuns entschuldigt und die richtigen Geräte geschickt. Aber so etwas darf einfach nicht passieren. Könnten Sie bitte\nüberprüfen, wie es zu diesem Fehler kommen konnte?\nFrau Groß: Moment, ich schaue mir einmal die Buchungsunterlagen an. Restaurant „Vier Jahreszeiten“, Bestellung\nvom 1. März. Stimmt das?\nHerr Juck: Ja, genau.\nFrau Groß: Gut. Nein, hier steht Restaurant „Vier Jahreszeiten“: ein Gasherd Marke Junghand, Bestellnummer 34-\n822, und ein Geschirrspüler Marke Bohm, Bestellnummer 34-555, 60 cm. Hier wurde kein Fehler gemacht. Die\nBestellung ist so rausgegangen. Dann muss ich mal schauen, was im Lager passiert ist.\nHerr Juck: Ist das denn denkbar?\nFrau Groß: Vielleicht gab es Probleme mit der Lagersoftware. Vielleicht hat aber auch der Spediteur hier etwas\nverwechselt.\nHerr Juck: Kümmern Sie sich bitte darum. Das Restaurant „Vier Jahreszeiten“ ist einer unserer besten Kunden.","questions":[{"n":26,"type":"tf","text":"Der Filialleiter informiert über neue Geräte.","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"answer":"f"},{"n":27,"type":"mcq","text":"Frau Groß soll überprüfen,","options":[{"key":"a","text":"ob die Bestellung richtig aufgenommen wurde."},{"key":"b","text":"ob es Fehler im Lager gab."},{"key":"c","text":"ob die Lieferung bereits korrigiert wurde."}],"answer":"b"}]}]},{"id":"H1V2","title":"Prüfungsvariante 2","pages":[110,111],"tracks":[{"id":"H1V2T1","transcript":"Kundin : Guten Tag. Berger von der Firma Michels. Ich bin auf der Suche nach neuen Druckern für unser Büro. Ich\nhabe mir Ihre Angebote im Internet angesehen und bräuchte jetzt bitte Ihren Rat.\nVerkäufer : Gerne. An was für Geräte haben Sie denn gedacht?\nKundin : Ich kenne mich mit Druckern nicht so gut aus. Können Sie mir nicht etwas empfehlen?\nVerkäufer : Doch, natürlich. Welche Funktionen soll das Gerät denn haben? Brauchen Sie auch einen Scanner oder\nKopierer? Wir haben sehr interessante Kombi-Geräte.\nKundin : Ein Scanner wäre gut, aber Kopierer brauchen wir nicht. Wir haben zwei große im Büro. Sind denn die\nKombi-Geräte viel teurer als ein Drucker?\nVerkäufer : Natürlich ist da ein Preisunterschied, aber mit einem Kombi-Gerät fahren Sie auf jeden Fall günstiger\nals mit Einzelgeräten. Wie viel drucken Sie denn im Schnitt pro Tag?\nKundin : Hm, wir sind 15 Mitarbeiter und da kommen schon circa 400 Druckseiten zusammen, denke ich.\nVerkäufer : Das ist ja nicht so viel. Drucken Sie auch in Farbe?\nKundin : Ja, teilweise schon. Und Bilder drucken wir auch ab und zu.\nVerkäufer : Dann würde ich Ihnen einen Farblaserdrucker empfehlen. Das Modell LD315 z.B. ist eine\nKombination aus Drucker und Scanner und passt auf jeden Schreibtisch. Das Papierfach fasst allerdings leider nur\nmaximal 150 Blatt. Reicht das?\nKundin : Hm. Ja, ich denke schon. Wie viel kostet das Gerät denn?\nVerkäufer : Das liegt bei 280 €.\nKundin : Das ist aber teuer. Bekommen wir einen Mengenrabatt, wenn wir vier Geräte kaufen?\nVerkäufer : Der LD315 ist der Testsieger und auf jeden Fall sein Geld wert. Bei Abnahme von fünf Druckern\nkönnte ich Ihnen einen Preis von 230 Euro pro Gerät anbieten.\nKundin : Ich bespreche das mit meinem Chef und melde mich nochmal bei Ihnen. Vielen Dank für Ihre Hilfe.","questions":[{"n":22,"type":"tf","text":"Die Kundin braucht eine Beratung für neue Bürogeräte.","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"answer":"r"},{"n":23,"type":"mcq","text":"Die Kundin möchte","options":[{"key":"a","text":"mindestens fünf Drucker kaufen."},{"key":"b","text":"mit ihrem Vorgesetzten reden."},{"key":"c","text":"viel kopieren."}],"answer":"b"}]},{"id":"H1V2T2","transcript":"TN 1-Guten Morgen.\nTN 2-Guten Morgen.\nTN 3-Guten Morgen.\nTN 1-Wir sollten langsam mit der Planung für unser jährliches Betriebsfest beginnen.\nTN 3-Was meinen Sie ?\nTN 2-Gibt es denn schon eine Agenda?\nTN 1-Darüber wollte ich mit Ihnen sprechen. Unter anderem.\nTN 3-Haben wir überhaupt schon einen Termin?\nTN 1-Nun, so gut wie. Wir haben der Geschäftsführung zwei Vorschläge in der 30. und 31. Kalenderwoche\ngemacht und bekommen diese Woche noch eine Rückmeldung dazu. Wir würden dann gerne möglichst schnell die\nPlanung abschließen. Wer von Ihnen wäre bereit, sich um das Essen und die Getränke zu kümmern?\nTN 2-Das übernehme ich gerne. Ich bin aber erst seit Kurzem im Unternehmen und kenne mich noch nicht so gut\n110\naus. Gibt es eine Firma, mit der wir immer zusammenarbeiten? Oder soll ich bei verschiedenen Cateringfirmen um\nMenüvorschläge bitten?\nTN 1-Super, dass Sie sich darum kümmern möchten. Ich gebe Ihnen nachher die Nummern von zwei Anbietern, mit\ndenen wir gute Erfahrungen gemacht haben und wenn Sie dann noch Fragen haben, kann ich Sie gerne unterstützen.\nTN 2-Danke, das wäre nett. Wie viele Kollegen kommen denn immer so?\nTN 1-Letztes Jahr waren wir ungefähr 180. Wir sollten spätestens Ende des Monats die Einladungen an alle\nMitarbeiterinnen und Mitarbeiter verschicken. Sie können dann in eine Liste eintragen, ob sie kommen. Wenn wir\ngenauere Zahlen haben, können wir die finale Planung machen.\nTN 3-Beim letzten Fest hatten wir ja eine Band. Das kam doch bei allen ganz gut an. Soll ich sie noch mal\nanfragen?\nTN 1-Ja, gerne, das ist eine gute Idee.\nTN 2-Und ich mache mir noch ein paar Gedanken wegen der Deko.\nTN 1-Ich sehe schon, Sie sind ein gutes Team.","questions":[{"n":24,"type":"tf","text":"Die Organisation des Betriebsfestes ist abgeschlossen.","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"answer":"f"},{"n":25,"type":"mcq","text":"Für die Betriebsfeier","options":[{"key":"a","text":"wird eine neue Cateringfirma gesucht."},{"key":"b","text":"muss eine neue Band gefunden werden."},{"key":"c","text":"werden die Aufgaben verteilt."}],"answer":"c"}]},{"id":"H1V2T3","transcript":"Frau : Herr Klein, herzlich willkommen im Team. Schön, dass Sie da sind.\nHerr : Ich freue mich auch hier zu sein und bin schon sehr gespannt auf meine Arbeit.\nFrau : Am besten bringe ich Sie direkt ins Lager. Dort wartet Ihr Vorgesetzter, Herr Lehmann, schon auf Sie. Den\nkennen Sie ja schon aus dem Vorstellungsgespräch.\nHerr : Ja, gern.\nFrau : Ach so, das hatte ich fast vergessen. Vorher müssen wir noch ein paar Formalitäten erledigen. Den\nArbeitsvertrag haben Sie uns ja schon zurückgeschickt. Uns fehlen aber noch Ihr Sozialversicherungsausweis und\ndie Steueridentifikationsnummer. Haben Sie die Sachen dabei? Dann mache ich schnell Kopien davon.\nHerr : Den Sozialversicherungsausweis habe ich leider nicht hier, aber die Versicherungsnummer kann ich Ihnen\ngeben. Und die Steuer-ID steht hier drauf .\nFrau : Die Sozialversicherungsnummer reicht erstmal. Bringen Sie mit dem Ausweis dann einfach die nächsten\nTage ins Büro.\nHerr : Ja, das mache ich. Und wie ist das mit der Arbeitskleidung? Bekomme ich die heute schon?\nFrau : Ja, es ist Pflicht bei der Arbeit die Sicherheitskleidung zu tragen, um Unfälle zu vermeiden. Ich zeige Ihnen\ngleich auf dem Weg zum Lager, wo Sie sie abholen und sich umziehen können. In der Umkleide haben Sie übrigens\nauch ein Spind, in dem Sie Ihre persönlichen Sachen abschließen können. Den Schlüssel dafür kann ich Ihnen jetzt\nschon geben. Hier bitte. Sie haben die Nr. 27.\nHerr : Vielen Dank.\nFrau : Sie werden heute im Lager übrigens nur Herr Lehmann antreffen. Normalerweise sind Sie dort zu viert, aber\nein Kollege ist zurzeit im Urlaub und der andere hat sich heute Morgen krankgemeldet.\nHerr : Kein Problem. Dan lerne ich die Kollegen später kennen.","questions":[{"n":26,"type":"tf","text":"Frau Schmidt und Herr Klein arbeiten beide im Lager.","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"answer":"f"},{"n":27,"type":"mcq","text":"Frau Schmidt","options":[{"key":"a","text":"gibt Herrn Klein die Arbeitskleidung."},{"key":"b","text":"stellt Herrn Klein seinem Vorgesetzten vor."},{"key":"c","text":"verlangt noch weitere Unterlagen von Herrn Klein."}],"answer":"c"}]}]},{"id":"H1V3","title":"Prüfungsvariante 3","pages":[112,113],"tracks":[{"id":"H1V3T1","transcript":"Chef : Wir müssen dringend über unsere Verkaufszahlen sprechen.\nFrau : Ja, darauf wollte ich Sie auch schon ansprechen. Die Entwicklung macht mir langsam Sorgen.\nChef : Haben Sie eine Idee, warum sich unsere Produkte nicht mehr so gut verkaufen?\nFrau : Wir haben ja schon öfter darüber gesprochen, dass wir vor einigen Monaten einen großen Konkurrenten\nbekommen haben. Wie Sie wissen, verkauft die Firma Sportslife ähnliche Sportbekleidung wie wir. Und einige\nKunden sind zur Konkurrenz übergelaufen. Ich habe mir deren Angebot angeschaut. Die haben viel günstigere\nPreise.\nChef : Aber die Kunden müssen das doch merken, dass die Qualität gar nicht vergleichbar ist.\nFrau : Ja, allerdings geht die Firma viel offensiver auf die Kunden zu als wir. Haben Sie in der Fußgängerzone die\nLeute gesehen, die Flyer verteilen? Darauf wird massiv mit Sonderangeboten und Rabattaktionen geworben.\nChef : Nein, die habe ich nicht gesehen. Aber ich denke, dass solche Maßnahmen nicht zu uns passen würden.\nFrau : Der Meinung bin ich auch. Aber etwas ändern müssen wir. Bisher konnten wir uns darauf verlassen, dass\nunser guter Name wirkt. Aber das reicht nicht mehr. Wir müssen auf jeden Fall mehr Werbung machen.\nChef : Mir wäre es auch wichtig, dass wir unser Verkaufspersonal in den Läden besser schulen und ihnen\nArgumente liefern, warum die Kunden unsere Produkte kaufen sollen.\nFrau : Und wir müssen uns klar von den Billigprodukten abgrenzen. Ein Argument könnte sein, dass wir nicht im\nAusland und nur zu fairen Konditionen produzieren lassen.\nChef : Der Ansatz gefällt mir. Arbeiten Sie doch mal eine Strategie aus, und dann sprechen wir nochmal darüber.\nWir sollten schnell handeln. Deshalb wäre es gut, wenn Sie bis zum 14.03. ein Konzept fertig hätten.","questions":[{"n":22,"type":"tf","text":"Der Geschäftsführer und die Marketingleiterin sprechen über Maßnahmen zur Umsatzsteigerung.","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"answer":"r"},{"n":23,"type":"mcq","text":"Die Firma möchte","options":[{"key":"a","text":"ihre Preise senken."},{"key":"b","text":"im Ausland produzieren."},{"key":"c","text":"das Verkaufspersonal schulen."}],"answer":"c"}]},{"id":"H1V3T2","transcript":"Herr : Einrichtungsgeschäft Home. Thoma, mein Name. Was kann ich für Sie tun?\nFrau : Lüdeke vom Logina, guten Tag, Ich rufe wegen Ihres Kostenvoranschlags für die Renovierung unserer\nBüroräume an.\nHerr : Ah, ja. Worum geht es denn?\nFrau : Sie haben mir zwei Alternativen für den Teppichboden angeboten. Der Preisunterschied ist ja doch ziemlich\ngroß. Wie unterscheiden sich denn die beiden Teppiche?\nHerr : Sie sind aus verschiedenen Materialien. Der eine Teppich ist aus reiner Schurwolle, und der andere hat eine\nAcrylbeimischung. Der ist dadurch natürlich preiswerter.\nFrau : Die Muster sehen ja sehr ähnlich aus.\nHerr : Das ist richtig. Optisch ähneln sich die beiden Teppiche zwar, aber der Laufkomfort auf dem Teppich aus\nreiner Schurwolle ist viel größer. Er ist weicher und federt mehr.\nFrau : Und welcher ist strapazierfähiger? Er soll ja in den Büros und in den Fluren liegen, und da laufen täglich\nviele Leute drüber. Er muss also schon was aushalten.\nHerr : Also robuster ist das Material mit Acrylbeimischung. Aber erfahrungsgemäß sehen die etwas teureren\nTeppiche trotzdem länger schöner aus. Ich würde Ihnen auf jeden Fall die reine Schurwolle empfehlen.\n112\nFrau : Was passiert denn, wenn der Teppich später mal beschädigt ist? Muss ich ihn dann gleich ganz austauschen\nlassen?\nHerr : Nein, das ist nicht nötig. Von diesem Teppich gibt es nicht nur Meterware, sondern auch Fliesen. Das sind\neinzelne kleine Quadrate, die als durchgehender Teppichboden verlegt werden und unabhängig voneinander\nausgetauscht werden können.\nFrau : Hm, das ist natürlich ein Argument. Kann ich mir die Fliesen bei Ihnen im Laden mal anschauen?\nHerr : Ja, natürlich. Kommen Sie gerne vorbei.","questions":[{"n":24,"type":"tf","text":"Herr Thoma verkauft Bodenbeläge.","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"answer":"r"},{"n":25,"type":"mcq","text":"Frau Lüdeke","options":[{"key":"a","text":"reklamiert einen Schaden."},{"key":"b","text":"trifft ihre Entscheidung aufgrund des Musters."},{"key":"c","text":"wundert sich über den Preisunterschied."}],"answer":"c"}]},{"id":"H1V3T3","transcript":"Frau Müller: Hallo Frau Herbst. Herzlich willkommen im Team.\nAmira Herbst: Guten Morgen. Dankeschön.\nFrau Müller: Das ist Ignacio Lopez. Ignacio, das ist Frau Herbst.\nIgnacio Lopez: Hallo. Wir arbeiten zusammen in der Gänseblümchen-Gruppe. Wollen wir uns nicht duzen?\nAmira Herbst: Ja klar, gerne. Ich bin Amira. Ich dachte, ich wäre in der Mäuse-Gruppe.\nIgnacio Lopez: Normalerweise schon. Aber diese Woche mussten wir das etwas anders organisieren. Denn\nheute Morgen hat sich eine Kollegin aus der Mäuse-Gruppe krankgemeldet. Und ich muss zwischen den beiden\nGruppen hin und her springen.\nAmira Herbst: Das ist für mich in Ordnung. Wenn du mir zeigst, wo ich alles finde, komme ich schon klar.\nFrau Müller: Wir sollten noch mal kurz in den Dienstplan schauen, bevor Sie anfangen.\nAmira Herbst: Ja, gibt es da denn Änderungen?\nFrau Müller: Da die Kollegin leider die ganze Woche ausfällt, müssen wir die Schichten anders verteilen.\nIch hatte Sie eigentlich für die Frühschicht eingetragen. Wäre es möglich, dass Sie stattdessen in den nächsten\nTagen den Spätdienst übernehmen?\nAmira Herbst: Ja, das geht. Ich hätte zwar lieber den Frühdienst gemacht, da ich diese Woche einige\nTermine habe. Aber die kann ich verschieben.\nIgnacio Lopez: Das ist prima. Aber wenn dir das Probleme bereitet, kann ich auch mal schauen, ob ich den\nSpätdienst machen kann.\nAmira Herbst: Ach nein, das passt schon. Trotzdem, danke für dein Angebot.\nFrau Müller: Wunderbar, dann ist das ja geklärt. Ich zeige Ihnen gleich alles, bevor die Kinder kommen.\nIgnacio Lopez: Das kann ich doch auch gerne übernehmen. Wo hast du denn früher gearbeitet?\nAmira Herbst: Ich bin erst vor Kurzem mit meinem Mann hierher gezogen. Vorher war ich in einer Kita in\nDarmstadt.","questions":[{"n":26,"type":"tf","text":"Ignacio und Amira sprechen über den Dienstplan.","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"answer":"r"},{"n":27,"type":"mcq","text":"Amira Herbst","options":[{"key":"a","text":"arbeitet diese Woche in einer anderen Gruppe."},{"key":"b","text":"kann diese Woche keinen Spätdienst übernehmen."},{"key":"c","text":"muss diese Woche zwei Gruppen betreuen."}],"answer":"a"}]}]},{"id":"H1V4","title":"Prüfungsvariante 4","pages":[114,115],"tracks":[{"id":"H1V4T1","transcript":"(\nMichaella : Hallo Karl, was gibt’s?\nKarl : Leider haben wir ein Problem mit unserem Termin mit der Schneider Barbara GmbH. Wir wollten ja\nursprünglich in den kommenden Wochen nach München fahren.\nMichaella : Ja stimmt, was ist denn los?\nKarl : Der Termin kann nicht wie geplant stattfinden. Die französische Firma La Monde hat sich überraschend für\nDonnerstag an uns angemeldet. Die Delegation ist vom 5. bis zum 10. August in Deutschland und hat spontan einen\nTermin zum persönlichen Kennenlernen vorgeschlagen. Diese Gelegenheit sollten wir unbedingt nutzen.\nMichaella : Hm, schon. Aber Christina hat doch schon alles für München gebucht. Hotels, Zugtickets. Kann denn\nniemand anders die Leute von La Monde treffen und wir fahren trotzdem?\nKarl : Oh, sie sind ein sehr wichtiger Geschäftspartner von uns und ich würde das Gespräch schon gerne selbst\nführen.\nMichaella : Aber die Schneider Barbara GmbH ist auch ein wichtiger Geschäftspartner. Immerhin hat sie uns einen\nBüroaufenthalt angekündigt. Ich denke, das sollten wir nicht so einfach aufs Spiel setzen. Außerdem war es\nschwierig genug, mit ihr einen Termin zu finden.\nKarl : Du hast schon recht. Dann schlage ich Folgendes vor. Du fährst nach München und ich nehme den Termin\nin La Monde wahr. Was hälst du davon?\nMichaella : Ich will halbwierig diese Lösung nicht, aber es ist ein guter Kompromiss. Ich würde aber gerne Nathalie\nmitnehmen, denn sie kennt die Kunden schon besser.\nKarl : Nathalie spricht sehr gut französisch. Die hätte ich gerne bei den Treffen in La Monde dabei. Aber du\nkönntest doch mit Ebol fahren. Er ist doch schon lange in den Projekten.\nMichaella : Ja gut, dann sage ich ihm direkt Bescheid.","questions":[{"n":22,"type":"tf","text":"Karl und Michaella verschieben einen wichtigen Termin.","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"answer":"f"},{"n":23,"type":"mcq","text":"Michaella soll","options":[{"key":"a","text":"ihre geplante Dienstreise absagen."},{"key":"b","text":"mit der Firma La Monde verhandeln."},{"key":"c","text":"mit einem Kollegen nach München fahren."}],"answer":"c"}]},{"id":"H1V4T2","transcript":"(\nHerr : Spedition Fix, guten Tag. Ich habe eine gute Nachricht für Sie. Wir haben den 15. ja den Liefertermin\nvereinbart, aber die Lieferung kommt schon drei Tage früher.\nFrau : Oh, die Nachricht ist leider gar nicht so gut. Wir müssen unser Lager baldest räumen, bevor die neue\nLieferung kommt. Die Winterware muss ja noch raus. Warum wird der Liefertermin denn vorgezogen?\nHerr : Wir müssen dies Mal aus betriblichen Gründen unsere Kunden in einer anderen Reihefolge liefern.\nFrau : Das verstehe ich ja, aber wir müssen natürlich auch sehen, wie wir klarkommen. Da müsste ich jetzt ziemlich\nviel umdisponieren.\nHerr : Es tut mir wirklich leid, dass wir Ihnen eine Umstellung machen. Aber ich kann es leider nicht ändern. Ich\nkann Ihnen aber anbieten, dass sie eine Woche später kommen. Aber am 15. klappt es leider definitiv nicht.\nFrau : Nein, später wird auch nicht. Dann würden sich ja alle Abläufe bei uns verzögern. Können wir die Lieferung\nwenigstens auf den späten Nachmittag legen, sodass wir an diesem Tag noch das Lager organisieren können?\nHerr : Ja, gerne. Da können wir uns nach Ihnen richten. Wir versuchen dann so zwischen 16 und 17 Uhr bei Ihnen\nzu sein. Unser Fahrer wird sich eine halbe Stunde vorher bei Ihnen melden. Wäre das für Sie so in Ordnung?\nFrau : Naja, die Situation ist nicht ideal. Aber manchmal muss man halt flexibel sein. Und sonst klappt die\nZusammenarbeit mit Ihnen ja immer gut. Dann halten wir den 12. ab 16 Uhr fest.\nHerr : Wunderbar. Und noch einmal vielen Dank für Ihr Verständnis.\n114","questions":[{"n":24,"type":"tf","text":"Frau Leipold vereinbart am Telefon einen Liefertermin.","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"answer":"r"},{"n":25,"type":"mcq","text":"Die Firma „Spedition Fix“","options":[{"key":"a","text":"beliefert Frau Leipold zum ersten Mal."},{"key":"b","text":"hat die Tourenplanung geändert."},{"key":"c","text":"verschiebt den Termin um sieben Tage."}],"answer":"b"}]},{"id":"H1V4T3","transcript":"(\nChef : Ich möchte Sie nochmal ausdrücklich darauf aufmerksam machen, dass die Sicherheitsregeln eingehalten\nwerden müssen. Gestern wäre es hier im Lager beinahe zu einem Unfall gekommen.\nFrau 1: Davon habe ich gehört. Franziska hat es heute Morgen erwähnt. Ich bin nur heute aus dem Urlaub\nwiedergekommen. Was ist denn genau passiert?\nChef : Herr Thoma hat keinen Schutzhelm getragen und hätte sich beinahe verletzt. Als er etwas aus einem Regal\nnehmen wollte, sind dabei andere schwere Gegenstände herausgerutscht und wären fast auf den Kopf gefallen.\nHerr 1: Ich stand daneben und habe einen riesigen Schreck bekommen. Zum Glück ist nichts passiert, aber es hätte\nböse ausgehen können.\nChef : Naja, dieses Mal ist es glimpflich ausgegangen, aber es hätte nicht passieren dürfen. Sie haben von uns\nSchutzkleidung bekommen, und ich weise Sie hiermit noch mal eindringlich darauf hin, dass Sie verpflichtet sind,\ndiese Sachen noch zu tragen. Denken Sie auch an Ihren Versicherungsschutz. Wenn Sie Ihre Gesundheit fahrlässig\nriskieren und es zu einem Unfall kommt, zahlt die Versicherung nicht.\nHerr 2: Da haben Sie natürlich recht. Aber ich muss gestehen, dass ich jetzt im Sommer den Helm manchmal\nabnehme, weil es so warm und heiß ist.\nChef : Das glaube ich, aber die Sicherheit geht vor. Und noch was. Ich habe kürzlich gesehen, dass zwei Kollegen\nauf einem Gabelstapler gefahren sind. Das ist auch streng untersagt.\nFrau 2: Kann ich die Vorschriften denn irgendwo nachlesen? Jemand hat sie mir bei der Einweisung am ersten\nArbeitstag erklärt. Aber das ist schon so lange her.\nChef : Die hängen in dem Pausenraum an der Tür. Vielleicht sollten wir aber einen Ort finden, wo der Aushang für\nalle besser sichtbar ist.","questions":[{"n":26,"type":"tf","text":"Der Chef weist auf wichtige Sicherheitsvorschriften hin.","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"answer":"r"},{"n":27,"type":"mcq","text":"Es gab keinen Unfall,","options":[{"key":"a","text":"da die Mitarbeiter alle Schutzkleidung getragen haben."},{"key":"b","text":"obwohl die Mitarbeiter die Vorschriften missachtet haben."},{"key":"c","text":"weil sich die Mitarbeiter an die Regeln gehalten haben."}],"answer":"b"}]}]},{"id":"H1V5","title":"Prüfungsvariante 5","pages":[116,117],"tracks":[{"id":"H1V5T1","transcript":"(\nChef : Gut, Melanie, dann will ich dir mal unseren Friseursalon zeigen. Also, hier haben wir den großen Raum mit\nzehn Stühlen. In der Regel arbeiten hier vier bis fünf Kollegen pro Schicht. Und dort hinten ist noch ein kleiner\nseparater Raum mit einem Stuhl.\nMelanie : Das heißt, dass wir hier auch an zwei Stühlen gleichzeitig arbeiten können?\nChef : Ja, das soll sogar so sein. Wenn du einer Kundin die Haare färbst und sie warten muss, kannst du\nwährenddessen schon den nächsten Kunden bedienen.\nMelanie : Ja, das kenne ich auch so. Und da muss kein Kunde allzu lange warten.\nChef : Dann gehen wir jetzt ins Lager. Da findest du Shampoo, Spüle und so weiter. In dieses Buch hier tragen wir\nimmer ein, was wir entnehmen, damit bei Bedarf nachbestellt werden kann.\nMelanie : Wie funktioniert das denn mit den Bestellungen? Wann und wie oft wird bestellt? Und wer macht das?\nChef : Es gibt immer eine Beauftragte pro Quartal, die dafür verantwortlich ist. Es geht reihum , das heißt, jeder ist\nmal dran . Normalerweise bestellen wir einmal im Monat.\nMelanie : Dürfen wir den Kunden bestimmte Produkte empfehlen? Oder ist das nicht erwünscht ?\nChef : Doch, zur Beratung gehört schon, dass wir geeignete Produkte empfehlen. Aber wir drängen die Kunden\nnicht zum Kauf.\nMelanie : Und wenn jemand eine Marke wissen will?\nChef : Dann empfehlen wir natürlich die, die wir hier benutzen.\nMelanie : Und wie ist das mit dem Trinkgeld ? Behält das jeder für sich oder gibt es eine gemeinsame Kasse?\nChef : Wir haben eine Kasse, in der wir das ganze Trinkgeld sammeln und einmal im Monat wird es verteilt. Also\njeder bekommt gleich veil. Wir sind davon aber auch schon mal gemeinsam essen gegangen.\nMelanie : Das ist ja eine schöne Idee.\nChef : Hast du sonst noch Fragen?","questions":[{"n":22,"type":"tf","text":"Der Chef erklärt Melanie, mit welchen Produkten der Salon arbeitet.","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"answer":"r"},{"n":23,"type":"mcq","text":"Im Friseursalon","options":[{"key":"a","text":"dürfen keine Produkte bestimmter Marken empfohlen werden."},{"key":"b","text":"ist der Chef für die Bestellung der Ware zuständig."},{"key":"c","text":"wird das Trinkgeld regelmäßig unter den Mitarbeitern aufgeteilt."}],"answer":"c"}]},{"id":"H1V5T2","transcript":"(\nFrau 1: Lasst uns mal über die Urlaubsplanung fürs nächste Jahr sprechen. Wisst ihr schon, wann ihr euch\nfreinehmen wollt?\nSandra : Ich würde gerne die ersten drei Wochen in den Sommerferien nehemen, da ich eine größere Reise plane.\nFrau 1: Oh, das könnte schwierig werden. Gerade in den Sommerferien wollen die Kollegen mit schulpflichtigen\nKindern Urlaub machen.\nSandra : Ja, stimmt. Daran habe ich gar nicht gedacht. Es ist nur so, dass ich mit einer Freundin verreisen möchte,\ndie nur zu dieser Zeit Urlaub nehmen kann.\nThomas : Ich habe ja zwei schulpflichtige Kinder, und wir haben überlegt, in den ersten beiden Wochen\nwegzufahren.\nMustafa : Oh-je, genau zu der Zeit wollte ich zu meiner Familie nach Horburg. Meine Lieblingskusine heiratet.\nThomas : Hm, naja, wir haben noch nichts gebucht. Ich könnte auch die letzten beiden Ferienwochen nehmen. Nur\nin der Mitte kann meine Frau nicht.\nFrau 1: Na Prima, dann passt das doch. Mustafa nimmt die ersten beiden Ferienwochen, und Thomas die letzten\nbeiden.\nSandra : Könnte ich dann in der Mitte drei Wochen freinehmen? Oder wäre es schlimm, wenn Mustafa und ich eine\nWoche gleichzeitig weg wären ?\n116\nFrau 1: Nein, das wäre schon okay. Ich bin in dieser Zeit ja auch da.\nThomas : Ich hätte übrigens auch ganz gerne noch zwei Wochen am Stück in den Winterferien. Da würden wir\nnämlich gern zum Skilaufen nach Österreich fahren.\nFrau 1: Über den Winterurlaub können wir später noch sprechen. Wichtig ist, dass wir jetzt den Sommerurlaub\nplanen.","questions":[{"n":24,"type":"tf","text":"Die Kollegen einigen sich darauf, wer wann Urlaub nehmen kann.","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"answer":"r"},{"n":25,"type":"mcq","text":"In den Sommerferien","options":[{"key":"a","text":"können nur Mitarbeitende mit Kindern Urlaub machen."},{"key":"b","text":"möchte Sandra zwei Wochen verreisen."},{"key":"c","text":"will Mustafa die ersten beiden Wochen freinehmen."}],"answer":"c"}]},{"id":"H1V5T3","transcript":"(\nFrau Schulz : Hallo, hier ist Michaela Schulz von Kaffeesahneschnitte in Bremen. Guten Tag. Einer unserer\nKaffeeautomaten ist gestern leider kaputt gegangen. Und wir wollen bei der Gelegenheit gleich in eine modernere\nMaschine investieren. Auf Ihrer Homepage habe ich den Esam 320 gesehen, den ich sehr interessant finde. Ich hätte\naber noch ein paar Fragen.\nHerr : Gerne, Frau Schulz. Wie kann ich Ihnen helfen?\nFrau Schulz : In unserem Cafe haben wir Platz für 60 Gäste. Reicht dafür der Esam 320 aus ?\nHerr : Wie viele Liter Kaffee bereiten Sie denn im Schnitt pro Tag zu?\nFrau Schulz : Ich denke, ein Wasserbehälter, den 10 Liter fasst, sollte reichen.\nHerr : Das passt genau. Der Isar 320 hat einen 10-Liter-Tank. Der ist allerdings auch größer als herkömmliche\nKaffeeautomaten.\nFrau Schulz : Das ist kein Problem. Wir haben ausreichend Platz. Uns wäre es aber wichtig, dass die Maschine ein\nleises Mahlwerk hat. Wenn es zu laut ist, stört sie die Gäste.\nHerr : Keine Sorge. Das Gerät hat eines der leisesten Mahlwerke, die im Moment auf dem Markt sind. Außerdem\nkönnen Sie 13 verschiedene Mahlstufen für sehr feinen bis grobgemahlenen Kaffee einstellen.\nFrau Schulz : Das ist gut. Wir haben so viele verschiedene Kaffeesorten und Röstungen. Und unsere jetzigen\nMaschinen haben nur sieben verschiedene Mahlstufen. Hat die Maschine denn auch eine Selbstreinigungsfunktion?\nHerr : Natürlich hat das Gerät verschiedene automatische Reinigungs- und Entkaltungsprogramme, die alle sehr\nschnell fertig sind. Und die Bedienung ist auch sehr einfach.\nFrau Schulz : Das klingt ja sehr gut. Vielen Dank. Ich werde nochmal kurz mit meinem Geschäftspartner\nRücksprache halten und melde mich spätestens morgen bei Ihnen.","questions":[{"n":26,"type":"tf","text":"Frau Schulz braucht mehrere neue Kaffeemaschinen.","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"answer":"f"},{"n":27,"type":"mcq","text":"Frau Schulz findet das Gerät gut, obwohl es","options":[{"key":"a","text":"sehr groß ist."},{"key":"b","text":"sich nicht selbst reinigen kann."},{"key":"c","text":"ziemlich laut ist."}],"answer":"a"}]}]},{"id":"H1V6","title":"Prüfungsvariante 6","pages":[118,119],"tracks":[{"id":"H1V6T1","transcript":"(\nSimmering : Guten Morgen, Frau Barthum. Ja, vielen Dank. Und jetzt freue ich mich sehr, hier am\nWilhelmsgymnasium anzufangen.\nBarthum: Sie übernehmen ja die Klassenleitung der 8B. Heute, am ersten Schultag nach den Sommerferien, lernen\nSie erstmal nur Ihre Klasse kennen. Und morgen geht es dann mit dem normalen Unterrichtsbetrieb los. Ihren\nStundenplan haben Sie bekommen, oder?\nSimmering : Ja, den habe ich letzte Woche erhalten.\nBarthum : Gut, dann bringe ich Sie jetzt zu Frau Alimi, meiner Assistentin. Sie führt Sie erstmal herum und kann\nIhnen alle Fragen beantworten.\nHallo Frau Alimi, hier bringe ich Ihnen Herrn Simmering, den neuen Kollegen, der die 8B übernimmt.\nAlimi : Guten Morgen, Herr Simmering. Schön, dass Sie da sind. Am besten gehen wir als Erstes ins Lehrerzimmer.\nDort stehen die Schränke für die Lehrer. Alle Kolleg*innen haben ein abschließbares Fach, wo sie ihre Sachen\nunterbringen können. Sie haben dort auch einen Computer und zwei Kopierer, um Unterrichtsmaterial\nvorzubereiten. Für die Kopierer bekommen Sie gleich noch einen Code. Ah, sehen Sie, da ist Herr Timbur, unser\nFachbereichsleiter für Fremdsprachen.\nHallo Herr Timbur, darf ich Ihnen Herrn Simmering vorstellen?\nTimbur : Guten Morgen, Herr Simmering. Entschuldigen Sie bitte, ich bin gerade ein bisschen in Eile. Frau Alimi,\nist denn der Gesamtstundenplan aller Kolleg*innen schon fertig? Frau Michaelis hat sich krank gemeldet und ich\nwollte nachschauen, wer einspringen kann.\nSimmering : Organisieren das die Lehrer unter sich?\nAlimi : Normalerweise mache ich das, aber wenn es mal schnell gehen muss oder ich beschäftigt bin, klären die\nKollegen auch mal unter sich, wer eine Vertretung übernehmen kann.","questions":[{"n":22,"type":"tf","text":"Am ersten Schultag unterhalten sich die Personen über organisatorische Fragen.","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"answer":"r"},{"n":23,"type":"mcq","text":"Frau Alimi","options":[{"key":"a","text":"ist Mitarbeiterin von Frau Barthum."},{"key":"b","text":"ist eine neue Lehrerin."},{"key":"c","text":"vertritt eine Kollegin."}],"answer":"a"}]},{"id":"H1V6T2","transcript":"(\nFrau : Hallo Markus, hast du kurz Zeit? Ich würde gerne was mit dir besprechen.\nMarkus : Klar, worum geht’s?\nFrau : Bei uns in der Personalabteilung wird doch ein neues Betriebssystem auf den Computern installiert. Und ihr\nvon der IT-Abteilung organisiert das doch, oder ?\nMarkus : Ja, genau.\nFrau : Weißt du schon, wann das stattfinden soll ? Am besten an einem Wochenende, oder ?\nMarkus : Ja, ich bin mit der Softwarefirma in Kontakt. Die meinen, die Systemumstellung sei in zwei Tagen\nerledigt. Also starten sie an einem Freitagnachmittag.\nFrau : Das ist eine gute Idee. Freitags arbeiten wir in der Personalabteilung, ja sowieso nur bis Mittag. Da könnte\ndie Softwarefirma spätestens um 14 Uhr beginnen. Sagst du mir Bescheid, an welchem Wochenende die Firma hier\nsein wird ? Es wird Zeit, dass wir ein neues System bekommen. Mit dem alten ist die Arbeit wirklich mühsam.\nMarkus : Das mache ich. Und wenn die Techniker dann kommen, können wir sie ja nicht allein hier arbeiten lassen.\nIch bin also auf jeden Fall vor Ort. Aber von euch aus der Personalabteilung sollte schon auch mindestens eine\nKollegin oder ein Kollege anwesend sein.\nFrau : Ja, das stimmt. Ich werde mal nachfragen, wer bereit ist, da zu kommen. An einem der Tage kann ich das auf\njeden Fall übernehmen. Wer arbeitet uns denn eigentlich dann in das neue System ein? Macht ihr das von der IT-\nAbteilung ?\n118\nMarkus : Nein, das macht auch die Softwarefirma. Es wird einige neue Funktionen geben und wir alle können da\nsicher noch was lernen. Die Schulung sollte dann direkt am darauffolgenden Montagmorgen stattfinden.\nFrau : Alles klar. Danke, dass du dich um alles kümmerst.","questions":[{"n":24,"type":"tf","text":"In dem Gespräch unterhalten sich zwei IT-Spezialisten.","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"answer":"f"},{"n":25,"type":"mcq","text":"Die Mitarbeiterinnen und Mitarbeiter der Personalabteilung","options":[{"key":"a","text":"kennen das neue Betriebssystem bereits."},{"key":"b","text":"müssen das ganze Wochenende in der Firma sein."},{"key":"c","text":"werden in das neue Betriebssystem eingewiesen."}],"answer":"c"}]},{"id":"H1V6T3","transcript":"(\nFrau : Kerner hier, von der Firma Orphitec. Guten Tag, Herr Neumeyer.\nHerr : Hallo Frau Kerner, was kann ich für Sie tun?\nFrau : Wir haben gerade Ihre Lieferung bekommen. Sie wissen schon, die zwölf Multifunktionsgeräte, die wir vor\nzwei Wochen bestellt haben. Aber leider sind nur zehn bei uns angekommen.\nHerr : Kleinen Moment bitte, Frau Kerner. Ich sehe mal nach. Können Sie mir die Bestellnummer sagen? Dann\nfinde ich den Vorgang schneller.\nFrau : Ja, natürlich. Das ist die 5437892. Der Auftrag ist vom 3. August.\nHerr : Danke. Ah ja, da habe ich ihn. Aber da muss ein Missverständnis vorliegen. Auf der Bestellung stehen nur\n10 Geräte.\nFrau : Das ist richtig, aber ich habe letzte Woche nochmal angerufen und zwei Geräte nachbestellt. Ihre Kollegin\nsagte mir, das ginge so in Ordnung.\nHerr : Wissen Sie, mit wem Sie gesprochen haben? Und haben Sie eine schriftliche Bestätigung der\nAuftragsänderung erhalten?\nFrau : Den Namen der Kollegin weiß ich leider nicht. Und ehrlich gesagt habe ich auf eine schriftliche Bestätigung\nIhrerseits gar nicht mehr geachtet. Ich habe mich einfach darauf verlassen, dass das klappt. Sonst funktioniert das ja\nauch immer wunderbar.\nHerr : Da muss etwas schiefgegangen sein. Offensichtlich hat die Kollegin die Änderung nicht weitergegeben.\nReicht es denn, wenn wir die beiden fehlenden Geräte mit der nächsten Lieferung mitschicken? Oder brauchen Sie\nsie dringend?\nFrau : Mit der nächsten Lieferung ist zu spät. Der Kunde wartet darauf.\nHerr : Okay, dann kümmere ich mich gleich persönlich darum und sehe zu, dass Sie die Geräte morgen\nhaben. Voraussetzung dafür ist natürlich, dass wir noch welche auf Lager haben.\nFrau : Gut, ich verlasse mich auf Sie. Herzlichen Dank für Ihre Unterstützung.\nHerr : Gerne, Frau Kerner , und enschuldigen Sie die Unannehmlichkeiten.","questions":[{"n":26,"type":"tf","text":"Herr Neumeyer nimmt eine Reklamation entgegen.","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"answer":"r"},{"n":27,"type":"mcq","text":"Frau Kerner","options":[{"key":"a","text":"benötigt eine Auftragsbestätigung."},{"key":"b","text":"braucht noch zwei Geräte für einen Kunden."},{"key":"c","text":"hat einen Auftrag für zwölf Geräte geschickt."}],"answer":"b"}]}]},{"id":"H1V7","title":"Prüfungsvariante 7","pages":[120,121],"tracks":[{"id":"H1V7T1","transcript":"Teamleiter : Herzlich willkommen in unserem Team, Frau Blume. Schön, dass es mit Ihrem Arbeitsantritt so\nschnell geklappt hat. Der Herbst ist ja unsere Hochsaison und wir können wirklich jede Hilfe gebrauchen.\nFrau : Ich freue mich auch, dass ich hier bin.\nTeamleiter : Ja, prima. Dann stelle ich Sie jetzt mal allen vor.\nHier im Großraumbüro hat jeder Mitarbeiter seinen festen Arbeitsplatz. Sie sitzen hier neben Herrn Gombert, ein\nsehr erfahrener Kollege. Er arbeitet schon seit zehn Jahren im Kundenservice und wird Sie einarbeiten und bei\nFragen unterstützen.\nFrau : Soll ich denn von Anfang an telefonische Kundengespräche führen?\nTeamleiter : Nein, ich denke, Sie werden zuerst die per E-Mail eingegangenen Anfragen bearbeiten.\nUnd sobald Sie mit diesen Abläufen vertraut sind, können Sie unsere Kunden auch persönlich betreuen.\nFrau : Sie hatten im Vorstellungsgespräch ja gesagt, dass wir in Schichten arbeiten. Ist der Dienstplan für diesen\nMonat schon fertig?\nTeamleiter : Ja, wir haben Sie in den ersten beiden Wochen zusammen mit Herrn Gombert für die Frühschicht\nvon 7 bis 14 Uhr eingeteilt. Die Spätschicht geht von 13 bis 20 Uhr. Die machen Sie dann in der zweiten\nMonatshälfte. Der Dienstplan wird 30 Tage im Voraus ins Intranet gestellt. Der Spätdienst hat übrigens\nKüchendienst. Dafür kocht die Frühschicht Kaffee für alle.\nFrau: Alles klar. Kann man die Schichten auch tauschen?\nTeamleiter : Ja, das ist möglich. Allerdings nur nach Rücksprache mit mir. Auch die Urlaubsanträge müssen\nzunächst von mir genehmigt werden. Im Kundenservice dürfen nicht so viele Mitarbeiter gleichzeitig fehlen. Wir\nfinden aber immer eine Lösung. Und jetzt stelle ich Ihnen die anderen Kollegen vor.\nFrau : Ja, gerne.","questions":[{"n":22,"type":"tf","text":"Der Teamleiter spricht mit der Mitarbeiterin über den Dienstplan.","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"answer":"r"},{"n":23,"type":"mcq","text":"Frau Blume","options":[{"key":"a","text":"darf ihre Schichten selbst bestimmen."},{"key":"b","text":"wird im Kundenservice eingesetzt."},{"key":"c","text":"wird die Kunden nur per E-Mail betreuen."}],"answer":"b"}]},{"id":"H1V7T2","transcript":"Frau : Guten Morgen zusammen.\nEs gibt heute gar nicht viel zu besprechen. Ich möchte mich nur kurz mit euch über die bevorstehende Buchmesse\nunterhalten. Wie ihr wisst, haben wir dieses Jahr einen größeren Stand. Das heißt, wir, die Marketingabteilung,\nwerden alle Hände voll zu tun haben.\n1 Azubi : Kriegt das Team denn keine Unterstützung von anderen Abteilungen?\nFrau : Doch, schon. Aber wir werden vor Ort dieses Mal trotzdem nicht so viele Mitarbeiter sein.\nDie Kollegen aus dem Außendienst sind natürlich da. Und ihr beiden, Tim und Joshua, helft uns ja auch wieder.\nWer sonst noch da sein wird, muss sich noch aushandeln.\n2 Azubi : Oh, wir Azubis dürfen auch wieder mit. Cool. Sind wir dann den ganzen Tag am Stand oder können wir\nuns auch auf der Messe umsehen?\nFrau : Ich hätte euch gerne den ganzen Tag am Stand. Ich denke, ihr seid mittlerweile mit all unseren Produkten\nvertraut und könnt sie den Kunden bestimmt sehr gut präsentieren. Das wäre uns eine große Hilfe.\n1 Azubi : Schade. Ich hatte gehofft, dass ich mir auch angucken kann, wie sich die Konkurrenz präsentiert.\nDas ist für uns Auszubildende schließlich auch wichtig.\n2 Azubi : Ja, das hätte ich mir auch gewünscht. Den ganzen Tag am Stand zu stehen, finde ich auch total\nanstrengend.\nFrau : Ach komm, Messezeit ist immer anstrengend. Aber das gehört zu unserem Job einfach dazu.\n1 Azubi : Trotzdem.\n120\nFrau : Okay. Wenn am Stand nicht so viel los ist, kann ja vielleicht einer von euch mal Viertelstunde weg.\nAber bitte nicht beide zusammen.\n2 Azubi : Das ist doch eine gute Lösung. Auch wenn ich mir gewünscht hätte, mit Joshua zusammen über die Messe\ngehen zu können.","questions":[{"n":24,"type":"tf","text":"Die Auszubildenden handeln einen Kompromiss mit der Abteilungsleiterin aus.","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"answer":"r"},{"n":25,"type":"mcq","text":"Die beiden Auszubildenden","options":[{"key":"a","text":"dürfen gleichzeitig den Stand verlassen."},{"key":"b","text":"dürfen keine Kundengespräche führen."},{"key":"c","text":"wollen die Konkurrenz beobachten."}],"answer":"c"}]},{"id":"H1V7T3","transcript":"Herr : Büro Möbelnab. Mein Name ist Karl Sachter. Guten Tag. Was kann ich für Sie tun?\nFrau : Guten Tag, Herr Sachter. Hier ist Eva Leutner, Firma Digitec aus Stuttgart. Wir ziehen in neue\nRäumlichkeiten um und möchten gerne bei der Gelegenheit unsere Büroausstattung erneuern.\nHerr : Woran genau haben Sie denn gedacht?\nFrau : Wir brauchen eine komplette Büroausstattung mit Arbeitsplätzen, Regalen und Schränken. Besonders\nwichtig sind uns ergonomische Schreibtische und rückenfreundliche Stühle. Auf Ihrer Homepage haben wir die\nelektrisch höhenverstellbaren Tische gesehen, die für uns in Frage kommen. Allerdings bräuchten wir einige\nInformationen dazu.\nHerr : Gerne. Momentan ist diese Art von Tischen sehr gefragt. Wie kann ich Ihnen denn weiterhelfen?\nFrau : Ich habe diese Tische nur rechteckig und in einer Größe gefunden. Bieten Sie die auch in anderen Formen\nund mit anderen Maßen an?\nHerr : Ja. Auf der Homepage ist nur die Standardvariante abgebildet. Sie können den Tisch aber auch in anderen\nGrößen und Formen bei uns bestellen. Ganz nach Ihren persönlichen Wünschen. Je nach Ausführung liegt die\nLieferzeit dann zwischen ein bis zwei Wochen.\nFrau : Das wäre kein Problem. Noch eine Frage hätte ich. Im Internet steht, dass man die Tische auch mit Rollen\nbekommen kann.\nHerr : Das stimmt. Die Tische können entweder mit oder ohne Rollen bestellt werden.\nFrau : Ach super. Tische mit Rollen wären vielleicht wirklich ganz praktisch für uns. Würden Sie uns bitte eine\nPreisliste Ihres Gesamtsortiments zukommen lassen?\nHerr : Selbstverständlich. Noch ein wichtiger Hinweis. Unsere Möbel liefern wir nur zerlegt und unsere Monteure\nbauen sie dann vor Ort auf. Das kostet Sie als Kunden natürlich nichts extra.","questions":[{"n":26,"type":"tf","text":"Frau Leutner bestellt telefonisch neue Möbel.","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"answer":"f"},{"n":27,"type":"mcq","text":"Die Möbelfirma","options":[{"key":"a","text":"bietet nur kostenpflichtige Montage der Ware."},{"key":"b","text":"hat Lieferzeiten von mindestens zwei Wochen."},{"key":"c","text":"kann Möbelstücke in verschiedenen Ausführungen herstellen."}],"answer":"c"}]}]}],"teil2":[{"id":"H2V1","title":"Prüfungsvariante 1","pages":[122,123],"options":[{"key":"a","text":"Mitarbeiter sollten ihr Diensthandy nach der Arbeit ausschalten."},{"key":"b","text":"Im Urlaub sollte man sich mit Arbeitsangelegenheiten nicht beschäftigen."},{"key":"c","text":"Arbeit und Freizeit sollten klar getrennt sein, um das Privatleben zu schützen."},{"key":"d","text":"Für manche Kunden ist es wichtig, dass der Kundenservice auch am Wochenende verfügbar ist."},{"key":"e","text":"Man sollte das Privatleben respektieren und Arbeitsanfragen außerhalb der Arbeitszeit vermeiden."},{"key":"f","text":"Manche Mitarbeiter sind bereit, für den Kundenservice am Wochenende erreichbar zu sein."}],"tracks":[{"id":"H2V1N28","n":28,"transcript":"Frau 1: Habt ihr auch schon davon gehört, dass wir uns alle ein Diensthandy bekommen sollen?\nHerr : Wirklich? Wie toll. Dann können wir endlich, wenn wir für die Firma unterwegs sind, das Firmenhandy\nbenutzen und müssen nicht ständig auf unsere Kosten mit unseren privaten Geräten telefonieren.\nFrau 2: Müssen wir dann auch in der Freizeit erreichbar sein? Das finde ich nämlich nicht so gut.\nHerr : Wir können es doch einfach am Ende des Arbeitstages und am Wochenende ausschalten. Da sehe ich kein\nProblem.\nFrau 1: Hoffentlich erwartet der Chef nicht, dass er uns dann immer erreichen kann. Darauf habe ich keine Lust.\nHerr : Das geht natürlich nicht. Es muss klar geregelt sein, dass wir nur während der Arbeitszeit erreichbar sein\nmüssen. Aber dann finde ich es praktisch.\nFrau 2: Dann lasst uns doch mal mit dem Chef darüber sprechen, wie er sich das vorstellt.","answer":"a"},{"id":"H2V1N29","n":29,"transcript":"Frau : Hallo Max, schön dich wiederzusehen. Wie war dein Urlaub?\nMax : Der war eigentlich schön, aber ich habe zu viele E-Mails aus dem Büro bekommen. Ich kann gar nicht richtig\nentspannen, wenn ich immer wieder an die Arbeit denken muss.\nFrau : Warum schaust du dir deine geschäftlichen Mails überhaupt im Urlaub an? Das würde ich ja nicht machen.\nMax : Mache ich eigentlich auch nicht. Aber wir waren mitten im Projekt, und deshalb habe ich mein Diensthandy\nmitgenommen. Für den Fall, dass etwas Wichtiges geklärt werden muss. Dass auch noch andere Mails kommen\nkönnten, habe ich nicht bedacht.\nFrau : Naja, dann darfst du dich aber nicht beschweren. Selbst schuld - wer im Urlaub auch noch an die Arbeit\ndenkt.\nMax : Das war eine besondere Situation. Das nächste Mal lasse ich das Diensthandy lieber zu Hause.","answer":"b"},{"id":"H2V1N30","n":30,"transcript":"Frau : Sag mal Thomas, hast du meine Nachricht denn gestern nicht bekommen?\nThomas : Wie? Hast du mir geschrieben? Worum ging's denn?\nFrau : Ach Thomas, warum hast du die Nachricht denn nicht gelesen? Ich wollte etwas wegen des Angebots für\nunseren Kunden mit dir besprechen und es dann auch ausschicken.\nThomas : Du weißt doch, dass ich abends mein Handy immer ausschalte. Wir hätten doch im Büro deine Fragen\nklären können. Ich war schließlich den ganzen Tag da.\nFrau : Ich habe es vorher nicht geschafft, deshalb bin ich erst abends dazu gekommen. Und weil der Kunde wichtig\nist, wollte ich es noch erledigen.\nThomas : Das kann ich verstehen, aber ich war schon um 7 Uhr im Büro und dann habe ich wie immer um 17 Uhr\nFeierabend gemacht und das Handy ausgeschaltet. Aber komm, lass uns das Angebot jetzt schnell zusammen fertig\nmachen.","answer":"e"},{"id":"H2V1
