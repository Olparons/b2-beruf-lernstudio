  function hseed11(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
  function rrng11(seed){let x=hseed11(seed)||123456789;return()=>{x+=0x6D2B79F5;let t=x;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
  function shuffle11(a,seed){a=[...a];const r=rrng11(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function cloudTasks(c){let pool=allGeneratedTasks().filter(t=>!t.input&&Array.isArray(t.options)&&t.options.length>=2);if(c.theme==='vp')pool=pool.filter(t=>t.cat==='VerbPräp');if(c.theme==='vocab')pool=pool.filter(t=>t.cat==='Wortschatz');if(c.theme==='grammar')pool=pool.filter(t=>['Grammatik','Kollokation'].includes(t.cat));if(c.theme==='sprach')pool=pool.filter(t=>['Grammatik','Kollokation','zu-Infinitiv'].includes(t.cat));return shuffle11(pool,c.question_seed).slice(0,c.question_count).map((t,i)=>({...t,options:shuffle11(t.options,c.question_seed+'-'+i)}))}
  function cloudMultiPanel(t){
    const raw=String((t&&t.id)||'');
    const mm=raw.match(/(vp\d+|nv\d+|zv\d+|za\d+|zn\d+|v\d+)/);
    let m=(mm&&CLOUD_MULTI[mm[1]])||CLOUD_MULTI[raw]||null;
    if(!m&&t&&t.answer){
      const ans=String(t.answer).toLowerCase();
      const vx=LEARN.vocab.find(x=>String(x.de).toLowerCase()===ans);
      const nv=LEARN.collocations.find(x=>String(x.de).toLowerCase()===ans);
      const zz=LEARN.zuInf.find(x=>String(x.word).toLowerCase()===ans);
      const key=(vx&&vx.id)||(nv&&nv.id)||(zz&&zz.id);
      if(key)m=CLOUD_MULTI[key]||null;
    }
    if(!m)return'';
    return `<div class="multi-help"><div class="multi-help-title"><b>🌍 Mehrsprachige Hilfe · erst nach der Antwort</b><span class="v8-badge">Deutsch bleibt Lernsprache</span></div><div class="multi-grid"><div class="multi-item"><span class="lang">ESPAÑOL</span>${esc(m[0])}</div><div class="multi-item"><span class="lang">ENGLISH</span>${esc(m[1])}</div><div class="multi-item"><span class="lang">РУССКИЙ</span>${esc(m[2])}</div><div class="multi-item ar"><span class="lang">العربية</span>${esc(m[3])}</div></div></div>`
  }

  window.cloudPlayChallenge=async function(id){const c=cloudData.challenges.find(x=>x.id===id);if(!c)return;const mine=cloudData.attempts.find(a=>a.challenge_id===id&&a.user_id===cloudUser.id);if(mine){cloudShowChallengeResult(id);return}if(c.status==='pending'){await sb.from('challenges').update({status:'active',accepted_at:new Date().toISOString()}).eq('id',id)}onlineGame={challenge:c,tasks:cloudTasks(c),index:0,score:0,answered:false,answers:[],started:Date.now()};renderOnlineGame()};
  function renderOnlineGame(){show('community');const g=onlineGame;if(!g)return openCommunity();if(g.index>=g.tasks.length)return finishOnlineGame();const t=g.tasks[g.index],otherId=g.challenge.creator_id===cloudUser.id?g.challenge.opponent_id:g.challenge.creator_id,other=cloudData.profiles[otherId]||{};document.getElementById('community').innerHTML=`<div class="backrow"><button class="back" onclick="onlineGame=null;openCommunity()">←</button><div style="flex:1"><h1>Online-Challenge</h1><div class="sub">gegen ${esc(other.display_name||other.username||'Freund')} · ${esc(tlabel(g.challenge.theme))}</div></div><span class="cloud-score">${g.score} Punkte</span></div><div class="memory-progress"><span style="width:${Math.round(g.index/g.tasks.length*100)}%"></span></div><div class="qcard" style="margin-top:14px"><div class="qmeta"><span class="qkind">Cloud-Duell</span><span class="qcount">${esc(t.cat)}</span></div><div class="question">${esc(t.prompt)}</div>${t.context?`<div class="example smart-context">${esc(t.context)}</div>`:''}<div class="options">${t.options.map((o,i)=>`<button class="opt" onclick="cloudAnswerChallenge(${i})"><span class="ol">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="cloudChFeedback" class="feedback"></div><div id="cloudChNext" class="nextbar"><button class="btn primary" onclick="cloudNextChallenge()">Weiter →</button></div></div>`}
  window.cloudAnswerChallenge=function(i){const g=onlineGame;if(!g||g.answered)return;g.answered=true;const t=g.tasks[g.index],chosen=t.options[i],ok=norm(chosen)===norm(t.answer);if(ok)g.score++;g.answers.push({id:t.id,chosen,answer:t.answer,ok});document.querySelectorAll('#community .opt').forEach((b,j)=>{b.disabled=true;if(norm(t.options[j])===norm(t.answer))b.classList.add('correct');else if(j===i)b.classList.add('wrong')});const f=document.getElementById('cloudChFeedback');f.className='feedback show '+(ok?'ok':'no');f.innerHTML=`<b>${ok?'Richtig':'Noch nicht'}</b>${esc(t.explain||('Lösung: '+t.answer))}${t.postExample?`<div class="memory-example">${esc(t.postExample)}</div>`:''}${cloudMultiPanel(t)}`;document.getElementById('cloudChNext').classList.add('show');try{record(t.cat,t.id+'-cloud',ok)}catch(_){}};
  window.cloudNextChallenge=function(){if(!onlineGame)return;onlineGame.index++;onlineGame.answered=false;renderOnlineGame()};
  async function finishOnlineGame(){const g=onlineGame;if(!g)return;show('community');document.getElementById('community').innerHTML='<div class="qcard" style="text-align:center"><h2>Ergebnis wird gespeichert…</h2></div>';const duration=Math.round((Date.now()-g.started)/1000);const {error}=await sb.from('challenge_attempts').upsert({challenge_id:g.challenge.id,user_id:cloudUser.id,score:g.score,total:g.tasks.length,duration_seconds:duration,answers:g.answers},{onConflict:'challenge_id,user_id'});if(error){toast('Ergebnis konnte nicht gespeichert werden.');onlineGame=null;openCommunity();return}const {data:ats}=await sb.from('challenge_attempts').select('*').eq('challenge_id',g.challenge.id);if((ats||[]).length>=2)await sb.from('challenges').update({status:'completed',completed_at:new Date().toISOString()}).eq('id',g.challenge.id);onlineGame=null;await loadCloudCommunity(false);renderChallengeResult(g.challenge.id)}
  window.cloudShowChallengeResult=function(id){renderChallengeResult(id)};
  function renderChallengeResult(id){const c=cloudData.challenges.find(x=>x.id===id);if(!c){openCommunity();return}const ats=cloudData.attempts.filter(a=>a.challenge_id===id),mine=ats.find(a=>a.user_id===cloudUser.id),otherId=c.creator_id===cloudUser.id?c.opponent_id:c.creator_id,theirs=ats.find(a=>a.user_id===otherId),other=cloudData.profiles[otherId]||{};show('community');document.getElementById('community').innerHTML=`<div class="qcard" style="max-width:720px;margin:auto;text-align:center"><span class="tag">Online-Challenge</span><h2>${esc(tlabel(c.theme))}</h2><div class="live-score"><div class="live-player"><span>${esc(p().name)}</span><b>${mine?.score??'–'}</b><small>${mine?mine.total+' Aufgaben':'noch nicht gespielt'}</small></div><div class="live-vs">VS</div><div class="live-player"><span>${esc(other.display_name||other.username||'Freund')}</span><b>${theirs?.score??'–'}</b><small>${theirs?theirs.total+' Aufgaben':'wartet noch'}</small></div></div><h2>${mine&&theirs?(mine.score>theirs.score?'Sieg!':mine.score<theirs.score?'Niederlage':'Remis'):'Ergebnis gespeichert'}</h2><p class="subtle">${mine&&theirs?'Beide Ergebnisse wurden automatisch synchronisiert.':'Sobald die andere Person spielt, erscheint ihr Ergebnis hier automatisch.'}</p><div class="toolbar" style="justify-content:center"><button class="btn primary" onclick="openCommunity()">Community</button>${!mine?`<button class="btn dark" onclick="cloudPlayChallenge('${id}')">Jetzt spielen</button>`:''}</div></div>`}

  // Home copy now reflects cloud capabilities.
  window.renderHome=renderHome=function(){oldRenderHome();const cards=[...document.querySelectorAll('#home .v8-card')];cards.forEach(c=>{const h=c.querySelector('h3');if(h?.textContent==='Community & Duell'){const pp=c.querySelector('p');if(pp)pp.textContent=cloudUser?'Freunde und Challenges online · Ergebnisse automatisch synchronisiert.':'Offline-Challenges + optionales Cloud-Konto für echte Online-Freunde.'}if(h?.textContent==='Geräte-Sync'){const pp=c.querySelector('p');if(pp)pp.textContent=cloudUser?'Automatisch zwischen Handy, PC und Tablet synchronisiert.':'Mit kostenlosem Konto automatisch zwischen Geräten synchronisieren.'}})};

  // Keep profile/activity fresh without excessive writes.
  setInterval(()=>{if(cloudUser)syncProfileToCloud(false)},3*60*1000);
  window.addEventListener('online',()=>{if(cloudUser){setSyncStatus('syncing');pushCloudState(false);loadCloudCommunity(false)}});
  window.addEventListener('offline',()=>{if(cloudUser)setSyncStatus('offline')});
  window.addEventListener('beforeunload',()=>{if(cloudUser&&syncTimer){clearTimeout(syncTimer);pushCloudState(false)}});

  // Start after the existing V10 app is fully defined.
  setTimeout(initCloud,0);
})();
</script>

  function zuPrompt(kind){
    if(kind==='Verb')return 'Welches Verb in der Grundform gehört zu diesem Satz?';
    if(kind==='Nomen')return 'Welche Nomenstruktur passt zu diesem Satz?';
    return 'Welches Adjektiv passt zu diesem Satz?';
  }
  // V11.1: Bei zu-Infinitiv-Aufgaben muss die eigentliche Struktur VOR der Antwort sichtbar sein.
  window.makeZuTask=makeZuTask=function(x){
    const pool=LEARN.zuInf.filter(y=>y.kind===x.kind);
    return{
      id:'t-'+x.id,
      cat:'Grammatik',
      kind:'zu-Infinitiv',
      prompt:zuPrompt(x.kind),
