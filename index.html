<script>
const APP={"data":{"lesen1":[{"id":"L1-P6","title":"Originalaufgabe · Seite 6","page":6,"questions":[{"n":1,"text":"Moutasem fragt sich, wie er neue Kollegen korrekt ansprechen sollte.","answer":"e"},{"n":2,"text":"Selma wurde entlassen und will sich dagegen wehren.","answer":"h"},{"n":3,"text":"Anka überlegt, eine Ausbildung im Fremdsprachenbereich zu machen.","answer":"c"},{"n":4,"text":"Sean ist Professor für Biologie und sucht einen Job im internationalen Umfeld.","answer":"b"},{"n":5,"text":"Yassin möchte erste Berufserfahrungen im Ausland sammeln.","answer":"g"}],"texts":[{"letter":"a","text":"Auf ins Abenteuer!\nDu hast Lust auf Sonne, Strand und eine fremde Sprache? Eine Sprachreise ermöglicht es dir nicht nur Land und\nLeute kennenzulernen, sondern auch deine frisch erworbenen Fähigkeiten direkt anzuwenden. Wo kannst du welche\nSprachen lernen?"},{"letter":"b","text":"Deutsch-japanische Zusammenarbeit.\nJapan gilt als innovativ und hat in der Forschung in Deutschland ein hohes Ansehen. So arbeiten beide Länder zum\nBeispiel eng in der Meeresforschung und im Umweltschutz zusammen. Die Bundesrepublik fördert die\nZusammenarbeit erfahrener deutscher und japanischer Wissenschaftler."},{"letter":"c","text":"Job mit guten Zukunftsaussichten.\nWer verschiedene Sprachen fließend beherrscht und zwischen ihnen ohne Mühe hin- und herwechseln kann, ist der\ngeborene Fremdsprachenkorrespondent. In diesem Jobprofil kann er oder sie seine/ihre Leidenschaft für Sprachen\nnämlich voll und ganz ausleben."},{"letter":"d","text":"Nutzen Sie das Recht für sich!\nBaumert & Partner helfen Ihnen, Ihr Recht durchzusetzen. Im Interview geben die Experten für Familienrecht Tipps\nzu folgenden Fragen: Wie gehen Sie aus einer Scheidung als Sieger heraus? Wie können Sie sich im\nSorgerechtsstreit behaupten? Und welcher Anteil des Gehalts Ihres Expartners steht Ihnen zu?"},{"letter":"e","text":"Umgangsformen im Berufsalltag.\nGewisse Verhaltensweisen, die im privaten Kontext völlig in Ordnung sind, können auf der Arbeit zu\nunangenehmen Stolpersteinen werden. Wie kleide ich mich richtig im Büro? Duzen oder siezen? Welche Themen\nsollten Sie im Smalltalk vermeiden?"},{"letter":"f","text":"Souverän am Telefon.\nDie Begrüßung am Telefon dauert in der Regel nur zwei bis drei Sekunden, ist aber für den ersten Eindruck\nentscheidend. Die richtige Formulierung hängt davon ab, ob es sich um ein eingehendes Telefonat oder einen\naktiven Anruf handelt. Worauf sollen Sie achten?"},{"letter":"g","text":"Warum nicht mal ganz weit weg?\nDu träumst von einem Job im Ausland, dann knüpfe erste Kontakte durch ein Praktikum. Ohne großen Aufwand\nkannst du so auch deine Sprachkenntnisse perfektionieren. Aber es gibt noch mehr überzeugende Gründe für ein\nAuslandspraktikum."},{"letter":"h","text":"Zahl der Klagen rückläufig.\nSeit einigen Jahren geht die Zahl der Kündigungsschutzklagen kontinuierlich zurück, das bestätigt der Deutsche\nAnwaltsverein. Warum nur jeder Fünfte nach einer Kündigung Klage bei Gericht einreicht, warum es sich trotzdem\nfür Sie lohnen kann und wie Sie dabei vorgehen müssen, erklärt der Arbeitsrechtsexperte Lars Hansso."}]},{"id":"L1-P8","title":"Originalaufgabe · Seite 8","page":8,"questions":[{"n":1,"text":". Mariarita wurde entlassen und will sich dagegen wehren.","answer":"h"},{"n":2,"text":". Ettorina überlegt, eine Ausbildung im Fremdsprachenbereich zu machen.","answer":"c"},{"n":3,"text":". Thom ist Wissenschaftler und sucht einen Job im internationalen Umfeld.","answer":"b"},{"n":4,"text":". Baldassarre möchte erste Berufserfahrungen in verschiedenen Ländern sammeln.","answer":"g"},{"n":5,"text":". Levi fragt sich, wie er neue Kollegen korrekt ansprechen sollte.","answer":"e"}],"texts":[{"letter":"a","text":"Auf ins Abenteuer!\nDu hast Lust auf Sonne, Strand und eine fremde Sprache? Eine Sprachreise ermöglicht es dir, nicht nur Land und\nLeute kennenzulernen, sondern auch deine frisch erworbenen Fähigkeiten direkt anzuwenden. Wo kannst du welche\nSprachen lernen? mehr..."},{"letter":"b","text":"Innovativer Klimaschutz.\nDeutschland hat in der Forschung auf der ganzen Welt ein hohes Ansehen. Das Land arbeitet in den Bereichen\nUmweltschutz und Meeresbiologie eng mit anderen Ländern zusammen. So fördert die Bundesrepublik Deutschland\nAustauschprogramme zwischen internationalen Forschern. mehr ..."},{"letter":"c","text":"Job mit guten Zukunftsaussichten.\nWer verschiedene Sprachen fließend beherrscht und zwischen ihnen ohne Mühe hin- und herwechseln kann, ist der\ngeborene Fremdsprachenkorrespondent. Es gibt unterschiedliche Möglichkeiten und Wege, diesen Beruf zu erlernen\nund damit die eigene Leidenschaft für Sprachen auszuleben. mehr..."},{"letter":"d","text":"Nutzen Sie das Recht für sich!\nBaumert & Partner helfen Ihnen, Ihr Recht durchzusetzen. Im Interview geben die Experten für\nFamilienrecht Tipps zu folgenden Fragen: Wie gehen Sie aus einer Scheidung als Sieger hervor?\nWie können Sie sich im Sorgerechtsstreit behaupten? Und welcher Anteil des Gehalts Ihres\nExpartners steht Ihnen zu? mehr..."},{"letter":"e","text":"Umgangsformen im Berufsalltag.\nGewisse Verhaltensweisen, die im privaten Kontext völlig in Ordnung sind, können auf der Arbeit zu\nunangenehmen Stolpersteinen werden. Wie kleide ich mich richtig im Büro? Duzen oder siezen?\nWelche Themen sollten Sie im Smalltalk vermeiden? mehr..."},{"letter":"f","text":"Souverän am Telefon.\nDie Begrüßung am Telefon dauert in der Regel nur zwei bis drei Sekunden, ist aber für den ersten\nEindruck entscheidend. Die richtige Formulierung hängt davon ab, ob es sich um ein eingehendes\nTelefonat oder einen aktiven Anruf handelt. Worauf sollen Sie achten? mehr ..."},{"letter":"g","text":"Warum nicht mal ganz weit weg?\nDu träumst von einem Job im Ausland? Dann knüpfe erste Kontakte durch ein Praktikum. Ohne großen Aufwand\nkannst du so auch deine Sprachkenntnisse perfektionieren. Aber es gibt noch mehr\n überzeugende Gründe für ein Auslandspraktikum. mehr ..."},{"letter":"h","text":"Zahl der Klagen rückläufig.\nSeit einigen Jahren geht die Zahl der Kündigungsschutzklagen kontinuierlich zurück, das bestätigt der Deutsche\nAnwaltsverein. Warum nur jeder Fünfte nach einer Kündigung Klage bei Gericht einreicht, warum es sich trotzdem\nfür Sie lohnen kann und wie Sie dabei vorgehen müssen, erklärt der Arbeitsrechtsexperte Lars Hansson. mehr ..."}]},{"id":"L1-P9","title":"Originalaufgabe · Seite 9","page":9,"questions":[{"n":1,"text":"Junis ist gelernter KIZ-Mechatroniker und möchte eine eigene Werkstatt gründen.","answer":"d"},{"n":2,"text":"Maria arbeitet als Hilfsarbeiterin und möchte nun eine Berufsausbildung machen.","answer":"h"},{"n":3,"text":"Nikolett möchte sich nicht zwischen Familie und Arbeit entscheiden müssen.","answer":"c"},{"n":4,"text":"Amin studiert Fremdsprachen und möchte nach seinem Abschluss freiberuflich arbeiten.","answer":"e"},{"n":5,"text":"Samita soll aus betrieblichen Gründen gekündigt werden und sie möchte dagegen vorgehen.","answer":"a"}],"texts":[{"letter":"a","text":"Achtung Kündigung.\nDas Arbeitsrecht unterscheidet zwischen personenbedingter, betriebsbedingter und verhaltensbedingter Beendigung\ndes Arbeitsverhältnisses. Lesen Sie hier alle Informationen darüber, aus welchen Gründen der Arbeitgeber\nberechtigt ist zu kündigen."},{"letter":"b","text":"Automobilbranche boomt nach wie vor.\nVor allem im Südwesten Deutschlands können sich die Menschen weiterhin auf sichere und gut bezahlte\nAnstellungen in der Automobilindustrie verlassen. Warum lohnt es sich, bei einem Autobauer oder Zulieferer zu\narbeiten? Welche Berufe sind am meisten gefragt?"},{"letter":"c","text":"Firmen setzen auf flexible Arbeitsbedingungen.\nIn vielen Branchen sind Fachkräfte gefragt wie nie zuvor. Dabei haben immer mehr Firmen Schwierigkeiten, ihre\nAngestellten langfristig zu halten. Wer kann, wechselt schnell zu einem Arbeitgeber mit besseren Bedingungen.\nViele große Unternehmen setzen nun verstärkt auf Flexibilität und familienfreundliche Leistungen wie Firmen-Kita\noder Homeoffice."},{"letter":"d","text":"Förderung von Selbstständigen.\nIn den letzten Jahren ist die Zahl der Selbstständigen stetig gestiegen. Das liegt unter anderem auch an neuen\nstaatlichen Förderungsmöglichkeiten für Jungunternehmer, die ihren eigenen Betrieb aufmachen möchten."},{"letter":"e","text":"Sein eigener Chef sein!\nDu willst keine starren Arbeitszeiten, weiten Anfahrtswege und keinen nervigen Umgang mit Kollegen und Chefs?\nDann ist der Weg in die Existenzgründung eine echte Alternative. Ob als Übersetzer, Programmierer oder\nSteuerberater - Theo Geertz berät dich, wie du dein Fachwissen nutzen kannst, um zu Hause und auf eigene\nRechnung zu arbeiten."},{"letter":"f","text":"Ungelernte Arbeitskräfte weiterhin benachteiligt.\nJe höher die Qualifikation, desto besser die Chancen auf dem Arbeitsmarkt. Wer keine Berufsausbildung hat, läuft\nGefahr, in die Langzeitarbeitslosigkeit abzustürzen. Wer Arbeit hat, muss als Ungelernter mit geringerem Gehalt\nund schlechteren Aufstiegschancen rechnen."},{"letter":"g","text":"Möglichkeiten, mit einer Kündigung umzugehen.\nDu fühlst dich nach einer Kündigung gedemütigt und alleine gelassen und weißt nicht, wie es weitergehen soll? Das\nkann auch eine Chance sein, sich neu zu orientieren und vielleicht sogar die eigene Berufung zu finden."},{"letter":"h","text":"Wege und Chancen.\nDas Bundesministerium für Bildung und Forschung unterstützt bei der beruflichen Qualifizierung Es hat ein Portal\neingerichtet, um vor allem Ungelernte und Geringqualifizierte sowie Arbeitnehmer in Elternzeit über passende Aus-\nund Weiterbildungsmöglichkeiten zu informieren."}]},{"id":"L1-P10","title":"Originalaufgabe · Seite 10","page":10,"questions":[{"n":1,"text":". Lamia überlegt, ob sie im Vorstellungsgespräch ihre Schwangerschaft erwähnen muss.","answer":"b"},{"n":2,"text":". Raymond möchte im Internet einen Job finden.","answer":"h"},{"n":3,"text":". Karl will sich in der Gastronomie selbstständig machen.","answer":"g"},{"n":4,"text":". Sean ist unsicher, ob er seinen kranken Sohn mit ins Büro nehmen darf.","answer":"f"},{"n":5,"text":". Ramona interessiert sich für Jobchancen als Reiseverkehrskauffrau.","answer":"d"}],"texts":[{"letter":"a","text":"Pflegefreistellung für Mütter und Väter.\nArbeitnehmerinnen und Arbeitnehmer haben das Recht auf Freistellung am Arbeitsplatz, wenn ein im Haushalt\nlebendes Kind erkrankt und keine Betreuungsmöglichkeit vorhanden ist. Die Freistellung ist pro Arbeitsjahr\nbegrenzt. In der Probezeit sollte man damit vorsichtig sein, da hier andere Kündigungsfristen gelten."},{"letter":"b","text":"Tipps für Frauen im Beruf.\nFrauen verkaufen sich oft unter Wert. Es ist besonders wichtig, dass Sie ausreichend über Ihre Rechte im\nBerufsleben informiert sind. Unsere Expertin für Arbeitsrecht gibt Tipps für Gehaltsverhandlungen und ein\nselbstbewusstes Auftreten.\nAußerdem informiert sie darüber, was Sie in einem Bewerbungsgespräch nicht erzählen müssen."},{"letter":"c","text":"Damit sich der Aufwand lohnt.\nStellenangebote online zu schalten, kann für Unternehmen schnell sehr kostspielig werden. Nicht nur die\nBekanntheit der Webseite ist dafür entscheidend, sondern auch die regionale Reichweite und der Grad der\nSpezialisierung."},{"letter":"d","text":"Der Bundesverband der Tourismusbranche informiert.\nTrotz anhaltend großer Nachfrage von Seiten der Arbeitgeber ist die Zahl der Bewerbungen rückläufig. Auch auf\ndem Ausbildungsmarkt fehlt es an jungen Menschen, die sich für dieses Arbeitsfeld interessieren. Offene Stellen\nwerden demzufolge zügig besetzt."},{"letter":"e","text":"Informationen rund um den Mutterschutz.\nFrauen dürfen nach dem Mutterschutzgesetz während einer Schwangerschaft und bis zu vier Monate nach der\nGeburt nicht gekündigt werden. Voraussetzung hierfür ist jedoch, dass der Arbeitgeber zum Zeitpunkt der\nKündigung von der Schwangerschaft wusste."},{"letter":"f","text":"Rechte berufstätiger Eltern.\nEltern haben keinen Rechtsanspruch darauf, ihre Kinder am Arbeitsplatz zu betreuen. Die Entscheidung unterliegt\nder Zustimmung des Arbeitgebers und viele sind damit einverstanden, wenn sich so vermeiden lässt, dass sich die\nEltern krankschreiben lassen. Arbeitsplätze, bei denen die Sicherheit des Kindes gefährdet ist, sind von dieser\nRegelung ausgeschlossen."},{"letter":"g","text":"Vom Traum zur Realität.\nAls angehender Gründer brauchen Sie nicht nur Branchenkenntnisse, sondern auch Wissen über\nbetriebswirtschaftliche Vorgänge. Vom Businessplan und der richtigen Finanzierung über vernünftige\nPersonalplanung bis hin zur Einholung der notwendigen Lizenzen kommen nun viele Dinge auf Sie zu."},{"letter":"h","text":"Die richtige Wahl spart Zeit und Frust.\nJe Suche nach einer neuen Stelle ist extrem zeitaufwendig. Im Internet erscheint das Angebot an offenen Stellen\nriesig, dennoch bleibt der Erfolge oft aus. Eine der wichtigsten Voraussetzungen ist es also, Jobangebote richtig zu\nfiltern, um ohne großen Zeitaufwand die richtige Anzeige zu finden."}]},{"id":"L1-P12","title":"Originalaufgabe · Seite 12","page":12,"questions":[{"n":1,"text":". Laura möchte während des Studiums Berufserfahrung sammeln.","answer":"e"},{"n":2,"text":". Igor hat Familie und möchte im europäischen Ausland arbeiten.","answer":"h"},{"n":3,"text":". Jens interessiert sich für das Thema Umweltschutz in Unternehmen.","answer":"b"},{"n":4,"text":". Jasmin hat Probleme mit ihren Kollegen und braucht Hilfe.","answer":"d"},{"n":5,"text":". Somayeh ist Architektin und möchte ihr eigenes Architekturbüro eröffnen.","answer":"a"}],"texts":[{"letter":"a","text":"Erfolgreich neue Wege gehen.\nDas Buch „Mit Erfolg durchstarten\" von Dr. Vera Baumgart richtet sich vor allem an Akademikerinnen, die\nerfolgreich ein eigenes Unternehmen aufbauen wollen. Egal ob Sie sich in der Immobilienbranche, im Bauwesen\noder im Gesundheitsbereich selbstständig machen, die Autorin hat Antworten auf alle wichtigen Fragen."},{"letter":"b","text":"Ein grüner Arbeitsplatz.\nDie Firma Heller aus Rostock will mit gutem Beispiel vorangehen und behauptet: „Klimafreundliche Energie und\nMüllvermeidung werden bei uns ganz großgeschrieben\". Aber geht das bei einer Transport- und Logistikfirma\nüberhaupt? Die Antwort ist ein klares „Ja\". Alle Details heute um 19:30 Uhr bei Neo TV."},{"letter":"c","text":"Verändertes Kaufverhalten.\nNeuesten Statistiken zufolge greifen Verbraucher in vielen Ländern der Europäischen Union immer mehr zu\nregionalen und ökologisch angebauten Lebensmitteln. Auch in deutschen Haushalten wird viel Wert auf gesunde\nErnährung gelegt. Die Nachfrage nach Bioprodukten ist in den letzten Jahren stetig angestiegen."},{"letter":"d","text":"Jetzt im Buchhandel.\nIn seinem neuen Bestseller beschreibt Georg Könitz auf eindrucksvolle Weise, wie er von seinem ständig schlecht\ngelaunten Chef und zwei Mitarbeitern in seinem Team schikaniert, ausgegrenzt und lächerlich gemacht wurde - und\nwie es ihm schließlich gelang, diesen Teufelskreis zu durchbrechen. Von seinen Erfahrungen können alle, die\nÄhnliches erleben, profitieren."},{"letter":"e","text":"Der richtige Praktikumsplatz.\nEin Praktikum bietet tolle Möglichkeiten, den Berufsalltag kennenzulernen. Viele Praktikanten sind aber enttäuscht,\ndass sie nur Hilfsarbeiten verrichten dürfen und dafür schlecht oder gar nicht bezahlt werden. Auf dem Portaldein-\npraktikum.de findest du jetzt aktuelle Infos und interessante Praktikumsstellen in ganz Deutschland."},{"letter":"f","text":"Eine Erfolgsgeschichte.\nDie Bilanz von Rita Jäger (34): Zwei abgebrochene Lehren und zahllose Hilfsjobs. Dann kam Tochter Samantha\nund Rita musste Verantwortung übernehmen. Im Interview erzählt sie, wie sie in einem Friseursalon die Chance\nbekam, ein Praktikum und anschließend eine Ausbildung zu machen. Nun hat sie ihren eigenen Salon eröffnet."},{"letter":"g","text":"Immobilienunternehmen expandiert.\nDie Frankfurter ImmobilienfirmaImmoInvest expandiert nach Süd- und Osteuropa. In den letzten Jahren hat das\nUnternehmen hohe Gewinne erwirtschaftet und plant nun, außerhalb Deutschlands mehrere Niederlassungen zu\ngründen. Über die Erfolgsgeschichte des Unternehmens berichtet der Geschäftsführer Herbert Grünberg in unserem\nInterview."},{"letter":"h","text":"Neue Broschüre.\nSie überlegen, Ihren Lebensmittelpunkt in ein anderes Land zu verlegen? Ein Neuanfang ist eine große Chance, aber\nimmer auch eine Herausforderung – besonders für den Partner oder die Partnerin und die Kinder. Unsere neue\nBroschüre bietet ausführliche Informationen und Hilfestellungen zum Leben und Arbeiten in der EU."}]},{"id":"L1-P13","title":"Originalaufgabe · Seite 13","page":13,"questions":[{"n":1,"text":"Yasmina sucht nach dem Realschulabschluss einen Beruf mit guten Perspektiven.","answer":"d"},{"n":2,"text":"Jason überlegt, ob er bei einem neu gegründeten Unternehmen arbeiten soll.","answer":"h"},{"n":3,"text":"Hannah wird von ihren Kollegen schlecht behandelt und sucht Hilfe.","answer":"a"},{"n":4,"text":"Gacer fragt sich, ob sie Fortbildungen besuchen muss.","answer":"g"},{"n":5,"text":"Assem braucht Informationen zur Meisterprüfung.","answer":"e"}],"texts":[{"letter":"a","text":"Hilfe für Betroffene.\nBeleidigungen, Ausgrenzung, versteckte Drohungen - am Arbeitsplatz ist Mobbing leider weit verbreitet. Für viele\nAngestellte ist der Arbeitsalltag oft mit Angst verbunden. Das führt schnell zu gesundheitlichen und psychischen\nProblemen. Inzwischen gibt es zahlreiche Coaching-Programme für Mitarbeiter, die Strategien aufzeigen, wie man\nmit solchen Situationen besser umgehen kann."},{"letter":"b","text":"Ein starkes Team.\nPünktlich zum Start der Weltmeisterschaft präsentiert der Handballbund seine neue Vertragspartnerin, die deutsche\nHandwerkskammer. Wie passt das zusammen? „Ganz einfach\", so der Sprecher des Handballbundes. „Was für den\nHandballer die Weltmeisterschaft ist, ist für den Handwerker die Meisterprüfung.\""},{"letter":"c","text":"Deutsche sind risikoscheu.\nIn Deutschland ist die Zahl der Unternehmensgründungen stark rückläufig, obwohl insbesondere viele jüngere\nMenschen angeben, dass sie sich gerne selbständig machen würden. Warum der Sprung in die Selbstständigkeit oft\ndoch nicht klappt, hat vielerlei Gründe. Während Frauen häufig das finanzielle Risiko scheuen, fürchten Männer den\nKarriereknick."},{"letter":"d","text":"Handwerk und Karriere - passt das?\nFleischer, Klempner, Tischler - laut der Bundesagentur für Arbeit werden bei uns ca. 150.000 Handwerker gesucht.\nDoch viele Stellen bleiben unbesetzt. Dabei bieten Handwerksberufe gerade jungen Leuten die allerbesten Chancen\nfür eine erfolgreiche Karriere. Fachkräfte brauchen sich um ihre Zukunft nicht zu sorgen."},{"letter":"e","text":"Stressfrei zum Ziel.\nAuch Fortbildungen können für eine Meisterprüfung im Handwerk anerkannt werden. Wenn Sie z B. als Kfz-\nServicetechniker einen Kurs in Elektronik erfolgreich absolviert haben, wird dieser Teil nicht noch einmal gesondert\ngeprüft. Die Interessengemeinschaft „Das Handwerk\" hat die wichtigsten Zulassungsvoraussetzungen zur\nMeisterprüfung zusammengefasst."},{"letter":"f","text":"Nie wieder Opfer.\nSie wurde in ihrer Firma gemobbt und konnte es ihrem Chef nicht nachweisen. Aber die Atmosphäre verschlechterte\nsich zusehends. Die Arbeit wurde jeden Tag mehr zur Qual. Die Autorin Stephanie Hauser verarbeitet in ihrem\nRoman „Nie wieder Opfer\" auf eindrucksvolle Weise ihre eigenen Erfahrungen zum Thema „Mobbing\"."},{"letter":"g","text":"Verpflichtend oder freiwillig.\nDie Anforderungen der Berufswelt ändern sich rasant und somit entsteht auch die Notwendigkeit für die\nBelegschaft, sich kontinuierlich weiterzubilden. Prinzipiell gilt, dass Mitarbeiter zur Teilnahme an Seminaren\nverpflichtet sind, wenn diese zur Ausübung ihrer Tätigkeit notwendig sind und in der normalen Arbeitszeit\nstattfinden."},{"letter":"h","text":"Karriereplan für eine vielversprechende Laufbahn.\nVor allem in Großstädten bieten immer mehr junge Unternehmen interessante Jobmöglichkeiten. Dennoch setzen\ndie meisten Uniabsolventen nach wie vor auf große Konzerne, von denen sie sich eher Sicherheit und\nvielversprechende Karrierechancen erhoffen. Doch das können sie auch bei jungen Start-up-Unternehmen finden."}]},{"id":"L1-P14","title":"Originalaufgabe · Seite 14","page":14,"questions":[{"n":1,"text":". Silvie ist gelernte Verkäuferin und möchte in ihrem Job aufsteigen.","answer":"c"},{"n":2,"text":". Brian sucht Computerkurse, die er von zu Hause aus machen kann.","answer":"h"},{"n":3,"text":". Carl ist Umwelttechniker und möchte seine eigene Beratungsagentur gründen.","answer":"b"},{"n":4,"text":". Mira ist unsicher, wie es nach ihrem Arbeitsplatzverlust weitergehen soll.","answer":"e"},{"n":5,"text":". Karim sucht einen Ausbildungsplatz in einer sicheren Branche.","answer":"a"}],"texts":[{"letter":"a","text":"Die Lebensmittelbranche boomt.\nDer Einzelhandel ist einer der größten und umsatzstärksten Wirtschaftszweige national und international. Es werden\ndort ständig qualifizierte Mitarbeiter gesucht. Allein in Hessen werden jährlich 160.000 junge Menschen\nausgebildet. Der Einzelhandel ist außerdem krisenfest, denn gegessen wird immer."},{"letter":"b","text":"Aus Fehlern anderer lernen.\nViele Unternehmer machen zu Beginn ihrer Selbstständigkeit ähnliche Fehler. Heute weiß man, dass ein\ndurchdachter Businessplan und eine genaue Konkurenzanalyse unverzichtbar sind. Worauf es noch ankommt,\nerfährst du in den Tipps des Erfolgscoachs Gregor Daub."},{"letter":"c","text":"Chancen im Einzelhandel.\nDie FOOD Unternehmensgruppe betreibt Supermärkte in zehn Ländern Europas. Der Branchenriese möchte weiter\nexpandieren und hat gerade die Filialen der Jennings GmbH übernommen. Erfahrene Mitarbeiter finden dort\ninteressante Möglichkeiten zur beruflichen Weiterentwicklung."},{"letter":"d","text":"Gute Nachrichten für gekündigte Mitarbeiter.\nDie Tankstellenkette Fairtank hat Bankrott angekündigt und schließt zum 31. März ihre 25 Filialen in Brandenburg.\nRund 100 Mitarbeiter sind betroffen und suchen nun einen neuen Job. Für einige von ihnen gibt es eine Lösung:\nTankstellen in der Umgebung haben ihre Unterstützung zugesagt und versprochen, Mitarbeiter von Fairtank zu\nübernehmen."},{"letter":"e","text":"Was nun?\nEgal, ob die ganze Firma pleitegeht, eine Abteilung dichtmacht oder nur der eigene Job weg ist, eine Entlassung ist\nimmer ein Schock. Arbeitsmarktexpertin Caroline Cuyper erklärt, was man als Angestellter tun muss, um möglichst\nschnell eine neue Stelle zu bekommen."},{"letter":"f","text":"Neue Kursreihe bei Arcadio.\nAb sofort bietet das Institut Arcadio neben seinen Computerkursen für Senioren auch Weiterbildungen für\nTeilnehmer mit geringen Deutschkenntnissen an. Das Besondere daran: Die Dozenten verwenden eine einfache\nSprache. Was hinter diesem innovativen Konzept steht, erzählt der Institutsgründer Benjamin von Adler im\nInterview."},{"letter":"g","text":"Wenn die Mitarbeiter kündigen.\nImmer mehr Mitarbeiter kündigen und verlassen ihre Firma. Und zwar selbst dann, wenn sie mehr Gehalt\nbekommen als bei der Konkurrenz. Die Unternehmensberatung Schindler hat die häufigsten Gründe analysiert,\nwarum sich Angestellte entscheiden, ihren Job zu wechseln."},{"letter":"h","text":"Bildung im neuen Zeitalter.\nSchneller technologischer Fortschritt, Globalisierung und Veränderungen auf dem Arbeitsmarkt haben dazu geführt,\ndass Fortbildungen im Beruf eine immer wichtigere Rolle spielen. Zunehmend werden Online-Kurse und Webinare\nam Computer angeboten, die den Teilnehmern maximale Flexibilität versprechen. Wo findet man passende\nFortbildungen ?"}]},{"id":"L1-P15","title":"Originalaufgabe · Seite 15","page":15,"questions":[{"n":1,"text":"Kurt sucht einen Job und braucht Anregungen für seine Unterlagen.","answer":"c"},{"n":2,"text":"Juliette arbeitet gerne, fühlt sich aber oft erschöpft.","answer":"g"},{"n":3,"text":"Peter ist vor seinem Start im neuen Unternehmen nervös.","answer":"e"},{"n":4,"text":"Katharina ist wegen des niedrigen Verdienstes in ihrer Branche frustriert.","answer":"f"},{"n":5,"text":"Carlos braucht Tipps für seine Tätigkeit im Homeoffice.","answer":"b"}],"texts":[{"letter":"a","text":"Den Arbeitsplatz produktiv gestalten.\nDie richtige Atmosphäre am Arbeitsplatz ist für die effektive Erledigung der Aufgaben unerlässlich.\nGerlinde Strauß beschreibt, wie man mit den richtigen Möbeln, Dekoartikeln, Licht, Ordnung am Arbeitsplatz und\nvielem mehr die eigene Umgebung so gestaltet, dass man die Zeit am Arbeitsplatz gerne und erfolgreich verbringt."},{"letter":"b","text":"Ohne Selbstdisziplin geht es nicht.\nDie Arbeit von zu Hause aus erfordert ein hohes Maß an Selbstdisziplin und die Fähigkeit des\nSelbstmanagements. Privates und Arbeit sollten strikt getrennt werden. Doch wie funktioniert das am besten?\nHelga Brinkmann hat einen Ratgeber für Arbeitskräfte herausgegeben, deren Unternehmen diese Form der Arbeit\nanbieten."},{"letter":"c","text":"Hobbys im Lebenslauf richtig einsetzen.\nAusbildung und Qualifikation sind in erster Linie wichtig, wenn man den Lebenslauf eines Bewerbers liest. Doch\nauch, welche Hobbys eine Person hat, kann Auskunft darüber geben, ob sie zum Unternehmen passt oder nicht.\nLesen Sie hier wichtige Tipps und Tricks für eine überzeugende Bewerbung."},{"letter":"d","text":"Was unsere Körpersprache über uns verrät.\nOb beim Vorstellungsgespräch, bei wichtigen Verhandlungen mit Kunden oder am ersten Arbeitstag - unsere\nKörpersprache gibt immer Auskunft darüber, wie wir uns gerade fühlen, z. B. angespannt oder selbstsicher.\nLernen Sie in unserem Seminar, wie Sie Körpersprache wirksam einsetzen und wie Sie Ihr Gegenüber\neinschätzen können."},{"letter":"e","text":"Der erste Arbeitstag in der neuen Firma.\nSo klappt es mit den Kolleginnen. Anspannung ist ganz normal: Beim Start im neuen Job ist es wichtig, gut\nvorbereitet zu sein. Im folgenden Artikel von Irene Miller finden Sie eine Checkliste mit den wichtigsten Punkten,\ndie Sie beachten sollten, damit der Einstieg gelingt."},{"letter":"f","text":"Angemessene Bezahlung?\nJeder möchte für seine Leistung fair bezahlt werden. Doch in vielen Berufsfeldern haben die\nArbeitnehmer das Gefühl, unterbezahlt zu sein. Die Folge davon sind Motivationsverlust und Zweifel daran, ob\nman wirklich den richtigen Beruf gewählt hat. Lesen Sie hier, wie Sie erfolgreich Gehaltsverhandlungen führen."},{"letter":"g","text":"Körperliche Folgen von Stress.\nNicht jeder Stress macht krank. Es gibt auch positiven Stress, der die Leistungsfähigkeit eines\nMenschen erhöht. Wer aber unter Daueranspannung steht und körperliche Symptome wie Bluthochdruck.\nMagenbeschwerden oder eine anhaltende innere Anspannung spürt, muss etwas ändern. Wie, das erfahren Sie im\nneusten Buch von Harald Erhard."},{"letter":"h","text":"Frauen verdienen immer noch zu wenig.\nEuropaweit ist das Ziel der Gleichstellung noch längst nicht erreicht. Man denke hier nur an die nach wie vor\nungleiche Bezahlung von Männern und Frauen und an die Besetzung von Stellen in der Führungsetage.\nDeutschland liegt bei diesem Vergleich noch immer auf einem der letzten Plätze."}]},{"id":"L1-P16","title":"Originalaufgabe · Seite 16","page":16,"questions":[{"n":1,"text":". Barbara braucht beruflich Grundkenntnisse in Spanisch.","answer":"f"},{"n":2,"text":". Frank denkt, dass sein Gehalt nicht branchenüblich ist.","answer":"d"},{"n":3,"text":". Petra fühlt sich am Arbeitsplatz gemobbt.","answer":"g"},{"n":4,"text":". Sandra möchte im Ausland berufliche Erfahrungen sammeln.","answer":"h"},{"n":5,"text":". Felix möchte sich beruflich verändern.","answer":"b"}],"texts":[{"letter":"a","text":"Internationale Fachkräfte gesucht\nIm Ausland zu arbeiten, kann eine hervorragende Chance fur Menschen in aller Welt sein. Erfahren Sie als\nArbeitgeber, mit welchen Strategien Sie dringend benötigte Arbeitskräfte aus dem Ausland für sich gewinnen, um\nlhr Unternehmen wettbewerbsfahiger zu machen."},{"letter":"b","text":"Auf zu neuen Ufern!\nIm Job ist es nie zu spät, mit etwas Neuem zu beginnen, um sich weiterzuentwickeln. Manchmal fehlen nur ein\nbisschen Mut und Unterstützung. Oder man weiß erst gar nicht, welche Möglichkeiten es gibt. Eine gute Beratung\nist darum wichtig. Wo Sie die bekommen, erfahren Sie hier."},{"letter":"c","text":"Zufriedene Mitarbeiter\nViele Firmen überlegen, wie sie ihren Angestellten das Arbeitsleben abwechslungsreicher gestalten können.\nManche schicken ihre Mitarbeitenden auf Dienstreisen ins Ausland, andere finanzieren ihnen Sprachkurse oder\nverteilen großzügig Prämien. Was noch möglich ist und wie sich das steuerlich auswirkt, erklärt der Steuerberater\nMichael Hahne."},{"letter":"d","text":"Dschungel in der Arbeitswelt\nWie viel Urlaub steht einem zu? Wie viel sollte man in seinem Beruf verdienen? Wie viele Stunden arbeitet man\nüblicherweise? Bekommt man einen Zuschuss für Sprachkurse? Mit vielen gesetzlichen Dingen muss man sich\nauskennen, wenn man im Arbeitsleben steht. Die wichtigsten Informationen finden Sie hier zusammengefasst."},{"letter":"e","text":"Chefsache\nEin erfolgreiches Unternehmen gibt es nur mit einem motivierten Team. Aber wie motiviert man seine\nMitarbeiter? Hören Sie ihnen aufmerksam zu! Kontrollieren Sie nicht jeden Arbeitsschritt, sondern delegieren Sie!\nNehmen Sie Mobbing ernst! Zahlen Sie faire Gehälter! Diese und noch viele andere Ratschläge lesen Sie hier."},{"letter":"f","text":"Vielseitig qualifiziert!\nVon Arbeitnehmer*innen wird immer mehr verlangt. Nicht nur die aktuellen fachlichen Kenntnisse und die\nsouveräne Arbeit mit dem PC sind eine Selbstverständlichkeit,sondern auch die sprachlichen Kompetenzen werden\nimmer wichtiger. Hier findet jeder den richtigen Kurs für sich, von Englisch über Japanisch bis Suaheli."},{"letter":"g","text":"Lassen Sie sich von Kolleg*innen den Arbeitsalltag nicht schwermachen\nSie erfahren von der Sitzung zuletzt? In der Kantine sitzen Sie allein? Es passiert immer häufiger in deutschen\nUnternehmen, dass manche Kollegen anderen das Leben aus unklaren Gründen schwermachen. Lesen Sie in\ndiesem Ratgeber, wo Sie Hilfe bekommen können."},{"letter":"h","text":"Den Horizont erweitern\nManche zieht die Liebe in ein anderes Land. Andere sehen dort interessantere berufliche Möglichkeiten.\nManchmal ist das die reine Abenteuerlust. Auslandsaufenthalte können"}]}],"lesen2":[{"id":"L2-P17","title":"Originalaufgabe · Seite 17","page":17,"body":"Lesen Teil 2\nText 1 (\nWillkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\nZugangskontrolle und Zeiterfassung\nAls Mitarbeiterinnen und Mitarbeiter erhalten Sie zu Beginn Ihres Arbeitsverhältnisses einen Firmenausweis mit\nChip-Karte. Dieser berechtigt zum Zugang in das Unternehmensgebäude und dient gleichzeitig zur Erfassung der\nArbeitszeit. Außerdem können Sie mit Ihrem Firmenausweis in der Kantine und am Getränkeautomaten bezahlen\nund das hauseigene Fitnessstudio benutzen.\nNeben den Aufzügen im Erdgeschoss finden Sie ein digitales Zeiterfassungsgerät. Bitte halten Sie beim Betreten\nund Verlassen des Gebäudes Ihren Firmenausweis an die blau markierte Fläche und vergewissern Sie sich, dass die\nZeit des Arbeitsbeginns und Arbeitsendes richtig erfasst wurde. Dies erkennen Sie anhand der Anzeige des Geräts,\ndie Ihnen Ihre monatliche Arbeitszeit anzeigt.\nDie Zeiterfassung berechnet automatisch die reguläre Arbeitszeit sowie eventuelle Über- als auch Minusstunden.\nDie Personalabteilung richtet Ihnen einen Zugang zu unserem Arbeitskontensystem PersoTime ein. Damit können\nSie im Intranet Ihr Arbeitszeitkonto jederzeit einsehen.","questions":[{"n":6,"text":"Der Firmenausweis hat neben der Arbeitszeiterfassung auch andere Funktionen. Richtig / falsch","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"type":"tf","answer":"r"},{"n":7,"text":"Überstunden","options":[{"key":"a","text":"können online eingesehen werden."},{"key":"b","text":"sind in der Firma grundsätzlich nicht erlaubt."},{"key":"c","text":"werden von der Zeiterfassung nicht registriert."}],"type":"mcq","answer":"a"}]},{"id":"L2-P18","title":"Originalaufgabe · Seite 18","page":18,"body":"Lesen Teil 2\nText 1 (\nWillkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\nArbeitszeit\nIn unserem Unternehmen arbeiten wir nach dem Gleitzeitsystem. Die Kernarbeitszeit ist Montag bis Freitag\nzwischen 9.00 Uhr und 15.30 Uhr. In dieser Zeit müssen alle Mitarbeitenden anwesend sein. Jede Abwesenheit\nwährend dieser Zeit muss genehmigt sein.\nDie tägliche Rahmenarbeitszeit ist von 6.00 Uhr bis 19.30 Uhr. Bitte beachten Sie, dass innerhalb dieses\nZeitrahmens maximal acht, in Ausnahmefällen zehn, Stunden täglich gearbeitet werden darf.\nAlle Mitarbeitenden müssen beim Betreten und Verlassen des Gebäudes mit der Zeiterfassungskarte am Lesegerät\nein- und ausstechen. So wird die tägliche Arbeitszeit auf dem Zeitkonto festgehalten. Dieses kann jederzeit am\nLesegerät eingesehen werden.\nBei entsprechendem Guthaben kann einmal pro Monat ein ganzer Arbeitstag (acht Stunden) als Gleitzeittag\ngenommen werden. Zu berücksichtigen ist, dass ein Minuskontostand im Folgemonat auszugleichen ist. Zusätzlich\nkönnen im Monat Dezember bis zu vier Arbeitstage als Gleitzeittage genommen werden, um sie zwischen\nWeihnachten und Neujahr zu nutzen, wenn das Arbeitszeitkonto ein ausreichendes Guthaben aufweist.","questions":[{"n":6,"text":"Bei Gleitzeit können Mitarbeitende täglich beliebig viele Stunden arbeiten. Richtig / falsch","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"type":"tf","answer":"f"},{"n":7,"text":"Durch Gleitzeit ist es den Mitarbeitenden möglich,","options":[{"key":"a","text":"ein Stundenguthaben aufzubauen."},{"key":"b","text":"jeden Monat einige Tage freizunehmen."},{"key":"c","text":"täglich mehr als acht Stunden zu arbeiten. Arbeitszeit Die wöchentliche Arbeitszeit beträgt 40 Stunden - bei einem Arbeitstag von acht Stunden, wobei die Pausen nicht mitgerechnet werden. Es gilt die Fünf-Tage-Woche. Betriebsbedingt ist es möglich, dass Sie bis zu zehn Stunden pro Tag arbeiten. Diese Mehrarbeit ist aber nur in Ausnahmefällen erlaubt und muss innerhalb von sechs Monaten durch entsprechend kürzerer Arbeitstage ausgeglichen werden. Wir haben flexible Arbeitszeiten. Sie können selbst bestimmen, wann Sie morgens anfangen zu arbeiten und wann Sie aufhören. Zwischen 10 und 15 Uhr, in der sogenannten Kernzeit, müssen Sie jedoch anwesend sein. Gleitzeiten sind zwischen 8 und 10 Uhr und 15 und 17 Uhr. Innerhalb dieser Zeiten können Sie anfangen bzw. aufhören zu arbeiten. Aus betrieblichen Gründen kann der Arbeitgeber die Gleitzeit für eine gewisse Zeit aussetzen. Unser elektronisches Zeiterfassungssystem registriert täglich die Zahl der von Ihnen geleisteten Arbeitsstunden auf Ihrem persönlichen Arbeitszeitkonto. Haben Sie in einer Woche mehr als 40 Stunden gearbeitet, sollten Ihre Überstunden bereits vor Monatsende durch weniger Arbeit abgebaut werden. Wenn ein Abbau nicht möglich ist, wird mit der Geschäftsführung eine rasche Lösung besprochen."}],"type":"mcq","answer":"a"}]},{"id":"L2-P19","title":"Originalaufgabe · Seite 19","page":19,"body":"Lesen Teil 2\nText 1 (\nWillkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\nUrlaub\nJedem Mitarbeiter und jeder Mitarbeiterin in unserem Unternehmen stehen je nach Betriebszugehörigkeit bis zu 26\nTage Urlaub zu.\nDer Urlaub sollte nach Möglichkeit innerhalb des laufenden Kalenderjahres genommen werden. In Ausnahmefällen\nkann diese Frist bis zum 31.3. des Folgejahres verlängert werden.\nGrundsätzlich besteht der volle Urlaubsanspruch erst nach Ablauf der sechsmonatigen Probezeit. Ein anteiliger\nUrlaub ist jedoch nach Rücksprache auch bereits während dieser Zeit möglich.\nUrlaubsanträge für das folgende Kalenderjahr sind spätestens bis zum 15.11. mittels des dafür vorgesehenen\nFormulars beim Abteilungsleiter bzw. seiner Vertretung einzureichen. Den Urlaubswünschen der einzelnen\nMitarbeiter wird entsprochen, sofern diese mit den Betriebsabläufen vereinbar sind. Sollten sich die beantragten\nUrlaubszeiten einzelner Kollegen und Kolleginnen überschneiden, wird nach sozialen Aspekten entschieden.\nDer Abteilungsleiter prüft alle Urlaubsanträge unverzüglich. Sollten die Wünsche der Mitarbeiter unvereinbar sein,\nwird der Betriebsrat mit dem Ziel der Einigung hinzugezogen.","questions":[{"n":6,"text":"Im ersten halben Jahr nach Neueinstellung ist kein Urlaub möglich. Richtig / falsch","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"type":"tf","answer":"f"},{"n":7,"text":"Urlaubsanträge müssen","options":[{"key":"a","text":"durch den Betriebsrat genehmigt werden."},{"key":"b","text":"in jedem Fall bewilligt werden."},{"key":"c","text":"rechtzeitig im Vorjahr gestellt werden. Lesen Teil 2 Text 1 ( Willkommensmappe für neue Mitarbeiterinnen und Mitarbeiter Regelungen am Arbeitsplatz Es ist wichtig, dass auf dem Betriebsgelände der AKO.KG alle Maßnahmen eingehalten werden, damit Sie sich selbst und andere nicht gefährden. Bei der Bedienung der Maschinen sind die jeweiligen Sicherheitsbestimmungen zu befolgen, angepasst an die neuen Richtlinien laut Arbeitsschutzgesetz vom Januar dieses Jahres. Die Sicherheitsbestimmungen finden Sie in der Anlage zu dieser Willkommensmappe und zusammengefasst auch auf Informationsblättern an den Maschinen. Sollten Sie hierzu Fragen haben, setzen Sie sich bitte mit unserer Sicherheitsbeauftragten Frau Scholz, Zimmer 122, Durchwahl - 308, in Verbindung. Dies ist auch die Kontaktstelle für alle Störungen, Unfälle, Brand oder bei für Sie unklaren Situationen. In diesen Fällen kontaktieren Sie bitte auch immer den Empfang, Durchwahl -100. Nach Verlassen der Werkstätten sind diese immer ordnungsgemäß abzuschließen, damit sich kein Unbefugter den Anlagen und Maschinen nähern kann. Der Arbeitsplatz muss sauber gehalten werden, damit umherliegender Unrat nicht zu einer Gefahrenquelle werden kann. Achten Sie dabei bitte auch auf die vorgeschriebene Trennung der Abfälle in die hierfür vorgesehenen Container im Hof. Auf dem gesamten Betriebsgelände ist Filmen und Fotografieren sowie der Konsum von Alkohol und Zigarettenkonsum nicht gestattet."}],"type":"mcq","answer":"c"}]},{"id":"L2-P20","title":"Originalaufgabe · Seite 20","page":20,"body":"Lesen Teil 2\nText 1 (\nWillkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\nBetriebssport\nSportliche Aktivitäten werden bei uns großgeschrieben. So bieten wir unseren Mitarbeitern im\nUntergeschoss einen Fitnessraum mit Bodenmatten und mehreren Fitnessgeräten, wie z B. zwei Indoor-\nFahrradtrainern. Dieser ist für alle ganztägig frei und ohne Gebühr zugänglich und kann\nselbstverständlich auch in den Pausen genutzt werden.\nAußerdem nehmen wir als Unternehmen jedes Jahr am städtischen Firmenlauf teil. Es hat sich die\nTradition entwickelt, dass sich die teilnehmenden Kolleginnen und Kollegen gemeinsam in einem\nwöchentlichen Lauftreff auf dieses Event vorbereiten.\nDieser findet jeden Mittwoch um 17:30 Uhr statt.\nAbwechslungsreich gestaltete Arbeitsplätze in den Büros tragen zur Steigerung der Aktivität auch\nwährend der Arbeit bei und wirken den negativen Auswirkungen langen Sitzens entgegen. Alle\nSchreibtische sind höhenverstellbar, sodass Arbeiten auch im Stehen möglich ist.\nZusätzlich bieten wir das sogenannte „Deskbike\" an - eine Art Büro-Fahrrad, das sich einfach unter einen\nhöhenverstellbaren Schreibtisch rollen lässt. Damit möchten wir Ihnen die Möglichkeit bieten, Ihre\nGesundheit zu stärken. Nicht zuletzt macht Bewegung auch einfach Spaß.\n6 Der Fitnessraum ist während der Arbeitszeit geöffnet.\nRichtig / falsch\n7 Die Mitarbeiter\na) erhalten einen Zuschuss für ein Deskbike.\nb) haben teilweise spezielle Schreibtischen Stehhöhe.\nc) können das hausinterne Fitnessstudio gratis nutzen.\nText 1 (","questions":[{"n":6,"text":"Der Fitnessraum ist während der Arbeitszeit geöffnet. Richtig / falsch","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"type":"tf","answer":"r"},{"n":7,"text":"Die Mitarbeiter","options":[{"key":"a","text":"haben teilweise spezielle Schreibtische in Stehhöhe."},{"key":"b","text":"können das hausinterne Fitnessstudio gratis nutzen."},{"key":"c","text":"erhalten einen Zuschuss für ein Deskbike."}],"type":"mcq","answer":"b"}]},{"id":"L2-P21","title":"Originalaufgabe · Seite 21","page":21,"body":"Lesen Teil 2\nText 1 (\nWillkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\nEinführungstag\nUnsere Personalreferentin führt mehrmals jährlich einen Einführungstag für unsere neuen Mitarbeiterinnen und\nMitarbeiter durch, an dem diese mit unterschiedlichen Arbeitsbereichen sowie den rechtlichen und organisatorischen\nProzessen vertraut gemacht werden. Wir möchten darauf hinweisen, dass die Teilnahme an einer solchen\nInformationsveranstaltung verpflichtend ist. Am Einführungstag besteht außerdem die Möglichkeit, Kolleginnen\nund Kollegen aus anderen Abteilungen kennenzulernen. Die Abteilungsleiter werden bei dieser Gelegenheit in\nkurzen Worten einen Einblick in den Tätigkeitsbereich ihrer Teams geben.\nDa unser Unternehmen in einem hochsensiblen Bereich arbeitet, haben wir für unser gesamtes Gebäude ein\nkomplexes Sicherheitssystem. Auch dieses stellen wir Ihnen im Rahmen des Orientierungstages im Detail vor.\nWeitere Einzelheiten zu diesem Tag, wie den Treffpunkt und den Ablauf, finden Sie in dieser Mappe. Eine\ngesonderte Anmeldung ist nicht erforderlich.\nFür Rückfragen zum Einführungstag steht die Personalabteilung gerne zur Verfügung.","questions":[{"n":6,"text":"Alle Mitarbeiter ( Mitarbeitende) müssen ein paar Mal pro Jahr am Einführungstag (einer Informationsveranstaltung) teilnehmen. Richtig / falsch","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"type":"tf","answer":"f"},{"n":7,"text":"Am Einführungstag","type":"mcq","answer":"c","options":[{"key":"a","text":"müssen sich die Teilnehmenden in der Personalabteilung melden."},{"key":"b","text":"stellt ein Abteilungsleiter alle Kolleginnen und Kollegen vor."},{"key":"c","text":"werden neue Mitarbeitende in die Sicherheitsregeln im Unternehmen eingeführt."}]}]},{"id":"L2-P22","title":"Originalaufgabe · Seite 22","page":22,"body":"Lesen Teil 2\nText 1 (\nWillkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\nEssen in der Kantine\nUnser Unternehmen arbeitet an sieben Tagen rund um die Uhr im Drei-Schicht-System. Deshalb steht\nauch unsere Kantine, die für die Mitarbeiterverpflegung sorgt, täglich 24 Stunden zur Verfügung. Um\nunnötige Wartezeiten in der Mittagszeit zu vermeiden, wurden in Abstimmung mit dem Betriebsrat aber\nfolgende Essenszeiten für die einzelnen Abteilungen festgelegt : Während das Personal aus der\nProduktion und dem Lager in der ersten Gruppe von 12.00 bis 13.00 Uhr eine warme Mahlzeit zu sich\nnehmen kann, folgen die Mitarbeiterinnen und Mitarbeiter der Verwaltung in der zweiten Gruppe von\n13.00 bis 14.00 Uhr.\nAußerdem können die Mitarbeitenden jederzeit frisch zubereitete Snacks oder kleine Mahlzeiten wie\nSuppen oder Nudelgerichte aus den in der Kantine aufgestellten Automaten entnehmen. Darüber hinaus\nbefindet sich dort eine Mikrowelle, in der Sie mitgebrachte Speisen erwärmen können. Zusätzliche\nAutomaten für kalte und warme Getränke befinden sich auf jeder Etage in unserem Firmengebäude.","questions":[{"n":6,"text":"Die Kantine ist immer geöffnet. Richtig / falsch","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"type":"tf","answer":"r"},{"n":7,"text":"Die Mitarbeiterinnen und Mitarbeiter","options":[{"key":"a","text":"bekommen in der Kantine keine Getränke."},{"key":"b","text":"können nachts in der Kantine essen."},{"key":"c","text":"müssen mittags oft sehr lange anstehen."}],"type":"mcq","answer":"b"}]},{"id":"L2-P23","title":"Originalaufgabe · Seite 23","page":23,"body":"Lesen Teil 2\nText 2 (\nWillkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\nArbeitsunfälle\nArbeitsunfälle sind Unfälle, die Beschäftigte bei der Ausübung ihrer Arbeit oder einer Dienstreise erleiden. Es muss\nalso ein ursächlicher Zusammenhang mit der beruflichen Tätigkeit bestehen.\nNach einem Arbeitsunfall müssen Beschäftigte ihren Arbeitgeber umgehend über den Unfall in Kenntnis setzen und\nsich ggf. in Behandlung begeben. Außerdem ist, sobald es der Gesundheitszustand des Geschädigten zulässt, ein\ndetaillierter Unfallbericht zu verfassen und der Personalabteilung vorzulegen.\nIm Falle einer Arbeitsunfähigkeit nach einem Arbeitsunfall erhalten Arbeitnehmende für sechs Wochen eine\nLohnfortzahlung vom Arbeitgeber, danach übernimmt die Berufsgenossenschaft (BG), zahlt u. a. Verletztengeld in\nHöhe von 80 Prozent des Bruttogehalts und kommt ggf. auch für weitere Kosten auf.\nZu Arbeitsunfällen zählen auch Wegeunfälle, also Unfälle, die sich auf dem direkten Weg zwischen dem\nWohngebäude und der Arbeitsstätte ereignen. Dieser Weg beginnt vor der eigenen Haustür und endet, sobald die\nArbeitnehmenden das Unternehmen erreicht haben. Dabei sind bestimmte notwendige Umwege mitversichert, wie\netwa der Weg zur Kita, Umleitungen oder im Falle von Fahrgemeinschaften, unabhängig davon, mit welchen\nVerkehrsmitteln man sich fortbewegt.\nDer Versicherungsschutz umfasst ausschließlich Personenschäden; Sachschäden, wie z. B. Schäden am Fahrzeug,\nsind hierbei nicht mitversichert. Die BG übernimmt in diesem Fall z. B. die Behandlungskosten sowie ggf.\nKrankenpflege oder medizinische Rehabilitation.","questions":[{"n":8,"text":"Ein Fahrradunfall auf dem Weg zur Arbeit zählt nicht als Arbeitsunfall. Richtig/ falsch","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"type":"tf","answer":"f"},{"n":9,"text":"Nach einem Arbeitsunfall","options":[{"key":"a","text":"bezahlt die Berufsgenossenschaft sofort Verletztengeld."},{"key":"b","text":"erhalten Arbeitnehmer sechs Wochen volles Gehalt."},{"key":"c","text":"muss ein Bericht vom Arzt beim Arbeitgeber abgegeben werden."}],"type":"mcq","answer":"b"}]},{"id":"L2-P24","title":"Originalaufgabe · Seite 24","page":24,"body":"Lesen Teil 2\nText 2 (\nWillkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\nWichtige Hinweise zum Datenschutz\nUnser Unternehmen ist dem Datenschutz gemäß der EU-Datenschutz-Grundverordnung (DSGVO) verpflichtet.\nGrundsätzlich dürfen die Daten unserer Mitarbeiterinnen und Mitarbeiter nur dann erhoben werden, wenn diese\nvorher ausdrücklich zugestimmt haben.\nMit Ihrem Arbeitsvertrag haben Sie bereits ein Formular erhalten, mit dessen Unterschrift Sie bestätigt haben, dass\nSie mit der Speicherung Ihrer personenbezogenen Daten einverstanden sind. Sollten Sie zukünftig Fragen zum\nDatenschutz haben, können Sie sich an unseren internen Datenschutzbeauftragten Herrn Koljak (Durchwahl-814)\noder seine Stellvertreterin Frau Dombrovski (Durchwahl -485) wenden.\nWir erwarten von unseren Mitarbeiterinnen und Mitarbeitern, sich beim Thema Datenschutzverordnung immer auf\ndem neuesten Stand zu halten, und bieten daher jedes Jahr Schulungen zu diesem Zweck an. Diese werden von\nunserem externen Schulungspartner WissMax durchgeführt und finden zu unterschiedlichen Terminen, jeweils am\nWochenende, bei uns im Haus statt. Der Besuch des Seminars wird als Arbeitszeit angerechnet und ist für unsere\nMitarbeiter kostenfrei.\nEine Teilnahme an einem solchen Training muss spätestens alle drei Jahre erfolgen und durch ein Zertifikat\nnachgewiesen werden. Reichen Sie dieses bitte unaufgefordert bei der Personalabteilung ein.\nAlternativ können Sie auch eine vergleichbare Schulung bei einem anderen Anbieter besuchen. In diesem Fall bitten\nwir Sie jedoch, eine solche Teilnahme im Vorfeld mit unserer Personalabteilung abzusprechen, sodass Ihnen das\nSeminar genehmigt und eine Kostenübernahme garantiert werden kann.","questions":[{"n":8,"text":"Die Mitarbeiter müssen einmal pro Jahr ein Seminar zum Datenschutz belegen. Richtig / falsch","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"type":"tf","answer":"f"},{"n":9,"text":"Die Teilnahme am Seminar","options":[{"key":"a","text":"gilt als Arbeitszeit."},{"key":"b","text":"ist kostenpflichtig."},{"key":"c","text":"muss bei WissMax erfolgen. Wichtige Hinweise zum Datenschutz Unser Unternehmen ist dem Datenschutz gemäß der EU-Datenschutz-Grundverordnung (DSGVO) verpflichtet. Grundsätzlich dürfen die Daten unserer Mitarbeiterinnen und Mitarbeiter nur dann erhoben werden, wenn diese vorher ausdrücklich zugestimmt haben. Mit Ihrem Arbeitsvertrag haben Sie bereits ein Formular erhalten, mit dessen Unterschrift Sie bestätigt haben, dass Sie mit der Speicherung Ihrer personenbezogenen Daten einverstanden sind. Sollten Sie zukünftig Fragen zum Datenschutz haben, können Sie sich an unseren internen Datenschutzbeauftragten Herrn Koljak (Durchwahl-814) oder seine Stellvertreterin Frau Dombrovski (Durchwahl -485) wenden. Wir erwarten von unseren Mitarbeiterinnen und Mitarbeitern, sich beim Thema Datenschutzverordnung immer auf dem neuesten Stand zu halten, und bieten daher jedes Jahr Schulungen zu diesem Zweck an. Diese werden von unserem externen Schulungspartner WissMax durchgeführt und finden zu unterschiedlichen Terminen, jeweils am Wochenende, bei uns im Haus statt. Der Besuch des Seminars wird als Arbeitszeit angerechnet und ist für unsere Mitarbeiter kostenfrei. Eine Teilnahme an einem solchen Training muss jedes Jahr erfolgen und durch ein Zertifikat nachgewiesen werden. Reichen Sie dieses bitte unaufgefordert bei der Personalabteilung ein. Alternativ können Sie auch eine vergleichbare Schulung bei einem anderen Anbieter besuchen. In diesem Fall bitten wir Sie jedoch, eine solche Teilnahme im Vorfeld mit unserer Personalabteilung abzusprechen, sodass Ihnen das Seminar genehmigt und eine Kostenübernahme garantiert werden kann."}],"type":"mcq","answer":"a"}]},{"id":"L2-P25","title":"Originalaufgabe · Seite 25","page":25,"body":"Lesen Teil 2\nText 2 (\nWillkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\nRauchen\nIm gesamten Betrieb gilt striktes Rauchverbot. Auf dem Betriebsgelände befinden sich vier durch Hinweisschilder\ngekennzeichnete Raucherzonen, Bitte benutzen Sie für Ihre Zigarettenreste die Standaschenbecher. Allerdings ist im\nUmkreis von mindestens 50 Metern rund um die Produktionshallen das Rauchen auch im Freien untersagt, Eine\nMissachtung dieser Regel zieht eine Abmahnung nach sich. Im Wiederholungsfall droht eine fristlose Kündigung.\nDas Rauchverbot schließt Zigaretten, Zigarren, Pfeifen und den Konsum ähnlich verwendbarer Substanzen sowie\njeglichen Gebrauch von E-Zigaretten mit ein. Bei Veranstaltungen ist das Rauchen auch auf der Dachterrasse des\nGebäudes A zulässig, Beschäftigte, die dort rauchen, sind dazu angehalten, die Terrassentür geschlossen zu halten.\nZigarettenpausen während der Arbeitszeit sind grundsätzlich zulässig, dabei sind folgende Regelungen zu beachten.\nRaucherpausen sind nicht Bestandteil der Arbeitszeit, deshalb müssen sich Mitarbeiter ordnungsgemäß vom\nZeiterfassungssystem ab- bzw. nach Beendigung der Pause wieder anmelden.\nDa die Raucherpause nicht zur Arbeitszeit gehört, greift währenddessen nach dem Arbeitsrecht die\nUnfallversicherung nicht.\nDaher ist ein Arbeitsunfall während der Raucherpausen, z. B. ein Treppensturz, nicht über die Unfallversicherung\nabgedeckt.\nDie Gesundheit unserer MitarbeiterInnen liegt uns am Herzen. Aus diesem Grund übernehmen wir in Kooperation\nmit unserer betrieblichen Krankenkasse die Kosten für einen Raucherentwöhnungskurs.\nFür weitere Informationen wenden Sie sich bitte vertrauensvoll an unsere Personalabteilung.","questions":[{"n":8,"text":"Das Rauchverbot auf dem Firmengelände schließt E-Zigaretten aus. Richtig / falsch","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"type":"tf","answer":"f"},{"n":9,"text":"Raucher","options":[{"key":"a","text":"müssen ihre Pausenzeiten nicht dokumentieren."},{"key":"b","text":"sind auch in der Raucherpause bei Unfällen versichert."},{"key":"c","text":"sollen die Terrassentür beim Rauchen schließen"}],"type":"mcq","answer":"c"}]},{"id":"L2-P26","title":"Originalaufgabe · Seite 26","page":26,"body":"Lesen Teil 2\nText 2 (\nWillkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\nLebensarbeitszeitkonto\nIn unserem Unternehmen wird die Möglichkeit angeboten, ein Lebensarbeitszeitkonto zu führen. Als Arbeitnehmer\nkönnen Sie Arbeitszeit, zum Beispiel geleistete Überstunden, als Guthaben auf diesem Konto stehen lassen. Ähnlich\nwie bei einem Bankkonto, mit dem Unterschied, dass auch die Währung 'Zeit' akzeptiert wird.\nBei Bedarf können Sie Ihre angesparten Stunden wieder einlösen. Das Lebensarbeitszeitkonto bietet die Chance,\nadäquat auf verschiedene Bedürfnisse zu verschiedenen Zeiten im Laufe des Arbeitslebens einzugehen.\nBeispielsweise könnte die angesparte Zeit etwa für die Betreuung von pflegebedürftigen Angehörigen genutzt\nwerden.\nAußerdem bietet unser Teilzeitangebot „Classic Vario\" eine Kombination von Teil- und Vollzeit bei flexibler\nEinteilung der Arbeitszeit. Nach rechtzeitiger Rücksprache mit dem Arbeitgeber (mindestens drei Monate vorher)\nkann die zu leistende Arbeitszeit auch zwischen Teil- und Vollzeit angepasst werden.\nWenn Sie eine gewisse zeitliche Flexibilität brauchen, können Sie auch kurzfristig nach Absprache im Homeoffice\narbeiten. Für die Arbeit von zu Hause stehen den Mitarbeitern und Mitarbeiterinnen ein firmeneigener Laptop und\nein Diensthandy zur Verfügung.\nSollten Sie eine komplette Auszeit nehmen wollen, können Sie das für einen Zeitraum von bis zu maximal zwölf\nMonaten vorübergehend tun. Wir sichern Ihnen einen gleichwertigen Arbeitsplatz nach Ihrer Rückkehr zu.\nAls familienfreundliche Firma bieten wir neben den oben beschriebenen flexiblen Arbeitszeitmodellen\nBetreuungsmöglichkeiten während der Schulferien für die Kinder unserer Mitarbeiter und Mitarbeiterinnen.","questions":[{"n":8,"text":"Das Unternehmen unterstützt die Mitarbeiter finanziell bei privaten Problemen. Richtig / falsch","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"type":"tf","answer":"f"},{"n":9,"text":"Die Mitarbeiter können","options":[{"key":"a","text":"bei Bedarf von zu Hause aus arbeiten."},{"key":"b","text":"sich maximal ein halbes Jahr beurlauben lassen."},{"key":"c","text":"Geldleistungen für die Pflege von Angehörigen erhalten."}],"type":"mcq","answer":"a"}]},{"id":"L2-P27","title":"Originalaufgabe · Seite 27","page":27,"body":"Lesen Teil 2\nText 2 (\nWillkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\nBerichtsheft\nDas Berichtsheft ist der Nachweis, dass die Ausbildung ordnungsgemäß verläuft. In diesem wird alles dokumentiert,\nwas man während der Ausbildung macht und lernt. Sie sollten nicht nur Ihre Tätigkeiten im Betrieb beschreiben,\nsondern auch alle Einweisungen, Schulungen und den innerbetrieblichen Unterricht vermerken. Wie Sie sehen, ist\ndas Führen der Ausbildungsnachweise ein wichtiger Inhalt Ihrer Ausbildung, bei dem Sie lernen, Ihre Tätigkeiten\nzeitlich und inhaltlich zu dokumentieren. Darüber hinaus bietet es Ihnen die Möglichkeit, den Zeitaufwand für\nbestimmte Tätigkeiten präziser einzuschätzen und Ihre Aufgaben zu reflektieren.\nWeiterhin wird Ihr Tätigkeitsbereich für Beteiligte im Unternehmen und für die Stellen, die für die\nBerufsausbildung zuständig sind, nachvollziehbar dargestellt. Es ist Pflicht, das Berichtsheft jeweils vor der\nZwischen- und der Abschlussprüfung vorzulegen. Nur wenn es vollständig ist, wird der Prüfungsausschuss Sie zu\nden Prüfungen zulassen. Wenn Sie zwischen zwei Noten stehen,können Ihre Berichte sogar Ihre Endnote\nbeeinflussen.\nNeben den Wochenberichten, die Sie jeden Freitag an Ihren Teamleiter schicken, müssen Sie nach dem Durchlaufen\neiner Abteilung einen zusätzlichen Bericht verfassen. Dieser ergänzt den Wochenbericht und verschafft Ihnen einen\ngenaueren Überblick über die Aufgaben in der jeweiligen Abteilung. Sie dürfen Ihre Berichte während der\nArbeitszeit schreiben und können sie sowohl in klassischer Heftform als auch in digitaler Form auf unserer\nfirmeninternen Plattform führen und einreichen. In festen Abständen haben Sie das Heft Ihrem Ausbildungsleiter\nzur Kenntnisnahme vorzulegen. In Ihrem eigenen Interesse empfehlen wir Ihnen, es immer zeitnah zu\nvervollständigen.","questions":[{"n":8,"text":"Auszubildende ohne ordentlich geführtes Berichtsheft dürfen nicht an der Abschlussprüfung teilnehmen. Richtig / falsch","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"type":"tf","answer":"r"},{"n":9,"text":"Das Berichtsheft muss","options":[{"key":"a","text":"in der Freizeit geführt werden."},{"key":"b","text":"dem Ausbildungsleiter regelmäßig gezeigt werden."},{"key":"c","text":"jeden Tag ausgefüllt werden."}],"type":"mcq","answer":"b"}]},{"id":"L2-P28","title":"Originalaufgabe · Seite 28","page":28,"body":"Lesen Teil 2\nText 2 (\nWillkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\nDatenschutz\nIhre im Unternehmen verwendeten Passwörter dürfen unter keinen Umständen weitergegeben und müssen\nregelmäßig alle sechs Monate geändert werden. Bitte verwenden Sie keine Passwörter, die Sie auch für private\nKonten nutzen, und generieren Sie sichere Passwörter mit einem Passwortgenerator\nUSB-Sticks und Ihnen unbekannte Geräte sind vor Inbetriebnahme in isolierter Umgebung zu prüfen. Es darf keine\nSoftware aus dem Internet heruntergeladen oder selbstständig auf dem Arbeitslaptop oder dem PC installiert\nwerden. Außerdem ist es untersagt, Daten lokal abzuspeichern.\nBitte achten Sie bei Dienstreisen darauf, Ihren Laptop vor Fremden zu sichern! Bedenken Sie bitte auch, dass bei der\nArbeit möglicherweise vertrauliche Informationen auf Ihrem Bildschirm zu sehen sind. Schützen Sie diese vor\nfremden Blicken.\nVertrauliche Telefonate dürfen nicht in der Öffentlichkeit geführt werden. Die private Nutzung von Diensthandys\noder Laptops ist untersagt.\nVertrauliche und personenbezogene Daten müssen nach Dienstschluss verschlossen werden. Sie dürfen zudem nicht\nlänger als unbedingt erforderlich aufgehoben oder gespeichert werden. Über interne Information\nUnternehmensangelegenheiten oder Dienstgeheimnisse ist Verschwiegenheit zu wahren. Unterlagen, Datenträg\nAbschriften oder Kopien dürfen nicht weitergegeben werden oder versehentlich in die Hände unbefugter Person\ngelangen. Vertrauliche Daten in Papierform sind in dafür bereitgestellten Schreddern zu vernichten.\nBitte melden Sie ungewöhnliche Vorkommnisse oder Feststellungen umgehend der Geschäftsführung oder unsere\nDatenschutzbeauftragten, Herrn Dr. Sevici. Er ist unter der Durchwahl -33 zu erreichen und steht Ihnen auch bei\nFragen bezüglich des Datenschutzes in unserem Unternehmen zur Verfügung.","questions":[{"n":8,"text":"Die Mitarbeitenden dürfen ihre Passwörter frühestens alle sechs Monate ändern. Richtig / falsch","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"type":"tf","answer":"f"},{"n":9,"text":"Vertrauliche Daten b) müssen nach einer bestimmten Zeit gelöscht werden. c) sollen ausgedruckt und abgeheftet werden.","options":[{"key":"a","text":"dürfen nicht auf dem PC gespeichert werden."},{"key":"b","text":"müssen nach einer bestimmten Zeit gelöscht werden."},{"key":"c","text":"sollen ausgedruckt und abgeheftet werden."}],"type":"mcq","answer":"b"}]},{"id":"L2-P29","title":"Originalaufgabe · Seite 29","page":29,"body":"Lesen Teil 2\nText 2 (\nWillkommensmappe für neue Mitarbeiterinnen und Mitarbeiter\nArbeitsunfall und Berufsgenossenschaft (BG)\nMit dem Arbeitsantritt in unserem Untermehmen sind Sie als Arbeitnehmer*in automatisch gesetzlich\nunfallversichert.\nDer Träger dieser Unfallversicherung ist die Berufsgenossenschaft, deren Aurfgaban in erster Linie darin bestehen,\nArbeits- und Wegeunfälle, Berufskrankheiten sowie arbeitsbedingte Gesundheitsgefahren zu vermeiden. Das wird\ngewährleistet, indem regelmäßig Kontrollen der Arbeitssicherheit durch die Berufsgenossenschaf stattfinden. Bei\ndiesen Kontrollen sind unsere Mitarbeiter*innen des Qualitätsmanagements mit vor Ort.\nSollte dennoch ein Unglücksfall eintreten, übernimmt die Berufsgenossenschaf sämtliche Kosten für\nHeilbehandlungen und Schadensersatzzahlungen. Dafür muss von Ihnen folgendes Prozedere eingehalten werden:\nNach einemn Abeitsunfall wird zunächst der Ersthelfer oder die Ersthelferin informiert. Je nach Schwere des\nUnfalls wird ein Rettungswagen dazugerufen. Ob mit der ohne Krankenhausaufenthalt, müssen Sie aber in jedem\nFall von einem Durchgangsarzt untersucht werden. Gleichzeitig sind wir als Arbeitgeber verpflichtet, den Unfall der\nBerufsgenossenschaft zu melden. Damit setzt der Prozess ein, dass die Berufsgenossenschaf Ihre Behandlung und\nderen Kosten übernimmt. Damit für Sie als Arbeitnehmer*in keine finanziellen Probleme entstehen, zahlt die\nBerufsgenossenschaft Ihnen den Lohn ab der siebten Woche der Arbeitsunfähigkeit weiter.\nDamit es aber gar nicht erst so weit kommt, führen wir regelmaßig Schulungen zur Arbeitssicherheit durch. Diese\nbeinhalten auf der einen Seite Einweisungen zum korrekten Tragen der Schutzkleidung und auf der anderen Seite\nkonkrete Anweisungen zur richtigen Bedienung der Maschinen.","questions":[{"n":8,"text":"Alle Mitarbeitenden müssen für eine Arbeitsunfallversicherung sorgen. Richtig / falsch","options":[{"key":"r","text":"Richtig"},{"key":"f","text":"Falsch"}],"type":"tf","answer":"f"},{"n":9,"text":"Nach einem Arbeitsunfall","options":[{"key":"a","text":"muss man sich einem Durchgangsarzt vorstellen."},{"key":"b","text":"schickt die BG einen Arzt oder Rettungswagen."},{"key":"c","text":"übernimmt die BG sofort die Gehaltsfortzahlungen."}],"type":"mcq","answer":"a"}]}],"lesen3":[{"id":"L3-P30","title":"Originalaufgabe · Seite 30","page":30,"body":"Lesen Teil 3 (\n10. Gabi\nIch hatte gerade Urlaub und gleich am ersten Urlaubstag wurde meine Kleine krank und ich musste sie vier Tage\nlang pflegen. Wenn ich im Urlaub krank werde, kann ich die Tage zurückbekommen. Aber wie ist das, wenn das\nKind krank wird?\n11. Charlotte\nIch konnte leider mal wieder nicht zur Arbeit gehen, weil mein Kind krank war. Als ich heute angerufen habe, hat\nmein Chef total überzogen reagiert und mir mit Kündigung gedroht, wenn ich mehr als einen Tag fehle. Das geht\ndoch nicht, oder?\n12. Lars\nIch bin letzten Montag mit furchtbaren Kopfschmerzen aufgewacht und konnte nicht aufstehen. Leider habe ich\nvergessen, meinen Arbeitgeber anzurufen, und bin im Bett geblieben. Jetzt will mein Chef mir kündigen, weil ich\nunentschuldigt gefehlt habe. Geht das so einfach?\n13. Kamil\nGestern war ich krank. Als ich heute wieder im Büro war, wollte mein Chef direkt die Krankschreibung haben. Ich\nwar immer der Meinung, die braucht man erst nach drei Tagen?\na) Günther, vor 9 Stunden\nDas kann man pauschal gar nicht so sagen. Wie das in deinem Unternehmen geregelt ist, steht in deinem\nArbeitsvertrag. Ab wann du eine Arbeitsunfähigkeitsbescheinigung brauchst, findest du meistens unter den\nParagraphen „Arbeitsverhinderung\" oder „Krankheit\".\nb) Marion, vor 4 Stunden\nNein, vorher musst du erst mal eine Abmahnung bekommen. Wenn du dann allerdings noch mal fehlst, ohne\nBescheid zu sagen, musst du mit der Kündigung rechnen. Such doch noch mal das Gespräch mit deinem Chef. Ihr\nfindet bestimmt eine Lösung.\nc) Karin, vor 45 Minuten\nDu kannst nicht einfach kommen und gehen, wann du willst, auch wenn du die Absicht hattest, die versäumte Zeit\nnachzuholen. Die Arbeitszeiten sind ja vertraglich geregelt. Wenn sich Mitarbeiter nicht daran halten, ist eine\nAbmahnung vor der Kündigung nicht notwendig.\nd) Elli, vor 3 Stunden\nWie du selbst schreibst, können im Krankheitsfall die Urlaubstage auf dein Urlaubskonto zurückgebucht werden. Du\nbrauchst natürlich ein ärztliches Attest. Das gilt allerdings nicht, wenn du dich um ein krankes Kind kümmern\nmusst. In diesem Fall gelten die Urlaubstage als genommen.\ne) Sabine, vor 40 Minuten\nDiese Situation kennen doch alle Eltern. Wenn ich für meinen Sohn mal keine Betreuung finde, kann ich ihn auch\nausnahmsweise mit ins Büro nehmen. Meine Chefin ist da zum Glück sehr verständnisvoll.\nf) Jorge, vor 2 Stunden\nAlso ich gehe immer gleich am ersten Krankheitstag zum Arzt. Sicher ist sicher. Außerdem kann es nicht schaden,\nwenn dich ein Doktor anschaut, wenn du dich nicht wohlfühlst. Gerade wenn du Kinder hast, ist es wichtig, dass du\nweißt, was dir fehlt. Du willst ja niemanden anstecken.","questions":[{"n":10,"answer":"d"},{"n":11,"answer":"x"},{"n":12,"answer":"b"},{"n":13,"answer":"a"}]},{"id":"L3-P33","title":"Originalaufgabe · Seite 33","page":33,"body":"Lesen Teil 3 (\n10. Inka\nIch bin Auszubildende in einem Büro und muss immer pünktlich Feierabend machen, weil ich meinen einjährigen\nSohn von der Krippe abholen muss. Mein Chef sieht das gar nicht gern und droht mir jetzt sogar mit Kündigung.\nWas soll ich machen?\n11. Jacqueline\nHallo Leute! Vor ein paar Monaten habe ich mit einer Ausbildung begonnen. Und jetzt bin ich schwanger... Was\nsoll ich bloß machen? Es wird bestimmt schwierig, Kind und Arbeit zu vereinbaren. Soll ich die Ausbildung\nabbrechen?\n12. Hans-Peter\nGuten Abend, ich bin Ende 40 und mein Sohn ist inzwischen erwachsen. Jetzt möchte ich beruflich was ganz Neues\nmachen und eine Ausbildung zum Steuerfachangestellten anfangen. Meint ihr, ich habe in meinem Alter noch\nChancen, in diesem Beruf zu arbeiten?\n13. Max\nHallo, ich mache momentan eine Ausbildung zum Einzelhandelskaufmann. Ich habe noch ein Jahr bis zum\nAbschluss und habe wirklich keine Lust mehr. Mein Vater möchte, dass ich die Ausbildung fertig mache. Ich bin\nnoch nicht 18. Kann ich trotzdem einfach kündigen?\na) Susi, vor 1 Stunde\nSolange du so nicht weniger arbeitest als im Vertrag vereinbart, müsstest du rechtlich auf der sicheren Seite sein.\nWenn du es genau wissen willst, solltest du in diesem Fall einen Anwalt fiür Arbeitsrecht kontaktieren. Mit einer\nRechtsschutzversicherung wird das auch nicht so teuer.\nb) Julia, vor 1 Stunde\nRein rechtlich kannst du das nicht ohne Zustimmung deiner Eltern machen. Sie müssen die Kündigung sogar\nunterschreiben. An deiner Stelle würde ich mir das aber noch mal überlegen. Ich kann deinen Vater jedenfalls gut\nverstehen. Er macht sich halt Sorgen um deine Zukunft.\n(\nDamit Minderjährigen die Ausbildung verlassen, müssen die Eltern eine Kündigung unterschreiben.\nc) Jürgen, vor 2 Stunden\nHi, ich würde die Ausbildung auf keinen Fall abbrechen. Mit Berufen im Finanzbereich hast du gute Aussichten auf\ndem Arbeitsmarkt und verdienst später auch gutes Geld. Mach dir das nicht kaputt. Meine Tochter ist\nSteuerberaterin und sucht händeringend nach fähigen Mitarbeitern. Sie kann sich vor Aufträgen gar nicht retten.\nd) Jochen, vor 5 Stunden\nAlso ich würde noch warten, bis dein Kind etwas größer ist, und mich jetzt noch nicht um einen Ausbildungsplatz\nbewerben. Wenn es etwas selbstständiger ist, wird vieles leichter. Eine Ausbildung kannst du auch in drei oder vier\nJahren noch machen. Dein Kind braucht dich jetzt.\ne) Achim, vor 6 Stunden\nSchutz von Leben und Gesundheit ist das oberste Gebot.\nUm dich und dein Kind zu schützen, darfst du während der Schwangerschaft keine körperlich anstrengenden\nArbeiten verrichten und auch Tätigkeiten, bei denen du Lärm, Schmutz, Kälte usw. ausgesetzt bist, sind tabu.\nf) Peter, vor 12 Stunden\nWarum das denn? Es gibt doch heutzutage Möglichkeiten, das Kind unterzubringen, während man arbeitet. Können\ndich deine Eltern vielleicht unterstützen? Sprich mal mit deinem Chef! Wenn der sieht, dass dir die Ausbildung\nwichtig ist, wird sich eine Lösung finden. Aber versuch auf jeden Fall, die Ausbildung durchzuziehen.","questions":[{"n":10,"answer":"a"},{"n":11,"answer":"f"},{"n":12,"answer":"x"},{"n":13,"answer":"b"}]},{"id":"L3-P34","title":"Originalaufgabe · Seite 34","page":34,"body":"Lesen Teil 3 (\n10. Som\nMeine Kinder sind unter der Woche ganztags in der Kita, damit ich Vollzeit arbeiten kann. Jetzt soll ich in den\nnächsten Wochen samstags ins Büro kommen. Ich habe aber niemanden, der da auf meine Kinder aufpassen kann.\nKann der Arbeitgeber das verlangen?\n11. Reinhold\nIch arbeite seit zwölf Jahren 20 Stunden die Woche und würde jetzt gerne, weil die Kinder aus dem Haus sind,\nmeine Arbeitszeit aufstocken und wieder Vollzeit arbeiten. Habe ich ein Recht darauf ?\n12. Mandy\nSeit zwei Jahren arbeite ich Vollzeit in einem Unternehmen und dieser Job macht mir auch viel Spaß. Aus\nfamiliären Gründen würde ich gerne eine dreijährige Auszeit nehmen. Ich überlege, ob ich mir das finanziell leisten\nkann.\n13. Nici\nIch bekomme jetzt das zweite Kind und werde danach wahrscheinlich erst mal Teilzeit arbeiten. Jetzt habe ich\nziemlich große Angst, dass ich in meiner Karriere den Anschluss verpasse. Soll ich vielleicht doch so schnell wie\nmöglich wieder Vollzeit arbeiten?\nForum: Rund um den Beruf\na) Thilo, vor 45 Minuten\nIn meinen Augen ist Familie das Wichtigste auf der Welt. Es ist doch auch ein Gewinn, wenn man mehr Zeit mit\nseinen Kindern verbringen kann und weniger gestresst ist. Ich würde mich auf jeden Fall für Teilzeit entscheiden.\nb) Henny, vor 1 Stunde\nAlso ich finde es nicht gut, wenn Geschäfte und Supermärkte an Samstagen so lange geöffnet sind. Ihr müsst doch\nbedenken, dass dort auch Menschen arbeiten müssen. Sie wollen doch ebenfalls Wochenende haben und zu ihren\nFamilien. Ich bin ganz klar gegen längere Ladenöffnungszeiten.\nc) Angela, vor 6 Stunden\nJeder Arbeitnehmer hat einen Rechtsanspruch auf Teilzeitarbeit. Allerdings musst du länger als sechs Monate bei\ndem Unternehmen beschäftigt sein. Man muss sich das aber genau überlegen, da man nicht nur kurz- oder\nmittelfristig weniger verdient, sondern auch weniger Rentenansprüche hat. Schau doch mal im Internet, wie viel das\nausmacht.\nd) Ratna, vor 2 Stunden\nSeit Kurzem haben Arbeitnehmer das Recht, eine befristete Zeit weniger zu arbeiten, aber das gilt bestimmt nicht\nrückwirkend. Soviel ich weiß, hast du also keinen Anspruch, in die Vollzeit zurückzukehren. Sprich doch einfach\nmal mit deinem Chef.\ne)Alex, vor 30 Minuten\nDer Samstag ist ein normaler Werktag und deshalb kann der Arbeitgeber anordnen, dass an diesem Tag auch\ngearbeitet wird. Dabei spielt es keine Rolle, ob du Kinder hast oder nicht. Oft ist es aber auch so, dass du dann an\neinem anderen Tag in der Woche frei bekommst.\nf) Gerhard, vor 3 Stunden\nAlso ich würde mir das gut überlegen. Wenn du bisher gut über die Runden gekommen bist, könntest du dir doch\netwas mehr Freizeit gönnen. Meines Erachtens geht es hier auch um mehr Lebensqualität. Das Leben ist zu kurz, um\nnur zu arbeiten.","questions":[{"n":10,"answer":"e"},{"n":11,"answer":"d"},{"n":12,"answer":"x"},{"n":13,"answer":"a"}]},{"id":"L3-P35","title":"Originalaufgabe · Seite 35","page":35,"body":"Lesen Teil 3 (\n10. Thia\nVoll gemein, ich habe nur 25 Urlaubstage! Mein Freund hat hingegen 30 Tage im Jahr. Ich frage mich, ob mir nicht\nauch mehr Tage zustehen. Kennt sich von euch da jemand aus?\n11. Marilena\nIch arbeite im Einzelhandel und bei uns gilt jede Woche ein anderer Dienstplan. Wir bekommen den Plan immer\nerst am Ende der Vorwoche und deshalb können wir unsere Freizeit natürlich auch nicht richtig planen. Ist das\nerlaubt?\n12. Hans\nIch habe nach der Genehmigung meines Urlaubs diesen gebucht und jetzt hat mein Chef gemerkt, dass ein anderer\nKollege schon vorher zur selben Zeit Urlaub eingereicht hat. Jetzt will er mir meinen wieder streichen. Darf er das?\n13. Lisa\nIch mache zurzeit ein Pflichtpraktikum in einem Unternehmen und arbeite von Montag bis Freitag acht Stunden\ntäglich. Jetzt soll ich nächsten Samstag auch noch kommen. Bin ich dazu verpflichtet? Ich fühle mich ein bisschen\nausgenutzt!\na) Cécile, vor 3 Stunden\nLeider muss ich dich enttäuschen. Die Regelung ist gesetzeskonform. Das Minimum legt sogar nur bei 20 Tagen.\nSei froh, dass du mehr hast. Bei manchen Arbeitgebern erhöht sich der Urlaubsanspruch mit längerer\nFirmenzugehörigkeit.\nb) Limit, vor 5 Stunden\nMeines Wissens gibt es keine gesetzliche Regelung dafür, aber sprich doch einfach mit eurem Chef. Dem ist\nvielleicht gar nicht klar, dass du das nicht so toll findest, wenn du immer erst so kurz vorher weißt, an welchen\nTagen du arbeiten musst und wann du frei hast.\nc) Susanne, vor 3 Stunden\nUrlaub muss immer rechtzeitig beantragt werden, aber der Arbeitgeber ist nicht unbedingt verpflichtet, ihn zu\ngewahren. Wann Urlaub genommen werden darf, entscheidet der Chef. Aufgrund dringender betrieblicher Gründe\nkann ein Urlaubsantrag auch abgelehnt werden.\nd) Nico, vor 30 Minuten\nSchau doch mal in deinen Arbeitsvertrag, da ist das sicher geregelt. Soviel ich wieß, gib es keine gesetzlichen\nEinschränkungen für angestellte Arbeitnehmer. Allerdings darfs du keine sieben Tage am Stück arbeiten. Der\nSamstag gilt in Deutschland als normalen Wochentag.\ne) Greta, vor 2 Stunden\nIch arbeite auch im Einzelhandel und bei uns ist es so geregelt, dass man einen festen Wochentag freibekommt,\nwenn man immer samstags arbeitet. Das kommt mir entgegen. So kann ich entspannt unter der Woche einkaufen\noder ins Schwimmbad gehen.\nf) Michele, vor 6 Stunden\nDas kann dein Chef nicht einfach so machen. Personelle Engpässe reichen für den Widerruf eines\nUrlaubsantrags nicht aus. Wenn du deinen Urlaub tatsächlich nicht antrittst, muss der Arbeitgeber alle Kosten\ntragen, die dir durch die Urlaubsverschiebung entstehen.","questions":[{"n":10,"answer":"a"},{"n":11,"answer":"b"},{"n":12,"answer":"f"},{"n":13,"answer":"x"}]},{"id":"L3-P36","title":"Originalaufgabe · Seite 36","page":36,"body":"Lesen Teil 3 (\n10. Mikke\nHeute hatte ich auf dem Weg zur Arbeit einen Unfall. Ich habe noch einen Umweg über die Kita gemacht, bin\ngestolpert und habe mir den Knöchel gebrochen. Bin ich denn jetzt versichert? Ich habe ja nicht den direkten Weg\nzur Arbeit genommen.\n11. Ludmilla\nIch habe eine Abmahnung bekommen, weil ich regelmäßig zu spät zur Arbeit komme. Ich fahre immer rechtzeitig\nvon zu Hause weg und finde dann bei der Firma keine Parkmöglichkeit. Muss der Arbeitgeber nicht eigentlich\nseinen Mitarbeiter Parkplatz stellen?\n12. Peter\nIch wollte heute Morgen mit der S-Bahn zur Arbeit fahren, aber diese ist wegen des Unwetters ausgefallen. So hatte\nich keine Möglichkeit, ins Büro zu kommen, da ich kein Auto habe. Hätte ich ein Taxi nehmen müssen?\n13. Ingo\nImmer das Gleiche. Der Bus kommt zu spät, steht im Stau oder fällt aus. Jetzt habe ich Ärger mit meinem Chef, weil\nich öfter mit Verspätung im Büro erscheine. Bin ich verpflichtet, immer ein früheren Bus zu nehmen, damit ich\npünktlich bin?\na) Hans, vor 2 Stunden\nDer Arbeitgeber hat eine Fürsorgepflicht und dazu gehört auch, dass er für Fahrzeuge der Mitarbeiter eine\nUnterbringungsmöglichkeit zu schaffen hat. Aber nur, wenn das ohne zu großen Aufwand geht. Wenn ein\nUnternehmen in der Innenstadt ist, gibt es einfach nicht genug Platz für ihre Parkmöglichkeiten.\nb) Thilo, vor 45 Minuten\nWenn die Bahn wegen eines Sturms nicht weiterfahren kann und in einem Bahnhof stehen bleiben, haben die\nFahrgäste meistens Anspruch auf einen Taxigutschein, damit sie auf diese Weise ihr Ziel erreichen. Du kannst auf\nder Webseite der Deutschen Bahn nachlesen, unter welchen Umständen die Bahn deine Weiterfahrt bezahlt.\nb) Mallory, vor 45 Minuten\nWenn ein Zug seine Reise nicht fortsetzen kann und in einem Bahnhof stehen bleiben muss, bezahlt die Deutsche\nBahn den Fahrgästen in bestimmten Fällen eine Weiterfahrt im Taxi. Oder sie übernimmt die Kosten für eine\nHotelübernachtung. Nähere Infos findest du auf der Webseite der Deutschen Bahn.\nc) Johannes, vor 3 Stunden\nWenn du auf dem Weg zur Arbeit einen Autounfall hast, bezahlt die Unfallversicherung nur Personenschäden.\nSachschäden sind dabei nicht inbegriffen. Du kannst aber grundsätzlich selbst entscheiden, welches Fahrzeug du für\nden Arbeitsweg benutzt.\nd) Jacqueline, vor 30 Minuten\nDu bist dafür verantwortlich, rechtzeitig an deinem Arbeitsplatz zu erscheinen. Wie du das machst, ist deine Sache.\nAber du kannst keinesfalls die Verantwortung auf die öffentlichen Verkehrsmittel schieben und dich auf den\nStandpunkt stellen, dass du nichts für deine Verspätung kannst.\ne) Andreij vor 4 Stunden\nNatürlich hast du an deinem Arbeitsplatz Versicherungsschutz, aber dieser gilt nicht in allen Teilen des Gebäudes.\nAuf der Toilette bist du zum Beispiel nicht versichert. Warum das so ist, weiß ich aber auch nicht.\nf) Alex, vor 45 Minuten\nAls Arbeitnehmer musst du dafür sorgen, zum Job zu kommen. Wenn das nicht geht, darfst du aber keine\nAbmahnung bekommen. Ob du ein Taxi nehmen muss, kommt darauf an, ob die Kosten dafür über deinem\nArbeitslohn für einen Tag liegen. Wenn ja, sind diese Kosten für dich nicht zumutbar.","questions":[{"n":10,"answer":"x"},{"n":11,"answer":"a"},{"n":12,"answer":"f"},{"n":13,"answer":"d"}]},{"id":"L3-P38","title":"Originalaufgabe · Seite 38","page":38,"body":"Lesen Teil 3 (\n10. Claudia\nIch muss während der Arbeit eine Uniform tragen. Mir ist es unangenehm, die schon morgens in der Bahn\nanzuhaben, und ich möchte mich lieber im Hotel umziehen. Muss ich dafür früher kommen oder gilt die\nUmkleidezeit als Arbeitszeit?\n11. Maisel\nGestern war ich für einen Tag bei einem Kunden in Norddeutschland. Ich bin mit dem Zug gefahren und habe\nwährend der Fahrt gelesen. Insgesamt war ich elf Stunden unterwegs und habe Überstunden geltend gemacht. Die\nwill mein Arbeitgeber nicht anerkennen.\n12. Cristof\nIch war am Wochenende auf einer Fortbildung, die für meine Arbeit relevant war. Ich wollte mir jetzt einen\nUrlaubstag gutschreiben lassen, aber meine Chefin sagt, das sei meine private Angelegenhei
