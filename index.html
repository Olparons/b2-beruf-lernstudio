t, da sie die Fortbildung\nnicht ungeordnet hat. Stimmt das?\n13. Samira\nIch fahre morgens mit dem Fahrrad in die Firma, bin immer pünktlich um 9.00 Uhr da und mache mich dann fertig.\nAb sofort soll ich früher kommen und darf mich nicht mehr während der Arbeitszeit umziehen. Ist das korrekt?\na) Andres, vor 8 Minuten\nWenn du in Sportkleidung in die Firma kommst und dich dort noch umziehst, ist das Privatsache. Du musst dafür\nsorgen, dass du pünktlich mit deiner Arbeit beginnen kannst. In diesem Fall ist die Umkleidezeit keine Arbeitszeit.\nb) Paula, vor 3 Stunden\nDer Weg zur Arbeit ist private Zeit. Du trägst die Verantwortung dafür, pünktlich vor Ort zu sein, egal wie weit dein\nWeg ist. Wenn du z.B. im Stau stehst oder die- S-Bahn streikt und du deshalb zu spät kommst, musst du die Zeit\nnacharbeiten.\nc) Raimund, vor 6 Stunden\nArbeitnehmer/innen haben in der Regel alle zwei Jahre Anspruch auf fünf Tage Bildungsurlaub. Die Gesetze sind\naber nicht in jedem Bundesland gleich. So variiert zum Beispiel die Anzahl der Tage für Bildungsurlaub je\nnachdem, ob du Voll- oder Teilzeit tätig bist.\nd) Hubert, vor 38 Minuten\nIch finde das Tragen von Dienstkleidung absolut veraltet. Warum müssen alle im Unternehmen gleich gekleidet\nsein? Jeder Mensch hat doch seinen eigenen Stil, mit dem er sich wohlfühlt. Ich kann verstehen, dass du die\nUniform nicht auch noch im Zug tragen möchtest.\ne) Yvonne, vor 7 Stunden\nWenn du selbst entscheidest, eine Fortbildung zu besuchen, und das vorher nicht mit deinem Arbeitgeber absprichst,\nist das reines Privatvergnügen. Schickt dein Chef dich allerdings seinerseits auf ein Seminar , handelt es sich um\nArbeitszeit.\nf) Winfried, vor 25 Minuten\nDas ist ein schwieriges Thema. Wenn du während der Reise zum Beispiel deinen Termin vorbereitest oder mit dem\nLaptop ein Protokoll schreibst, ist das Arbeitszeit. Wenn du dich aber mit privaten Dingen wie einem Roman oder\neinem privaten Telefonat beschäftigst, gilt das als Freizeit.","questions":[{"n":10,"answer":"x"},{"n":11,"answer":"f"},{"n":12,"answer":"e"},{"n":13,"answer":"a"}]},{"id":"L3-P39","title":"Originalaufgabe · Seite 39","page":39,"body":"Lesen Teil 3 (\n10. Torsten\nWir hatten neulich im Büro eine Diskussion darüber, ab wann man in Rente gehen kann. Ich dachte\nimmer, man muss bis 67 arbeiten. Aber meine Kollegin meinte, dass sie zwei Jahre früher in Rente\ngehen wird. Geht das überhaupt?\n11. Hella\nMeine Rente wird ja nicht so berauschend sein, vor allem, weil ich wegen meiner zwei Kinder einige\nJahre nicht oder nur Teilzeit gearbeitet habe. Es ist ja wohl schon so, dass ich dafür jetzt irgendwie\nbestraft werde, oder?\n12. Petra\nMein Mann geht in zwei Jahren in Rente. Ich müsste noch vier Jahre arbeiten. Wir haben uns überlegt,\ndass wir zusammen in Rente gehen und noch viele gemeinsame Jahre mit verschiedenen Aktivitäten\nerleben wollen. Welche Folgen hätte das?\n13. Leni\nIch bin ja noch jung und denke überhaupt noch nicht an die Rente. Aber es wird ja immer wieder gesagt,\ndass die normale Rente irgendwann nicht mehr ausreichen wird. Was kann ich denn jetzt schon für\nspäter tun?\nForum: Rund um den Beruf\na) Stefan, vor 4 Stunden\nKaum jemandem gelingt es, 45 Jahre durchgehend so ein hohes Gehalt zu verdienen, dass er später die\nHöchstrente bekommt Das liegt schon allein daran, dass man während der Ausbildung und in den ersten\nBerufsjahren weniger verdient.\nb) Jana, vor 34 Minuten\nAuch Firmen helfen, für die Zukunft vorzusorgen, denn man kann gar nicht früh genug damit anfangen. Erkundige\ndich bei deinem Arbeitgeber, ob eine betriebliche Altersvorsorge angeboten wird. Wenn man dann später Rentner\nist, bekommt man eine zusätzliche Rente.\nc) Antje, vor 7 Stunden\nWenn man mindestens fünf Jahre versicherungspflichtig beschäftigt war, hat man Anspruch auf die gesetzliche\nRente. Dabei spielt es keine Rolle, ob man Teiltzeit oder Vollzeit gearbeitet hat. Es gibt aber noch Unterschiede\nzwischen Ost und West.\nd) Jonas, vor 2 Stunden\nMan hat das Recht, früher als mit 67 Jahren in Rente zu gehen, aber man muss Abschläge in Kauf nehmen. Im\nMoment sind das für jeden Monat, den man weniger arbeitet, 0,3 Prozent weniger. Man muss sich das genau\nausrechnen, ob man sich das leisten kann.\ne) Jörg, vor 5 Stunden\nFür alle, die nach 1964 geboren sind, gilt dass sie bis 67 Jahre arbeiten müssen. Außer, wenn man mit 65 schon 45\nBeitragsjahre nachweisen kann, also Jahre, in denen man in die Rentenversicherung eingezahlt hat.\nf) Lia, vor 12 Stunden\nWenn man jung ist, sollte mạn sein Leben doch erst einmal genießen. Über Alter und Krankheit kann man sich\nimmer noch Gedanken machen. Wer weiß, ob es später, wenn wir so weit sind, überhaupt noch eine Rente geben\nwird.","questions":[{"n":10,"answer":"e"},{"n":11,"answer":"x"},{"n":12,"answer":"d"},{"n":13,"answer":"b"}]}],"lesen4":[{"id":"L4-P40-41","title":"Originalaufgabe · Seiten 40-41","pages":[40,41],"body":"Lesen Teil 4 (\n(Zulieferer, Fahrtenbuch)\nProtokoll 20.06.20XX, 10.00-12.00\nBesprechungsraum: 032,\nOrt: Konrad-Adenauer-Straße 43, 30159 Hannover\nTeilnehmende: Veronika Emmerich (VE, Stellvertreterin Geschäftsleitung), Marita Hinze (MH, Leitung Einkauf),\nPeter Renner (PR, Leitung Produktion), Thomas Hagen (TH, Leitung Finanzen), Sibylle Marquards (SM, Leitung\nPersonal), Christian Werner (CW, Leitung Vertrieb), Jessica Froh (JF, Leitung Marketing). Jutta Raulin (IR, Leitung\nQualitätssicherung), Joachim Meyer (JM, Leitung IT)\nSitzungsleitung: Veronika Emmerich P\nProtokollantin: Sibylle Marquardt\nNicht Anwesende: Martin Stahl (MS, Geschäftsleitung)\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung der Tagesordnungspunkte - VE\n2. Probleme mit einem Zulieferer - MΗ\n3. Zwischenstand Qualitätssicherung - JR\n4. Neue Überstundenregelung - VE\n5. Private Nutzung der Dienstwagen - SM\n6. Sonstiges\nTOP 1 Begrüßung und Genehmigung der Tagesordnungspunkte\nVE begrüßt alle Anwesenden, alle Abteilungsleiterinnen und -leiter zur heutigen Besprechung und bittet um die\nGenehmigung der Tagesordnungspunkte. Dieses wird per Handzeichen einstimmig angenommen. Als nächster\nBesprechungstermin wird der 24.09.20XX nach der Urlaubszeit einstimmig festgelegt.\nTOP 2 Probleme mit einem Zulieferer\nMH berichtet, dass unser südamerikanischer Zulieferer Dos Caminos Exports Ltd. die Preise für seine Vorprodukte\nohne weitere Absprache erhöht und uns in Rechnung gestellt hat. Auf Nachfrage wurde uns mitgeteilt, dass dies\naufgrund stark gestiegener Transportkosten geschehen ist. Dies wird von uns nicht akzeptiert und wurde\nentsprechend an den Zulieferer kommuniziert. Nach intensivem Schriftwechsel kam es zu einer Einigung. Wir\nbehalten es uns vor, bis zum 31. des kommenden Monats einen für uns günstigeren Zulieferer zu finden. Hierfür\nzuständig sind MH und TH. Neue Lieferpartner könnten im asiatischen Raum gesucht werden. MH berichtet über\ngute Erfahrungen in dieser Region. Ziel ist es, ohne weitere Ansprüche beiderseits von dem Vertrag des Zulieferers\nzurückzutreten.Gerichtliche Schritte werden dann nicht unternommen.\nBis zum 20. des kommenden Monats ist darüber zu berichten.\nTOP 3 Zwischenstand Qualitätssicherung\nDie Abteilung Qualitätssicherung erarbeitete ein neues Konzept für Qualitätsprüfung in der Phase der\nEndproduktion. Das vor zwei Quartalen umgesetzte Konzept zeigt in der Qualitätsmessung bereits bei einer\nAbweichung von 30 Prozent eine Fehlermeldung.Dies führt seit drei Monaten zu einem messbaren Erfolg, berichtet\nJR. Die Zahl der Reklamationen ist zurückgegangen.\nTOP 4 Neue Überstundenregelung\nVE dankt allen Mitarbeitenden für die mehrheitliche Bereitschaft, Überstunden zu leisten. Vor allem in Zeiten höher\nAuftragseingänge lässt sich das leider nicht immer vermeiden.\nBisher konnten die Mitarbeitenden diese Überstunden als Freizeit ausgleichen oder sich auszahlen lassen. Aufgrund\neines momentan unerwartet hohen Auftragsvolumens wird ab sofort festgelegt, dass bin zu 20. Überstunden pro\nQuartal ausschließlich vergütet werden können, da die Freistellung von der Arbeit aus personellen Gründen\nmomentan nicht möglich ist. Bei sinkendem Auftragseingang kann man diese Maßnahme zu einem späteren\nZeitpunkt wieder rückgängig machen. Diese Vorgehensweise ist mit Protokoll vom 15.06.20XX vom Betriebsrat\ngenehmigt.\nTOP 5 Private Nutzung der Dienstwagen\nSM teilt mit, dass alle Mitarbeiter, die über einen Dienstwagen verfügen, diesen ab dem nächsten Monat nicht mehr\nnur für dienstliche, sondern auch für private Zwecke nutzen können. Es wird aber darauf hingewiesen, dass dann\nunbedingt ein Fahrtenbuch geführt werden muss, das die privat gefahrenen Kilometer angibt. Dieses ist monatlich in\nder Finanzabteilung einzureichen.\nTOP 6 Sonstiges\nTH präsentiert eine Idee seiner Mitarbeiterinnen und Mitarbeiter, sie möchten am Samstag in zwei Wochen einen\ngeselligen Bowlingabend in der Anlage „Sport und Spaß“ Marienstraße 10-12, verbringen. Dazu laden sie alle\ninteressierten Kolleginnen und Kollegen aus anderen Abteilungen ein. Die Personalabteilung wird diese Information\nins Intranet stellen. Wer Interesse hat, soll sich dort bis Freitag nächster Woche anmelden.","questions":[{"n":14,"text":"Der Termin der nächsten Sitzung","options":[{"key":"a","text":"findet nach Abstimmung im Herbst statt."},{"key":"b","text":"muss verlegt werden."},{"key":"c","text":"wird noch bekannt gegeben."}],"answer":"a"},{"n":15,"text":"Die Firma","options":[{"key":"a","text":"hat ohne Weiteres die Preiserhöhung des Zulieferers akzeptiert."},{"key":"b","text":"will sich an den höheren Transportkosten gern beteiligen."},{"key":"c","text":"wird einen neuen Vertragspartner suchen."}],"answer":"c"},{"n":16,"text":"Die Abteilung Qualitätssicherung","options":[{"key":"a","text":"berichtet von 30 Prozent fehlerhafter Produkte."},{"key":"b","text":"hat keine Qualitätsprobleme."},{"key":"c","text":"verzeichnet erste Erfolge."}],"answer":"c"},{"n":17,"text":"Die Mitarbeitenden","options":[{"key":"a","text":"haben mit dem Betriebsrat gesprochen."},{"key":"b","text":"können alle Überstunden als Freizeit nehmen."},{"key":"c","text":"müssen zurzeit Mehrarbeit leisten."}],"answer":"c"},{"n":18,"text":"Das Fahrtenbuch","options":[{"key":"a","text":"dokumentiert alle gefahrenen Kilometer."},{"key":"b","text":"enthält nichtdienstliche Autofahrten."},{"key":"c","text":"wird von allen Mitarbeitern geführt."}],"answer":"b"}]},{"id":"L4-P42-43","title":"Originalaufgabe · Seiten 42-43","pages":[42,43],"body":"Lesen Teil 4 (\n(Zulieferer, Fahrtenbuch)\nProtokoll 20.06.20XX,      10.00-12.00\nBesprechungsraum: 032,\nOrt: Konrad-Adenauer-Straße 43, 30159 Hannover\nTeilnehmende: Veronika Emmerich (VE, Stellvertreterin Geschäftsleitung), Marita Hinze (MH, Leitung Einkauf),\nPeter Renner (PR, Leitung Produktion), Thomas Hagen (TH, Leitung Finanzen), Sibylle Marquards (SM, Leitung\nPersonal), Christian Werner (CW, Leitung Vertrieb), Jessica Froh (JF, Leitung Marketing). Jutta Raulin (IR, Leitung\nQualitätssicherung), Joachim Meyer (JM, Leitung IT)\nSitzungsleitung: Veronika Emmerich P\nProtokollantin: Sibylle Marquardt\nNicht Anwesende: Martin Stahl (MS, Geschäftsleitung)\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung der Tagesordnungspunkte - VE\n2. Probleme mit einem Zulieferer - MΗ\n3. Zwischenstand Qualitätssicherung - JR\n4. Neue Überstundenregelung - VE\n5. Private Nutzung der Dienstwagen - SM\n6. Sonstiges\nTOP 1 Begrüßung und Genehmigung der Tagesordnungspunkte\nVE begrüßt alle Anwesenden, alle Abteilungsleiterinnen und -leiter zur heutigen Besprechung und bittet um die\nGenehmigung der Tagesordnungspunkte. Diese werden per Handzeichen einstimmig angenommen. Der nächste\nBesprechungstermin findet am 24.09.20XX statt; also nach der Urlaubszeit. Dies wird einstimmig beschlossen.\nTOP 2 Probleme mit einem Zulieferer\nMH berichtet, dass unser südamerikanischer Zulieferer Dos Caminos Exports Ltd. die Preise für seine Vorprodukte\nohne weitere Absprache erhöht und uns in Rechnung gestellt hat. Auf Nachfrage wurde uns mitgeteilt, dass dies\naufgrund stark gestiegener Transportkosten geschehen ist. Dies wird von uns nicht akzeptiert und wurde\nentsprechend an den Zulieferer kommuniziert. Nach intensivem Schriftwechsel kam es zu einer Einigung. Wir\nbehalten es uns vor, bis zum 31. des kommenden Monats einen für uns günstigeren Zulieferer zu finden. Hierfür\nzuständig sind MH und TH. Neue Lieferpartner könnten im asiatischen Raum gesucht werden. MH berichtet über\ngute Erfahrungen in dieser Region. Ziel ist es, ohne weitere Ansprüche beiderseits von dem Vertrag des Zulieferers\nzurückzutreten. Gerichtliche Schritte werden dann nicht unternommen.\nBis zum 20. des kommenden Monats ist darüber zu berichten.\nTOP 3 Zwischenstand Qualitätssicherung\nDie Abteilung Qualitätssicherung erarbeitete ein neues Konzept für Qualitätsprüfung in der Phase der\nEndproduktion. Das vor zwei Quartalen umgesetzte Konzept zeigt in der Qualitätsmessung bereits bei einer\nAbweichung von 30 Prozent eine Fehlermeldung. Dies führt seit drei Monaten zu einem messbaren Erfolg, berichtet\nJR. Die Zahl der Reklamationen ist zurückgegangen.\nTOP 4 Neue Überstundenregelung\nVE dankt allen Mitarbeitenden für die mehrheitliche Bereitschaft, Überstunden zu leisten. Vor allem in Zeiten höher\nAuftragseingänge lässt sich das leider nicht immer vermeiden.\nBisher konnten die Mitarbeitenden diese Überstunden als Freizeit ausgleichen oder sich auszahlen lassen. Aufgrund\neines momentan unerwartet hohen Auftragsvolumens wird ab sofort festgelegt, dass bin zu 20. Überstunden pro\nQuartal ausschließlich vergütet werden können, da die Freistellung von der Arbeit aus personellen Gründen\nmomentan nicht möglich ist. Bei sinkendem Auftragseingang kann man diese Maßnahme zu einem späteren\nZeitpunkt wieder rückgängig machen.\nDiese Vorgehensweise ist mit Protokoll vom 15.06.20XX vom Betriebsrat genehmigt.\nTOP 5 Private Nutzung der Dienstwagen\nSM teilt mit, dass alle Mitarbeiter, die über einen Dienstwagen verfügen, diesen ab dem nächsten Monat nicht mehr\nnur für dienstliche, sondern auch für private Zwecke nutzen können. Es wird aber darauf hingewiesen, dass dann\nunbedingt ein Fahrtenbuch geführt werden muss, das die privat gefahrenen Kilometer angibt. Dieses ist monatlich in\nder Finanzabteilung einzureichen.\nTOP 6 Sonstiges\nTH präsentiert eine Idee seiner Mitarbeiterinnen und Mitarbeiter, sie möchten am Samstag in zwei Wochen einen\ngeselligen Bowlingabend in der Anlage „Sport und Spaß“ Marienstraße 10-12, verbringen. Dazu laden sie alle\ninteressierten Kolleginnen und Kollegen aus anderen Abteilungen ein. Die Personalabteilung wird diese Information\nins Intranet stellen. Wer Interesse hat, soll sich dort bis Freitag nächster Woche anmelden.","questions":[{"n":14,"text":"Der Termin der nächsten Sitzung","options":[{"key":"a","text":"muss noch entschieden werden."},{"key":"b","text":"wird nach der Urlaubszeit abgestimmt."},{"key":"c","text":"wurde während der Sitzung gesprochen."}],"answer":"c"},{"n":15,"text":"Die Firma","options":[{"key":"a","text":"hat ohne Weiteres die Preiserhöhung des Zulieferers akzeptiert."},{"key":"b","text":"will sich an den höheren Transportkosten gern beteiligen."},{"key":"c","text":"wird einen neuen Vertragspartner suchen."}],"answer":"c"},{"n":16,"text":"Die Abteilung Qualitätssicherung","options":[{"key":"a","text":"berichtet von 30 Prozent fehlerhafter Produkte."},{"key":"b","text":"hat keine Qualitätsprobleme."},{"key":"c","text":"verzeichnet erste Erfolge."}],"answer":"c"},{"n":17,"text":"Die Mitarbeitenden","options":[{"key":"a","text":"haben mit dem Betriebsrat gesprochen."},{"key":"b","text":"können alle Überstunden als Freizeit nehmen."},{"key":"c","text":"müssen zurzeit Mehrarbeit leisten."}],"answer":"c"},{"n":18,"text":"Das Fahrtenbuch","options":[{"key":"a","text":"dokumentiert alle gefahrenen Kilometer."},{"key":"b","text":"enthält nichtdienstliche Autofahrten."},{"key":"c","text":"wird von allen Mitarbeitern geführt."}],"answer":"b"}]},{"id":"L4-P44-45","title":"Originalaufgabe · Seiten 44-45","pages":[44,45],"body":"Lesen Teil 4 (\n(neue Werbemaßnahmen, Frau Schlosser)\nProtokoll 14.02.20XX,      08:00-11:45 Uhr\nAbteilung 4, Besprechungszimmer 2\nTeilnehmende: Holger Marschke (HM, Teamleiter), Cornelia Markert (CM, Marketingabteilung), Susanne Willke\n(SW,Marketingabteilung), Monique Rüdiger (MR, Betriebsratsmitglied)\nEntschuldigt: Martin Hamann (MH, Qualitätssicherung)\nProtokollantin: Marianne Schiller (MS)\nSitzungsleitung: Andreas Mertens (AM)\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung des letzten Protokolls\n2. Neue Marketingmaßnahmen\n3. Qualitätsmanagement\n4. Anpassung der Pausenzeiten\n5. Standorte der neuen Fahrradständer\n6. Sonstiges\nTOP 1 Begrüßung und Genehmigung des letzten Protokolls\nAM begrüßt alle Teilnehmenden und eröffnet die heutige Sitzung. Das Protokoll des letzten Meetings am\n10.01.20XX wird ohne weitere Änderungen und Ergänzungen einstimmig per Handzeichen genehmigt. Auf Antrag\nvon MR, die wegen anderweitiger terminlicher Verpflichtungen nicht bis zum Ende am Meeting teilnehmen kann,\nwird die Reihenfolge der Tagesordnung geändert und die TOPs 4 und 5 werden am heutigen Vormittag vorgezogen.\nTOP 2 Neue Marketingmaßnahmen\nCM und SW berichten, dass traditionelle Marketingmaßnahmen wie z. B. Fernsehwerbung zu den Hauptsendezeiten\nzu teuer sind. Deshalb sollen soziale Medien wie Facebook, Instagram u. a. verstärkt genutzt werden. Weitere\nMöglichkeiten, Werbung zu machen, müssen von der Marketingabteilung noch erörtert werden, Es ist geplant, neue\nWege zu gehen und zusätzlich zu den lokalen Geschäften einen Online-Shop zu starten. Für alle diese Maßnahmen\nsteht insgesamt ein Budget von 150.000 € zur Verfügung. CM wird beauftragt, dafür eine spezialisierte\nWerbeagentur zu finden sowie einen Kostenvoranschlag der betreffenden Agentur einzuholen, SW soll Kontakte zu\nprofessionellen Fotografen und Textern herstellen und Angebote anfordern.\nErgebnisse der beiden Recherchen werden bei der nächsten Besprechung am 10.03.20XX vorgestellt. Das weitere\nVorgehen wird definiert, wenn alle nötigen Informationen vorliegen.\nTOP 3 Qualitätsmanagement\nZu den in der Besprechung vom 11.01.20XX vorgeschlagenen Maßnahmen hat MH im Vorfeld allen\nSitzungsteilnehmenden erste Ergebnisse des Arbeitskreises „Optimierung innerer Kommunikationsstrukturen\" in\nForm eines Konzeptpapiers zukommen lassen. Da MH an der heutigen Sitzung aus gesundheitlichen Gründen nicht\nteilnehmen kann, ist gemeinsam beschlossen worden, die Diskussion zu diesem Punkt bis zur nächsten Besprechung\nam 10.03.20XX zu vertagen. Damit ist die Umsetzung der geplanten Veränderungen auf das nächste Quartal\nverschoben.\nTOP 4 Anpassung der Pausenzeiten\nAufgrund mehrfacher Anfragen von Seiten der Abteilungsleiter regt MR an, dass die Zeiten, in denen Pausen\ngemacht werden können, flexibler gestaltet werden. Sie schlägt ein erweitertes Zeitfenster zwischen 11:30 Uhr und\n13:00 Uhr vor, in dem eine Mittagspause von 30 Minuten gemacht werden kann. So können die betrieblichen\nNotwendigkeiten und Arbeitsabläufe verschiedener Abteilungen besser berücksichtigt werden. Dieser Vorschlag\nwird einstimmig angenommen, MR wird beauftragt, eine entsprechende Mitteilung an die Belegschaft über die\nÄnderung der Pausenzeiten zu verfassen.\nTOP 5 Standorte der neuen Fahrradständer\nMR teilt mit, dass auf Wunsch der Belegschaft zwei weitere Fahrradständer auf dem Gelände aufgestellt werden.\nDabei wurden zwei Standorte favorisiert und der erste Fahrradständer wird neben Tor 2, der zweite neben Tor 3\ninstalliert. So steht den Mitarbeitenden nun an jedem Zugang zum Gelände eine Möglichkeit zur Verfügung, ihr\nFahrrad abzustellen.\nDementsprechend werden der Lageplan überarbeitet und die neuen Standorte der Fahrradständer eingezeichnet. MR\nformuliert dazu eine Mitteilung und wird diese intern kommunizieren und am Schwarzen Brett des Betriebsrats\naushängen.\nTOP 6 Sonstiges\nDie Assistentin der Geschäftsleitung, Frau Schlosser, verabschiedet sich in den Mutterschutz und die anschließende\nElternzeit. Ansprechpartnerin bis zu ihrer Rückkehr wird für alle ab sofort Frau Meier im Büro von Frau Schmidt\nsein. Frau Meier wird eine Abschiedsfeier für den 16.03.20XX organisieren und sich auch um kleine Geschenke für\nMutter und Kind im Namen der Kolleginnen und Kollegen kümmern.","questions":[{"n":14,"text":"Für neue Werbemaßnahmen","options":[{"key":"a","text":"werden kreative Mitarbeiter gesucht."},{"key":"b","text":"wird ein Gesamtbetrag von 150.000 € bereitgestellt."},{"key":"c","text":"wurden Kostenvoranschläge angefragt."}],"answer":"b"},{"n":15,"text":"Herr Hamann","options":[{"key":"a","text":"hat bereits ein Konzept vorbereitet."},{"key":"b","text":"ist dienstlich verhindert."},{"key":"c","text":"stellt die Resultate seiner Arbeit vor."}],"answer":"a"},{"n":16,"text":"Die Mittagspause","options":[{"key":"a","text":"ist 30 Minuten lang."},{"key":"b","text":"wird um 30 Minuten verlängert."},{"key":"c","text":"wird um 30 Minuten verschoben."}],"answer":"a"},{"n":17,"text":"Der Standort der neuen Fahrradständer","options":[{"key":"a","text":"wird an der Informationstafel bekanntgegeben."},{"key":"b","text":"wird dem Betriebsrat mitgeteilt."},{"key":"c","text":"wird zwischen Tor 2 und 3 geplant."}],"answer":"a"},{"n":18,"text":"Frau Schlosser","options":[{"key":"a","text":"macht Frau Schmidt ein Geschenk."},{"key":"b","text":"verlässt das Unternehmen."},{"key":"c","text":"wird von Frau Meier vertreten."}],"answer":"c"}]},{"id":"L4-P46-47","title":"Originalaufgabe · Seiten 46-47","pages":[46,47],"body":"Lesen Teil 4 (\n(neue Werbemaßnahmen, Frau Schlosser)\nProtokoll 14.02.20XX,      08:00-11:45 Uhr\nAbteilung 4, Besprechungszimmer 2\nTeilnehmende: Holger Marschke (HM, Teamleiter), Cornelia Markert (CM, Marketingabteilung), Susanne Willke\n(SW,Marketingabteilung), Monique Rüdiger (MR, Betriebsratsmitglied)\nEntschuldigt: Martin Hamann (MH, Qualitätssicherung)\nProtokollantin: Marianne Schiller (MS)\nSitzungsleitung: Andreas Mertens (AM)\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung des letzten Protokolls\n2. Neue Marketingmaßnahmen\n3. Qualitätsmanagement\n4. Anpassung der Pausenzeiten\n5. Standorte der neuen Fahrradständer\n6. Sonstiges\nTOP 1 Begrüßung und Genehmigung des letzten Protokolls\nAM begrüßt alle Teilnehmenden und eröffnet die heutige Sitzung. Das Protokoll des letzten Meetings am\n10.01.20XX wird ohne weitere Änderungen und Ergänzungen einstimmig per Handzeichen genehmigt. Auf Antrag\nvon MR, die wegen anderweitiger terminlicher Verpflichtungen nicht bis zum Ende am Meeting teilnehmen kann,\nwird die Reihenfolge der Tagesordnung geändert und die TOPs 4 und 5 werden am heutigen Vormittag vorgezogen.\nTOP 2 Neue Marketingmaßnahmen\nCM und SW berichten, dass traditionelle Marketingmaßnahmen wie z. B. Fernsehwerbung zu den Hauptsendezeiten\nzu teuer sind. Deshalb sollen soziale Medien wie Facebook, Instagram u. a. verstärkt genutzt werden. Weitere\nMöglichkeiten, Werbung zu machen, müssen von der Marketingabteilung noch erörtert werden, Es ist geplant, neue\nWege zu gehen und zusätzlich zu den lokalen Geschäften einen Online-Shop zu starten. Für alle diese Maßnahmen\nsteht insgesamt ein Budget von 150.000 € zur Verfügung. CM wird beauftragt, dafür eine spezialisierte\nWerbeagentur zu finden sowie einen Kostenvoranschlag der betreffenden Agentur einzuholen, SW soll Kontakte zu\nprofessionellen Fotografen und Textern herstellen und Angebote anfordern.\nErgebnisse der beiden Recherchen werden bei der nächsten Besprechung am 10.03.20XX vorgestellt. Das weitere\nVorgehen wird definiert, wenn alle nötigen Informationen vorliegen.\nTOP 3 Qualitätsmanagement\nMH hat vor der heutigen Sitzung allen Anwesenden erste Vorschläge zur Verbesserung der Produktqualität\nzugeschickt, die er mit seiner Arbeitsgruppe erstellt hat. Da MH heute wegen Krankheit nicht an dem Meeting\nteilnehmen kann, wird beschlossen, diesen Punkt bis zur nächsten Besprechung am 10.03.20XX zu vertagen. Damit\nverschiebt sich auch die Umsetzung Maßnahmen zur Qualitätssicherung. MH hat aber zugesagt, bis Anfang März\nnoch weitere Idee erarbeiten und zu kommunizieren.\nTOP 4 Anpassung der Pausenzeiten\nAufgrund mehrfacher Anfragen von Seiten der Abteilungsleiter regt MR an, dass die Zeiten, in denen Pausen\ngemacht werden können, flexibler gestaltet werden. Sie schlägt ein erweitertes Zeitfenster zwischen 11:30 Uhr und\n13:00 Uhr vor, in dem eine Mittagspause von 30 Minuten gemacht werden kann. So können die betrieblichen\nNotwendigkeiten und Arbeitsabläufe verschiedener Abteilungen besser berücksichtigt werden. Dieser Vorschlag\nwird einstimmig angenommen, MR wird beauftragt, eine entsprechende Mitteilung an die Belegschaft über die\nÄnderung der Pausenzeiten zu verfassen.\nTOP 5 Standorte der neuen Fahrradständer\nMR teilt mit, dass auf Wunsch der Belegschaft zwei weitere Fahrradständer auf dem Gelände aufgestellt werden.\nDabei wurden zwei Standorte favorisiert und der erste Fahrradständer wird neben Tor 2, der zweite neben Tor 3\ninstalliert. So steht den Mitarbeitenden nun an jedem Zugang zum Gelände eine Möglichkeit zur Verfügung, ihr\nFahrrad abzustellen.\nDementsprechend werden der Lageplan überarbeitet und die neuen Standorte der Fahrradständer eingezeichnet. MR\nformuliert dazu eine Mitteilung und wird diese intern kommunizieren und am Schwarzen Brett des Betriebsrats\naushängen.\nTOP 6 Sonstiges\nDie Assistentin der Geschäftsleitung, Frau Schlosser, verabschiedet sich in den Mutterschutz und die anschließende\nElternzeit. Ansprechpartnerin bis zu ihrer Rückkehr wird für alle ab sofort Frau Meier im Būro von Frau Schmidt\nsein. Frau Meier wird eine Abschiedsfeier für den 16.03.20XX organisieren und sich auch um kleine Geschenke für\nMutter und Kind im Namen der Kolleginnen und Kollegen kümmern.","questions":[{"n":14,"text":"Die neuen Werbemaßnahmen","options":[{"key":"a","text":"dürfen bis zu 150.000 Euro kosten."},{"key":"b","text":"sollen Online-Medien ausschließen."},{"key":"c","text":"werden bis zur nächsten Teamsitzung umgesetzt."}],"answer":"a"},{"n":15,"text":"Herr Hamann","options":[{"key":"a","text":"hat erste Arbeitsergebnisse versendet."},{"key":"b","text":"realisiert bis Marz die Maßnahmen zur Qualitätssicherung."},{"key":"c","text":"stellt die Resultate seiner Arbeit vor."}],"answer":"a"},{"n":16,"text":"Die Mittagspause","options":[{"key":"a","text":"wird um 30 Minuten verlängert."},{"key":"b","text":"wird um 30 Minuten verschoben."},{"key":"c","text":"ist 30 Minuten lang."}],"answer":"c"},{"n":17,"text":"Der Standort der neuen Fahrradständer","options":[{"key":"a","text":"wird dem Betriebsrat mitgeteilt."},{"key":"b","text":"wird zwischen Tor 2 und 3 geplant."},{"key":"c","text":"wird an der Informationstafel bekanntgegeben."}],"answer":"c"},{"n":18,"text":"Frau Schlosser","options":[{"key":"a","text":"verlässt das Unternehmen."},{"key":"b","text":"wird von Frau Meier vertreten."},{"key":"c","text":"macht Frau Schmidt ein Geschenk."}],"answer":"b"}]},{"id":"L4-P48-49","title":"Originalaufgabe · Seiten 48-49","pages":[48,49],"body":"Lesen Teil 4 (\n(Personalthemen, Urlaubssperre)\nProtokoll 19.11.20XX,           08.00-11.45 Uhr\nZentrale, Raum 405\nSitzungsleitung: Lukas Wallner (LW)\nTeilnehmende: Jessica Müller (JM, Personalabteilung), Maximilian Berger (MB, Marketingabteilung), Rebecca\nLehmann (RL, Öffentlichkeitsarbeit), Kurt Meichsner (KM, Verkauf)\nExtern: Ansgar Wolf (AW, Hausverwaltung)\nProtokollantin: Beate Richter (BR)\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung des letzten Protokolls\n2. Personal\n3. Kundenbindung, Rabattaktion\n4. Vorbereitungen der Messe\n5. Neujahrsfeier\n6. Sonstiges\nTOP 1 Begrüßung und Genehmigung des letzten Protokolls\nLW begrüßt alle Teilnehmer und eröffnet die heutige Besprechung. Herr Dr. Baumann aus der Qualitätssicherung\nlässt sich entschuldigen, da er in dieser Woche auf einer Dienstreise ist. Das Protokoll des Meetings vom 14.\nNovember wird ohne weitere Änderungen und Ergänzungen einstimmig per Handzeichen genehmigt.\nTOP 2 Personal\nDie Kundenbetreuung ist aktuell unterbesetzt, weil viele Kollegen krank sind. Auch in der Personalabteilung\nherrscht ein hoher Krankenstand. Krankmeldungen aus allen Abteilungen sollen deshalb vorübergehend direkt an\nJM gesendet werden.\nUrlaubsanträge können im Moment nur im Falle dringender persönlicher Angelegenheiten genehmigt werden.\nAufgrund des hohen Krankenstands mussten einige Kollegen in den letzten Monaten besonders viele Überstunden\nmachen, die möglichst bis zum Ende des Kalenderjahres abgebaut werden sollten. Sollte dies aufgrund des hohen\nArbeitspensums nicht möglich sein, können die Überstunden auch in das nächste Jahr übertragen werden.\nHerr Wortmann aus dem Verkauf geht am 1. Februar des nächsten Jahres in den Ruhestand. Sein Nachfolger wird\nKM, den Herr Wortmann ab sofort einarbeitet. Im Rahmen der Neujahrsfeier wird unser langjähriger Mitarbeiter\nverabschiedet. Wir möchten ihm zum Abschied eine Freude machen. Ideen hierzu bitte an JM , die anschließend das\nGeld einsammeln und das Geschenk besorgen wird.\nZum 1. Dezember beginnen drei neue Mitarbeiter in der Produktion, da die Verkaufszahlen stark gestiegen sind.\nTOP 3 Kundenbindung, Rabattaktion\nKM hat erfahren, dass der Wettbewerber Lutz GmbH für das Frühjahr eine Rabattaktion plant. RL schlägt vor,\nebenfalls eine Kampagne zur Kundenbindung zu entwickeln. KM hat hierfür bereits einen ersten Entwurf für ein\nKonzept ausgearbeitet und legt diesen vor. Er schlägt vor, das Konzept in einer kleineren Runde zu diskutieren. Wer\nInteresse hat, an diesem Brainstorming teilzunehmen, soll sich bis zum Ende der Woche bei KM melden.\nTOP 4 Vorbereitungen der Messe\nIm nächsten Jahr wird unsere Firma erstmals an der Frühjahrsmesse in Dresden teilnehmen, die vom 20.- 24. April\nstattfindet. MB aus der Marketingabtellung berichtet, dass bereits der Standplatz gebucht und der Messebauer\nbeauftragt ist. Interessierte können sich die Standgestaltung im Büro von MB ansehen. Auch die Broschüren zu\nunserem Messeauftritt sind bereits im Druck und können in der 2. KW an unsere Kunden verschickt werden.\nAbschließend bittet MB JM, externes Standpersonal und Hotelzimmer für die Mitarbeiter zu buchen, die auf die\nMesse gehen.\nTOP 5 Neujahrsfeier\nJM berichtet, dass am 7. Januar die Neujahrsfeier im Restaurant „Zum Schwan\" stattfindet. Die Einladungen und\nMenüvorschläge werden verschickt. Alle Mitarbeiter sollen bis zum 15. Dezember Bescheid sagen, mit wie vielen\nPersonen sie teilnehmen und was sie essen möchten. Die Geschäftsführung hat auch eine kleine Überraschung für\ndie Mitarbeiter an diesem Abend geplant.\nTOP 6 Sonstiges\nAW informiert über Renovierungsarbeiten im ersten Stock, die für die nächste Woche geplant sind. Die Firma\nBuntschuh wird die Wände in der Teeküche Montag und Dienstag nächster Woche streichen. Da die Küche dafür\nkomplett ausgeräumt werden muss, werden die Mitarbeiter gebeten, bei dieser Gelegenheit persönliche Gegenstände\nwie zum Beispiel nicht firmeneigene Kaffeetassen, Brotdosen und Ähnliches bis Donnerstag an sich zu nehmen.\nAnsonsten werden diese durch AW entsorgt.","questions":[{"n":14,"text":"Bei der Sitzung wird","answer":"c","options":[{"key":"a","text":"das Protokoll der letzten Besprechung geändert."},{"key":"b","text":"die Tagesordnung genehmigt."},{"key":"c","text":"über Personalthemen gesprochen."}]},{"n":15,"text":"Einige Mitarbeiter machen Überstunden,","options":[{"key":"a","text":"da andere Urlaub machen."},{"key":"b","text":"obwohl sie krank sind."},{"key":"c","text":"weil viele Kollegen krank sind 15. Aufgrund des hohen Krankenstands"}],"answer":"c"},{"n":16,"text":"","options":[{"key":"a","text":"ist Wettbewerber der Firma."},{"key":"b","text":"möchte sein Konzept besprechen."},{"key":"c","text":"plant eine Rabattaktion im Frühling."}],"answer":"b"},{"n":17,"text":"Die Firma","options":[{"key":"a","text":"besucht die Frühjahrsmesse regelmäßig"},{"key":"b","text":"braucht Hilfe bei der Standgestaltung."},{"key":"c","text":"lässt gerade Broschüren drucken."}],"answer":"c"},{"n":18,"text":"Persönliche Gegenstände","options":[{"key":"a","text":"können nicht in der Küche bleiben."},{"key":"b","text":"sollen am Donnerstag mitgenommen werden."},{"key":"c","text":"sollen weggeworfen werden."}],"answer":"a"}]},{"id":"L4-P50-51","title":"Originalaufgabe · Seiten 50-51","pages":[50,51],"body":"Lesen Teil 4 (\n(neue Werbestrategie, Jobticket)\nProtokoll 15.04.2003,      14:00-16:00 Uhr\nTagungsraum: 256, Ort: Geschwister-Scholl-Platz 12, 10738 Berlin\nAnwesende: Petra Kramer (PK, Geschäftsleitung), Yvonne Schmidt (YS, Assistenz der Geschäftsleitung) Thorsten\nKlein (TK, Leitung Einkauf), Sonja Kühl (SK, Leitung Finanzen), Jenny Mitschke (JM, Leitung Marketing), Ilkay\nErgün (IE, Leitung Produktion), Johannes Schön (JS, Leitung Personal)\nGast: Jonas Braun (Deutsches Rotes Kreuz)\nSitzungsleitung: Johannes Schön\nProtokollantin: Yvonne Schmidt\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung des Protokolls der letzten Sitzung\n2. Neue Werbemaßnahmen\n3. Beschwerden über schlecht geputzte Büros\n4. Fortbildung der Ersthelfer\n5. Einführung eines Jobtickets\n6. Sonstiges\nTOP 1 Begrüßung und Genehmigung des Protokolls der letzten Sitzung\nJS begrüßt alle Anwesenden und stellt den Gast Jonas Braun vom Deutschen Roten Kreuz vor. Weiterhin bittet er\num die Genehmigung des Protokolls der letzten Sitzung. SK merkt an, dass das Datum des diesjährigen\nSommerfests falsch im letzten Protokoll festgehalten wurde. Dieses findet am 19.07. statt. Die Änderung wird\naufgenommen, ansonsten wird das Protokoll genehmigt.\nTOP 2 Neue Werbemaßnahmen\nJM berichtet, dass die Marketingabteilung eine neue Werbestrategie entwickelt hat, um die Verkaufszahlen wieder\nzu verbessern. SK hatte in der letzten Sitzung berichtet, dass sie seit Januar dieses Jahres stetig zurückgegangen\nsind.\nUm langfristige Lösungen zu finden, wurde eine Marktanalyse in Auftrag gegeben. Bevor die Ergebnisse vorliegen,\nsollen aber bereits erste Maßnahmen ergriffen werden. Ein IT-Mitarbeiter erarbeitet zurzeit ein Konzept, um die\nHomepage der Firma etwas moderner und benutzerfreundlicher zu gestalten. Außerdem sollte man unsere\nHomepage möglichst auf der ersten Seite in der Suchmaschine finden können. Diese Maßnahmen wären relativ\nschnell und kostengünstig umsetzbar.\nAuch die Präsenz in den sozialen Medien soll weiter ausgebaut werden, um die jüngere Zielgruppe noch besser zu\nerreichen. JM schlägt in diesem Zusammenhang vor, kurze, unterhaltsame Werbevideos zu drehen. Für deren\nProduktion wurde ein Filmteam angefragt, das auf dem Markt sehr erfolgreich, aber auch sehr teuer ist. PK\nbeauftragt JM, bis zur nächsten Sitzung noch andere, günstigere Filmteams über Produktion zu prüfen.\nTOP 3 Beschwerden über schlecht geputzte Büros\nSeit der Zusammenarbeit mit der neuen Reinigungsfirma beschweren sich viele Kollegen aus verschiedenen\nAbteilungen darüber, dass die tägliche Reinigung der Büros unzureichend ausgeführt wird. Kritikpunkte sind\nschmutzige Tische, unregelmäßig geleerte Mülleimer und unordentlich gesaugte Fußböden. Dazu kommt, dass die\nReinigungskräfte bei Eintreffen der Mitarbeiter gegen 9 Uhr noch anwesend sind, obwohl die Reinigungsarbeiten\nbis 8.30 Uhr abgeschlossen sein sollten. JS soll Kontakt zur Reinigungsfirma aufnehmen, um das Problem zu\nbesprechen. Sollte es zu keiner Änderung kommen, wird der Vertrag fristlos gekündigt.\nTOP 4 Fortbildung der Ersthelfer\nUnsere Ersthelfer müssen regelmäßig Fortbildungen besuchen. Dafür konnten wir Jonas Braun vom Deutschen\nRoten Kreuz als Kursleiter gewinnen, der zusammen mit JS aus der Personalabteilung Samstag, den 10.06. als\nTermin festgelegt hat. Das Training dauert neun Stunden. Es wird bei uns im Haus stattfinden und als Arbeitszeit\nangerechnet. Die Teamleiter sollen möglichst bald klären, ob die bisherigen Ersthelfer diese Funktion weiter\nübernehmen möchten oder ob es neue Interessenten gibt. Jonas Braun weist allerdings darauf hin, dass die\nTeilnehmerzahl auf acht Personen beschränkt ist. Die interessierten Mitarbeiter müssen sich bis zum 15.05. in der\nPersonalabteilung anmelden.\nTOP 5 Einführung eines Jobtickets\nPK teilt mit, dass aufgrund der schwierigen Parksituation mehr Mitarbeiter dazu animiert werden sollen, öffentliche\nVerkehrsmittel zu nutzen. Aus diesem Grund wird sich die Firma an den Fahrtkosten der Beschäftigten in Form von\nJobtickets beteiligen. Das bedeutet, dass Mitarbeiter ab dem 01.07. zu ihrer Monatskarte einen Zuschuss von 50\nProzent, maximal aber 60 Euro erhalten.\nAntragsformulare sind bei JS erhältlich. Er steht auch für Fragen zur Verfügung.\nTOP 6 Sonstiges\nTK berichtet, dass sich die Lieferzeiten unseres Zulieferers wieder normalisiert haben. Die Ursache der\nVerzögerungen war ein Mitarbeiterstreik in der Partnerfirma in Litauen, der aber inzwischen beigelegt wurde.\nJS teilt mit, dass von den vier neu eingestellten Mitarbeitern einer die Probezeit nicht beendet hat und seit dem\n01.04. nicht mehr in der Firma tätig ist.","questions":[{"n":14,"text":"Die neue Werbestrategie","options":[{"key":"a","text":"beinhaltet ein Video über die Produktionsabläufe."},{"key":"b","text":"ist wegen der schlechten Verkaufszahlen notwendig."},{"key":"c","text":"lässt sich sehr schnell und kostengünstig umsetzen."}],"answer":"b"},{"n":15,"text":"Die Reinigungsfirma","options":[{"key":"a","text":"hält sich nicht an die vereinbarten Putzzeiten."},{"key":"b","text":"putzt die Büros der Firma nicht regelmäßig."},{"key":"c","text":"wird den Vertrag demnächst kündigen."}],"answer":"a"},{"n":16,"text":"Die Fortbildung für Ersthelfer","options":[{"key":"a","text":"ist nur mit begrenzter Teilnehmerzahl möglich."},{"key":"b","text":"müssen die Teilnehmer nur einmal absolvieren."},{"key":"c","text":"wird beim Deutschen Roten Kreuz veranstaltet."}],"answer":"a"},{"n":17,"text":"Das Jobticket","options":[{"key":"a","text":"soll zu 60 Prozent finanziert werden."},{"key":"b","text":"kann in der Personalabteilung beantragt werden."},{"key":"c","text":"wird ab nächsten Monat eingeführt."}],"answer":"b"},{"n":18,"text":"Der Streik in Litauen","options":[{"key":"a","text":"dauert immer noch an."},{"key":"b","text":"fand landesweit statt."},{"key":"c","text":"führte zu Lieferproblemen."}],"answer":"c"}]},{"id":"L4-P52-53","title":"Originalaufgabe · Seiten 52-53","pages":[52,53],"body":"Lesen Teil 4 (\n(Frau Wagner, Kantine)\nProtokoll 05.02.20XX,    14.00 - 16.00 Uhr\nSitzungsraum: 239, Ort: Hauptstraße 23, 25421 Pinneberg\nAnwesende: Michael Müller (MM, Stellvertreter Geschäftsleitung), Katrin Wagner (KW, Leitung Personal), Henry\nSmith (HS, Leitung Produktion), Tomás Rodrgiuez (TR, Leitung Vertrieb), Manuela Hinz (MH, Leitung\nQualitätsmanagement), Karl Lehmann (KL, Leitung Finanzen), Sabine Kurz (SK, Hausverwaltung)\nSitzungsleitung: Michael Müller\nProtokollantin: Katrin Wagner\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung des letzten Protokolls\n2. Probleme bei der Warenauslieferung\n3. Berichte\n4. Sanierung der Kantine\n5. Neue Krankmeldungsregelung\n6. Sonstiges\nTOP 1 Begrüßung und Genehmigung des letzten Protokolls\nMM heißt alle Anwesenden zur heutigen Besprechung willkommen und bittet um die Genehmigung des Protokolls\nder letzten Sitzung. Per Handzeichen wird das Protokoll der Sitzung vom 08.01. ohne weitere Änderungen und\nErgänzungen einstimmig genehmigt. Aufgrund terminlicher Verpflichtungen muss KW die Sitzung früher verlassen\nund bittet darum, TOP 5 der heutigen Tagesordnung vorzuziehen. Das wird einstimmig angenommen.\nTOP 2 Probleme bei der Warenauslieferung\nTR teilt mit, dass sich immer wieder Kunden über den Zustand unserer gelieferten Waren beschwert haben. Auf\ndem Transportweg kommt es wohl immer wieder zu Beschädigungen der Verpackungen, sodass die Ware teilweise\ngar nicht oder nur zu stark reduzierten Preisen an den Endkunden verkauft werden kann. Man habe mit der\nSpedition schon öfter über diese Problematik gesprochen. Diese sieht das Problem jedoch bei uns und ist der\nAnsicht, dass die Schäden durch minderwertiges Verpackungsmaterial entstehen und nicht durch den Transport. MH\nund HS haben das Verpackungsmaterial überprüft und weisen den Vorwurf vehement zurück. Nachdem das\nProblem bis heute nicht gelöst werden konnte, macht MH den Vorschlag, dass unsere Firma die Lieferungen in\nZukunft selbst übernimmt. Dafür werden KL und TR zusammen ein Konzept zur Finanzierung erarbeiten. Dieses\nsoll zur übernächsten Sitzung in zwei Monaten vorliegen.\nTOP 3 Berichte\nSH berichtet, dass durch die Einstellung von zehn Zeitarbeitskräften am Fließband 3 und 4 der personelle Engpass\nfür den Moment behoben werden konnte, und dankt der Personalabteilung für die prompte und unbürokratische\nLösung des Problems. Er regt an, um die Unterbesetzung in der Produktion dauerhaft zu lösen, einige\nZeitarbeitskräfte festzustellen. Insbesondere Herr Ahmed Hassani und Frau Ina Zurek sind HS durch Ihre\nZuverlässigkeit und schnelle Auffassungsgabe positiv aufgefallen.\nTOP 4 Sanierung der Kantine\nKS macht darauf aufmerksam, dass die Küche ab dem kommenden Montag saniert wird und die Kantine\ninfolgedessen voraussichtlich sechs bis acht Wochen geschlossen sein wird. Alle Abteilungsleiter sollen ihre Teams\ndaran erinnern, sich selbst Verpflegung mitzubringen oder alternativ das Bistro „Suppenkasper“ in der Sonnenstraße\nzu nutzen. Die Essensmarken der Firma gelten während der Kantinenschließung auch dort in der Mittagszeit von\n12.00 bis 14.00 Uhr.\nTOP 5 Neue Krankmeldungsregelung (vorgezogener TOP)\nDie Geschäftsleitung hatte in der letzten Mitarbeiterversammlung angekündigt, dass die Mitarbeiter zukünftig schon\nab dem ersten Krankheitstag einen Krankenschein vom Arzt benötigen. Die bisherige Regelung ab dem dritten WK\nberichtet, dass diese Entscheidung in der Belegschaft für großen Unmut sorgt. Sie bittet alle Abteilungsleiter ein\nweiteres Mal, den Sinn dieser Maßnahme zu erläutern. In der nächsten Sitzung soll das Thema noch einmal\nbehandelt werden. Man hofft auf eine breite Akzeptanz.\nTOP 6 Sonstiges\nMM teilt mit, dass ab dem kommenden Monat für die Autofahrer mehr Parkplätze zur Verfügung stehen. Diese\nentstehen neben dem Eingang C. Alle Mitarbeiterinnen und Mitarbeiter sollen in einer Rundmail darüber informiert\nwerden und wer Interesse hat, kann in der Personalabteilung einen kostenlosen Stellplatz beantragen.","questions":[{"n":14,"text":"Frau Wagner","options":[{"key":"a","text":"bittet um Änderungen des Protokolls vom 08.01."},{"key":"b","text":"hat heute noch einen anderen wichtigen Termin."},{"key":"c","text":"schlägt einen zusätzlichen Tagesordnungspunkt vor."}],"answer":"b"},{"n":15,"text":"Die Geschäftsleitung möchte, dass","options":[{"key":"a","text":"das Thema Krankmeldung nicht mehr besprochen wird."},{"key":"b","text":"man bei Krankheit spätestens am dritten Tag zum Arzt geht."},{"key":"c","text":"sich Mitarbeiter bei Krankheit sofort krankschreiben lassen."}],"answer":"c"},{"n":16,"text":"Karl Lehmann soll","options":[{"key":"a","text":"besseres Verpackungsmaterial einkaufen."},{"key":"b","text":"einen Finanzierungsplan erstellen."},{"key":"c","text":"Kontakt mit der Spedition aufnehmen."}],"answer":"b"},{"n":17,"text":"In der Produktionsabteilung","options":[{"key":"a","text":"gibt es derzeit genügend Mitarbeiter."},{"key":"b","text":"will man alle Zeitarbeiter fest anstellen."},{"key":"c","text":"wurden zwei neue Mitarbeiter fest eingestellt."}],"answer":"a"},{"n":18,"text":"In der Kantine","options":[{"key":"a","text":"bekommt man in den kommenden Wochen kein Essen."},{"key":"b","text":"kann man ab Montag von 12 bis 14 Uhr zu Mittag essen."},{"key":"c","text":"sollten die Essensmarken abgeschafft werden."}],"answer":"a"}]},{"id":"L4-P54-55","title":"Originalaufgabe · Seiten 54-55","pages":[54,55],"body":"Lesen Teil 4 (\n(Frau Bruhns, Betriebsausflug)\nProtokoll 27.08.20XX,     10.00 bis 11.30 Uhr bis 11.30 Uhr\nKonferenzraum Rhein-Main, Am Wegesrand 12, 63345 Frankfurt\nAnwesende: Thomas Köhler (TK, Werkstatt). Brigitte Turner (\nHilde Bruhns (HB, Buchhaltung)\nEntschuldigt: Kari Muster (KM, Lager)\nSitzungsleitung: Gerd Schneider\nProtokollfühning: Thomas Köhler\nTagesordnungspunkte:\n1. Begrüßung und Eröffnung der Sitzung\n2. Erste-Hilfe-Kurs\n3. Homeoffice\n4. Personelle Engpässe Buchhaltung\n5. Betriebsausflug\n6. Sonstiges\nTOP 1 Begrüßung und Eröffnung der Sitzung\nGS eröffnet die Sitzung, begrüßt alle Anwesenden und stellt den Kolleg*innen Hilde Bruhns vor, die seit dem 1.\nAugust in der Abteilung Buchhaltung für die Auszahlung der Gehälter etc. zuständig ist.\nTOP 2 Erste-Hilfe-Kurs\nTK berichtet, dass es vor Kurzem zu einem Unfall in der Werkstatt gekommen ist, bei dem ein Kollege am Arm\nverletzt wurde und stark geblutet hat. Obwohl regelmäßig Sicherheitsunterweisungen, für die Mitarbeitenden im\nLager und in der Werkstatt stattfinden, reagierte nur ein Kollege ruhig und besonnen und war in der Lage, den\nVerletzten zu versorgen und dann Hilfe zu holen. Die anderen wussten nicht, was sie tun sollten. Auch in der\nMarketingabteilung gab es eine Situation, in der einer Kollegin wohl wegen der Hitze schwindlig wurde und ein\nKrankenwagen gerufen werden musste, da niemand von den Mitarbeiter*innen helfen konnte.\nTK schlägt deshalb vor, einen Erste-Hilfe-Kurs im Unternehmen zu organisieren, an dem alle interessierten\nAngestellten teilnehmen können. TK hat bereits mit dem Roten Kreuz gesprochen. Es wäre möglich, dort kurzfristig\neinen solchen Kurs an zwei Freitagsterminen zu buchen.\nTOP 3 Homeoffice\nin der Woche von zu Hause aus zu arbeiten, wenn sie Aufgaben zu erledigen haben, die eine Anwesenheit im Büro\nnicht unbedingt erforderlich machen.\nBT steht diesem Wunsch offen gegenüber. Durch diese Möglichkeit könnten die Mitarbeiter*innen die Zeit für\nden Arbeitsweg sparen und sich ihre Arbeitszeit flexibler einteilen. Das würde sicher erheblich zur\nMitarbeiterzufriedenheit beitragen. Den Mitarbeiter*innen, die im Homeoffice arbeiten, müssten firmeneigene\nLaptop, Diensthandys zur Verfügung gestellt werden. Da aber bereits einige mobile Geräte im Unternehmen\nvorhanden sind, würde das keine signifikanten Mehrkosten bedeuten. Sollte sich das Arbeitsmodell „Homeoffice”\nbewähren, könnte für die Kolleg*innen die regelmäßig von zu Hause aus arbeiten, ein VPN-Tunnel eingerichtet\nwerden, durch den sie sicheren Zugang zu den Daten auf dem Firmenserver erhalten würden.\nhalten, bevor sie den Vorschlag der Geschäftsführung vorlegt.\nTOP 4 Personelle Engpässe in der Buchhaltung\nGS teilt mit, dass die Buchhaltung zur Zeit trotz der Neueinstellung von Frau Bruhns personell unterbesetzt ist.\nDas Arbeitsaufkommen ist von den derzeit drei Mitarbeiter*innen in der Abteilung nicht mehr zu bewältigen. Im\nMoment ist auch noch eine Kollegin krank, sodass das verbleibende Kolleg*innen viele Überstunden machen\nmüssen, um die Arbeit zu schaffen. Er plant, eine weitere Mitarbeiterin oder ein weiteren Mitarbeiter einzustellen.\nTOP 5 Betriebsausflug\nHB arbeitet im diesjährigen Team für die Organisation des Betriebsausflugs mit, um so gleich einige Kolleg*\ninnen kennenzulernen. Sie berichtet, dass der Ausflug am 1. Oktober stattfindet. Alle Mitarbeiter*innen treffen sich\nmorgens um 9.00 Uhr vor dem Haupteingang der Firma. Dort werden sie von einem Bus abgeholt und zum Kastell\nSaalburg gefahren.\nVom Parkplatz am Fuße der Burg aus ist eine kleine Wanderung geplant. Am Ziel wartet eine Überraschung. Für\ndas leibliche Wohl ist gesorgt. Die Rückkehr zur Firma ist für 19.00 Uhr gleichen Tag vorgesehen.\nTOP 6 Sonstiges\nEntfällt. Keiner der Anwesenden hat noch Punkte zu besprechen.","questions":[{"n":14,"text":"Frau Bruhns","options":[{"key":"a","text":"arbeitet seit einigen Wochen in der Buchhaltung."},{"key":"b","text":"bezahlt die Gehälter der Mitarbeiter*innen."},{"key":"c","text":"nimmt bald ihre Tätigkeit auf."}],"answer":"b"},{"n":15,"text":"Der Erste-Hilfe-Kurs","options":[{"key":"a","text":"findet jeden Freitag statt."},{"key":"b","text":"ist für alle Mitarbeiter* innen verpflichtet."},{"key":"c","text":"wird vom Roten Kreuz durchgeführt."}],"answer":"c"},{"n":16,"text":"Homeoffice","options":[{"key":"a","text":"erfordert die Anschaffung neuer Arbeitsgeräte."},{"key":"b","text":"verringert die Arbeitszeit der Mitarbeitenden."},{"key":"c","text":"wird von vielen Mitarbeitenden gewünscht."}],"answer":"c"},{"n":17,"text":"In der Abteilung Buchhaltung","answer":"c","options":[{"key":"a","text":"gibt es zu viele Beschäftigte."},{"key":"b","text":"sind viele Kolleg*innen erkrankt."},{"key":"c","text":"soll eine Stelle ausgeschrieben werden."}]},{"n":18,"text":"Der Betriebsausflug wird","answer":"a","options":[{"key":"a","text":"für den ganzen Tag geplant."},{"key":"b","text":"jedes Jahr von den gleichen Personen organisiert."},{"key":"c","text":"zum besseren Kennenlernen der Kolleg*innen genutzt."}]}]},{"id":"L4-P56-57","title":"Originalaufgabe · Seiten 56-57","pages":[56,57],"body":"Lesen Teil 4 (\n( Kosteneinsparnis, Lagebericht, Betriebsartzt)\nProtokoll 15.01.20XX,       10.00 bis 11.30 Uhr\nSitzungsraum 205, Ort: Hauptstraße 27, 99099 Erfurt\nAnwesende: Jakob Müller (JM, Geschäftsleitung), Friedrich Döring (FD, Vertrieb), Karl Altmann (KA, Buchhaltung\nund Finanzen), Peter Bischoff (PB, Produktion), Karsten Hinz (KH, Logistik), Jana Bartsch ( JB, Personal), Beate\nFritsch (BF, Marketing), Jonas Stoll ( JS, IT-Abteilung).\nSitzungsleitung: Jakob Müller\nProtokollant: Jonas Stoll\nTagesordnungspunkte:\n1. Begrüßung und Tagesordnung\n2. Kosteneinsparungen\n3. Lagebericht Produktion\n4. Kündigung des Betriebsarztes\n5. Betriebliche Altersvorsorge\n6. Sonstiges\nTOP 1 Begrüßung und Tagesordnung\nJM heißt die Kolleg*innen zur heutigen Besprechung herzlich willkommen und bestätigt die Anwesenheit aller\neingeladenen Teilnehmer*innen. Danah erkundigt JM sich, ob noch zusätzliche Themen protokollarisch\naufgenommen werden sollen. Hierzu gibt es keine Kommentare und damit gilt die Tagesordnung als genehmigt.\nTOP 2 Kosteneinsparungen\nWie JM darstellt, hat sich der Markt im Vergleich zum Vorjahr stark verändert. In diesem Zusammenhang müssen\ndeshalb Kostenstrukturen neu überdacht werden. Es wird vorgeschlagen, die administrativen Kosten zu senken, da\nes hier Einsparungspotential gibt. Im Vorfeld zu dieser Besprechung wurde JB bereits von der Geschäftsleitung\nbeauftragt, eine exakte Kostenübersicht zu erstellen und Vorschläge zur Kostenreduzierung vorzulegen. JB legt dar,\ndass die in der Firmenzentrale eingehenden Anrufe auf ein externes Call- Center umgeleitet werden könnten.\nVerschiedene Kostenvoranschläge wurden hierfür auch schon eingeholt. Die Firma tele-info scheint unseren\nAnsprüchen am besten gerecht zu werden. Deshalb sollten Vertragsverhandlungen aufgenommen und zeitgleich\nSchulungpläne für die Call-Center-Mitarbeiter*innen ausgearbeitet werden, um ihnen die Organisationsstruktur\ndes Unternehmens so schnell wie möglich näherzubringen, damit die Arbeit ohne Verzögerung aufgenommen\nwerden kann. Durch die so gewonnene Zeitersparnis am Empfang können Mitarbeiter*innen von dort flexibler\neingesetzt werden und zum Beispiel zusätzlich den für das Unternehmer wichtigen Konferenzbereich und die\nGästebetreuung übernehmen. JM stimmt den Vorschlägen zu und bittet um Umsetzung der weiteren Schritte.\nTOP 3 Lageberichrt Produktion\nPB merkt an, dass auch in seiner Abteilung eine Kostenreduzierung möglich wäre, indem unausgewogene\nLagerungen von Material und Rohstoffen vermieden werden. Das Lagerungsmanagement ist optimierbar, d.h.,\ndass sowohl zu hohe als auch niedrige Lagermengen vermieden werden müssen, da sie zu unnötigen Kosten\nführen. Im Fall von Überbeständen muss neue Lagerfläche geschaffen werden und im Fall von Unterbeständen\nkann es zu kurzfristigen Produktionsausfällen kommen. JM beauftragt PB , sich umgehend zusammen mit KH mit\ndieser Thematik auseinanderzusetzen und zur nächsten Sitzung konkrete Zahlen und Vorschläge vorzulegen.\nTOP 4 Kündigung des Betriebsarztes\nMit Bedauern teilt die Gechäftsleitung mit, dass unser Betriebsarzt die Firma zum Jahresende verlässt, da er eine\neigene Praxis eröffnen will. Aus diesem Grund hat sich die Firma entschlossen, die Ersthelferausbildung zu\nforcieren, damit bei kleineren Verletzungen, die im Produktionsablauf immer wieder auftreten können, sofort\neingegriffen werden kann. Ärztliche Unterstützung bekommen wir ab nächstem Jahr von der Allgemeinärztlichen\nPraxis Dr.Mertens. Die Kontaktdaten werden bekannt gegeben.\nTOP 5 Betriebliche Altersvorsorge\nSeit einem Jahr bietet die Firma den Mitarbeiter*innen an, in eine betriebliche Zusatzrente zu investieren. Bisher\nwird dieses Angebot aber nur von wenigen Kolleg*innen genutzt. Deshalb werden erneut alle\nAbteilungsleiter*innen darauf hingewiesen, in ihren Abteilungen über diese Möglichkeit der Altersvorsorge\naufzuklären. Interessierte Mitarbeiter*innen können in der Personalabteilung genauere Informationen erhalten.\nZusätzlich bietet die Versicherungsgesellschaft immer donnerstags eine gesonderte Sprechstunde an, zu der man\nsich aber anmelden muss.\nTOP 6 Sonstiges\nDie Mitarbeiter*innen werden gebeten, im Intranet abzustimmen, ob die Firma in diesem Jahr für alle\nKolleg*innen entweder einen eintägigen Betriebsausflug oder ein Sommerfest organisieren soll. Für den\nBetriebsausflug könnten dann auch gleich Vorschläge unterbreitet werden. Die Abstimmung muss bis zum 31.03\nerfolgen, damit für das 0rganisationskomitee noch ausreichend Zeit für die Planung bleibt.","questions":[{"n":14,"text":"Bei der Besprechung","options":[{"key":"a","text":"müssen weitere Themen besprochen werden."},{"key":"b","text":"sind alle Mitarbeiter*innen des Unternehmens anwesend."},{"key":"c","text":"wird die Tagesordnung angenommen."}],"answer":"c"},{"n":15,"text":"Um Kosten zu sparen,","options":[{"key":"a","text":"sollen einige Empfangsmitarbeiter*innen in ein Call-Center wechseln."},{"key":"b","text":"werden die Aufgaben der Mitarbeitenden am Empfang neu festgelegt."},{"key":"c","text":"wird der Empfanf demnächst geschlossen."}],"answer":"b"},{"n":16,"text":"Der Lagerbestand muss","options":[{"key":"a","text":"an die Produktion angepasst werden."},{"key":"b","text":"dauerhaft ausgebaut werden."},{"key":"c","text":"kurzfristig reduziert werden."}],"answer":"a"},{"n":17,"text":"Der Betriebsarzt wird","options":[{"key":"a","text":"mit Dr. Mertens zusammenarbeiten."},{"key":"b","text":"zukünftig selbstständig arbeiten."},{"key":"c","text":"zum Jahresende entlassen."}],"answer":"b"},{"n":18,"text":"Die betriebliche Altersvorsorge","options":[{"key":"a","text":"kann bei ainem vereinbarten Termin besprochen werden."},{"key":"b","text":"nehmen viele Mitarbaiter*innen an."},{"key":"c","text":"wird neu in der Fima eingeführt."}],"answer":"a"}]},{"id":"L4-P58-59","title":"Originalaufgabe · Seiten 58-59","pages":[58,59],"body":"Lesen Teil 4 (\n(Marketingmaßnahmen, Einführung Jobticket)\nSitzungsraum: 112, Ort: Ludwigstr. 23, 79342 Herbolzen\nAnwesende: Jan Schneider (JS,Geschäftsleitung), Sabine Faust (SF, Leiterin Marketing), Paul Mayer (PM, Leiter\nProduktion), Tim Janzen (TJ, Leiter Vertrieb), Chiara Reich (CR, Leiterin IT), Simon Zitzmann (SZ,Leiter Personal),\nMona Seil(MS, Leiterin Controlling)\nSitzungsleitung: Jan Schneider, Protokollant: Simon Zitzmann\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung der Tagesordnungspunkte\n2. Marketingmaßnahmen\n3. Berichte\n4. Erweiterte Überstundenregelung\n5. Einführung Jobticket\n6. Sonstiges\nTOP 1 Begrüßung und Genehmigung der Tagesordnungspunkte\nJS begrüßt die Abteilungsleitungen zur heutigen Sitzung, die daraufhin pünktlich eroffnet wird. Anschließend bittet\ner um die Genehmigung der Tagesordnungspunkte. Nach Handzeichen wird die Tagesordnung ohne Ergänzungen\nund Änderungen einstimmig genehmigt. Als nächster Besprechungstermin wird der 25.06. vor der großen\nSommerpause einstimmig festgelegt.\nTOP 2 Marketingmaßnahmen\nNach dem im letzten Quartal von MS und TJ festgestellten Absatzrückgang wurden bereits auf der letzten Sitzung\nneue Verkaufsstrategien beschlossen. Hierzu wurde von der Geschäftsleitung ein Budget von 350.000 Euro\nfreigegeben. SF berichtet, dass schon im Vorfeld neue Zielgruppen beleuchtet wurden, insbesondere die Gruppe\nder Berufseinsteiger und Hochschulabsolventen, also die Altersgruppe 17 bis 25 Jahre. Im Vergleich dazu lag der\nFokus bisher auf Verbraucher im Alter von 30 bis 50 Jahren.\nZunächst wurde eine Social-Media-Agenturbeauftragt, um gezielt neue Endverbraucher anzusprechen. Hierzu\nliegen auch schon erste Ergebnisse vor, die zeigen, dass das Interesse die Aufmerksamkeit um 38% gestiegen sind.\nInfolgedessen stieg der Umsatz um 18 % im Vergleich zum Vorjahr. JS zeigt sich mit dieser ersten Entwicklung\nzufrieden und erwartet einen weiteren positiven Trend. Für das nächste Quartal ist geplant, positive\nKundenreaktionen im Internet hochzuladen. SF betont, dass gerade in diesem Bereich die Zukunft liegt und\nregelmäßige Neuerungen erwartet werden können. Deshalb wird sie in den kommenden Sitzungen regelmäßig\nneue Konzepte präsentieren.\nTOP 3 Berichte\nSz berichtet darüber, dass die Mitarbeitenden in der Produktion seit dem Einbau der neuen Maschinen gehäuft\nüber eine enorme Lärmbelastung klagen würden. Hier bestehe dringender Handlungsbedarf, da im anderen Fall\neine Überprüfung durch die Behörden erfolgen konnte. PM wird mit der Herstellerfirma dieser Anlagen Kontakt\naufnehmen, um dieses Problem zu klären. Bis zur Lösung sollten Gehörschützer benutzt werden.\nTOP 4 Erweiterte Überstundenregelung\nJS teilt einen Vorschlag der Geschäftsleitung hinsichtlich einer erweiterten Überstundenregelung mit. Aufgrund\neiner sich ständig ändernden Auftragslage kommt es vor, dass den Mitarbeitenden immer mehr Überstunden\nzugemutet werden. Die bisherige Regelung, dass bis zehn Stunden Mehrarbeit im Monat bezahlt werden, bleibt\nbestehen. Die Stunden darüber hinaus werden weiterhin als Freizeitausgleich gewährt. Neu kommt hinzu, dass ab\ndem kommenden Jahr für jeweils 100 geleistete Überstunden jährlich ein Urlaubstag zusätzlich gegeben wird. SZ\nwird diese Maßnahme in der nächsten Betriebsratssitzung zur Prüfung und Genehmigung vorlegen.\nTOP 5 Einführung Jobticket\nDa in der Vergangenheit die Situation auf unseren Firmenparkplätzen sehr angespannt war, nahm die Firma\nKontakt zum örtlichen öffentlichen Personennahverkehr auf, um die Einführung von Jobtickets für die\nMitarbeitenden möglich zu machen. Viele Mitarbeitende hatten zuvor diesen Wunsch geäußert. SZ teilt mit, dass\ndie Verhandlungen kurz vor dem Abschluss stehen. Wer Interesse an diesem günstigen Ticket hat, sollte sich per\nMail oder persönlich in der Personalabteilung dafür anmelden. Die Abteilungsleiter übernehmen es, Ihre\nAbteilungen zu informieren.\nTOP 6\nUnser Unternehmen und das Fitnesscenter fit und fun, das sich in der unmittelbaren Nähe unserer Firma befindet,\nhaben gemeinsam ein Angebot für unsere Mitarbeiter erarbeitet. Wenn man seine Betriebszugehörigkeit\nnachweist, kann man einen Vertrag zu besonders günstigen Konditionen abschließen. SZ schlägt vor, man könnte\ndort zu einem späteren Zeitpunkt sogar ein Sportfest für die Abteilungen durchführen. Diesen Vorschlag begrüßt JS.","questions":[{"n":14,"text":"Die Besprechung","options":[{"key":"a","text":"beginnt zu festgelegten Uhrzeit."},{"key":"b","text":"soll auf den 25.06. verlegt werden."},{"key":"c","text":"wird durch Änderungen ergänzt."}],"answer":"a"},{"n":15,"text":"Die Umsatzsteigerung","options":[{"key":"a","text":"beträgt 350.000 Euro."},{"key":"b","text":"liegt bei 38 %."},{"key":"c","text":"wird sich fortsetzen."}],"answer":"c"},{"n":16,"text":"Die Überstundenregelung","options":[{"key":"a","text":"bleibt genauso bestehen."},{"key":"b","text":"erhält eine Ergänzung."},{"key":"c","text":"gilt ab 100 Überstunden."}],"answer":"b"},{"n":17,"text":"Das Jobticket","options":[{"key":"a","text":"ist eine preislich unattraktive Variante."},{"key":"b","text":"können die Mitarbeiter beim ÖPNV kaufen."},{"key":"c","text":"soll den Arbeitsweg stressfreier machen."}],"answer":"c"},{"n":18,"text":"Sportliche Aktivitäten","options":[{"key":"a","text":"finden in dem Unternehmen statt."},{"key":"b","text":"sollen in den Abteilungen stattfinden."},{"key":"c","text":"werden von der Firma gefördert."}],"answer":"c"}]},{"id":"L4-P60-61","title":"Originalaufgabe · Seiten 60-61","pages":[60,61],"body":"Lesen Teil 4 (\n(Frau Schäfer, Sommerfest)\nProtokoll 19. Februar 20XX, 10.00-11.45 Uhr\nKonferenzraum 7,\nOrt: Neuburger Allee 28, 87341 Ballhausen\nAnwesende: Maria Loppinet (ML, Geschäftsführung), Lukas Meier (LM, Leitung Einkauf), Magda Nauner (MN,\nLeitung Personal), Gert Schrader (GS, Leitung Produktion), Peter Schuldt (PS, Leitung Verkauf), Katja Stevens\n(KS, Leitung Qualitätskontrolle), Volha Schäfer (VS, Leitung Finanzen)\nGast: Wanda Lubic (WL, ITBeauftragte),\nSitzungsleitung: Magda Nauner\nProtokollantin: Volha Schäfer\nTagesordnungspunkte:\n1. Begrüßung und Genehmigung des letzten Protokolls\n2. Stand des Projekts ,,Fertigungsanlage\"\n3. Berichte\n4. Neue Mitarbeiterinnen und Mitarbeiter\n5. Update der Software\n6. Sonstiges\nTOP 1 Begrüßung und Genehmigung des letzten Protokolls\nMN begrüßt Frau Loppinet und alle Leiterinnen und Leiter zur heutigen Sitzung. Sie bittet um Genehmigung des\nProtokolls der letzten Sitzung. Nach Handzeichen wird das Protokoll der Sitzung vom 15.01. ohne weitere\nÄnderungen und Ergänzungen.\nTOP 2 Stand des Projekts „Fertigungsanlage\"\nLM gibt einen Überblick zum Projekt „Fertigungsanlage\". Er berichtet über den Auftrag an eine Firma aus Italien,\ndie bereits ähnliche Anlagen hergestellt und aufgebaut hat. Die italienische Firma kommt nächsten Monat, um sich\nvor Ort ein Bild von unseren Werkshallen II und IV zu machen, wo die Anlage stehen soll. Der genaue Termin steht\nnoch nicht fest. Wenn Werkshalle II oder IV als geeignet erscheint, wird unmittelbar mit der Herstellung der\nFertigungsanlage in Italien begonnen.\nDie Montage der Anlage ist dann einige Monate später. Wie geplant soll die neue Fertigungsanlage im folgenden\nFrühjahr betriebsbereit sein. Sollte keine der beiden Werkshallen für den Aufbau der Fertigungsanlage groß genug\nsein, müssten wir zuerst eine komplett neue Werkshalle auf dem südlichen Werksgelände errichten lassen. Dadurch\nkönnte sich die Inbetriebnahme einer neuen Fertigungsanlage um mindestens 8 bis 9 Monate verschieben.\nTOP 3 Berichte\nGS berichtet über die ohne große Probleme laufende Produktion der Metallkästen und Metallgehäuse, die sehr\nnachgefragt sind. Bei noch größerer Nachfrage nach Metallgehäusen könnte jedoch die derzeitige Fertigungsanlage\nnicht ausreichen. GS freut sich daher über die Planung einer neuen Fertigungsanlage. PS legt neue Verkaufszahlen\nvor, die im letzten Quartal 20 Prozent über dem vergleichbaren Quartal des Vorjahrs liegen. Besonders die\nMetallgehäuse für den Hochbau zeigen sehr gute Verkaufszahlen. PS erwähnt hier einen großen Auftrag aus\nKasachstan, der für das hohe Auftragsvolumen ausschlaggebend ist.\nTOP 4 Neue Mitarbeiterinnen und Mitarbeiter\nMN nennt die Namen von fünf neuen Mitarbeiterinnen und Mitarbeitern, drei Frauen und zwei Männern, die ab dem\n1. des Monats im Betrieb in Vollzeit tätig sind.\nTOP 5 Update der Software\nWL spielt am kommenden Freitag ab 19 Uhr ein Software-Update auf unser Computersystem. Daher darf am\nFreitag ab 19 Uhr niemand am Computer arbeiten. Die leicht überarbeitete Software hat einige Neuerungen. Allen\nMitarbeiterinnen und Mitarbeitern werden diese Neuerungen in einem halbtägigen Info-Workshop demonstriert. Es\nwird zeitversetzte Workshops geben. Die Termine dafür werden noch bekannt gegeben.\nTOP 6 Sonstiges\nML berichtet über den Stand der Planung eines Sommerfests, das etwas größer als in den vergangenen Jahren sein\nsoll. Alle wichtigen Kunden und großen Lieferanten werden eingeladen. ML bittet alle Leiterinnen und Leiter, sich\nden 31. Juli freizuhalten. Der Ort steht auch schon fest. ML möchte ihn aber noch nicht nennen. Es soll eine\nÜberraschung für alle sein, da der 31. Juli auch ihr 60. Geburtstag ist, den sie mit allen feiern möchte.","questions":[{"n":14,"text":"Das Protokoll","options":[{"key":"a","text":"der letzten Sitzung ist nach Überarbeitung genehmigt."},{"key":"b","text":"nennt die Teilnehmer der Januar-Sitzung."},{"key":"c","text":"wird heute von Frau Schäfer geschrieben."}],"answer":"c"},{"n":15,"text":"Die neue Fertigungsanlage","options":[{"key":"a","text":"kommt in die Werkshalle IV."},{"key":"b","text":"steht in einem Neubau."},{"key":"c","text":"wird in Italien gebaut."}],"answer":"c"},{"n":16,"text":"Metallkästen und Metallgehäuse","options":[{"key":"a","text":"lassen sich nur in Deutschland verkaufen."},{"key":"b","text":"sind eine Belastung für die Produktion."},{"key":"c","text":"zeigen steigende Verkaufszahlen."}],"answer":"c"},{"n":17,"text":"Das Update der Software","options":[{"key":"a","text":"erfordert ein neues Computersystem."},{"key":"b","text":"schließt einen eintägigen Workshop mit ein."},{"key":"c","text":"wird am Freitag installiert."}],"answer":"c"},{"n":18,"text":"Die Geschäftsführerin","options":[{"key":"a","text":"berichtet über Ort und Termin eines Sommerfests."},{"key":"b","text":"erwartet eine genaue Planung des Sommerfests."},{"key":"c","text":"möchte zum Sommerfest Kunden und Lieferanten einladen."}],"answer":"c"}]}],"sprach1":[{"id":"SB1-P75","title":"Originalaufgabe · Seite 75","page":75,"body":"Sprachbausteine Teil 1 (\nBewerbung um ein Praktikum\nSehr geehrte Damen und Herren,\nzunächst bedanke ich mich für das freun aus.\nWir würden uns freuen, Sie bald wieder in einer unserer Filialen 57 (____).\nMit freundlichen Grüßen\nLudmilla Dombrowski Leiterin Kundenservice\n52. a) Ihren Auftrag angenommen\n    b) Ihre Bestellung erhalten\n    c) Ihre Reklamation geprüft\n53. a) das Problem unbemerkt\n    b) der Mangel übersehen\n    c) der Schaden behoben\n54. a) Auf dieser Stelle\n    b) In diesem Zustand\n55. a) Fehler zu beanstanden\n    b) Probleme zu berücksichtigen\n    c) Unannehmlichkeiten zu entschuldigen\n56. a) für den Betrag von\n    b) in Höhe von\n    c) zum Preis von\n57. a) begrüßen zu dürfen\n    b) beobachten zu dürfen\n    c) besuchen zu dürfen","questions":[{"n":52,"answer":"c","options":[{"key":"a","text":"Ihren Auftrag angenommen"},{"key":"b","text":"Ihre Bestellung erhalten"},{"key":"c","text":"Ihre Reklamation geprüft"}]},{"n":53,"answer":"b","options":[{"key":"a","text":"das Problem unbemerkt"},{"key":"b","text":"der Mangel übersehen"},{"key":"c","text":"der Schaden behoben"}]},{"n":54,"answer":"b","options":[{"key":"a","text":"Auf dieser Stelle"},{"key":"b","text":"In diesem Zustand 55. a) Fehler zu beanstanden b) Probleme zu berücksichtigen"},{"key":"c","text":"Unannehmlichkeiten zu entschuldigen 56. a) für den Betrag von b) in Höhe von c) zum Preis von 57. a) begrüßen zu dürfen b) beobachten zu dürfen c) besuchen zu dürfen"}]},{"n":55,"answer":"c","options":[{"key":"a","text":"Fehler zu beanstanden"},{"key":"b","text":"Probleme zu berücksichtigen"},{"key":"c","text":"Unannehmlichkeiten zu entschuldigen"}]},{"n":56,"answer":"b","options":[{"key":"a","text":"für den Betrag von"},{"key":"b","text":"in Höhe von"},{"key":"c","text":"zum Preis von"}]},{"n":57,"answer":"a","options":[{"key":"a","text":"begrüßen zu dürfen"},{"key":"b","text":"beobachten zu dürfen"},{"key":"c","text":"besuchen zu dürfen"}]}]},{"id":"SB2-P86","title":"Originalaufgabe · Seite 86","page":86,"body":"Sprachbausteine Teil 2 (\n(\nIhre Beschwerde\nSehr geehrte Frau Janiashvilli,\nvielen Dank für Ihr Schreiben, in dem Sie uns auf die Schäden an der bei uns bestellten Bettcouch hinweisen. Wir\nhaben Ihre Reklamation anhand Ihrer mitgeschickten Fotos geprüft. Offensichtlich ist bei unserer Qualitätskontrolle\n52 (____) worden. Die Couch hätte 53 (____) nicht ausgeliefert werden\ndürfen.\nSelbstverständlich erhalten Sie ein Ersatzprodukt, das beschädigte Möbelstück wird dann kostenlos mitgenommen.\nWir bitten Sie, die entstandenen 54 (____). Rufen Sie uns gerne an und teilen\nSie uns mit, zu welchem Termin wir die neue 55 (____) sollen. Als Entschuldigung finden Sie\nanbei einen Gutschein 56 (____) 50 Euro.\nWir würden uns freuen, Sie bald wieder in einer unserer Filialen 57 (____).\nMit freundlichen Grüßen\nLudmilla Dombrowski\n52. a) das Problem verursacht\n    b) der Mangel übersehen\n    c) der Schaden behoben\n53. a) an diesen Ort\n    b) in diesem Zustand\n    c) zu diesem Zeitpunkt\n54. a) Fehler zu beanstanden\n    b) Probleme zu berücksichtigen\n    c) Unannehmlichkeiten zu entschuldigen\n55. a) Bestellung aufnehmen\n    b) Bettcouch abholen\n    c) Lieferung veranlassen\n56. a) für den Betrag von\n    b) in Höhe von\n    c) zum Preis von\n57. a) begrüßen zu dürfen\n    b) beobachten zu dürfen\n    c) besuchen zu dürfen","questions":[{"n":52,"answer":"b","options":[{"key":"a","text":"das Problem verursacht"},{"key":"b","text":"der Mangel übersehen"},{"key":"c","text":"der Schaden behoben"}]},{"n":53,"answer":"b","options":[{"key":"a","text":"an diesen Ort"},{"key":"b","text":"in diesem Zustand"},{"key":"c","text":"zu diesem Zeitpunkt"}]},{"n":54,"answer":"c","options":[{"key":"a","text":"Fehler zu beanstanden"},{"key":"b","text":"Probleme zu berücksichtigen"},{"key":"c","text":"Unannehmlichkeiten zu entschuldigen"}]},{"n":55,"answer":"c","options":[{"key":"a","text":"Bestellung aufnehmen"},{"key":"b","text":"Bettcouch abholen"},{"key":"c","text":"Lieferung veranlassen"}]},{"n":56,"answer":"b","options":[{"key":"a","text":"für den Betrag von"},{"key":"b","text":"in Höhe von"},{"key":"c","text":"zum Preis von"}]},{"n":57,"answer":"a","options":[{"key":"a","text":"begrüßen zu dürfen"},{"key":"b","text":"beobachten zu dürfen"},{"key":"c","text":"besuchen zu dürfen"}]}]},{"id":"SB2-P87","title":"Originalaufgabe · Seite 87","page":87,"body":"Sprachbausteine Teil 2 (\nZahlungserinnerung\nSehr geehrter Herr Batic,\nIn Oktober haben wir in Ihrem Firmengebäude an der Heizungsanlage Reparaturarbeiten ausgeführt. Da wir 52 (____) gehört haben, gehen wir davon aus, dass alles zu Ihrer Zufriedenheit war. Allerdings ist\nbislang für unsere Rechnung Nr. 2008/123 in Höhe von 2.746,- Euro leider keine 53 (____).\nFür den Fall, dass die Rechnung bei Ihnen verloren gegangen ist, senden wir Ihnen anbei eine neue mit der Bitte um\n54 (____).\nDa der Betrag bereits am 31. Oktober 55 (____) war, können wir Ihnen den eingeräumten Skonto von 2% leider\nnicht mehr 56 (____). Wir bitten um Verständnis.\nSollten Sie die Rechnung 57 (____) bezahlt haben, betrachten Sie dieses Schreiben bitte als\ngegenstandslos.\nMit freundlichen Grüßen\nIlka Desgrane (Heizung und Sanitär Resch)\n52. a) nichts Gegenteiliges\n    b) nur Anderes\n    c) viel Negatives\n53. a) Auszahlung veranlasst\n    b) Einzahlung gemacht\n    c) Zahlung eingegangen\n54. a) nachfolgenden Betrag\n    b) schnellstmögliche Überweisung\n    c) zeitnahe Korrektur\n55. a) abgelaufen\n    b) fällig\n    c) verspätet\n56. a) gewähren\n    b) leisten\n    c) überreichen\n57. a) infolgedessen\n    b) währenddessen\n    c) zwischenzeitlich","questions":[{"n":52,"answer":"a","options":[{"key":"a","text":"nichts Gegenteiliges"},{"key":"b","text":"nur Anderes"},{"key":"c","text":"viel Negatives"}]},{"n":53,"answer":"c","options":[{"key":"a","text":"Auszahlung veranlasst"},{"key":"b","text":"Einzahlung gemacht"},{"key":"c","text":"Zahlung eingegangen"}]},{"n":54,"answer":"b","options":[{"key":"a","text":"nachfolgenden Betrag"},{"key":"b","text":"schnellstmögliche Überweisung"},{"key":"c","text":"zeitnahe Korrektur"}]},{"n":55,"answer":"b","options":[{"key":"a","text":"abgelaufen"},{"key":"b","text":"fällig"},{"key":"c","text":"verspätet"}]},{"n":56,"answer":"a","options":[{"key":"a","text":"gewähren"},{"key":"b","text":"leisten"},{"key":"c","text":"überreichen"}]},{"n":57,"answer":"c","options":[{"key":"a","text":"infolgedessen"},{"key":"b","text":"währenddessen"},{"key":"c","text":"zwischenzeitlich"}]}]},{"id":"SB2-P89","title":"Originalaufgabe · Seite 89","page":89,"body":"Sprachbausteine Teil 2 (\nAuftragsbestätigung\nSehr geehrte Frau Mackbock,\nich danke Ihnen für Ihre Bestellung und bestätige hiermit die Zustellung des PKW Bulldog zum Preis von 1078\nEuro zzgl. MwSt. an die von 52 (____) Lieferadresse. Sollte die Ihre Rechnungsadresse nicht mit\nder Lieferadresse übereinstimmen, teilen Sie uns dies bitte bis spätestens 07.07 schriftlich mit.\nDie Rechnungszustellung erfolgt per Post. Bitte beachten Sie, dass wir bei Zahlung des Kaufpreises innerhalb von\nsieben Tagen nach Lieferung 53 (____). Ansonsten muss der Rechnungsbetrag bis 30\nTagen nach Wareneingang 54 (____).\nDie detaillierten Konditionen 55 (____) unseren allgemeinen Geschäftsbedingungen auf der\nRückseite dieser Auftragsbestätigung.\nBei Rückfragen steht Ihnen unser 24-Stunden-Service unter der Rufnummer 0175 545621 zur Verfügung. Bitte\nhalten Sie hierzu Ihre 56 (____).\nWir versprechen Ihnen eine zuverlässige 57 (____) und sind sicher, dass Sie mit unserem\nProdukt zufrieden sein werden.\nMit freundlichen Grüßen\nChristoph Sellert\n52. a) Ihnen angegebene\n    b) ihr angeordnete\n    c) mir angeführte\n53. a) drei Prozent Ermäßigung bezahlen\n    b) drei Prozent Rabatt wünschen\n    c) drei Prozent Skonto gewähren\n54. a) beglichen werden\n    b) dokumentiert werden\n    c) verhandelt werden\n55. a) entnehmen Sie bitte\n    b) erfahren Sie direkt\n    c) finden Sie gerne\n56. a) Auftragsnummer bereit\n    b) Kundennummer fest\n    c) Rechnungsnummer an\n57. a) Ausführung Ihres Auftrags\n    b) Bearbeitung Ihrer Anfrage\n    c) Durchführung Ihrer Arbeit","questions":[{"n":52,"answer":"a","options":[{"key":"a","text":"Ihnen angegebene"},{"key":"b","text":"ihr angeordnete"},{"key":"c","text":"mir angeführte"}]},{"n":53,"answer":"c","options":[{"key":"a","text":"drei Prozent Ermäßigung bezahlen"},{"key":"b","text":"drei Prozent Rabatt wünschen"},{"key":"c","text":"drei Prozent Skonto gewähren"}]},{"n":54,"answer":"a","options":[{"key":"a","text":"beglichen werden"},{"key":"b","text":"dokumentiert werden"},{"key":"c","text":"verhandelt werden"}]},{"n":55,"answer":"a","options":[{"key":"a","text":"entnehmen Sie bitte"},{"key":"b","text":"erfahren Sie direkt"},{"key":"c","text":"finden Sie gerne"}]},{"n":56,"answer":"a","options":[{"key":"a","text":"Auftragsnummer bereit"},{"key":"b","text":"Kundennummer fest"},{"key":"c","text":"Rechnungsnummer an"}]},{"n":57,"answer":"a","options":[{"key":"a","text":"Ausführung Ihres Auftrags"},{"key":"b","text":"Bearbeitung Ihrer Anfrage"},{"key":"c","text":"Durchführung Ihrer Arbeit"}]}]},{"id":"SB2-P90","title":"Originalaufgabe · Seite 90","page":90,"body":"Sprachbausteine Teil 2 (\nAuftragsbestätigung\n(\nSehr geehrte Frau Mackbock,\nich danke Ihnen für Ihre Bestellung und bestätige hiermit die Zustellung des PKW Bulldog zum Preis von 1078\nEuro zzgl. MwSt. an die von 52 (____) Lieferadresse. Sollte die Ihre Rechnungsadresse nicht mit\nder Lieferadresse übereinstimmen, teilen Sie uns dies bitte bis spätestens 07.07 schriftlich mit.\nDie Rechnungszustellung erfolgt per Post. Bitte beachten Sie, dass wir bei Zahlung des Kaufpreises innerhalb von\nsieben Tagen nach Lieferung 53 (____). Ansonsten muss der Rechnungsbetrag bis 30 Tagen\nnach Wareneingang 54 (____).\nDie detaillierten Konditionen 55 (____) in unseren allgemeinen Geschäftsbedingungen auf der\nRückseite unserer Auftragsbestätigung.\nBei Rückfragen steht Ihnen unser 24-Stunden-Service unter der Rufnummer 0175 345621 zur Verfügung. Bitte\nhalten Sie hierzu Ihre 56 (____).\nWir versprechen Ihnen eine zuverlässige 57 (____) und sind sicher, dass Sie mit unserem\nProdukt zufrieden sein werden.\nMit freundlichen Grüßen\nChristoph Sellert\n52. a) Ihnen angegebene\n    b) ihr angeordnete\n    c) mir angeführte\n53. a) 3% Ermäßigung bezahlen\n    b) 3% Rabatt wünschen\n    c) 3% Skonto gewähren\n54. a) beglichen werden\n    b) dokumentiert werden\n    c) verhandelt werden\n55. a) erklären Sie\n    b) schreiben Sie\n    c) finden Sie gerne\n56. a) Auftragsnummer bereit\n    b) Kundennummer fest\n    c) Rechnungsnummer an\n57. a) Ausführung Ihres Auftrags\n    b) Bearbeitung Ihrer Anfrage\n    c) Durchführung Ihrer Arbeit","questions":[{"n":52,"answer":"a","options":[{"key":"a","text":"Ihnen angegebene"},{"key":"b","text":"ihr angeordnete"},{"key":"c","text":"mir angeführte"}]},{"n":53,"answer":"c","options":[{"key":"a","text":"3% Ermäßigung bezahlen"},{"key":"b","text":"3% Rabatt wünschen"},{"key":"c","text":"3% Skonto gewähren"}]},{"n":54,"answer":"a","options":[{"key":"a","text":"beglichen werden"},{"key":"b","text":"dokumentiert werden"},{"key":"c","text":"verhandelt werden"}]},{"n":55,"answer":"c","options":[{"key":"a","text":"erklären Sie"},{"key":"b","text":"schreiben Sie"},{"key":"c","text":"finden Sie gerne"}]},{"n":56,"answer":"a","options":[{"key":"a","text":"Auftragsnummer bereit"},{"key":"b","text":"Kundennummer fest"},{"key":"c","text":"Rechnungsnummer an"}]},{"n":57,"answer":"a","options":[{"key":"a","text":"Ausführung Ihres Auftrags"},{"key":"b","text":"Bearbeitung Ihrer Anfrage"},{"key":"c","text":"Durchführung Ihrer Arbeit"}]}]}],"forum":[{"n":1,"title":"Papierlose Lohnabrechnung","prompt":"Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma erhalten künftig keine Lohn- / Gehaltsabrechnungen mehr in Papierform, sondern können diese selbst online einsehen. Sie müssen diese ab sofort selbst von ihrem persönlichen Konto im Intranet herunterladen. 2.Urlaub während der Betriebsferien: Alle Mitarbeiterinnen und Mitarbeiter in Ihrer Firma sollen ab dem kommenden Jahr während der dreiwöchigen Betriebsferien im August Urlaub nehmen. Die restlichen Urlaubstage können sie selbst planen."},{"n":3,"title":"Nur Vegan-Menü, plus 20% mehr bezahlen","prompt":"Vegetarische Essen in Kantine, dafür sollen alle Mitarbeiter 20% höher bezahlen: Alle Mitarbeitenden in Ihrer Firma sollen in der Kantine nur noch zwischen fleischlosen Gerichten wählen können. Alles soll Bioqualität haben und dafür etwas mehr kosten."},{"n":4,"title":"Keine Frühstückspause, 1 Stunde Mittagspause","prompt":"Nicht mehr 15 Minuten Frühstückspause, sondern verlängert sich die Mittagspause vom 45 Minuten zu einer Stunde in einem Stück."},{"n":5,"title":"Regelmäßige Arbeit durch Wochenende und Feiertage, extra 4 Tagen Urlaub.","prompt":""},{"n":6,"title":"Wer am Sonntag arbeitet, bekommt gratis Mittagessen, anderen kein.","prompt":""},{"n":7,"title":"Ein Jobticket für öffentlichen Verkehrsmittel (monatliche Gebühr selbst übernehmen, 20 Euro)","prompt":"Ihre Firma möchte für alle Mitarbeitenden ein kostenloses Jobticket für die Fahrten mit dem ÖPNV einführen. Dafür soll Parken auf dem Firmenparkplatz in Zukunft Geld kosten."},{"n":8,"title":"Firmenlaptop, man muss selbst Versicherung bezahlen","prompt":"Unternehmen geben den Mitarbeitenden Arbeitslaptop, aber sie müssen die Laptop Versicherung bezahlen."},{"n":9,"title":"Handy Firma kostenlos, aber 24 Stunden erreichbar sein.","prompt":""},{"n":10,"title":"Handys in der Großküche sind verboten","prompt":"Aus hygienischen Gründen dürfen die Küchenmitarbeiter kein Handy während der Arbeitszeit benutzen. Die Handys sollen im Spind eingeschlossen sein."},{"n":11,"title":"Fortbildung 5 Mal/Jahr, aber selbst bezahlt","prompt":"Alle Mitarbeiterinnen und Mitarbeiter Ihrer Firma sollen an einer Weiterbildung teilnehmen. Die Weiterbildung sollen Sie selbst bezahlen, aber sie findet während der Arbeitszeit statt."},{"n":12,"title":"Großraumbüro arbeiten","prompt":"Alle Mi
