N31","n":31,"transcript":"Frau 1: Kommt ihr auch? Gleich fängt das Meeting mit dem Chef an.\nHerr : Ja, wir kommen. Wisst ihr, worum es heute geht?\nFrau 2: Ich habe gehört, um einen Bereitschaftsdienst am Wochenende. Ich bin mal gespannt, was das bedeuten\nsoll.\nFrau 1: Ich denke, dass an jedem Wochenende immer einer aus dem Team erreichbar sein soll.\nFrau 2: Wieso soll das denn? Wir sind doch eh jeden Tag unter der Woche von morgens bis abends erreichbar. Ist\ndas nicht genug?\nFrau 1: Ja, aber unsere Kunden brauchen vielleicht auch am Wochenende einen Ansprechpartner und\nwenn wir samstags arbeiten, dann sollten wir auch ansprechbar sein\nHerr : Naja. Wenn es nur um eine telefonische Erreichbarkeit geht, ist es ja nicht so schlimm... Solange wir nicht\nins Büro kommen müssen.\nFrau 2: Kundenservice ist schon wichtig. Aber irgendwo ist auch mal eine Grenze. Jetzt hören wir erstmal, was der\nChef sagt.","answer":"d"}]},{"id":"H2V2","title":"Prüfungsvariante 2","pages":[124,125],"options":[{"key":"a","text":"Die Firma möchte, dass alle Mitarbeiter ihre Englischkenntnisse verbessern."},{"key":"b","text":"Ein Mitarbeiter nutzt eine besondere Urlaubsregelung, um seine Sprachkenntnisse zu verbessern."},{"key":"c","text":"Ein Mitarbeiter hilft einem Kollegen bei einem Kundengespräch in einer fremden Sprache."},{"key":"d","text":"Die Firma überlegt, ob sie weiterhin Übersetzungsdienste benötigt."},{"key":"e","text":"Ein Mitarbeiter plant, an einem Intensivsprachkurs teilzunehmen."},{"key":"f","text":"Ein Kollege übernimmt einen Teil der Arbeit, um einem Team zu helfen."}],"tracks":[{"id":"H2V2N28","n":28,"transcript":"Herr : Jana, ich habe gehört, dass du im nächsten Monat an einem Spanischkurs teilnimmst. Das ist ja toll. Fliegst\ndu dann nach Spanien?\nFrau : Das wäre wirklich super. Aber ich fliege nicht weg, sondern lerne zwei Wochen lang in einem Intensivkurs\nin einer Sprachschule hier in der Stadt.\nHerr : Nimmst du dafür Urlaubstage?\nFrau : Nein, das brauche ich nicht. Ich habe nämlich Bildungsurlaub.\nHerr : Bildungsurlaub?\nFrau : Ja. Den können wir doch jedes Jahr nehmen. Im letzten Jahr hatte ich keinen. Und nun stehen mir dieses Jahr\nsogar zwei Wochen für so eine Weiterbildung zu. Dafür brauche ich keine Urlaubstage zu nehmen.\nHerr : Und warum hast du dich für einen Spanischkurs entschieden?\nFrau : Ich spreche diese Sprache schon ganz gut und betreue deshalb unsere Kunden in Lateinamerika. Aber E-\nMails auf Spanisch zu schreiben fällt mir immer noch schwer.\nHerr : Dann wünsche ich dir viel Spaß und viel Erfolg.","answer":"b"},{"id":"H2V2N29","n":29,"transcript":"Frau : Stimmt das eigentlich, dass unsere Firma keine professionellen Übersetzer mehr bezahlen will? Habt ihr\netwas über diesen Plan gehört?\nHerr 1: Das kann ich mir nicht vorstellen. Wir müssen doch oft etwas in anderen Sprachen schreiben.\nHerr 2: Ja, erst gestern habe ich eine Information über das neue Produkt für den französischen Markt geschrieben.\nDas konnte ich auf Deutsch machen. Zum Glück. Die Übersetzer können das natürlich viel besser auf Französisch\nausdrücken als ich.\nFrau : Ich spreche überhaupt kein Französisch. Das kann doch auch keiner von uns verlangen.\nHerr 1: Unser Team ist ja ziemlich international. Vielleicht haben wir genug Mitarbeiter, die Präsentationen und E-\nMails in anderen Sprachen schreiben können.\nFrau : Aber professionell ist das nicht.\nHerr 2: Ich sehe das auch so wie Julia. Wir brauchen den Übersetzerservice. Hoffentlich behalten wir ihn.","answer":"d"},{"id":"H2V2N30","n":30,"transcript":"Frau : Hallo, Ahmed. Ich brauche deine Hilfe. Hast du einen Moment Zeit?\nHerr : Natürlich, Gina. Worum geht es denn?\nFrau : Ich bediene gerade einen Kunden, der ein neues Handy kaufen will. Er spricht zwar ganz gut Deutsch, aber\nwir wollen jetzt über den Vertrag sprechen. Das ist ein bisschen schwierig. Könntest du ihm das wohl auf Arabisch\nerklären? Der Kunde spricht Arabisch.\n124\nHerr : Ja, das kann ich machen. Am besten übernehme ich den Kunden. Und du machst hier weiter mit den\nBestellungen.\nFrau : Eigentlich habe ich ihm schon ziemlich viele Handymodelle gezeigt und würde gerne den Verkauf auch\nabschließen.\nHerr : Und jetzt möchtest du nicht auf deine Verkaufsprovision verzichten? Das kann ich ja auch verstehen. In\nOrdnung, gehen wir zusammen zu ihm.\nFrau : Danke, Achmed. Wenn ich dich nicht hätte.","answer":"c"},{"id":"H2V2N31","n":31,"transcript":"Frau 1: Nächste Woche fangen doch unsere Englischkurse an! Habt ihr euch schon für einen entschieden?\nHerr : Also ich bin Anfänger. Seit mindestens 20 Jahren habe ich kein Englisch mehr gesprochen und ich werde es\nin meinem Alter auch bestimmt nicht mehr lernen.\nFrau 2: Ich weiß gar nicht, wie gut mein Englisch ist. Die Lehrer werden uns sicherlich beraten, welcher Kurs der\nRichtige ist, oder? Vielleicht machen die ja auch einen Einstufungstest mit uns.\nHerr : Einen Test? Das wird ja immer schlimmer. Ich arbeite seit Jahren hier, ohne dass sich jemand für meine\nEnglischkenntnisse interessiert. Und jetzt soll ich plötzlich in einen Kurs gehen und Tests schreiben? Das gefällt mir\ngar nicht.\nFrau 1: Na ja, Hans, weil du kein Englisch sprichst, muss immer ich mit unseren internationalen Partnern\ntelefonieren. Du sollst das ja auch mal machen.\nFrau 2: Miriam hat recht. Wir arbeiten mit immer mehr Partnern in verschiedenen Ländern zusammen. Ich finde es\ngut, dass unsere Firma jetzt Englischkurse für uns anbietet.","answer":"a"}]},{"id":"H2V3","title":"Prüfungsvariante 3","pages":[126,127],"options":[{"key":"a","text":"Kleidung für die Feiertage sollte schick aussehen."},{"key":"b","text":"Auf der Firmenfeier gibt es keine Kleiderordnung."},{"key":"c","text":"Beim Firmenlauf sollen möglichst viele Mitarbeiter teilnehmen."},{"key":"d","text":"Die Firma plant aus besonderem Anlass eine Kunden-Kampagne."},{"key":"e","text":"Es gibt verschiedene Programmpunkte beim Betriebsausflug."},{"key":"f","text":"Für den Lauf werden sportliche Mitarbeiter gesucht."}],"tracks":[{"id":"H2V3N28","n":28,"transcript":"Herr Schmidt: Hallo Mia. Ich suche Kollegen, die Lust haben, beim Firmenlauf mitzumachen. Du bist doch\nsportlich. Wie sieht das bei dir aus?\nMia: Firmenlauf? Muss man denn da joggen? Oder kann man da auch walken?\nHerr Schmidt: Natürlich kannst du beides machen. Aber je schneller, desto besser. Die Läufer des besten Teams\ngewinnen nämlich einen tollen Preis.\nMia: Oh, das klingt ja gut. Wann findet das Ganze denn statt?\nHerr Schmidt: In einem Monat. Das ist aber wenig Zeit, um für so einen Lauf zu trainieren.\nMia: Ich bin mir nicht sicher, ob ich das schaffe. Wie viele Kilometer muss man denn laufen?\nHerr Schmidt: Man läuft nur 6 Kilometer. Aber wir müssen fünf Kollegen sein, die teilnehmen.\nMia: Und was kann man gewinnen?\nHerr Schmidt: Eine Jahresmitgliedschaft im Fitnessstudio.\nMia: Das ist super. Okay, du hast mich überzeugt. Ich mache mit.\nHerr Schmidt: Toll. Dann müssen wir jetzt nur noch drei andere Personen finden.","answer":"f"},{"id":"H2V3N29","n":29,"transcript":"Herr 1: Wow, im nächsten Jahr wird unsere Firma 50. Ich habe gehört, das soll groß gefeiert werden.\nEmilia: Ja, und für unsere Kunden sind jede Menge Aktionen geplant. Davon bin ich nicht so begeistert.\nHerr 1: Warum denn? Ich finde es toll, dass unsere Firma schon so viele Jahre existiert und wir das feiern.\nEmilia: Naja, aber für uns bedeutet das vor allem mehr Arbeit, oder?\nHerr 2: Ach, Emilia, sei doch nicht so negativ. Wenn alle so denken würden, könnten wir nichts auf die Beine\nstellen. Das ist doch mal was anderes. Also, mir gefällt die Idee.\nEmilia: Ja, schon. Aber wir arbeiten sowieso schon so viel. Da habe ich keine Lust auf Extraaktionen.\nHerr 1: Aber diese Extraaktionen machen uns doch auch Spaß und finden in der Arbeitszeit statt.\nHerr 2: Ich finde diese Abwechslung auch gut.\nEmilia: Ja, ihr habt recht. Und das große Fest am Ende des Jubiläumsjahres wird bestimmt schön.","answer":"d"},{"id":"H2V3N30","n":30,"transcript":"Michael: Ich freue mich schon auf unseren Mitarbeiterausflug übermorgen. Dass wir dies Mal in den Klettergarten\ngehen, finde ich richtig super!\nSabine: Hmm, Klettern ist nicht so meins, ehrlich gesagt.\nMichael: Warum, hast du etwa Höhenangst?\nSabine: Ja, habe ich. Ich wäre schon nervös, wenn ich nur auf einen Stuhl steige. Darf ich recht ängstlich auf die\nBäume klettern ?\nMichael: Ah, ja. Das kann ich gut verstehen. Aber kommst du trotzdem mit, oder gehst du lieber ins Büro? Zuhause\nbleiben dürfen wir nicht.\nSabine: Nee, nee, ich komme schon mit. Julia ist ja auch dabei, obwohl sie aufgrund ihrer Schwangerschaft nicht\nklettern kann.\nMichael: Ja, stimmt. Und nach dem Klettern wird ja auch noch zusammen gegrillt. Da sind wir dann alle dabei.\nSabine: Auf das Grillen und das gemeinsame Essen freue ich mich auch schon. Und euch beim Klettern\nzuzugucken, das wird bestimmt auch ganz witzig.","answer":"e"},{"id":"H2V3N31","n":31,"transcript":"Lena: Diesen Freitag ist ja schon die Weihnachtsfeier. Ich freue mich drauf und ich finde es toll, dass der Chef uns\nalle dazu einlädt.\nElla: An sich finde ich das auch gut, aber in der Weihnachtszeit haben die meisten Leute viele private\nVerpflichtungen.\nTom: Meine Frau und ich haben auch einen Termin nachdem anderen, aber die Weihnachtsfeier der Firma gehört\nauch dazu. Zieht man da eigentlich etwas Besonderes an? Ich bin ja das erste Mal dabei.\nLena: Also, ich habe mir extra ein neues Kleid gekauft, aber man kann anziehen, was man will.\nElla: Ich glaube, ich ziehe mich an wie immer. Mir ist die Kleidung nicht so wichtig, aber ich habe mich noch nicht\nentschieden.\nTom: Das klingt ja entspannt. Dann werde ich auch was finden.","answer":"b"}]},{"id":"H2V4","title":"Prüfungsvariante 4","pages":[128,129],"options":[{"key":"a","text":"Arbeitnehmer bekommen zu besonderen Anlässen frei."},{"key":"b","text":"Einige Kollegen können nur zu bestimmten Zeiten Urlaub nehmen."},{"key":"c","text":"Manchmal müssen Kollegen auch die Aufgaben anderer übernehmen."},{"key":"d","text":"Unter gewissen Umständen gehen Urlaubstage nicht verloren."},{"key":"e","text":"Viele Menschen träumen während der Arbeitszeit vom Sommerurlaub."},{"key":"f","text":"Wer im Urlaub krank wird, kann Sonderurlaub beantragen."}],"tracks":[{"id":"H2V4N28","n":28,"transcript":"(\nHerr : Hallo, Lisa-Vera. Wie gut, dass ich dich jetzt noch treffe. Ich wollte vor meinem Urlaub noch etwas mit dir\nbesprechen.\nFrau : Ach, du machst Urlaub? Wohin geht’s denn?\nHerr : Ja, nächste Woche bin ich mit der Familie in Südfrankreich. Du weißt ja, unser Projekt muss bald fertig sein.\nUnd leider habe ich es nicht mehr geschafft, die Informationen über den Kreis einzuholen. Könntest du das bitte für\nmich machen?\nFrau : Eigentlich habe ich überhaupt keine Zeit dafür. Sag mir bitte das nächste Mal früher Bescheid. Aber gut, wer\nhat denn die Informationen?\nHerr : Franka Pater. Die ist allerdings heute nicht mehr im Haus, aber morgen ist sie wieder da.\nFrau : In Ordnung, dann rufe ich mich morgen wieder an. Und dir wünsche ich einen schönen Urlaub.\nHerr : Danke, du bist super.","answer":"c"},{"id":"H2V4N29","n":29,"transcript":"(\nHerr : Wisst ihr eigentlich, bis wann wir unseren Jahresurlaub einreichen müssen?\nFrau 1: Ich denke, wie immer bis Ende Januar. Aber je früher, desto besser, damit wir uns noch absprechen können.\nHast du dir denn schon überlegt, wann du Urlaub machen willst?\nHerr : Am nächsten, im August. Da hat meine Familie in der Türkei auch Urlaub. Dann können wir alle zusammen\nden Sommer genießen.\nFrau 2: Das klingt super. Aber du weißt ja, ich bin wegen der Kinder auch auf die Schulferien angewiesen. Wir\nsollten uns da absprechen.\nHerr : Ja, klar sprechen wir uns mal. Was hältst du davon, wenn ich die erste Augusthälfte freinehme und du die\nletzten beiden Wochen?\nFrau : Das klingt super. Dann bin ich einverstanden. Jetzt warten wir mal, was der Chef dazu sagt.","answer":"b"},{"id":"H2V4N30","n":30,"transcript":"(\nFrau : Hallo Jens. Wie war dein Urlaub. Bist du gut erholt?\nHerr : Nein, gar nicht. Mich hat schon gleich am 1. Urlaubstag eine dicke Erkältung erwischt. Ich lag die meiste\nZeit im Bett, statt am Strand in der Sonne.\nFrau : Ach du Armer, das tut mir aber leid. Hast du dir wenigstens einen Attest vom Arzt besorgt, damit du dir die\nUrlaubstage zurückholen kannst?\n128\nHerr : Nee, ich war doch im Ausland. Und da wollte ich nicht zum Arzt gehen. Aber wenigstens für die letzten 4\nTage habe ich von meinem Hausarzt hier noch eine Krankschreibung bekommen.\nFrau : Na, immerhin. Dann hast du noch ein paar Urlaubstage, die du später nehmen kannst.\nHerr : Genau. Aber jetzt fange ich erstmal wieder mit der Arbeit an.\nFrau : Sei einen guten Start.","answer":"d"},{"id":"H2V4N31","n":31,"transcript":"(\nFrau : Ich habe gehört, dass du vor Kurzem umgezogen bist. Wusstest du, dass bei mir demnächst auch ein Umzug\nansteht?\nHerr : Ach ja? Na dann viel Spaß. Das ist echt viel Arbeit. Wir haben 2 Tage nur Müll geschleppt. Zum Glück gibt\nes dafür einen Antrag auf Sonderurlaub.\nFrau : Sonderurlaub? Das wusste ich gar nicht. Was muss man denn dafür machen?\nHerr : Einfach einen Antrag stellen. Und später musst du natürlich nachweisen, dass du umgezogen bist.\nFrau : Guter Tipp. Reicht da ein einfaches Schreiben oder muss ich ein Antragsformular ausfüllen.\nHerr : Es gibt ein Formular dafür. Geh einfach mal zu Frau Heilmann ins Sekretariat. Die kann dir genau sagen,\nwas du brauchst. Aber geh rechtzeitig. Die Firma muss mindestens eine Woche vorher wissen, dass du nicht da bist.\nFrau : Okay. Dann erledige ich das mal sofort. Danke dir.","answer":"a"}]},{"id":"H2V5","title":"Prüfungsvariante 5","pages":[130,131],"options":[{"key":"a","text":"Regelungen zur Arbeitsunfähigkeit unterscheiden sich von Unternehmen zu Unternehmen."},{"key":"b","text":"Die Arbeitsplatzgestaltung hat einen Einfluss auf die Gesundheit der Mitarbeiter."},{"key":"c","text":"Arbeitgeber sollten mehr für die Hygiene im Betrieb tun."},{"key":"d","text":"Manche Arbeitgeber bieten Maßnahmen für die Gesundheitsvorsorge an."},{"key":"e","text":"Das Wohlbefinden der Mitarbeiter sollte ein wichtiges Anliegen sein."},{"key":"f","text":"Bei Krankheit braucht man ab dem ersten Tag ein Attest vom Arzt."}],"tracks":[{"id":"H2V5N28","n":28,"transcript":"Frau 1: Wie ist das eigentlich? Könnt ihr mir sagen, was ich machen muss, wenn ich mal krank sein sollte? Ich\nhabe noch gar nicht gefragt, wie das hier gehandhabt wird.\nHerr : Ich bin auch erst kurz hier und weiß das nicht genau. Melanie, was sagst du denn dazu?\nMelanie : Wenn man krank ist, soll man morgens so früh wie möglich anrufen und im Büro bei Frau\nGumpel Bescheid sagen. Das ist wichtig, sich direkt bei ihr krank zu melden.\nHerr : Ach stimmt, so war das. Frau Gumpel ist auch immer schon früh im Büro.\nFrau 1: In meiner letzten Firma musste ich immer direkt am ersten Krankheitstag ein Attest bringen. Wie ist das\nhier?\nMelanie : Keine Sorge, hier ist es nicht so streng. Zwie Tage darf man fehlen, aber wenn du länger krank bist, musst\ndu eine Krankmeldung vorlegen.\nFrau 1: Ah. Danke für die Tipps.","answer":"a"},{"id":"H2V5N29","n":29,"transcript":"Herr : Hast du auch die Information im Pausenraum gesehen? Ich frage mich ja, was das soll. Ich halte sowieso\nnichts von Grippeschutzimpfungen. Aber warum muss jetzt auch noch ein Arzt in die Firma kommen?\nFrau : Also ich finde, das ist ein tolles Angebot. Ich lasse mich auf jeden Fall impfen.\nHerr : Aber du bist doch jung und gesund. Nur Personen über 60 Jahren wird eine Impfung empfohlen.\nFrau : Das kann noch nicht schaden. Außerdem ist es doch wirklich bequem für uns, wenn der Arzt schon extra in\ndie Firma kommt. Dann nehme ich auf jeden Fall das Angebot an.\nHerr : Jeder kann das selbst entscheiden. Ich habe keine Angst vor der Grippe und lasse mich auch nicht impfen.\nFrau : Du hast doch nur Angst vor der Spritze. Komm, gib's zu.","answer":"d"},{"id":"H2V5N30","n":30,"transcript":"Herr 1: Monika, hängt bei euch Damen in der Toilette auch ein Infoblatt zum richtigen Händewaschen? Oder\nwollen sie uns Männern etwas damit sagen?\nFrau : Nee, nee, das hängt bei uns auch. Aber ich frage mich, ob das nicht Allgemeinwissen sein sollte.\nHerr 2: Jetzt in der kalten Jahreszeit, in der so viele krank sind, ist eine Erinnerung immer gut. Das macht bestimmt\nnicht jeder.\nHerr1 : Schön und gut. Aber was sollen wir denn machen, wenn die Seife immer leer ist? Desinfektionsmittel wäre\nauch keine schlechte Idee.\nFrau : Das stimmt. Ich finde es auch lästig, dass man immer dran erinnern muss. Kann man die Seife nicht jeden\nMorgen einfach auffüllen?\nHerr 2: Ja, aber auch mit Seife muss man wissen, wie man sich richtig die Hände wäscht. Es gibt genug Leute, die\ndas falsch machen.","answer":"c"},{"id":"H2V5N31","n":31,"transcript":"Herr : Hallo Isabel. Wurde dein Arbeitsplatz schon geprüft?\nFrau : Nein, noch nicht. Was soll da überhaupt passieren?\nHerr : Der Experte kontrolliert, ob du in der richtigen Haltung am Schreibtisch sitzen kannst.\nFrau : Aha. Und wie macht er das?\nHerr : Naja, er schaut, wie weit du vom Computer entfernt sitzt und ob der Stuhl richtig eingestellt ist.\nFrau : Das klingt ja merkwürdig. Ich arbeite doch schon seit Jahren an meinem Schreibtisch. Und plötzlich soll\nkontrolliert werden, ob das gesund ist?\nHerr : Wie du weißt, haben viele Kollegen Rückenschmerzen und fallen dadurch bei der Arbeit aus.\nFrau : Und was kam bei dir dabei heraus? Hat dein Stuhl die richtige Höhe?\nHerr : Ja, das schon. Aber der Computer steht jetzt tatsächlich anders, damit ich besser davor sitze.\nFrau : Na. Ich bin gespannt, was er zu mir sagt.","answer":"b"}]}],"teil3":[{"id":"H3V1","title":"Prüfungsvariante 1","pages":[132,133],"transcript":"Leiter : Und jetzt gehe ich zum wichtigsten Punkt unserer Besprechung, dem Thema Arbeitsschutz und Sicherheit.\nWie ihr alle wisst, arbeiten wir als Betriebsrat eng mit der Geschäftsleitung zusammen, um die\nSicherheitsmaßnahmen in unserer Firma zu optimieren und Sicherheitslücken zu schließen.\nLeider lassen sich Arbeitsunfälle oder plötzliche Erkrankungen trotz aller Sicherheitsmaßnahmen nie ganz\nausschließen. Umso wichtiger ist es, dass im Notfall schnell jemand zur Stelle ist, der sich um einen verletzten oder\nerkrankten Kollegen kümmern kann, bis der Rettungsdienst eintrifft. Wir haben deshalb der Geschäftsleitung den\nVorschlag gemacht, zusätzliche betriebliche Ersthelfer auszubilden und haben grünes Licht bekommen.\nTN 1: Entschuldigung, kurze Zwischenfrage. Wer sind ja eigentlich die betrieblichen Ersthelfer in unserer Firma?\nIch wusste gar nicht, dass wir überhaupt welche haben.\nLeiter : Doch, betriebliche Ersthelfer sind Pflicht. Die Anzahl ist sogar gesetzlich geregelt. Ein Unternehmen\nunserer Größe muss mindestens zwei Ersthelfer haben. Bei uns sind das Frederik Gerling, der früher sogar\nhauptberuflich als Rettungssanitäter gearbeitet hat, und Paulina Jovic. Die Namen der Ersthelfer findet ihr übrigens\nzusammen mit den Notrufnummern und dem Notfallplan am schwarzen Bretten. Da Paulina die nächste Rente geht,\nbrauchen wir jemanden, der an ihre Stelle tritt und sie als Ersthelferin ersetzt. Es wäre toll, wenn darüber hinaus\nnoch zwei oder drei weitere Personen bereit wären, die Ausbildung zum Ersthelfer zu machen.\nTN 2: Wie würde die Ausbildung denn genau ablaufen?\nLeiter : Also, ihr macht zunächst die Grundausbildung, einen neunstündigen Erste-Hilfe-Lehrgang. Da lernt man,\nwas man wissen muss, um bei fast jedem Notfall richtig helfen zu können. Wer Ersthelfer bleiben möchte, muss\ndanach alle zwei Jahre eine Fortbildung machen, um sein Wissen aufzufrischen. Grund- und Fortbildungen werden\nvon verschiedenen Organisationen angeboten, z.B. dem roten Kreuz oder dem Malteser Hilfsdienst. Die Malteser\nsind ja hier gleich in der Parallelstraße. Deshalb habe ich euch die Kurstermine für die zweite Jahreshälfte mal\nmitgebracht. Ich gebe die mal um. Aber wie gesagt, ihr könnt auch woanders hingehen. Der Lehrgang ist für euch\nübrigens kostenlos. Die Teilnahme zählt leider nicht als Arbeitszeit, aber immerhin bekommt ihr die Fahrtkosten\nzum Kursort erstattet.\nTN 3: Also, ich muss da nicht lange überlegen. Ich würde sehr gerne Ersthelferin werden. Was man in der\nGrundausbildung lernt, kann man ja nicht nur im Beruf, sondern auch in der Freizeit gut gebrauchen. Wo muss man\nsich denn anmelden?\nLeiter : Die Anmeldung sollte nach Möglichkeit über unser Personalbüro laufen. Das ist am einfachsten, nicht nur\nfür die Firma, sondern auch für euch. Ihr braucht dort nur Bescheid zu sagen und die Kollegen kümmern sich um\nalles. Wenn es euch lieber ist, könnt ihr euch aber auch selbst bei der Organisation anmelden, die den Kurs\ndurchführt. In diesem Fall benötigt ihr eine Bescheinigung des Arbeitgebers, die bestätigt, dass ihr in der Firma als\nErsthelfer eingesetzt werden sollt.\nDiese Bescheinigung ist wichtig für die Kostenübernahme. Ihr könnt sie euch ebenfalls im Personalbüro holen.\nAch ja, noch etwas... Damit wir planen können, sollten die Anmeldungen bis zum 15. September erfolgen. Das\nheißt, ihr habt noch zwei Wochen Zeit, um euch zu überlegen, ob ihr den Lehrgang machen wollt. Okay? Habt ihr\nnoch weitere Fragen? Ja, Murat?\nMurat : Ich würde mich auch gerne als betrieblicher Ersthelfer zur Verfügung stellen. Ich habe sogar früher eine\nAusbildung zum Krankenpfleger gemacht.\nLeiter : Ah, in diesem Fall kannst du tatsächlich als Ersthelfer eingesetzt werden, ohne den Erste-\nHilfe-Lehrgang zu absolvieren. Du müsstest lediglich ein Zeugnis vorlegen, und das deinen Ausbildungsabschluss\nbestätigt. Dann bekommst du von der Firma eine sogenannte Ernennungsurkunde, also ein Papier, auf dem steht,\ndass du offiziell als betrieblicher Ersthelfer eingesetzt werden darfst. Diese speziellen Situationen können wir aber\nim Anschluss nochmal besprechen. Gibt's sonst noch Fragen? Gut, dann vielen Dank. Ich finde es toll, dass sich\nspontan schon zwei Kollegen gemeldet haben, die bereit sind als Ersthelfer aktiv zu werden. Ideal wäre, wenn noch\neine oder zwei weitere Personen dazu kämen. Lasst euch das einfach nochmal in Ruhe durch den Kopf gehen. Jetzt\nhabt aber erstmal einen schönen Feiertag.","questions":[{"n":32,"type":"mcq","text":"Die Firma hat zurzeit","options":[{"key":"a","text":"mehr Ersthelfer als gesetzlich vorgeschrieben."},{"key":"b","text":"so viele Ersthelfer wie gesetzlich vorgeschrieben."},{"key":"c","text":"weniger Ersthelfer als gesetzlich vorgeschrieben."}],"answer":"b"},{"n":33,"type":"mcq","text":"Die Mitarbeiter","options":[{"key":"a","text":"dürfen den Lehrgang während der Arbeitszeit machen."},{"key":"b","text":"können den Lehrgang zu unterschiedlichen Terminen besuchen."},{"key":"c","text":"müssen den Lehrgang beim Malteser Hilfsdienst absolvieren."}],"answer":"b"},{"n":34,"type":"mcq","text":"Wer sich anmelden möchte,","options":[{"key":"a","text":"kann sich an das Personalbüro wenden."},{"key":"b","text":"muss dem Arbeitgeber eine Bescheinigung vorlegen."},{"key":"c","text":"sollte dies spätestens zwei Wochen vor Kursbeginn tun."}],"answer":"a"},{"n":35,"type":"mcq","text":"Es ist noch ungeklärt,","options":[{"key":"a","text":"ob Murat überhaupt als Ersthelfer tätig sein darf."},{"key":"b","text":"welche Dokumente Murat vorlegen muss."},{"key":"c","text":"wie viele neue Ersthelfer die Firma haben wird."}],"answer":"c"}]},{"id":"H3V2","title":"Prüfungsvariante 2","pages":[134,135],"transcript":"Chefin : Meine Damen und Herren, ich begrüße Sie herzlich zu unserer Mitarbeiterversammlung. Wie Sie der\nTagesordnung entnehmen können, ist eines unserer Themen heute der Arbeitsschutz. In unserem Unternehmen\nhalten wir die gesetzlichen Regeln natürlich strikt ein. Wir haben aber in Absprache mit der Geschäftsführung und\ndem Betriebsrat beschlossen, ein Managementsystem zum Arbeitsschutz einzuführen, um unsere Sicherheit weiter\nzu verbessern. Gerne können Sie Zwischenfragen stellen.\nTN 1: Ja, gut. Dann möchte ich gleich mit einer ersten Frage beginnen. Was kann ich mir denn unter so einem\nManagementsystem vorstellen?\nChefin : Genau das möchte ich Ihnen jetzt erklären. Uns geht es bei diesem Thema nicht nur um die Vermeidung\nvon Arbeitsunfällen und das Verhalten in Notsituationen. Wir möchten, dass Sie als Mitarbeiter zufrieden sind, sich\nbei der Arbeit sicher fühlen und gesund bleiben. Im ersten Schritt werden wir die aktuelle Situation an den einzelnen\nArbeitsplätzen analysieren, indem wir in jeder Abteilung eine Gefährdungsbeurteilung durchführen. Dabei handelt\nes sich um einen Fragebogen, der von Fachleuten entwickelt wurde. Wir sind sehr froh, dass wir die Firma Worksek\nins Boot holen konnten, die auf diesem Gebiet zu den führenden Dienstleistern in Deutschland gehört. Sie\nentwickeln in den nächsten Wochen einen für uns passenden Fragenkatalog. Sobald er uns vorliegt, wird er an die\nTeamleitenden weitergereicht. Diese füllen ihn für ihre Abteilungen aus.\nTN 2: Entschuldigung, ich habe da auch eine Frage zu. Was passiert dann mit den Fragebögen? Können wir sicher\nsein, dass die Daten vertraulich behandelt werden?\nChefin : Selbstverständlich. Sie brauchen sich darüber keine Sorgen zu machen. Die ausgefüllten Fragebögen\nwerden dann verschlüsselt an die Firma Worksek gesendet. Dort werden sie ausgewertet. Dabei liegt besondere\nAufmerksamkeit auf der Arbeitsumgebung und den betrieblichen Abläufen, sodass festgestellt werden kann, wo\neventuell gesundheitliche Risiken bestehen. Im Anschluss werden uns die Ergebnisse und der eventuelle\nHandlungsbedarf von einem Mitarbeiter von Worksek präsentiert. Je nach Bedarf müssen wir dann aktiv werden\nund eventuell Arbeitsgruppen gründen. Die Fragebögen werden anschließend selbstverständlich vernichtet, sodass\nder Datenschutz gewahrt bleibt.\nTN 3 : Das klingt alles nach einem sehr langwierigen Prozess. Wie lange wird es dauern, bis wir wirklich sichere\nArbeitsplätze haben?\nChefin : Frau Klinger, Sie haben bereits jetzt sichere Arbeitsplätze. Alle Vorschriften sind erfüllt, da kann ich Sie\nberuhigen. Wir möchten aber, dass unsere Mitarbeiter sich mit den Sicherheitsvorkehrungen noch besser auskennen.\nDaher wird es unter anderem vierteljährlich eine Begehung der Fluchtwege geben, an der neue Mitarbeiter\nteilnehmen müssen. Dabei erhalten diese auch eine Einweisung in die Verwendung der Feuerlöscher durch unsere\nSicherheitsbeauftragte, Frau Fernandez Suarez. Sie können unseren Brandschutzbeauftragten, Herrn Dr. Yilmaz,\njederzeit darauf ansprechen. Bitte informieren Sie sich, welcher Sammelpunkt bei Feueralarm für Sie vorgesehen ist.\nDenken Sie bitte daran, bei Feueralarm ruhig zu bleiben und höchstens Ihre persönlichen Wertsachen mitzunehmen,\nweil es dann wirklich schnell gehen muss.\nTN 1: Ich habe noch eine Frage. Ich bin ja erst seit Kurzem im Unternehmen. Wie ist das eigentlich, wenn ein\nUnfall passiert? Wer sind die Ersthelfer, an die man sich dann wenden kann?\nChefin : Gut, dass Sie das ansprechen. Für ein Unternehmen unserer Größe sind fünf Ersthelfer gesetzlich\nvorgeschrieben. Da Herr Fischer und Frau Homance in Rente bzw Mutterschutz gegangen sind, müssen zwei\nweitere Mitarbeiter zu Ersthelfern ausgebildet werden. Aktuell sind Herr Ohoven, Frau Smirnow und Herr Albertall\nunsere Ersthelfer. Diese sind unter der Durchwahl 111 jederzeit für Sie erreichbar. Vielen Dank für Ihren Einsatz.\nWer Ersthelfer werden möchte, wird einen Erste-Hilfe-Kurs besuchen und kann dann ebenfalls im Notfall angerufen\nwerden. Wenn jemand Interesse hat, als Ersthelfer in der Firma zu fungieren, freuen wir uns über Ihre\nRückmeldung. Sie können sich auch gerne direkt nach dem Vortrag an mich oder einen der Ersthelfer wenden.\nVielen Dank für Ihre Aufmerksamkeit.\nDa Sie im letzten Jahr während unserer Umstrukturierung so viel Einsatz gezeigt haben, haben wir noch eine\nbesondere Überraschung für Sie. Wir möchten Sie nun alle zu einem Mittagessen einladen. Die Metzgerei Müller\nhat das Essen bereits in der Kantine aufgebaut. Greifen Sie ordentlich zu.","questions":[{"n":32,"type":"mcq","text":"Das Unternehmen","options":[{"key":"a","text":"hat ein anderes Unternehmen beauftragt."},{"key":"b","text":"wird alle Mitarbeiter einzeln befragen."},{"key":"c","text":"wird intern einen Fragebogen entwickeln."}],"answer":"a"},{"n":33,"type":"mcq","text":"Die Fragebögen werden","options":[{"key":"a","text":"im Haus ausgewertet."},{"key":"b","text":"nach der Analyse weiter aufbewahrt."},{"key":"c","text":"von Fachleuten analysiert."}],"answer":"c"},{"n":34,"type":"mcq","text":"Die Begehung der Fluchtwege","options":[{"key":"a","text":"findet jährlich statt."},{"key":"b","text":"ist für neue Mitarbeiter verpflichtend."},{"key":"c","text":"leitet Frau Fernandez Suarez."}],"answer":"b"},{"n":35,"type":"mcq","text":"Die Geschäftsführung","options":[{"key":"a","text":"bietet einen Erste-Hilfe-Kurs für alle an."},{"key":"b","text":"sucht weitere Ersthelfer."},{"key":"c","text":"verabschiedet Herrn Fischer."}],"answer":"b"}]},{"id":"H3V3","title":"Prüfungsvariante 3","pages":[136],"transcript":"Chefin: Guten Morgen, liebe Mitarbeiterinnen und Mitarbeiter. Als ich diese Firma vor acht Jahren von meinem\nVater übernommen habe, war sie noch ein ganz kleiner Betrieb mit großen finanziellen Schwierigkeiten. Doch in\nden letzten Jahren hat sich einiges bewegt. Wir haben, dank Ihres großen Engagements, viele innovative Ideen\numgesetzt und konnten dadurch ein stetiges Wachstum erreichen. Dies ist eine fantastische Entwicklung, die ich\nnatürlich fortsetzen möchte. Deshalb stehen auch in diesem Jahr einige Veränderungen an. Ich habe unter anderem\neine Grafikagentur beauftragt unser Firmenlogo neu zu gestalten. Und darüber möchte ich Sie heute informieren. Ja,\nHerr Gertenbach, Sie haben eine Frage?\nHerr Gertenbach: Macht die Grafikagentur Compton das neue Logo? War nicht letztens Frau Seidel von Compton\nhier im Haus? Die Agentur hat doch vor zwei Jahren so tolle Plakate für uns gestaltet.\nChefin: Ja, Frau Seidel hat mich auch diesmal sofort mit ihren guten Ideen überzeugt. Aber dazu gleich mehr.\nLassen Sie mich zuerst kurz erklären, warum ich mich überhaupt für ein neues Logo entschieden habe. Das alte\nLogo ist ja nicht schlecht. Obwohl es vor über zehn Jahren entworfen wurde, ist es immer noch zeitgemäß. Das\nschlichte, unkomplizierte Design ist unabhängig von Trends und hat außerdem den Vorteil, dass es vielseitig\nverwendbar ist. Es funktioniert ganz klein auf einer Visitenkarte, aber auch großflächig als Print auf einem LKW.\nTrotzdem, durch die Erweiterung unseres Sortiments und die neuen Produkte, die wir auf den Markt gebracht haben,\nhat sich das Gesicht unserer Firma verändert. Das neue Logo soll dazu beitragen, dass dies auch von unseren\nKunden so wahrgenommen wird. Sie möchten etwas fragen, Frau Bräuer?\nFrau Bräuer: Ja, ich wollte fragen, ob die Einführung eines neuen Logos nicht auch ein Risiko sein kann. Die\nKunden sind schließlich mit dem alten Logo vertraut und erkennen es sofort.\nChefin: Ja, absolut. Die Einführung eines neuen Logos wird gut überlegt sein. Ich habe mich deshalb auch\nausführlich beraten lassen, bevor ich eine Entscheidung getroffen habe. Frau Seidel hat vorgeschlagen, kein ganz\nneues Logo zu entwerfen, sondern das alte weiterzuentwickeln. Das heißt, wir übernehmen einige Elemente aus dem\nbisherigen Design und diese werden die Kunden dann auch wiedererkennen. Das neue Logo wird, wie gehabt, ein\nRechteck sein, auf dem die Buchstaben F, A, N stehen, also die Initiale des Firmengründers Florian-Alexander\nNiehaus. Das Rechteck bleibt dunkelblau, die gelbe Schrift wird allerdings durch eine leuchtende Orangefarbe\nersetzt. Außerdem verwenden wir eine andere Schriftart, die etwas dynamischer aussieht. Und der kleine Fußball,\nder früher unser gesamtes Sortiment repräsentiert hat und bisher Teil des Logos war, fällt weg. Dadurch wirkt das\nDesign noch klarer.\nTom: Anschauen können wir uns das neue Logo aber noch nicht.\nChefin: Nein, die Agentur arbeitet noch daran. Frau Seidel hat die Entwürfe für den 15. März angekündigt. Sie\nbespricht diese dann zunächst mit Herrn Aydin, dem neuen Leiter unserer Marketingabteilung. Eventuelle\nÄnderungswünsche werden dann realisiert und spätestens Ende März können wir Ihnen dann hoffentlich das\nendgültige Ergebnis präsentieren. Ich weiß, dass es noch ein paar Wochen hin, aber es ist mir wichtig, Sie frühzeitig\nzu informieren, denn die Einführung des neuen Logos bedeutet natürlich eine Menge Arbeit. Bedenken Sie bitte,\ndass wir das Logo auf all unseren Plattformen und Firmenmaterialien aktualisieren müssen. Das betrifft\nVisitenkarten, Briefköpfe, Formulare, Werbematerialien, unsere Webseite und, und, und. Sogar ein neues Türschild\nmuss her. Herr Aydin wird sich um alles kümmern. Er wird aber hin und wieder Ihre Unterstützung benötigen.\nFrau Müller: Und wann wird das neue Logo dann offiziell verwendet?\nChefin: Ich habe lange überlegt, wie wir den Übergang vom alten zum neuen Logo am besten hinbekommen. Und\nhabe mich dagegen entschieden, ein Datum festzulegen, an dem von heute auf morgen alles umgestellt wird. Ein\nZeitraum von 6 bis 8 Wochen, in dem wir die Umstellung nach und nach vornehmen, erscheint mir sinnvoll.\nSpätestens Ende Juni sollte der ganze Prozess aber abgeschlossen sein. Und wenn alles geschafft ist, stoßen wir mit\neinem Gläschen auf den schönen Erfolg an, okay?\nGut, mit diesen Aussichten lasse ich Sie nun an Ihre Arbeitsplätze zurückkehren und bedanke mich für Ihre\nAufmerksamkeit.","questions":[{"n":32,"type":"mcq","text":"Das alte Logo","options":[{"key":"a","text":"ist nicht überall einsetzbar."},{"key":"b","text":"passt nicht mehr zum Angebot."},{"key":"c","text":"wirkt unmodern."}],"answer":"b"},{"n":33,"type":"mcq","text":"Das neue Logo enthält","options":[{"key":"a","text":"den vollständigen Namen der Firma."},{"key":"b","text":"ein Symbol für Sport."},{"key":"c","text":"zwei farbige Elemente."}],"answer":"c"},{"n":34,"type":"mcq","text":"Herr Aydin","options":[{"key":"a","text":"wird sich bei den Mitarbeitern Hilfe holen."},{"key":"b","text":"soll den Mitarbeitern das neue Logo vorstellen."},{"key":"c","text":"wird die Logo-Entwürfe erst Ende März sehen."}],"answer":"a"},{"n":35,"type":"mcq","text":"Die Einführung des neuen Logos soll","options":[{"key":"a","text":"an einem bestimmten Tag stattfinden."},{"key":"b","text":"gefeiert werden."},{"key":"c","text":"nicht länger als einen Monat dauern."}],"answer":"b"}]},{"id":"H3V4","title":"Prüfungsvariante 4","pages":[137],"transcript":"Chef : Guten Morgen an alle. Heute geht es um ein äußerst wichtiges Thema, nämlich den Umweltschutz.\nRegelmäßig suchen wir nach Möglichkeiten, den ökologischen Fußabdruck unseres Unternehmens zu verringern.\nWie erfolgreich die Lage waren, beweist, dass wir letztes Jahr den Nachhaltigkeitspreis des Landes bekommen\nhaben.\nHeute ist Frau Seibert vom Landesamt für Umwelt bei uns. Sie kennen sie ja schon von ihrem letzten Vortrag bei\nuns im Haus. Sie wird uns Tipps zum umweltgerechten Verhalten geben. Herzlich willkommen, Frau Seibert. Sie\nsind bereits zum zweiten Mal in unserem Unternehmen.\nFrau Seibert : Vielen Dank. Ich freue mich, dass Sie mich eingeladen haben. Damit ein Büro zum nachhaltigen\nBüro wird, kommt das besonders auf die Menschen an, die dort arbeiten, also auf Sie. Jeder Einzelne ist gefragt.\nEinige konkrete Maßnahmen zum täglichen Umweltschutz möchte ich gleich vorstellen. Bitte unterbrechen Sie mich\ngerne jederzeit, wenn Sie eine Frage haben.\nAls Arbeitsmittel Nummer 1 steht der Computer bei dem Umweltschutz für das Büro ganz vorne. Wichtig ist, dass\nSie keinen Bildschirmschoner verwenden. Stellen Sie Ihren PC besser so ein, dass er nach einigen Minuten der\nNichtbenutzung automatisch in den Schlaf- bzw. Ruhemodus umschaltet. Die Energieersparnis zum Normalbetrieb\nliegt so bei ca. 70%. Auch das Ausschalten des Bildschirms während der Pausen oder Besprechungen kann viel\nEnergie sparen. Wenn Sie mit der Arbeit fertig sind, sollten Sie den Computer ganz ausschalten.\nTN 1: Ich habe vor Kurzem etwas über papierlose Büros gelesen. Wir sind davon ja noch sehr weit entfernt, denn\nwir drucken hier noch fast alles aus. Ist der Energieverbrauch beim Drucken wirklich so groß?\nFrau Seibert : Das kommt drauf an. Man sollte sich vorher überlegen, ob es notwendig ist, Dokumente\nauszudrucken und was überhaupt gedruckt werden muss. Für den internen Gebrauch empfiehlt es sich immer, auch\ndie Rückseite zu bedrucken. Außerdem druckt man viel sparsamer, wenn man den Entwurfmodus verwendet. Die\nDokumente sind auch in dieser Einstellung von sehr guter Qualität. Und man spart wirklich richtig viel Tinte bzw.\nToner. Probieren Sie es so mal aus. Wenn man diese Maßnahmen umsetzt, kann man eventuell auf graues\nRecyclingpapier verzichten, denn darauf kann man oft nicht so gut lesen.\nTN 2: Ich hätte da mal eine ganz andere Frage. Was sagen Sie zur Mülltrennung?\nFrau Seibert : Ebenso wichtig wie selbstverständlich ist natürlich der Hinweis aufs Müllsortieren. Aber ich sehe\nhier schon überall die unterschiedlichen Tonnen mit verschiedenen Farben für jede Müllsorte stehen. Noch\nwichtiger wäre es, Müll zu vermeiden, sofern es möglich ist. Wenn alle sich daranhalten, würde die Frage des\nRecyclings in den Hintergrund treten. Übrigens würden dann die Kosten für die Abfallbeseitigung sinken.\nTN 3: Wenn wir schon beim Thema Geld sind. Geschäftsreisen verursachen ja auch hohe Kosten und sind\naußerdem nicht gut für die Umwelt. Was würden Sie empfehlen?\nFrau Seibert : Guter Punkt. Das ist das letzte Thema meiner Präsentation. Dank moderner Kommunikationsmittel\nsind Dienstreisen in bestimmten Fällen nicht mehr erforderlich. Einiges kann schon in einer Telefon- oder\nVideokonferenz besprochen werden.\nAllerdings möchte ich auch darauf hinweisen, dass Videokonferenzen für Teilnehmer meist anstrengender sind, weil\nsie mehr Konzentration erfordern. Manchmal sind Reisen unvermeidbar. Aber man kann sie auch durchaus\numweltfreundlich durchführen.\nViele Unternehmen befürchten aber, dass dies hohe Kosten verursacht. Das ist aber nicht unbedingt der Fall. Die\nrichtige Wahl des Verkehrsmittels kann hier die Kosten senken. Bahnfahrten sind nämlich nicht nur günstiger als\nBusinessflüge und besser für die Umwelt als Autofahren, sondern haben auch weitere positive Seiten. Denn man\nmuss sich nicht auf den Verkehr konzentrieren und kann sogar im Zug arbeiten.\nChef : Danke für diese Anlegungen, Frau Seibert. Wir haben noch viel zu tun in diesem Bereich. Das sehen wir jetzt\ndeutlich. Und jetzt kommt noch der praktische Teil. Wir schauen uns die konkrete Situation in unseren Büros\ngenauer an.\nDabei hoffe ich dann auf Ihre Fragen und Vorschläge zum Thema‘‘ Wie wird unser Büro ein nachhaltiges Büro?‘‘","questions":[{"n":32,"type":"mcq","text":"Ein Computer sollte","options":[{"key":"a","text":"nicht mehrmals ein- und ausgeschaltet werden."},{"key":"b","text":"nur selten ganz heruntergefahren werden."},{"key":"c","text":"von allein in den Ruhemodus schalten."}],"answer":"c"},{"n":33,"type":"mcq","text":"Frau Seibert empfiehlt,","options":[{"key":"a","text":"den Entwurfmodus zu verwenden."},{"key":"b","text":"immer Recyclingpapier zu benutzen."},{"key":"c","text":"Unterlagen für Kunden beidseitig zu bedrucken."}],"answer":"a"},{"n":34,"type":"mcq","text":"Frau Seibert findet es wichtig, dass","options":[{"key":"a","text":"die Firma den Müll sorgfältiger trennt."},{"key":"b","text":"mehr recycelt wird."},{"key":"c","text":"weniger Abfall produziert wird."}],"answer":"c"},{"n":35,"type":"mcq","text":"Geschäftsreisen","options":[{"key":"a","text":"lassen sich problemlos durch Videokonferenzen ersetzen."},{"key":"b","text":"mit der Bahn haben verschiedene Vorteile."},{"key":"c","text":"sind teurer, wenn sie umweltfreundlich sind."}],"answer":"b"}]},{"id":"H3V5","title":"Prüfungsvariante 5","pages":[139,140],"transcript":"Leiterin: Guten Morgen alle zusammen. Ich hoffe, Sie hatten alle einen guten Start in den Tag. Bevor wir gleich in\nden Arbeitsalltag starten, möchte ich die Gelegenheit nutzen, um Sie über ein wirklich spannendes Projekt zu\ninformieren. Wir arbeiten schon seit einiger Zeit daran und jetzt, da die ersten Schritte in die Wege geleitet sind,\nmöchte ich Sie alle ins Boot holen. Es geht um unsere neue Werbekampagne. Sie wissen ja, dass unser altes\nKonzept in den letzten Jahren wirklich gut funktioniert hat. Aber, wie das so ist, wir müssen uns weiterentwickeln\nund die Zeit steht ja bekanntlich nicht still, richtig? Deshalb habe ich beschlossen, dass wir dieses Mal eine völlig\nneue Richtung einschlagen. Und ja, bevor die Frage aufkommt, ich habe eine professionelle Agentur damit\nbeauftragt, uns dabei zu unterstützen. Die Jungs und Mädels von dieser Agentur, ich sage Ihnen, die haben wirklich\nwas drauf. Wir haben ja schon einmal mit ihnen zusammengearbeitet und das hat damals super geklappt.\nHerr Müller: Ah, das klingt spannend. Und ich nehme an, die Agentur übernimmt dann alles komplett. Oder wie\nläuft das?\nLeiterin: Ganz genau, Herr Müller, wobei wir natürlich auch unseren Input geben werden. Es soll ja am Ende auch\nzu uns passen. Wir haben regelmäßige Meetings mit der Agentur, um sicherzustellen, dass die Kampagne wirklich\nunsere Botschaft transportiert. Aber die grobe Gestaltung liegt bei ihnen. Der erste Entwurf soll schon nächsten\nMonat kommen. Wenn alles nach Plan läuft, können wir im Frühling richtig durchstarten.\nFrau Meier: Aha, das klingt vielversprechend. Und werden wir dann auch verstärkt auf soziale Medien setzen? Sie\nwissen ja, das ist heutzutage fast wichtiger als klassische Werbung.\nLeiterin: Genau, das ist ein großer Punkt, Frau Meier. Die sozialen Netzwerke spielen eine enorm wichtige Rolle in\nder neuen Kampagne. Wir wollen sie nicht nur nutzen, um unsere Produkte zu bewerben, sondern auch, um\npotenzielle Mitarbeiter anzusprechen. Es ist kein Geheimnis, dass viele junge Talente über Plattformen wie\nLinkedIn oder Instagram auf uns aufmerksam werden. Bevor wir uns in den klassischen Bewerbungsprozess\nstürzen, möchten wir da schon früh Kontakt aufnehmen. So können wir die Bewerber auch ein wenig besser\nkennenlernen, bevor es zu einem Vorstellungsgespräch kommt.\nHerr Müller: Und wie sieht es eigentlich mit unserer neuen Filiale aus? Da war doch die Rede von einem speziellen\nBeleuchtungskonzept, oder?\n139\nLeiterin: Ganz richtig. Da sind wir noch mitten in der Planung. Es hat sich herausgestellt, dass einige Kunden mit\nder bisherigen Beleuchtung in den anderen Filialen nicht ganz zufrieden waren. Es war manchmal etwas dunkel und\ndas passt einfach nicht zu unserem Image. Deswegen arbeiten wir gerade an einem komplett neuen Konzept, das wir\nzunächst in der neuen Filiale testen wollen. Wenn es gut ankommt, wird das dann das Modell für alle zukünftigen\nStandorte. Ich denke, das wird ein echter Hingucker.\nFrau Meier: Und was sagen unsere Kunden zu den Produkten? Haben wir da schon Feedback, wie sie die aktuellen\nKollektionen finden?\nLeiterin: Oh ja, das Feedback ist super. Wir haben wirklich viele Rückmeldungen bekommen und es ist ganz klar,\nunsere Kunden legen viel mehr Wert auf Qualität als auf den Preis. Das hat mich ehrlich gesagt ein wenig\nüberrascht, aber es zeigt, dass wir auf dem richtigen Weg sind. Natürlich müssen wir darauf achten, weiterhin diesen\nhohen Qualitätsstandard zu halten.\nAber keine Sorge, wir haben da schon einige Ideen, wie wir das noch weiter ausbauen können.\nHerr Müller: Aber sagen Sie mal, wann geht das denn alles los? Ich meine, die neue Kampagne und das neue\nBeleuchtungskonzept, wann sehen wir da die ersten Ergebnisse?\nLeiterin: Gute Frage. Also, was die Werbekampagne angeht, habe ich bereits mit der Agentur vereinbart, dass die\nersten Entwürfe Mitte nächsten Monats kommen. Da werden wir dann noch ein paar Feinheiten anpassen und\nspätestens im Frühling sollte alles startklar sein. Was das Beleuchtungskonzept angeht, da müssen wir noch ein\nbisschen Geduld haben. Das wird Schritt für Schritt umgesetzt und ich denke, es wird Ende des Sommers, bis wir\nalle Filialen umgestellt haben. Aber ich kann Ihnen versprechen, dass es die Mühe wert sein wird.","questions":[{"n":32,"type":"mcq","text":"Die Werbekampagne","options":[{"key":"a","text":"gestaltet eine Agentur."},{"key":"b","text":"ist schon fertig."},{"key":"c","text":"wird intern konzipiert."}],"answer":"a"},{"n":33,"type":"mcq","text":"Die sozialen Medien werden dazu genutzt, um","options":[{"key":"a","text":"aktiv neue Bewerber zu finden."},{"key":"b","text":"Bewerbungsgespräche zu führen."},{"key":"c","text":"die Bewerber besser kennenzulernen."}],"answer":"a"},{"n":34,"type":"mcq","text":"Das Beleuchtungskonzept der anderen Filialen","options":[{"key":"a","text":"führte zu Unzufriedenheit bei der Kundschaft."},{"key":"b","text":"soll als Modell für die neue Filiale dienen."},{"key":"c","text":"wird zurzeit neu ausgearbeitet."}],"answer":"a"},{"n":35,"type":"mcq","text":"Die Kundschaft","options":[{"key":"a","text":"achtet mehr auf die Qualität als auf den Preis."},{"key":"b","text":"interessiert sich ausschließlich für Luxusmode."},{"key":"c","text":"bevorzugt Mode im unteren Preisbereich."}],"answer":"a"}]},{"id":"H3V6","title":"Prüfungsvariante 6","pages":[141,142],"transcript":"Chefin: Nun zu einem weiteren Punkt unserer Tagesordnung. Der Vorstand hat beschlossen, im Unternehmen ein\nsogenanntes Bonussystem für die Mitarbeiter*innen einzuführen. Was meinen wir damit? Wir stellen uns vor,\ndass sowohl jede und jeder Einzelne, als auch Abteilungen und Teams von den Erfolgen der Firma profitieren,\nindem besondere Leistungen extra belohnt werden. Wir erwarten uns davon, dass die Motivation aller\nMitarbeitenden, sich für das Unternehmen einzusetzen, gesteigert wird.\nTN 1: Das klingt ja prinzipiell sehr interessant, aber geht es dabei nicht eher um einen Wettbewerb unter den\nMitarbeiter*innen? Das würde die Stimmung im Unternehmen sicherlich verschlechtern.\nChefin: Das ist eine berechtigte Frage, Frau Schmidt.\nGenau darüber haben wir auch viel diskutiert. Wir werden ein System einführen, das die Einschätzung der einzelnen\nPersonen wie auch der Abteilungen gleichermaßen in Betracht zieht. Dafür haben wir zwei Fragebögen erstellt.\nEinen für die Mitarbeitenden und einen anderen für die einzelnen Abteilungen. Zunächst soll mit den Fragebögen\ngrundsätzlich das Kompetenzprofil von jedem Einzelnen und auch von jeder Abteilung erfasst werden. Dazu\ngehören solche Informationen wie die Qualifikationen, Ausbildungen und Berufserfahrungen. Gleichzeitig sollen\nauf der Basis dieser Informationen auch die Entwicklungsmöglichkeiten innerhalb des Betriebs ermittelt werden. Im\nGegensatz dazu geht es bei den Zielen der Abteilungen beispielsweise um Kostenersparnis und Umsatzsteigerung.\nTN 2: Werden dann auch die Interessen von uns Mitarbeitenden dabei berücksichtigt? Also ich meine, kann man\nauch Wünsche äußern?\nChefin: Ja, natürlich. Wenn Sie das auf Ihre persönliche Karriereentwicklung beziehen, ist dieses Feedback sogar\nsehr wichtig. Wir möchten unter anderem von Ihnen gerne erfahren, ob Sie bei Ihrer Arbeit persönliche\nEntwicklungsmöglichkeiten sehen. Dazu kommt aber auch noch eine Analyse Ihrer Stärken und Schwächen, die uns\nund Ihnen ein klares Bild Ihrer Kompetenzen geben.\nJetzt mal ein Beispiel. Für uns als Arbeitgeber ist die Pünktlichkeit von großem Interesse. Damit meinen wir nicht,\ndass Sie jeden Morgen pünktlich am Arbeitsplatz erscheinen, sondern eher, ob Sie Ihre Arbeit fristgerecht und\nsorgfältig ausführen. Das ist das, was man allgemein unter gutem Zeitmanagement versteht. Ein weiteres Kriterium\nist auch die Bereitschaft an Weiterbildungsseminaren teilzunehmen. Wie Sie ja selber wissen, muss man immer auf\ndem neuesten Stand sein.\nNach Ablauf von zwölf Monaten wird dann ein erstes obligatorisches Feedback-Gespräch zwischen den\nMitarbeitenden und den Vorgesetzten geführt und geschaut, wie die Entwicklung war. Diese Gespräche sollten von\nbeiden Seiten, also vom Arbeitgeber und vom Arbeitnehmer, gleichermaßen gut vorbereitet sein. Hierzu sollten\nbeide Seiten im Laufe des Jahres Notizen zur gelungenen Umsetzung der Ziele machen, um dann gemeinsam zu\nschauen, was und wie etwas erreicht wurde und warum etwas vielleicht nicht erreicht wurde. Das ermöglicht uns\nauch zukünftig, die Mitarbeiter*innen ihren Ressourcen und Wünschen entsprechend optimal im Unternehmen\nbeziehungsweise in der Abteilung einzusetzen, wovon sowohl Sie als Arbeitnehmer*innen als auch wir als\nArbeitgeber profitieren. Je nachdem, inwieweit die gemeinsam vereinbarten Ziele erreicht wurden, werden Punkte\nvergeben. Und ab einer bestimmten Punktzahl gibt es Prämien.\nTN 3: Und was für Prämien sind das?\nChefin: Bei den Prämien denken wir an Leistungen wie zum Beispiel an einen Zuschuss für eine Mitgliedschaft im\nFitnessstudio oder auch an einen Tankgutschein. Diese Gutscheine sind jeweils zwölf Monate gültig und können\nnicht ausgezahlt werden.\nTN 2: Könnte man nicht auch andere Sachen, wie zum Beispiel Eintrittskarten für die ganze Familie in den Zoo, in\neinen Freizeitpark oder in ein Erlebnisbad bekommen?\nChefin: Ja, wir sind da ganz offen. Gerne können Sie Ihre Ideen an uns weiterleiten. Das gleiche gilt auch, wenn wir\ndie Boni für die Abteilungen betrachten. Wir denken in die Richtung gemeinsame Städtereisen oder andere\nWochenendausflüge. Aber auch ein Bowling-Abend mit Kolleg*innen und anschließendem Restaurantbesuch wäre\nmöglich.\nTN 1: Das klingt nach einem gut durchdachten und fairen System.\nChefin: Ja, das denken wir auch. So erwarten wir uns davon natürlich nicht nur eine Produktivitätssteigerung und\nzufriedenere Kunden, sondern auch engagiertere Mitarbeitende. Gemeinsam erreichte Ziele stärken das\nZusammengehörigkeitsgefühl genauso wie gemeinsame Aktivitäten, die aufgrund des Bonus-Systems unternommen\nwerden können. Das geht auch um Spaß, denn schließlich ist Arbeit nur das halbe Leben.\n141","questions":[{"n":32,"type":"mcq","text":"Das Bonussystem","options":[{"key":"a","text":"dient der Einsatzbereitschaft der Mitarbeitenden."},{"key":"b","text":"verstärkt die Konkurrenz unter den Kollegen."},{"key":"c","text":"wird von den Mitarbeitenden gefordert."}],"answer":"a"},{"n":33,"type":"mcq","text":"Mit den Fragebögen wird","options":[{"key":"a","text":"die Stimmung im Unternehmen ermittelt."},{"key":"b","text":"die Entwicklung der Firma dokumentiert."},{"key":"c","text":"ein Mitarbeiterprofil erstellt."}],"answer":"c"},{"n":34,"type":"mcq","text":"Das erste Gespräch","options":[{"key":"a","text":"findet nach einem Jahr statt."},{"key":"b","text":"ist freiwillig."},{"key":"c","text":"muss nicht vorbereitet werden."}],"answer":"a"},{"n":35,"type":"mcq","text":"Als Bonus für gute Leistungen","options":[{"key":"a","text":"bekommen alle Mitarbeitenden Geld."},{"key":"b","text":"erhalten die Angestellten eine Sachleistung."},{"key":"c","text":"gehen die Mitarbeitenden mit den Familien essen."}],"answer":"b"}]}],"teil4":[{"id":"H4V1","title":"Prüfungsvariante 1","pages":[144],"tracks":[{"id":"H4V1N36","n":36,"transcript":"Hallo, hier ist Andrea Faber. Wir sind doch am Freitag zum Arbeitsfrühstück verabredet. Leider kann ich unseren\nTermin nicht einhalten. Wir haben ein spontanes Treffen mit unserem Vertreter aus Wien. Kannst du auch nächste\nWoche Montag? Das ist der 25. Ich halte dir mal den Vormittag frei. Sei doch so nett und gib mir bitte heute noch\nBescheid, ob dir der Termin passt. Es ist wichtig, dass wir uns zeitnah zusammensetzen. Danke.","question":{"n":36,"type":"mcq","text":"Andrea","options":[{"key":"a","text":"wird mit dem Vertreter frühstücken."},{"key":"b","text":"sagt den Termin ab."},{"key":"c","text":"wird sich am Montag melden."}],"answer":"b"}},{"id":"H4V1N37","n":37,"transcript":"Hallo, hier ist Zeuner, der neuen Assistent der Geschäftsleitung. Sie wollten am Dienstag die neue Werbekampagne\nmit Frau Plasberg besprechen, aber sie ist leider wegen einer Steuerprüfung hier im Haus verhindert. Die restliche\nWoche ist sie auf Dienstreise. Ginge bei Ihnen auch der Dienstag nächster Woche zur selben Zeit. Bevor unser\nKunde am Freitag kommender Woche zur Präsentation kommt, müssen noch wichtige Dinge geklärt werden. Bitte\nbestätigen Sie den Termin. Vielen Dank.","question":{"n":37,"type":"mcq","text":"Frau Plasberg","options":[{"key":"a","text":"möchte Steuerprüfung auswerten."},{"key":"b","text":"möchte die neue Werbekampagne diskutieren."},{"key":"c","text":"möchte über die Dienstreise sprechen."}],"answer":"b"}},{"id":"H4V1N38","n":38,"transcript":"Hallo, Daniela Schöller von der Firma Neuhaus. Die für heute angekündigte Ware ist jetzt versandfertig. Ich habe\nIhnen ja schon gesagt, dass das Transporthub sehr zerbrechlich ist und nicht gestattet werden darf. Wie Sie wissen,\nist die Lieferung sehr eilig und der Kunde hat den Eilzuschlag gezahlt. Es ist also unumgänglich, dass die Kisten\nheute noch abgeholt werden. Bitte bestätigen Sie mir kurz, dass das heute noch klappt. Bis später.","question":{"n":38,"type":"mcq","text":"Daniela Schöller","options":[{"key":"a","text":"bittet um heutige Abholung der Ware."},{"key":"b","text":"braucht die Lieferung dringend."},{"key":"c","text":"hat den Eilzuschlag bezahlt."}],"answer":"a"}},{"id":"H4V1N39","n":39,"transcript":"Hallo, Guido Lattermann von der Firma Top Elektronik. Ich muss Ihnen leider mitteilen, dass die von Ihnen\nbestellte Maschine heute wegen des Sturms in Hamburg nicht verladen werden konnte. Die Lieferung verzögert sich\nwahrscheinlich um eine Woche. So wie es aussieht, kommt das Schiff am 16. Mai bei Ihnen in Dresden an. Es wäre\nnett, wenn Sie uns dann den Empfang der Ware bestätigen können. Ein kurzer Anruf reicht. Ich wünsche Ihnen\neinen schönen Tag und bitte entschuldigen Sie die Unannehmlichkeiten.","question":{"n":39,"type":"mcq","text":"Herr Lattermann","options":[{"key":"a","text":"bekommt eine Maschine aus Hamburg."},{"key":"b","text":"bestätigt den Empfang der Maschine."},{"key":"c","text":"liefert eine Maschine nach Dresden."}],"answer":"c"}},{"id":"H4V1N40","n":40,"transcript":"Bernhard, Geschäftsleitung. Ich habe mir Ihren Entwurf für unsere neue Homepage angesehen.\nIm Großen und Ganzen gefällt er mir recht gut, aber ich habe noch ein paar Änderungen. Wir sollten mehr\nhervorheben, was uns von anderen Firmen unterscheidet. Z.B. die zehnjährige Garantie, die wir auf unsere Produkte\ngeben. Das ist aber noch nicht alles. Bitte melden Sie sich bei meiner Sekretärin Frau Zimmer für einen Termin, bei\ndem ich Ihnen die Punkte kurz erläutern kann.","question":{"n":40,"type":"mcq","text":"Frau Bernhard","options":[{"key":"a","text":"hat Änderungswünsche für die Homepage."},{"key":"b","text":"meldet sich bei ihrer Sekretärin."},{"key":"c","text":"möchte die Garantie verlängern. 144"}],"answer":"a"}}]},{"id":"H4V2","title":"Prüfungsvariante 2","pages":[145],"tracks":[{"id":"H4V2N36","n":36,"transcript":"Hi,Robert Krüger hier. Ich habe die Organisation der diesjährigen Weihnachtsfeier ja von dir übernommen. Ich weiß\naber noch nicht, welches Restaurant ich reservieren soll. Ich bin ja noch ziemlich neu in der Stadt. Ihr wart letztes\nJahr doch beim Griechen, oder? Dieses Jahr sollte es etwas anderes sein. Vielleicht eins, wo es eine größere\nAuswahl an Fleischlosen Gerichten gibt. Deine Meinung hier wäre mir wichtig.","question":{"n":36,"type":"mcq","text":"Robert Krüger","options":[{"key":"a","text":"hat letztes Jahr die Weihnachtsfeier organisiert."},{"key":"b","text":"möchte bei einem Griechen feiern."},{"key":"c","text":"denkt an die Interessen der Vegetarier."}],"answer":"c"}},{"id":"H4V2N37","n":37,"transcript":"Hallo Bettina. Katrin hier. Hast du schon gehört, dass Heli Joni nächste Woche einen runden Geburtstag feiert?\nWir, ihr Team, brauchen noch ein Geschenk für sie, haben aber keine Idee. Du kennst sie ja privat. Hast du\nvielleicht einen Vorschlag? Normalerweise gibt jeder 5 €. Es darf also etwa 70 € kosten. Wenn es etwas mehr kostet,\nist es aber auch nicht schlimm. Kannst du mich später zurückrufen? Das wäre super.","question":{"n":37,"type":"mcq","text":"Katrin","options":[{"key":"a","text":"will Bettina mit einem Geschenk überraschen."},{"key":"b","text":"sucht eine Anregung für ein Geschenk."},{"key":"c","text":"möchte ein kleines Geschenk für fünf Euro kaufen."}],"answer":"b"}},{"id":"H4V2N38","n":38,"transcript":"Hallo, Stefan Körner hier. Ich wollte Sie nur daran erinnern, dass die Brandmelder in den Büros demnächst\nausgetauscht werden müssen. Bei der letzten Wartung hat uns der Fachmann von der Müller Brandschutz GmbH\ndarauf aufmerksam gemacht, dass wir sie nur noch bis Ende des Jahres in Betrieb haben dürfen. Können Sie bitte\nbei der Firma anrufen und fragen, wann jemand bei uns vorbeikommen kann?\nBei Fragen rufen Sie mich einfach zurück.","question":{"n":38,"type":"mcq","text":"Stefan Körner bittet seinen Kollegen,","options":[{"key":"a","text":"die Wartung zu beauftragen."},{"key":"b","text":"einen Termin zu vereinbaren."},{"key":"c","text":"die Brandmelder zu warten."}],"answer":"b"}},{"id":"H4V2N39","n":39,"transcript":"Hallo, Barbara hier. Ich rufe noch mal an wegen des Besuchs der Kollegen aus unserer französischen Niederlassung.\nSo viel ich weiß, ist am Montagmorgen eine Betriebsbesichtigung geplant und am Nachmittag gibt es dann noch ein\ngroßes Begegnungsfest. Ich brauche bitte noch die genaue Zahl der Anmeldungen, damit ich das Essen und die\nGetränke bestellen kann. Du hast den Raum ja schon gebucht, richtig? Melde dich doch einfach, wenn du wieder am\nPlatz bist.","question":{"n":39,"type":"mcq","text":"Barbara","options":[{"key":"a","text":"organisiert allein das Begegnungsfest."},{"key":"b","text":"wird den französischen Kollegen die Firma zeigen."},{"key":"c","text":"kümmert sich um die Verpflegung der Gäste."}],"answer":"c"}},{"id":"H4V2N40","n":40,"transcript":"Hallo, Michaell Brüger von der Brüger Hausverwaltung. Wie ich Ihnen gestern schon auf den Anrufbeantworter\ngesprochen habe, ist bei uns im Haus in der Ludwigsstraße 8 seit vorgestern die Heizung defekt.\nDas Problem muss umgehend behoben werden, da in den nächsten Tagen -5 Grad erwartet werden. Ich hätte\neigentlich gestern mit einem zeitnahen Rückruf gerechnet. Das hat in den letzten Jahren ja immer geklappt. Rufen\nSie mich bitte in den nächsten Stunden zurück.","question":{"n":40,"type":"mcq","text":"Michaell Brüger möchte, dass","options":[{"key":"a","text":"die Heizung repariert wird."},{"key":"b","text":"er in den nächsten Tagen zurückgerufen wird."},{"key":"c","text":"die Heizkörper ausgetauscht werden. 145"}],"answer":"a"}}]},{"id":"H4V3","title":"Prüfungsvariante 3","pages":[146],"tracks":[{"id":"H4V3N36","n":36,"transcript":"Hallo, Waldemar Hahrmann, Öffentlichkeitsarbeit. Die Lehrerin von meiner Tochter hat angerufen. Die Kleine hat\nFieber und muss abgeholt werden. Heute sollte ich doch gegen 10:30 Uhr die potenziellen Partner unserer Firma\ndurch den Betrieb führen. Könntest du das übernehmen? Wäre super. Ist auch ganz unproblematisch. Treffpunkt ist\nder Eingangsbereich des Verwaltungsgebäudes. Dann geht es sofort über zu der neuen Produktionshalle und danach\nnoch in die Lagerhalle. Nach einem kurzen Rundgang durch die Büros auf der ersten Etage schließen wir mit Kaffee\nund Kuchen in der Kantine ab.","question":{"n":36,"type":"mcq","text":"Waldemar","options":[{"key":"a","text":"trifft die Partner an der Produktionshalle."},{"key":"b","text":"geht es nicht so gut."},{"key":"c","text":"muss seine Tochter abholen./ muss sich um seine Tochter kümmern."}],"answer":"c"}},{"id":"H4V3N37","n":37,"transcript":"Hallo, hier ist Jana Wartner von Hessen-Grönland. Danke für den Kostenvoranschlag, den Sie mir gestern noch\ngemailt haben. Wir möchten einen Probeauftrag für zehn Laserdrucker Modell X3 aufheben. Bei unserem letzten\nGespräch haben wir 5% Einführungsrabatt vereinbart. Die Zahlung erfolgt bar bei der Lieferung. Den Auftrag\nbekommen Sie natürlich noch ganz offiziell da näher. Aber wir brauchen die Drucker wirklich dringend für unser\nneues Großraumbüro. Können Sie mir garantieren, dass die Lieferung rechtzeitig eintreffen wird? Bitte um gute\nAntwort.","question":{"n":37,"type":"mcq","text":"Jana","options":[{"key":"a","text":"hat den Auftrag bereits gemailt."},{"key":"b","text":"mochte einen höheren Rabatt vereinbaren."},{"key":"c","text":"benötigt die Drucker für das Großraumbüro."}],"answer":"c"}},{"id":"H4V3N38","n":38,"transcript":"Hallo, Erisia hier . Frau Schmidt musste dringend kurz weg und wird erst gegen Mittag wieder hier sein. Deshalb ist\nJana alleine am Empfang. Jetzt ist der Zug aus Russland auch noch früher gekommen als geplant. Jana kann doch\nkeine Russen speisen. Wir bräuchten deine Hilfe zum Dolmetschen. Ich habe die Gatten in den Konferenzraum\ngebracht und ihnen den Kaffee und Snacks angeboten. Könntest du dich um sie kümmern, bis Frau Schmidt zurück\nist? Das wäre super. Danke.","question":{"n":38,"type":"mcq","text":"Erisia","options":[{"key":"a","text":"ist allein am Empfang."},{"key":"b","text":"schickt Frau Schmidt in den Konferenzraum."},{"key":"c","text":"braucht einen Dolmetscher."}],"answer":"c"}},{"id":"H4V3N39","n":39,"transcript":"Hi, Trixi nochmal. Es geht schon wieder um den Messeauftritt in Köln nächste Woche. Ich habe nun endlich eine\npreisgünstige Spedition gefunden, die unsere Ausstellungsstücke von Leipzig nach Köln und zurück transportiert.\nKontenmappe, Broschüren und Werbeposter haben wir alles schon verpackt. Ich kann sie mitnehmen, weil ich selbst\nvor Ort sein werde. Nur eins noch. Für den Auf- und Abbau des Standes brauche ich zwei handkräftige Kollegen\nzur Unterstützung. Bitte heute noch melden, wer mithelfen könnte, sodass ich die Hotelzimmer für die Woche\nverwirklich buchen kann. Danke.","question":{"n":39,"type":"mcq","text":"Trixi","options":[{"key":"a","text":"fährt mit zur Messe nach Köln."},{"key":"b","text":"hat die Hotelzimmer schon gebucht."},{"key":"c","text":"findet keine kostengünstige Spedition."}],"answer":"a"}},{"id":"H4V3N40","n":40,"transcript":"Hallo, Julius Lehmann, Personalabteilung. Wegen der Fortbildung bei Händelbau nächste Woche. Kannst du bitte\nden Teilnehmern noch einmal deutlich sagen, dass dort im ganzen Haus Rauchverbot besteht? Der Raucherbereich\nbefindet sich frei. Die Kollegen sollen außerdem zu ihrer eigenen Sicherheit stets auf den grün markierten Bereichen\nbleiben, wegen der Gefahr von Gabelstaplern angefangen zu werden. Das sind Sicherheitsvorschriften, die wir\nunbedingt einhalten müssen. Sonst würden wir in diesem Unternehmen keine Fortbildung mehr machen. Das wäre\nsehr schade, denn bisher gab es nur gute Rückmeldungen zu den Veranstaltungen. Danke.","question":{"n":40,"type":"mcq","text":"Julius","options":[{"key":"a","text":"darf keine Fortbildung mehr buchen."},{"key":"b","text":"erinnert an die Sicherheitsregeln zur Fortbildung."},{"key":"c","text":"hat negative Reaktionen zu Fortbildungen bekommen. 146"}],"answer":"b"}}]},{"id":"H4V4","title":"Prüfungsvariante 4","pages":[147],"tracks":[{"id":"H4V4N36","n":36,"transcript":"Hallo, Rita hier. Du hast mir doch erzählt, dass dein Sohn einen Laptop sucht. Nächste Woche bekommt unsere\nAbteilung neue Computer und neue Drucker. Deshalb werden die alten Geräte günstig an interessierte Mitarbeiter\nabgegeben. Das heißt, wer noch für zu Hause Computer, Laptops oder Drucker braucht, kann sich bis Freitag in eine\nListe am schwarzen Brett eintragen.\nDer Verkauf findet dann ab Montag ab 14:30 Uhr im Großraumbüro 2 statt. Man kann die Geräte dann direkt\nmitnehmen. Der Erlös wird übrigens für die Finanzierung unseres Sommerfests verwendet.","question":{"n":36,"type":"mcq","text":"Rita","options":[{"key":"a","text":"informiert über den Verkauf der Firmencomputer."},{"key":"b","text":"möchte ihren privaten Computer günstig verkaufen."},{"key":"c","text":"sorgt sich um die Finanzierung des Sommerfests."}],"answer":"a"}},{"id":"H4V4N37","n":37,"transcript":"Guten Tag, Konstantinos Pagonis von der Firma Pizzos.\nIch wollte mich nochmal wegen Ihres Besuchs in der nächsten Woche melden. Sie brauchen sich nicht um den\nTransfer vom Flughafen zur Firma kümmern. Meine Kollegin wird Sie in der Ausgangshalle A am Infopoint\nempfangen und mit Ihnen zusammen zu unserem Werk in Thessaloniki fahren.\nDort warte ich auf Sie und wir machen gemeinsam eine Werksbesichtigung. Ich freue mich schon, Sie persönlich\nkennenzulernen.","question":{"n":37,"type":"mcq","text":"Konstantinos Pagonas ruft an, um","options":[{"key":"a","text":"einen Firmenbesuch anzukündigen."},{"key":"b","text":"nach dem Weg zur Firma zu fragen."},{"key":"c","text":"organisatorische Informationen mitzuteilen."}],"answer":"c"}},{"id":"H4V4N38","n":38,"transcript":"Lara Hartmann aus der Personalabteilung. Ich habe Sie bisher leider nicht persönlich erreicht, deshalb spreche ich\njetzt auf die Mailbox. Unser Steuerbüro hat gestern angerufen. Dort benötigt man dringend die Belege für Ihre\nDienstreise nach Berlin im Mai des vergangenen Jahres. Können Sie mir diese bitte im Original am Montag im Büro\nvorbeibringen? Vielen Dank und entschuldigen Sie die kurze Frist.\nFür Rückfragen erreichen Sie mich heute noch bis 17 Uhr.","question":{"n":38,"type":"mcq","text":"Lara Hartmann","options":[{"key":"a","text":"benötigt Dokumente für das Steuerbüro."},{"key":"b","text":"bringt der Kollegin die Belege vorbei."},{"key":"c","text":"hat gestern das Steuerbüro angerufen."}],"answer":"a"}},{"id":"H4V4N39","n":39,"transcript":"Thomas Barthel, IT-Abteilung. Sie hatten angerufen, weil Sie Ihren PC nicht mehr runterfahren können.\nEntschuldigen Sie, dass ich mich jetzt erst melde, aber seit der Systemumstellung haben wir im ganzen Haus viel zu\ntun, weil viele Kollegen Fragen dazu haben. Aber Ihr Problem, denke ich, kann ich per Fernwartung lösen.\nDazu bräuchte ich Sie aber am Telefon. Bitte rufen Sie mich zurück. Ich bin heute bis 18 Uhr im Büro.","question":{"n":39,"type":"mcq","text":"Thomas Barthel","options":[{"key":"a","text":"hat Schwierigkeiten mit seinem Computer."},{"key":"b","text":"kann das aufgetretene Problem wohl schnell lösen."},{"key":"c","text":"soll eine Systemumstellung im Haus vornehmen."}],"answer":"b"}},{"id":"H4V4N40","n":40,"transcript":"Clara Günther, Personalabteilung hier.\nDie Geschäftsführung hatte doch beschlossen, dass die Urlaubsplanung für das kommende Jahr zentral gemacht\nwerden soll. Daher wurden alle Mitarbeiterinnen und Mitarbeiter aufgefordert, ihre Urlaubswünsche bis zum 30.\nNovember im Intranet einzutragen. Heute ist schon der 29. und ich habe gesehen, dass Sie noch nichts angegeben\nhaben. Deshalb dachte ich, ich sage noch mal kurz Bescheid. Für den Fall, dass Sie es vergessen haben.\nSchönen Tag noch.","question":{"n":40,"type":"mcq","text":"Klara Günther","options":[{"key":"a","text":"erinnert an die neue Urlaubsplanung."},{"key":"b","text":"legt die Urlaubsplanung zentral fest."},{"key":"c","text":"möchte am 29. November Urlaub nehmen. 147"}],"answer":"a"}}]},{"id":"H4V5","title":"Prüfungsvariante 5","pages":[148],"tracks":[{"id":"H4V5N36","n":36,"transcript":"Hallo, Jana / Katia Müller hier.\nEs geht nochmal um unseren Workshop am 8. Mai. Könntest du bitte dafür sorgen, dass im Raum K7 ein\nfunktionstüchtiger Beamer steht? Und Internet brauchen wir natürlich auch. Ich würde vor der Veranstaltung alle\nTops auf einen Flipchart schreiben. Wir müssen dann nur sicherstellen, dass der auch im Raum bleibt. Nicht, dass\nwir wieder kurz vor Veranstaltungsbeginn danach suchen müssen. Und Moderationskarten und Marker bringe ich\nübrigens mit.","question":{"n":36,"type":"mcq","text":"Jana / Katia","options":[{"key":"a","text":"benötigt einen Internetzugang im Raum."},{"key":"b","text":"besorgt einen Beamer für die Veranstaltung."},{"key":"c","text":"stellt den Flipchart in den Veranstaltungsraum."}],"answer":"a"}},{"id":"H4V5N37","n":37,"transcript":"Hi, Felix hier. Ich habe gute Nachrichten. Unsere Kollegen vom Kundenservice bekommen jetzt ihre Schulung und\nwir sollen das vorbereiten. Um Zeit und Kosten zu sparen, soll diese Fortbildung online stattfinden. Und ich habe\nschon mehrere Anbieter für die Schulungssoftware angefragt. Ich hoffe, die Angebote kommen nächste Woche.\nDann können wir uns vielleicht gleich für eins entscheiden. Wir müssen auch noch einen Feedbackbogen und einen\nAbschlusstest entwerfen. Wann würde es dir denn am besten passen?","question":{"n":37,"type":"mcq","text":"Felix","options":[{"key":"a","text":"bittet um einen Terminvorschlag."},{"key":"b","text":"hat schon Angebote für die Software."},{"key":"c","text":"soll an einer Schulung teilnehmen."}],"answer":"a"}},{"id":"H4V5N38","n":38,"transcript":"Hallo, hier ist Kathrin Schönberner von der Kundenbetreuung. Ich habe heute schon wieder einige Beschwerden von\nKunden bekommen, auch von Standkunden übrigens, weil es immer wieder Probleme mit der Spedition „Flink und\nSicher “ gibt. Wenn die weiterhin die vereinbarten Lieferfristen nicht einhalten, gehen unsere Kunden zur\nKonkurrenz. Ich glaube, wir sollten dringend handeln und uns zusammensetzen, um eine Lösung zu finden.\nVielleicht müssen wir uns nach einem neuen Partner umschauen. Passt Ihnen morgen um drei.","question":{"n":38,"type":"mcq","text":"Kathrin Schönberner hat","options":[{"key":"a","text":"Angst, Kunden zu verlieren."},{"key":"b","text":"eine neue Spedition gefunden."},{"key":"c","text":"Fristen nicht beachtet."}],"answer":"a"}},{"id":"H4V5N39","n":39,"transcript":"Daniel Meyer von der Firma Busch. Guten Tag. Nächste Woche wechseln Sie ja die Telefonanlage bei uns in der\nSemperstraße 2 aus. Und dazu habe ich noch ein paar Fragen. Wie lange werden wir denn nicht telefonieren\nkönnen? Außerdem hatten Sie gesagt, dass die Telefonapparate ausgetauscht werden müssen. Bringen Sie die neuen\ngleich mit? Und wir brauchen noch eine Einweisung in die Nutzung der neuen Anlage. Es wäre sinnvoll, wenn wir\ndas an dem Tag auch gleich machen könnten.","question":{"n":39,"type":"mcq","text":"Daniel Meyer möchte wissen,","options":[{"key":"a","text":"ob die Telefonapparate ausgetauscht werden."},{"key":"b","text":"wer den Kollegen die Anlage erklärt."},{"key":"c","text":"wie lange die Telefonanlage nicht funktionieren wird."}],"answer":"c"}},{"id":"H4V5N40","n":40,"transcript":"Hallo, hier ist Anja nochmal. Du kommst doch am Freitag auch zu der außerplanmäßigen Abteilungsbesprechung,\noder? Zumindest habe ich deinen Namen auf der Liste gelesen.Kannst du bitte Katharinas Präsentation übernehmen?\nSie ist die ganze nächste Woche auf einer Schulung und kommt dann erst wieder Montag ins Haus.\nIhr habt doch die Verkaufszahlen vom letzten Quartal zusammen ausgewertet. Ich habe darüber leider keinen\nÜberblick und kann es nicht selbst machen. Gibst du mir bitte kurz Bescheid, ob es klappt? Danke.","question":{"n":40,"type":"mcq","text":"Anja","options":[{"key":"a","text":"kann nicht zur Besprechung kommen."},{"key":"b","text":"kennt die Verkaufszahlen nicht."},{"key":"c","text":"steht nicht auf der Teilnehmerliste. 148"}],"answer":"b"}}]}],"telefonnotiz":[{"id":"TN-P99","page":99,"title":"Telefonnotiz 1","transcript":"Guten Tag, hier spricht Adriane Schmid von der Autovermietung Klein.\nSie haben angerufen und um ein Angebot gebeten. Ich kann Ihnen dieses Mal einen Mittelklassewagen für Sie zum\nSonderpreis von 99 Euro pro Tag anbieten. Sonst tragen Sie ja immer einen Kleinwagen. Wir haben schon\nmehrmals über andere Optionen gesprochen. Sie können das Auto vollgetankt wieder abgeben oder wir machen\ndas kostenpflichtig für Sie. Außerdem wissen Sie ja, dass Sie mit uns die Versicherung bilden müssen. Bitte\nrufen Sie mich zurück und sagen Sie mir, ob Sie das Angebot so annehmen.\nIch wiederhole nochmal meinen Namen. Adriane Schmid, S-C-H-M-I-D Telefon 0173 721 572 6\nIch wünsche Ihnen noch einen schönen Tag und freue mich auf Ihren Anruf.","solution":"Angebot\nName: Schmid\nTelefonnummer: 0173 721 572 6\nWeitere Informationen:\n• 99 € pro Tag ein Mittelklassewagen\n• das Auto vollgetankt wieder abgeben oder sie machen das kostenpflichtig für uns\n• die Versicherung bilden müssen\nZu erledigen: Zurückrufen,ob wir das Angebot so annehmen."},{"id":"TN-P100","page":100,"title":"Telefonnotiz 2","transcript":"Guten Tag. Hier spricht Dr. Mayer. Wir müssen dringend etwas klären. Wir hatten doch vor ein paar Tagen\nverabredet, dass Ihre Firma heute unsere Praxis streicht. Wir haben extra unsere Praxis geschlossen und alles für\nSie vorbereitet. Und jetzt höre ich von meinen Mitarbeitern, dass die Maler gar nicht gekommen sind. Wie stellen\nSie sich das jetzt vor? Wir haben zuletzt vor fünf Jahren streichen lassen. Da gab es solche Probleme gar nicht. Ach\nja? Sie denken auch daran, dass Sie weiße und grüne Farbe mitbringen. Ich erwarte, dass bis morgen Mittag die\nWände gestrichen sind. Ich bitte dringend um Rückruf. Mein Name ist Mayer. M-A-Y-E-R. Sie erreichen mich\nunter der Nummer 05123 72 85 618. Danke und auf Wiederhören.\nGuten Tag, hier ist Dr. Meyer. Wir müssen dringend etwas besprechen. Vor ein paar Tagen hatten wir vereinbart,\ndass Ihre Firma heute unsere Praxis streichen würde. Wir haben extra dafür die Praxis geschlossen und alles\nvorbereitet. Nun höre ich von meinen Mitarbeitern, dass die Maler überhaupt nicht erschienen sind. Wie\ngedenken Sie jetzt weiter vorzugehen?\nAls wir vor fünf Jahren das letzte Mal gestrichen haben, gab es solche Probleme nicht. Denken Sie auch daran,\nweiße und grüne Farbe mitzubringen. Ich erwarte, dass die Wände bis morgen um 13 Uhr fertig gestrichen\nsind. Bitte rufen Sie mich umgehend zurück. Mein Name ist Meyer, buchstabiert M-E-Y-E-R. Sie können mich\nunter der Nummer 0512 37 285 618 erreichen. Vielen Dank und auf Wiederhören.","solution":"Beschwerde\nName:Mayer/ Meyer\nTelefonnummer: 05123 72 85 618\nWeitere Informationen:\n• Heute Praxis streichen würde\n• Die Maler gar nicht gekommen sind / die Maler überhaupt nicht erschienen sind\n• Weiße und grüne Farbe mitbringen\n• Bis morgen Mittag die Wände gestrichen sind / bis morgen um 13 Uhr fertig gestrichen sind\nZu erledigen: dringend Rückruf / umgehend Zurückrufen.\nGuten Tag, hier ist Meier. Wir müssen dringend etwas besprechen. Vor ein paar Tagen hatten wir vereinbart, dass\nIhre Firma heute unser Geschäft streichen würde. Wir haben extra dafür das Geschäft geschlossen und alles\nvorbereitet. Nun höre ich von meinen Mitarbeitern, dass die Maler überhaupt nicht erschienen sind. Wie\ngedenken Sie jetzt weiter vorzugehen? Denken Sie auch daran, weiße und blaue Farbe mitzubringen. Ich erwarte,\ndass die Wände bis morgen Mittag fertig gestrichen sind. Bitte rufen Sie mich umgehend zurück. Mein Name\nist Meier, buchstabiert M-E-I-E-R. Sie können mich unter der Nummer 0512 37 285 618 erreichen. Vielen Dank\nund auf Wiederhören.\nBeschwerde\nName: Meier / Maier / Schröder\nTelefonnummer: 0512 37 285 618 / 0155 623 66 85\nWeitere Informationen:\n• Heute Geschäft streichen würde / Friseursalon\n• Die Maler überhaupt nicht erschienen sind / Maler sind nicht gekommen.\n• Weiße und blaue Farbe mitbringen / Wieße und grüne Farbe mitbringen / weiße und pinke Farbe\n• Bis morgen Mittag Wände streichen müssen / bis Montag Mittag\nZu erledigen: umgehend Zurückrufen."},{"id":"TN-P101","page":101,"title":"Telefonnotiz 3","transcript":"Guten Tag, hier spricht Herr Städtler, buchstabiert S-T-Ä-D-T-L-E-R. Ich habe kürzlich 180 Prospekte bei Ihnen\nbestellt. Allerdings sind nur 100 angekommen. Ich würde darum bitten, die fehlenden 80 Prospekte bis morgen\nzu liefern. Bitte rufen Sie mich zurück, um die Lieferung zu bestätigen.\nSie erreichen mich unter der Telefonnummer 0173 536 47 15. Vielen Dank und auf Wiederhören","solution":"Beschwerde\nName: Städtler / Hoffmann\nTelefonnummer: 0173 536 47 15\nWeitere Informationen:\n• 180 Prospekte bestellt und nur 100 angekommen /200 Prospekte bestellen und nur 120 angekommen\n• Die fehlenden 80 Prospekte bis morgen zu liefern\nZu erledigen: Zurückrufen, die Lieferung bestätigen."},{"id":"TN-P102","page":102,"title":"Telefonnotiz 4","transcript":"Guten Morgen. Hier spricht Eno Hofmann von der Firma Multico.\nIch rufe wegen Ihrer Lieferung an. Wir hatten bei Ihnen Anfang der Woche 200 Prospekthüllen bestellt. Wir\nkaufen ja oft Büromaterialen bei Ihnen ein.\nGerade eben habe ich die Lieferung bekommen und habe gesehen, dass in dem Paket nur insgesamt 80\nProspekthüllen sind. Ich brauche die fehlenden Hüllen unbedingt morgen.\nKönnen Sie sie bitte sofort losschicken?\nBitte rufen Sie mich zurück. Mein Name ist Hofmann, H-O-F-M-A-N-N. Telefon 0173 715 720 3.\nIch danke Ihnen. Auf Wiederhören.","solution":"Beschwerde\nName: Hofmann\nTelefonnummer: 0173 715 720 3\nWeitere Informationen:\n• Anfang der Woche 200 Prospekthüllen bestellt haben\n• In dem Paket nur insgesamt 80 Prospekthüllen sind\n• Brauchen die fehlenden Hüllen unbedingt morgen\n• Sofort losschicken\nZu erledigen: Zurückrufen."},{"id":"TN-P103","page":103,"title":"Telefonnotiz 5","transcript":"Guten Tag, hier spricht …. Walter von der Firma Groß und Co. Ich rufe wegen Ihrer Kopierpapierbestellung an.\nZu Ihren Fragen: Wir haben aktuell das Premiumpapier im Angebot. Sie nehmen ja immer unser Standardpapier.\nKopierpapier in Premiumqualität gibt es momentan Standard 4,49 € pro 500 Blatt. Wir können Ihnen das\nKopierpapier im Rahmen des Expressversands innerhalb eines Tages liefern. Wenn Sie bis 18:00 Uhr bestellen,\nkönnen wir Ihnen dieses garantieren.\nBitte rufen Sie mich zurück und bestätigen die Papiersorte. Mein Name ist Walter. W-A-L-T-E-R. Meine\nTelefonnummer ist die 0174 113 806 6. Ich wünsche Ihnen noch einen sch
