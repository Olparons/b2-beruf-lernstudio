function openExam(){show('exam');document.getElementById('exam').innerHTML=`<div class="backrow"><button class="back" onclick="show('home')">←</button><div><h1>Prüfung</h1><div class="sub">Im Prüfungsmodus wird nur markiert. Lösungen erscheinen erst nach der Abgabe.</div></div></div><div class="section-head"><div><h2>Simulationen</h2><p>Aus Originalaufgaben der hochgeladenen Sammlung zusammengestellt.</p></div></div><div class="grid g3"><div class="card module"><div class="ico">📖</div><h3>Lesen</h3><p>20 Aufgaben · Auswahl bleibt sichtbar · keine Sofortkorrektur.</p><button class="btn primary sm" onclick="startExam('lesen')">Starten</button></div><div class="card module"><div class="ico">◎</div><h3>Kurzsimulation</h3><p>Lesen und Sprachbausteine für eine schnelle Standortkontrolle.</p><button class="btn primary sm" onclick="startExam('mixed')">Starten</button></div></div><div class="section"><div class="section-head"><div><h2>Originalaufgaben</h2><p>Quelle und Seitenangabe werden angezeigt.</p></div></div><div class="grid g3"><div class="card module"><h3>Lesen Teil 1–4</h3><p>Originaltexte und Aufgaben aus der Sammlung.</p><button class="btn ghost sm" onclick="openOriginal('l1')">Öffnen</button></div><div class="card module"><h3>Sprachbausteine</h3><p>Teil 1 und 2 mit Lösungen erst nach Auswertung.</p><button class="btn ghost sm" onclick="openOriginal('sb1')">Öffnen</button></div><div class="card module"><h3>Schreiben</h3><p>Beschwerde und Forumsbeitrag.</p><button class="btn ghost sm" onclick="openWrite('complaint')">Öffnen</button></div><div class="card module"><h3>Sprechen</h3><p>Lösungswege mit Timer und Aufnahme.</p><button class="btn ghost sm" onclick="openSpeak()">Öffnen</button></div></div></div>`}
function examQuestions(type){let tasks=[];if(type==='lesen'||type==='mixed'){sample(DATA.lesen1,type==='lesen'?2:1).forEach(ex=>ex.questions.forEach(q=>tasks.push({cat:'Lesen',source:`Seite ${ex.page}`,body:ex.questions.map(x=>`${x.n}. ${x.text}`).join('\n')+'\n\n'+ex.texts.map(t=>`${t.letter}) ${t.text}`).join('\n\n'),q})));sample(DATA.lesen2,type==='lesen'?3:2).forEach(ex=>ex.questions.forEach(q=>tasks.push({cat:'Lesen',source:`Seite ${ex.page}`,body:ex.body,q})));sample(DATA.sprach1,type==='lesen'?1:2).forEach(ex=>ex.questions.forEach(q=>tasks.push({cat:'Sprachbausteine',source:`Seite ${ex.page}`,body:ex.body,q})));}return shuffle(tasks).slice(0,type==='mixed'?12:20)}
function startExam(type){examState={type,tasks:examQuestions(type),i:0,answers:{},plays:{},submitted:false};show('exam');renderExamQuestion()}
function renderExamQuestion(){const root=document.getElementById('exam');if(!examState||!examState.tasks.length){openExam();return}if(examState.submitted){renderExamResult();return}const t=examState.tasks[examState.i],q=t.q;root.innerHTML=`<div class="backrow"><button class="back" onclick="openExam()">←</button><div><h1>Prüfungsmodus</h1><div class="sub">Keine Sofortkorrektur. Antworten können bis zur Abgabe geändert werden.</div></div></div><div class="exam-nav">${examState.tasks.map((x,i)=>`<button class="exam-dot ${examState.answers[i]!=null?'answered':''} ${i===examState.i?'current':''}" onclick="examState.i=${i};renderExamQuestion()">${i+1}</button>`).join('')}</div><div class="qcard"><div class="qmeta"><span class="qkind">${t.cat}</span><span class="qcount">${t.source}</span></div>${t.audio?examAudio(t.audio,examState.i,t.audioKey):`<div class="source compact">${esc(t.body||'')}</div>`}<div class="question" style="font-size:19px;margin-top:16px">${q.n?esc(q.n+'. '):''}${esc(q.text||'')}</div>${examOptions(q,examState.i)}<div class="toolbar"><button class="btn ghost sm" onclick="examState.i=Math.max(0,examState.i-1);renderExamQuestion()">← Zurück</button><button class="btn primary sm" onclick="examState.i=Math.min(examState.tasks.length-1,examState.i+1);renderExamQuestion()">Weiter →</button></div><div class="divider"></div><button class="btn dark" onclick="submitExam()">Prüfung abgeben</button></div>`}
function examAudio(text,i,key){const played=examState.plays[i];return`<div class="audio-box" id="audio-exam${i}"><div class="audio-main"><button class="btn dark sm" ${played?'disabled':''} onclick="playExamAudio('${key}',${i},this)">${played?'Audio bereits gestartet':'▶ Audio einmal starten'}</button><div class="audio-wave"><i></i><i></i><i></i><i></i></div><span class="audio-ok">offline</span></div><audio id="player-exam${i}" preload="metadata" src="${AUDIO_DATA[key]||''}"></audio></div>`}
function playExamAudio(key,i,btn){if(examState.plays[i])return;examState.plays[i]=true;btn.disabled=true;btn.textContent='Audio läuft';const a=document.getElementById('player-exam'+i);if(!a||!AUDIO_DATA[key]){toast('Audio nicht verfügbar.');return}a.playbackRate=1;a.onended=()=>btn.textContent='Audio beendet';a.play().catch(()=>{btn.disabled=false;examState.plays[i]=false;toast('Audio konnte nicht gestartet werden.')})}
function examOptions(q,i){if(q.type==='tf'){return`<div class="options"><button class="examopt ${examState.answers[i]==='richtig'?'selected':''}" onclick="examState.answers[${i}]='richtig';renderExamQuestion()">Richtig</button><button class="examopt ${examState.answers[i]==='falsch'?'selected':''}" onclick="examState.answers[${i}]='falsch';renderExamQuestion()">Falsch</button></div>`}return`<div>${(q.options||[]).map(o=>`<button class="examopt ${examState.answers[i]===o.key?'selected':''}" onclick="examState.answers[${i}]='${o.key}';renderExamQuestion()"><b>${o.key.toUpperCase()}.</b> ${esc(o.text)}</button>`).join('')}</div>`}
function submitExam(){const unanswered=examState.tasks.filter((x,i)=>examState.answers[i]==null).length;if(unanswered&&!confirm(`${unanswered} Aufgaben sind noch unbeantwortet. Trotzdem abgeben?`))return;examState.submitted=true;renderExamResult()}
function renderExamResult(){let ok=0,details=[];examState.tasks.forEach((t,i)=>{const good=norm(examState.answers[i])===norm(t.q.answer);if(good)ok++;details.push({i:i+1,good,ans:examState.answers[i]||'–',sol:t.q.answer});record(t.cat==='Sprachbausteine'?'Grammatik':'Lesen','exam-'+examState.type+'-'+i,good)});const pct=Math.round(ok/examState.tasks.length*100);document.getElementById('exam').innerHTML=`<div class="backrow"><button class="back" onclick="openExam()">←</button><div><h1>Auswertung</h1><div class="sub">Lösungen werden erst jetzt angezeigt.</div></div></div><div class="card" style="text-align:center"><div class="score">${pct}%</div><h2>${ok} / ${examState.tasks.length} richtig</h2><p class="subtle">${pct>=75?'Starke Leistung. Arbeiten Sie weiter an Geschwindigkeit und Stabilität.':pct>=60?'Solide Basis. Wiederholen Sie die Fehler gezielt.':'Die Fehlerliste sollte heute noch einmal trainiert werden.'}</p></div><div class="card" style="margin-top:14px"><div class="list">${details.map(d=>`<div class="learn-row"><div><b>Aufgabe ${d.i}</b><p>Ihre Antwort: ${esc(d.ans)} · Lösung: ${esc(d.sol)}</p></div><span class="case" style="background:${d.good?'#eaf8f2':'#fff0f3'};color:${d.good?'#087354':'#a83249'}">${d.good?'richtig':'falsch'}</span></div>`).join('')}</div></div>`}

function startTimer(sec,id){clearInterval(timerHandle);let left=sec,el=document.getElementById(id);function tick(){if(!el)return;let m=Math.floor(left/60),s=left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(left<=0){clearInterval(timerHandle);toast('Zeit beendet.');return}left--}tick();timerHandle=setInterval(tick,1000)}

function openProgress(){show('progress');const acc=overallAccuracy(),cats=[['VerbPräp','Verben + Präpositionen'],['Wortschatz','Wortschatz'],['Grammatik','Grammatik'],['Kollokation','Kollokationen'],['Lesen','Lesen'],['Hören','Hören'],['Schreiben','Schreiben'],['Sprechen','Sprechen']];document.getElementById('progress').innerHTML=`<div class="backrow"><button class="back" onclick="show('home')">←</button><div><h1>Fortschritt</h1><div class="sub">Trefferquote und offene Schwächen.</div></div></div><div class="grid g3"><div class="card"><div class="metric">${acc.attempts?acc.pct+'%':'–'}</div><div class="metric-label">Gesamt</div></div><div class="card"><div class="metric">${acc.attempts}</div><div class="metric-label">beantwortete Aufgaben</div></div><div class="card"><div class="metric">${Object.keys(state.wrong).length}</div><div class="metric-label">offene Fehler</div></div></div><div class="section"><div class="card"><h2>Bereiche</h2>${cats.map(([c,l])=>{const a=catAccuracy(c);return`<div class="skillbar"><span>${l}</span><div class="bar"><span style="width:${a.s?a.pct:0}%"></span></div><b>${a.s?a.pct+'%':'–'}</b></div>`}).join('')}</div></div><div class="section"><div class="card"><h2>Wiederholungsplan</h2><p class="subtle"><b>${dueCount()} Inhalte sind heute fällig.</b> Richtig beantwortete Inhalte werden nach 1, 2, 4, 7 und 10 Tagen erneut eingeplant; Fehler noch am selben Tag.</p><div class="toolbar"><button class="btn primary sm" onclick="startWrongSession()">Fällige Inhalte trainieren</button></div></div></div><div class="section"><div class="card"><h2>Plan verwalten</h2><p class="subtle">Der 15-Tage-Sprint beginnt mit dem gespeicherten Startdatum.</p><div class="toolbar"><button class="btn ghost sm" onclick="resetPlan()">Sprint heute neu starten</button><button class="btn ghost sm" onclick="exportProgress()">Fortschritt exportieren</button><button class="btn bad sm" onclick="resetAll()">Alle Daten löschen</button></div></div></div>`}
function resetPlan(){if(confirm('Den 15-Tage-Sprint heute neu starten?')){state.startDate=todayISO();state.daily={};save();openProgress()}}
function exportProgress(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='B2-Beruf-Fortschritt.json';a.click();URL.revokeObjectURL(u)}
function resetAll(){if(confirm('Wirklich alle Lernstände und Texte löschen?')){localStorage.removeItem(STORE);state=defaultState();save();show('home')}}

// First-run diagnostic banner and init
function init(){refreshTop();renderHome();if(!state.diagnosticDone&&planDay()===1)setTimeout(()=>{document.getElementById('modalBody').innerHTML=`<span class="tag">Empfohlen</span><h2>15-Minuten-Standortbestimmung</h2><p>20 kurze Aufgaben aus Präpositionen, Wortschatz, Grammatik und zu-Infinitiv. Danach priorisiert das Training Ihre schwächeren Bereiche.</p><div class="toolbar"><button class="btn primary" onclick="closeModal();startDiagnostic()">Diagnose starten</button><button class="btn ghost" onclick="closeModal()">Später</button></div>`;openModal()},450)}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
window.addEventListener('beforeunload',stopSpeech);
init();
</script>

<script id="v7-script">
// V7: intelligenter Kontext, Beispiele nach der Antwort, neues Dashboard und Offline-Duell.
(function(){
  // Zusätzliche Ansicht + neue Navigation.
  const main=document.querySelector('main.content');
  if(main && !document.getElementById('duel')){const sec=document.createElement('section');sec.id='duel';sec.className='view';main.appendChild(sec)}
  const nav=document.querySelector('.bottom-in');
  if(nav)nav.innerHTML=`
    <button class="nav active" data-v="home" onclick="show('home')"><span class="ni">⌂</span>Start</button>
    <button class="nav" data-v="today" onclick="openToday()"><span class="ni">◎</span>Heute</button>
    <button class="nav" data-v="learn" onclick="openLearn()"><span class="ni">▤</span>Lernen</button>
    <button class="nav" data-v="exam" onclick="openExam()"><span class="ni">◉</span>Prüfung</button>
    <button class="nav" data-v="duel" onclick="openDuel()"><span class="ni">⚔</span>Duell</button>`;

  function reEsc(x){return String(x).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
  function maskPrep(sentence,prep){
    if(!sentence)return'';
    const r=new RegExp(`\\b${reEsc(prep)}\\b`,'i');
    return sentence.replace(r,'___');
  }
  function maskLastVerb(sentence,verb){
    if(!sentence)return'';
    // Für Kollokationen steht das gesuchte Verb meist am Satzende bzw. als Partizip.
    const simple=verb.replace(/^sich\s+/,'');
    const r=new RegExp(`\\b${reEsc(simple)}(?:e|st|t|en|te|ten|et)?\\b`,'i');
    const changed=sentence.replace(r,'___');
    return changed===sentence?'':changed;
  }
  function contextOf(t){return t.context||''}
  function fullExampleOf(t){return t.postExample||t.fullExample||''}

  // Aufgaben: Kontext nur dann vorab, wenn er die Lösung NICHT verrät.
  makeVpTask=function(x,variant){
    if(variant%3===0)return{id:'t-'+x.id+'-p',cat:'VerbPräp',kind:'Präposition',prompt:`Welche Präposition gehört zu „${x.verb}“?`,context:maskPrep(x.example,x.prep),postExample:x.example,options:prepOptions(x.prep),answer:x.prep,explain:`Merksatz: ${x.verb} ${x.prep} + ${x.case}.`};
    if(variant%3===1)return{id:'t-'+x.id+'-k',cat:'VerbPräp',kind:'Kasus',prompt:`Welchen Kasus verlangt „${x.verb} ${x.prep}“?`,postExample:x.example,options:shuffle(['Akkusativ','Dativ']),answer:x.case,explain:`Merksatz: ${x.verb} ${x.prep} + ${x.case}.`};
    const dm=daMap[x.prep];
    if(dm)return{id:'t-'+x.id+'-d',cat:'VerbPräp',kind:'da-/wo-Wort',prompt:`Bei einer Sache: Welche Frageform gehört zu „${x.prep}“?`,context:`${x.verb} ${x.prep} …`,postExample:`${dm[0]} …? — ${dm[1]} …`,options:shuffle([dm[0],...sample(Object.values(daMap).map(v=>v[0]).filter(v=>v!==dm[0]),3)]),answer:dm[0],explain:`Fragewort: ${dm[0]} · Antwortwort: ${dm[1]}.`};
    return makeVpTask(x,0)
  };
  makeVocabTask=function(x,variant){
    if(variant%2===0)return{id:'t-'+x.id+'-d',cat:'Wortschatz',kind:x.cat,prompt:x.definition,postExample:x.example,options:wordOptions(x.de,LEARN.vocab),answer:x.de,explain:`Begriff: ${x.de}.`};
    const cl=replaceFirstWord(x.example,x.de);
    return{id:'t-'+x.id+'-c',cat:'Wortschatz',kind:x.cat,prompt:'Welcher Begriff passt in den Satz?',context:cl,postExample:x.example,options:wordOptions(x.de,LEARN.vocab),answer:x.de,explain:x.definition}
  };
  makeCollTask=function(x){
    const sp=splitColl(x.de),verbs=LEARN.collocations.map(y=>splitColl(y.de).verb);
    return{id:'t-'+x.id,cat:'Kollokation',kind:'Nomen-Verb-Verbindung',prompt:`Ergänzen Sie die feste Verbindung: ${sp.stem} ___`,postExample:x.example,options:shuffle([sp.verb,...sample(verbs.filter(v=>v!==sp.verb),3)]),answer:sp.verb,explain:`Feste Verbindung: ${x.de}.`}
  };
  makeZuTask=function(x){
    const pool=LEARN.zuInf.filter(y=>y.kind===x.kind);
    return{id:'t-'+x.id,cat:'Grammatik',kind:'zu-Infinitiv',prompt:`Welches ${x.kind.toLowerCase()} passt zu dieser Struktur?`,postExample:x.example,options:wordOptions(x.word,pool,'word'),answer:x.word,explain:`Struktur: ${x.word} + zu-Infinitiv.`}
  };
  makeModalTask=function(x){
    const others=LEARN.modals.filter(y=>y.id!==x.id);
    return{id:'t-'+x.id,cat:'Grammatik',kind:'Modalverben',prompt:x.rule,postExample:x.examples[0],options:shuffle([x.word,...sample(others.map(y=>y.word),3)]),answer:x.word,explain:`Modalverb: ${x.word}.`}
  };
  productionTasks=function(){let a=[];
    LEARN.verbPrep.forEach(x=>a.push({id:'prod-'+x.id,cat:'VerbPräp',kind:'Aktiv produzieren',prompt:`Ergänzen Sie nur die Präposition: ${x.verb} ___`,input:true,answer:x.prep,postExample:x.example,explain:`${x.verb} ${x.prep} + ${x.case}`}));
    LEARN.collocations.forEach(x=>{const sp=splitColl(x.de);a.push({id:'prod-'+x.id,cat:'Kollokation',kind:'Aktiv produzieren',prompt:`Ergänzen Sie das Verb: ${sp.stem} ___`,input:true,answer:sp.verb,postExample:x.example,explain:x.de})});
    LEARN.vocab.forEach(x=>a.push({id:'prod-'+x.id,cat:'Wortschatz',kind:'Aktiv produzieren',prompt:x.definition,input:true,answer:x.de,postExample:x.example,explain:`Gesuchter Begriff: ${x.de}.`}));return a
  };

  // Training: Beispiel erst nach Antwort vollständig zeigen.
  renderSession=function(){
    const root=document.getElementById('session');
    if(session.index>=session.tasks.length){
      const pct=session.tasks.length?Math.round(session.correct/session.tasks.length*100):0;if(session.mode==='diagnostic'){state.diagnosticDone=true;save()}
      root.innerHTML=`<div class="session-shell"><div class="qcard" style="text-align:center"><span class="tag">Training beendet</span><div class="score">${pct}%</div><h2>${session.correct} von ${session.tasks.length} richtig</h2><div class="mini-kpi" style="justify-content:center"><span>${Object.keys(state.wrong).length} offene Fehler</span><span>${dueCount()} heute fällig</span><span>+${session.correct*5} Lernpunkte</span></div><p class="subtle">Unsichere Inhalte kommen früher wieder. Beispiele wurden erst nach Ihrer Antwort vollständig eingeblendet.</p><div class="toolbar" style="justify-content:center"><button class="btn primary" onclick="${session.returnView==='home'?"show('home')":session.returnView==='learn'?"openLearn()":"openToday()"}">Weiter</button>${Object.keys(state.wrong).length?`<button class="btn ghost" onclick="startWrongSession()">Fehler wiederholen</button>`:''}</div></div></div>`;return
    }
    const t=session.tasks[session.index],pct=Math.round(session.index/session.tasks.length*100),ctx=contextOf(t);
    root.innerHTML=`<div class="session-shell"><div class="backrow"><button class="back" onclick="${session.returnView==='home'?"show('home')":session.returnView==='learn'?"openLearn()":"openToday()"}">←</button><div style="flex:1"><b>${session.mode==='diagnostic'?'Standortbestimmung':session.mode==='production'?'Produktivtraining':'Aktives Training'}</b><div class="sub">Kontext nur dann, wenn er die Lösung nicht verrät. Das vollständige Beispiel kommt nach Ihrer Antwort.</div></div><span class="tag">${session.index+1}/${session.tasks.length}</span></div><div class="session-top"><div class="bar"><span style="width:${pct}%"></span></div></div><div class="qcard"><div class="qmeta"><span class="qkind">${esc(t.kind)}</span><span class="qcount">${esc(t.cat)}</span></div><div class="question">${esc(t.prompt)}</div>${ctx?`<div class="example smart-context">${esc(ctx)}</div>`:''}${t.input?`<div class="text-answer"><input id="prodInput" class="prod-input" autocomplete="off" autocapitalize="none" placeholder="Antwort eingeben …" onkeydown="if(event.key==='Enter')answerTextTask()"><button class="btn primary" onclick="answerTextTask()">Prüfen</button></div><div class="session-note">Aktives Schreiben stärkt den Abruf stärker als bloßes Wiedererkennen.</div>`:`<div class="options">${t.options.map((o,i)=>`<button class="opt" onclick="answerTask(${i})"><span class="ol">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div>`}<div id="feedback" class="feedback"></div><div id="nextbar" class="nextbar"><button class="btn primary" onclick="nextTask()">Weiter →</button></div></div></div>`;
    if(t.input)setTimeout(()=>document.getElementById('prodInput')?.focus(),80)
  };
  answerTextTask=function(){if(session.answered)return;const inp=document.getElementById('prodInput'),val=inp.value.trim();if(!val)return;session.answered=true;const t=session.tasks[session.index],ok=norm(val)===norm(t.answer);if(ok)session.correct++;inp.disabled=true;inp.style.borderColor=ok?'#30a780':'#df6b7d';const f=document.getElementById('feedback'),ex=fullExampleOf(t);f.className='feedback show '+(ok?'ok':'no');f.innerHTML=`<b>${ok?'Richtig':'Noch nicht'}</b>${ok?'':`Ihre Antwort: ${esc(val)}<br>`}${esc(t.explain||('Lösung: '+t.answer))}${ex?`<div class="post-example"><b>Beispiel:</b> ${esc(ex)}</div>`:''}`;document.getElementById('nextbar').classList.add('show');record(t.cat,t.id,ok)};
  answerTask=function(i){if(session.answered)return;session.answered=true;const t=session.tasks[session.index],opts=[...document.querySelectorAll('#session .opt')],chosen=t.options[i],ok=norm(chosen)===norm(t.answer);if(ok)session.correct++;opts.forEach((b,idx)=>{b.disabled=true;if(norm(t.options[idx])===norm(t.answer))b.classList.add('correct');else if(idx===i)b.classList.add('wrong')});const f=document.getElementById('feedback'),ex=fullExampleOf(t);f.className='feedback show '+(ok?'ok':'no');f.innerHTML=`<b>${ok?'Richtig':'Noch nicht'}</b>${esc(t.explain||('Lösung: '+t.answer))}${ex?`<div class="post-example"><b>Beispiel:</b> ${esc(ex)}</div>`:''}`;document.getElementById('nextbar').classList.add('show');record(t.cat,t.id,ok)};

  // Attraktiveres Dashboard.
  renderHome=function(){
    const d=planDay(),p=PLAN[d-1],acc=overallAccuracy(),dp=dayProgress(d),weak=getWeakAreas(),due=dueCount(),orb=acc.attempts?acc.pct:dp.pct;
    document.getElementById('home').innerHTML=`
      <div class="hero"><div class="hero-main"><span class="eyebrow">15-Tage-Sprint · Tag ${d} · ${phaseFor(d)}</span><h1>${esc(p.title)}</h1><p>${esc(p.focus)}. Heute zählt nicht, wie viel Sie ansehen, sondern wie viel Sie ohne Hilfe abrufen können.</p><div class="hero-row"><button class="btn white" onclick="openToday()">▶ Tagestraining starten</button><button class="btn" style="background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.16)" onclick="startProduction(10,'home')">✎ Aktivmodus</button></div><div class="focus-strip"><div class="focus-step"><b>1</b>Wiederholen</div><div class="focus-step"><b>2</b>Abrufen</div><div class="focus-step"><b>3</b>Anwenden</div><div class="focus-step"><b>4</b>Prüfen</div></div></div><div class="hero-side"><div class="progress-orb" style="--p:${orb}"><div class="orb-content"><div class="orb-num">${orb}%</div><div class="orb-label">Lernsicherheit</div></div></div></div></div>
      <div class="dashboard-grid"><div class="dash-main"><div><span class="tag">Heute</span><h3>${dp.done}/4 Lernblöcke</h3><p>${due?due+' Wiederholungen sind heute fällig.':'Keine alten Wiederholungen offen.'}</p></div><div class="dash-icon">${dp.done===4?'✓':'→'}</div></div><div class="dash-stat"><span>Trefferquote</span><b>${acc.attempts?acc.pct+'%':'–'}</b></div><div class="dash-stat"><span>Offene Fehler</span><b>${Object.keys(state.wrong).length}</b></div><div class="dash-stat"><span>Serie</span><b>${state.streak||1}×</b></div></div>
      <div class="section"><div class="section-head"><div><h2>Direkt weitermachen</h2><p>Kurze Wege zu den wichtigsten Lernmodi.</p></div></div><div class="grid g3"><div class="card module"><div class="ico">⚡</div><h3>Adaptives Training</h3><p>Gemischt, mit intelligenten Beispielen und Wiederholung Ihrer Schwächen.</p><div class="minirow"><button class="btn primary sm" onclick="startAdaptive(20,'home')">20 Aufgaben</button><span class="pct">empfohlen</span></div></div><div class="card module"><div class="ico">▤</div><h3>Lernen</h3><p>Strukturen zuerst verstehen und anhand vollständiger Beispiele ansehen.</p><button class="btn ghost sm" onclick="openLearn()">Bibliothek öffnen</button></div><div class="card module"><div class="ico">⚔</div><h3>Duell</h3><p>Zu zweit auf einem Gerät oder mit demselben Challenge-Code.</p><button class="btn ghost sm" onclick="openDuel()">Duell starten</button></div></div></div>
      <div class="section"><div class="section-head"><div><h2>Schwächen zuerst</h2><p>Das adaptive Training gewichtet diese Bereiche stärker.</p></div><button class="quick-chip" onclick="openProgress()"><strong>${due}</strong> fällig</button></div><div class="grid g3">${weak.map(w=>`<div class="card weak-card"><span class="tag">${w.pct===null?'Diagnose offen':w.pct+'%'}</span><h3 style="margin:10px 0 5px">${esc(w.label)}</h3><p class="subtle">${esc(w.hint)}</p><div class="weak-line"><span style="width:${w.pct===null?12:w.pct}%"></span></div></div>`).join('')}</div></div>
      <div class="section"><div class="section-head"><div><h2>15-Tage-Sprint</h2><p>Jeder Tag baut auf den vorherigen Wiederholungen auf.</p></div></div><div class="card"><div class="timeline">${PLAN.map((x,i)=>{let n=i+1,pr=dayProgress(n);return`<button class="dotday ${n<d||pr.pct===100?'done':''} ${n===d?'now':''}" onclick="openPlanDay(${n})">${n}</button>`}).join('')}</div></div></div>`;
    refreshTop()
  };

  // Lernen optisch klarer: Beispiele sind hier ausdrücklich erlaubt und erwünscht.
  openLearn=function(){show('learn');document.getElementById('learn').innerHTML=`<div class="backrow"><button class="back" onclick="show('home')">←</button><div><h1>Lernen</h1><div class="sub">Hier dürfen Sie die vollständigen Beispiele sehen. Im Training werden Lösungen dagegen geschützt.</div></div></div><div class="notice"><b>Lernprinzip:</b> Erst Struktur + Beispiel verstehen, danach mit „Üben“ in den aktiven Abruf wechseln.</div><div class="grid g3" style="margin-top:14px">${MODULES.map(m=>`<div class="card module"><div class="ico">${m.icon}</div><h3>${m.title}</h3><p>${m.desc}</p><div class="bar" style="margin:10px 0"><span style="width:${masteryPct(m.prefix)}%"></span></div><div class="minirow"><button class="btn ghost sm" onclick="openLearnDetail('${m.id}')">Beispiele</button><button class="btn primary sm" onclick="startModule('${m.id}',16)">Üben</button></div></div>`).join('')}</div><div class="section"><div class="card"><div class="section-head"><div><h2>Intelligente Wiederholung</h2><p>Fehler und fällige Inhalte werden zuerst wiederholt.</p></div></div><div class="toolbar"><button class="btn dark" onclick="startProduction(14,'learn')">Aktiv produzieren</button><button class="btn ghost" onclick="startWrongSession()" ${Object.keys(state.wrong).length?'':'disabled'}>${Object.keys(state.wrong).length?Object.keys(state.wrong).length+' Fehler wiederholen':'Noch keine offenen Fehler'}</button></div></div></div>`};

  // Fortschritt ohne Hören.
  openProgress=function(){show('progress');const acc=overallAccuracy(),cats=[['VerbPräp','Verben + Präpositionen'],['Wortschatz','Wortschatz'],['Grammatik','Grammatik'],['Kollokation','Kollokationen'],['Lesen','Lesen'],['Schreiben','Schreiben'],['Sprechen','Sprechen']];document.getElementById('progress').innerHTML=`<div class="backrow"><button class="back" onclick="show('home')">←</button><div><h1>Fortschritt</h1><div class="sub">Sicherheit, Wiederholung und aktive Schwächen.</div></div></div><div class="dashboard-grid"><div class="dash-main"><div><span class="tag">Gesamt</span><h3>${acc.attempts?acc.pct+'% Sicherheit':'Noch keine Daten'}</h3><p>${acc.attempts} beantwortete Aufgaben.</p></div><div class="dash-icon">◎</div></div><div class="dash-stat"><span>Aufgaben</span><b>${acc.attempts}</b></div><div class="dash-stat"><span>Fehler</span><b>${Object.keys(state.wrong).length}</b></div><div class="dash-stat"><span>Heute fällig</span><b>${dueCount()}</b></div></div><div class="section"><div class="card"><h2>Bereiche</h2>${cats.map(([c,l])=>{const a=catAccuracy(c);return`<div class="skillbar"><span>${l}</span><div class="bar"><span style="width:${a.s?a.pct:0}%"></span></div><b>${a.s?a.pct+'%':'–'}</b></div>`}).join('')}</div></div><div class="section"><div class="card"><h2>Wiederholungsplan</h2><p class="subtle">Richtig beantwortete Inhalte kommen nach 1, 2, 4, 7 und 10 Tagen zurück. Fehler noch am selben Tag.</p><div class="toolbar"><button class="btn primary sm" onclick="startWrongSession()">Fällige Inhalte trainieren</button><button class="btn ghost sm" onclick="resetPlan()">Sprint neu starten</button><button class="btn ghost sm" onclick="exportProgress()">Exportieren</button></div></div></div>`};

  // ---------------- OFFLINE-DUELL ----------------
  let duelState=null;
  function hashSeed(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
  function rngFrom(seed){let x=hashSeed(seed)||123456789;return()=>{x+=0x6D2B79F5;let t=x;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
  function seededShuffle(a,seed){a=[...a];const r=rngFrom(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function cleanDuelPool(){return allGeneratedTasks().filter(t=>!t.input&&Array.isArray(t.options)&&t.options.length>=2).map(t=>({...t,context:contextOf(t)}))}
  function duelTasks(seed,n=12){const base=seededShuffle(cleanDuelPool(),seed).slice(0,n);return base.map((t,i)=>({...t,options:seededShuffle(t.options,seed+'-'+i)}))}
  window.openDuel=function(){show('duel');const code=String(Math.floor(100000+Math.random()*900000));document.getElementById('duel').innerHTML=`<div class="backrow"><button class="back" onclick="show('home')">←</button><div><h1>Duell</h1><div class="sub">Motivation durch Wettbewerb – komplett offline.</div></div></div><div class="duel-hero"><span class="eyebrow">B2 Battle</span><h1 style="margin:12px 0 8px">Wer ruft Deutsch schneller und sicherer ab?</h1><p style="color:#dbeafe;margin:0">Die Fragen stammen aus Ihrem Lernpool. Im Duell werden keine vollständigen Beispiele vor der Antwort gezeigt.</p></div><div class="duel-modes"><div class="duel-card"><div class="duel-icon">⚔</div><h3>2 Spieler · ein Gerät</h3><p class="subtle">Abwechselnd antworten. Jeder bekommt gleich viele Aufgaben.</p><div class="grid g2"><input id="p1" class="seed-input" style="letter-spacing:0;text-align:left" value="Spieler 1"><input id="p2" class="seed-input" style="letter-spacing:0;text-align:left" value="Spieler 2"></div><button class="btn primary" style="margin-top:12px;width:100%" onclick="startLocalDuel()">Duell starten</button></div><div class="duel-card"><div class="duel-icon">#</div><h3>Challenge-Code</h3><p class="subtle">Zwei Geräte mit derselben App + demselben Code erhalten dieselben 15 Fragen. Kein Internet nötig.</p><div class="code-box" id="generatedCode">${code}</div><input id="challengeCode" class="seed-input" inputmode="numeric" maxlength="6" value="${code}"><button class="btn dark" style="margin-top:12px;width:100%" onclick="startCodeChallenge()">Challenge spielen</button></div></div><div class="section"><div class="notice"><b>Online-Live-Duell:</b> Für automatische Räume, Live-Punktestand und Freunde auf zwei Geräten wäre zusätzlich ein kleiner Echtzeit-Server nötig. Diese Version bleibt bewusst vollständig offline.</div></div>`};
  window.startLocalDuel=function(){const p1=(document.getElementById('p1').value||'Spieler 1').trim(),p2=(document.getElementById('p2').value||'Spieler 2').trim(),seed='local-'+Date.now();duelState={mode:'local',players:[p1,p2],scores:[0,0],streak:[0,0],turn:0,index:0,tasks:duelTasks(seed,14),answered:false};renderDuelQuestion()};
  window.startCodeChallenge=function(){const code=(document.getElementById('challengeCode').value||'').replace(/\D/g,'').slice(0,6);if(code.length<4){toast('Bitte einen Challenge-Code eingeben.');return}duelState={mode:'code',code,players:['Sie'],scores:[0],streak:[0],turn:0,index:0,tasks:duelTasks('challenge-'+code,15),answered:false};renderDuelQuestion()};
  function renderDuelQuestion(){const root=document.getElementById('duel');if(!duelState)return openDuel();if(duelState.index>=duelState.tasks.length)return renderDuelResult();const t=duelState.tasks[duelState.index],pl=duelState.mode==='local'?duelState.turn:0,ctx=contextOf(t);root.innerHTML=`<div class="backrow"><button class="back" onclick="openDuel()">←</button><div><h1>${duelState.mode==='local'?'Lokales Duell':'Challenge '+duelState.code}</h1><div class="sub">Aufgabe ${duelState.index+1}/${duelState.tasks.length}</div></div></div>${duelState.mode==='local'?`<div class="duel-score"><div class="duel-player ${pl===0?'active':''}"><span>${esc(duelState.players[0])}</span><b>${duelState.scores[0]}</b></div><div class="vs">VS</div><div class="duel-player ${pl===1?'active':''}"><span>${esc(duelState.players[1])}</span><b>${duelState.scores[1]}</b></div></div>`:`<div class="card" style="margin-bottom:12px;text-align:center"><span class="tag">Code ${duelState.code}</span><h3 style="margin:8px 0 0">${duelState.scores[0]} Punkte</h3></div>`}<div class="qcard"><div class="qmeta"><span class="qkind">${duelState.mode==='local'?esc(duelState.players[pl]):'Challenge'}</span><span class="qcount">${esc(t.cat)}</span></div><div class="question">${esc(t.prompt)}</div>${ctx?`<div class="example smart-context">${esc(ctx)}</div>`:''}<div class="options">${t.options.map((o,i)=>`<button class="opt" onclick="answerDuel(${i})"><span class="ol">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="duelFeedback" class="feedback"></div><div id="duelNext" class="nextbar"><button class="btn primary" onclick="nextDuel()">Weiter →</button></div></div>`}
  window.answerDuel=function(i){if(!duelState||duelState.answered)return;duelState.answered=true;const t=duelState.tasks[duelState.index],pl=duelState.mode==='local'?duelState.turn:0,choice=t.options[i],ok=norm(choice)===norm(t.answer),opts=[...document.querySelectorAll('#duel .opt')];if(ok){duelState.streak[pl]++;duelState.scores[pl]+=1+(duelState.streak[pl]>=3?1:0)}else duelState.streak[pl]=0;opts.forEach((b,idx)=>{b.disabled=true;if(norm(t.options[idx])===norm(t.answer))b.classList.add('correct');else if(idx===i)b.classList.add('wrong')});const f=document.getElementById('duelFeedback'),ex=fullExampleOf(t);f.className='feedback show '+(ok?'ok':'no');f.innerHTML=`<b>${ok?'Richtig!':'Nicht ganz.'}</b>${esc(t.explain||'')}${ex?`<div class="post-example"><b>Beispiel:</b> ${esc(ex)}</div>`:''}${ok&&duelState.streak[pl]>=3?`<div style="margin-top:5px;font-weight:900">🔥 Serienbonus +1</div>`:''}`;document.getElementById('duelNext').classList.add('show')};
  window.nextDuel=function(){if(!duelState)return;duelState.index++;duelState.answered=false;if(duelState.mode==='local')duelState.turn=1-duelState.turn;renderDuelQuestion()};
  function renderDuelResult(){const root=document.getElementById('duel');if(duelState.mode==='local'){const a=duelState.scores[0],b=duelState.scores[1],winner=a===b?'Unentschieden':(a>b?duelState.players[0]:duelState.players[1]);root.innerHTML=`<div class="qcard" style="text-align:center;max-width:650px;margin:auto"><span class="tag">Duell beendet</span><div style="font-size:56px;margin:12px 0">🏆</div><h1>${esc(winner)}</h1><p class="subtle">${a===b?'Beide waren gleich stark.':'gewinnt dieses Duell.'}</p><div class="duel-score" style="margin-top:18px"><div class="duel-player"><span>${esc(duelState.players[0])}</span><b>${a}</b></div><div class="vs">:</div><div class="duel-player"><span>${esc(duelState.players[1])}</span><b>${b}</b></div></div><div class="toolbar" style="justify-content:center"><button class="btn primary" onclick="openDuel()">Noch einmal</button><button class="btn ghost" onclick="show('home')">Startseite</button></div></div>`}else{const sc=duelState.scores[0];root.innerHTML=`<div class="qcard" style="text-align:center;max-width:650px;margin:auto"><span class="tag">Challenge ${duelState.code}</span><div class="score">${sc}</div><h2>Punkte</h2><p class="subtle">Geben Sie denselben Code einer zweiten Person. Sie erhält auf ihrem Gerät dieselben 15 Aufgaben und kann das Ergebnis direkt vergleichen.</p><div class="code-box">${duelState.code}</div><div class="toolbar" style="justify-content:center"><button class="btn primary" onclick="startCodeChallenge()">Erneut spielen</button><button class="btn ghost" onclick="openDuel()">Neuer Code</button></div></div>`}}

  // Prüfungskarten leicht aufwerten und Hören nicht erwähnen.
  const oldOpenExam=openExam;
  openExam=function(){oldOpenExam();const ex=document.getElementById('exam');if(ex){const first=ex.querySelector('.backrow');if(first)first.insertAdjacentHTML('afterend','<div class="notice" style="margin-bottom:14px"><b>Prüfungslogik:</b> Eine Antwort wird sofort sichtbar markiert, aber erst nach der Abgabe bewertet.</div>')}};

  // Nach den Overrides Startseite erneut rendern.
  renderHome();refreshTop();
})();
</script>

<script>if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});</script>

<script id="v8-local-social-script">
(function(){
  // ---------------- BASIS & STATE ----------------
  const main=document.querySelector('main.content');
  ['trainingHub','memoryLab','writingAcademy','writingStudio','sprachLab','community','profile','friendProfile'].forEach(id=>{
    if(!document.getElementById(id)){const s=document.createElement('section');s.id=id;s.className='view';main.appendChild(s)}
  });
  function uid(){return 'u_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5)}
  function ensureProState(){
    state.social=state.social||{};
    state.social.profile=Object.assign({id:uid(),name:'Deutschlerner',username:'',photo:'',bio:'',visibility:'friends'},state.social.profile||{});
    state.social.friends=Array.isArray(state.social.friends)?state.social.friends:[];
    state.social.duelHistory=Array.isArray(state.social.duelHistory)?state.social.duelHistory:[];
    state.social.challenges=state.social.challenges||{};
    state.writing=state.writing||{};
    state.writing.drafts=state.writing.drafts||{};
    state.writing.checks=state.writing.checks||{};
    save();
  }
  ensureProState();
  const profile=()=>state.social.profile;
  function initials(name){return (name||'D').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'D'}
  function avatarHTML(p,cls='profile-avatar'){return `<div class="${cls}">${p.photo?`<img src="${p.photo}" alt="Profilbild">`:esc(initials(p.name))}</div>`}
  function areaStats(){const pairs=[['Wortschatz','Wortschatz'],['VerbPräp','Präpositionen'],['Grammatik','Grammatik'],['Kollokation','Kollokationen'],['Lesen','Lesen'],['Schreiben','Schreiben'],['Sprechen','Sprechen']];return pairs.map(([c,l])=>({c,l,...catAccuracy(c)}))}
  function topAreas(){return areaStats().filter(x=>x.s>0).sort((a,b)=>b.pct-a.pct).slice(0,3)}
  function weakAreasV8(){return areaStats().filter(x=>x.s>=3).sort((a,b)=>a.pct-b.pct).slice(0,3)}
  function profileSnapshot(includePhoto=true){const a=overallAccuracy();return{v:1,id:profile().id,name:profile().name,username:profile().username,photo:includePhoto?profile().photo:'',bio:profile().bio,xp:state.xp||0,streak:state.streak||0,day:planDay(),accuracy:a.pct,attempts:a.attempts,areas:areaStats().map(x=>({c:x.c,l:x.l,pct:x.pct,s:x.s})),updated:todayISO()}}
  function b64uEncode(obj){const txt=encodeURIComponent(JSON.stringify(obj)).replace(/%([0-9A-F]{2})/g,(_,p)=>String.fromCharCode(parseInt(p,16)));return btoa(txt).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
  function b64uDecode(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);let pct='';for(let i=0;i<bin.length;i++)pct+='%'+bin.charCodeAt(i).toString(16).padStart(2,'0');return JSON.parse(decodeURIComponent(pct))}
  function encodeCard(prefix,obj){return prefix+'.'+b64uEncode(obj)}
  function decodeCard(code,prefix){code=String(code||'').trim();if(!code.startsWith(prefix+'.'))throw new Error('Ungültiger Code');return b64uDecode(code.slice(prefix.length+1))}
  async function copyText(txt,msg='Kopiert.'){try{await navigator.clipboard.writeText(txt);toast(msg)}catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(msg)}}
  async function shareText(title,text){if(navigator.share){try{await navigator.share({title,text});return}catch(e){}}copyText(text,'Code kopiert.')}
  function openCodeModal(title,help,onImport){document.getElementById('modalBody').innerHTML=`<span class="tag">Offline & privat</span><h2>${esc(title)}</h2><p>${esc(help)}</p><textarea id="v8ImportCode" class="share-code" placeholder="Code hier einfügen …"></textarea><div class="toolbar"><button class="btn primary" id="v8ImportBtn">Importieren</button><button class="btn ghost" onclick="closeModal()">Abbrechen</button></div>`;openModal();document.getElementById('v8ImportBtn').onclick=()=>{const v=document.getElementById('v8ImportCode').value.trim();if(!v)return;try{onImport(v);closeModal()}catch(e){toast('Code konnte nicht gelesen werden.')}}}

  // ---------------- HEADER / NAVIGATION ----------------
  function refreshAvatar(){const top=document.querySelector('.topin');if(!top)return;let b=document.getElementById('v8AvatarBtn');if(!b){b=document.createElement('button');b.id='v8AvatarBtn';b.className='v8-avatar-btn';b.onclick=()=>{if(typeof window.openProfile==='function')window.openProfile()};top.appendChild(b)}b.innerHTML=profile().photo?`<img src="${profile().photo}" alt="Profil">`:esc(initials(profile().name))}
  const nav=document.querySelector('.bottom-in');
  if(nav)nav.innerHTML=`
    <button class="nav active" data-v="home" onclick="show('home')"><span class="ni">⌂</span>Start</button>
    <button class="nav" data-v="learn" onclick="openLearn()"><span class="ni">▤</span>Lernen</button>
    <button class="nav" data-v="trainingHub" onclick="openTrainingHub()"><span class="ni">◎</span>Training</button>
    <button class="nav" data-v="exam" onclick="openExam()"><span class="ni">◉</span>Prüfung</button>
    <button class="nav" data-v="community" onclick="openCommunity()"><span class="ni">⚔</span>Community</button>`;
  // Avatar wird nach der vollständigen Initialisierung aktualisiert.
  document.querySelector('.brand b').textContent='B2 Beruf Lernstudio Pro';
  document.querySelector('.brand span').textContent='15-Tage-Intensiv · Lernen · Training · Prüfung · V9';

  // ---------------- STARTSEITE ----------------
  renderHome=function(){
    const d=planDay(),p=PLAN[d-1],acc=overallAccuracy(),due=dueCount(),dp=dayProgress(d),weak=weakAreasV8(),tops=topAreas();
    const learned=LEARN.vocab.filter(x=>(state.mastery['mem-'+x.id]||0)>=4).length;
    document.getElementById('home').innerHTML=`
      <div class="v8-hero">
        <span class="v8-kicker">Tag ${d} von 15 · ${phaseFor(d)} · ${esc(profile().name)}</span>
        <h1>${esc(p.title)}</h1>
        <p>${esc(p.focus)}. Heute zählt nicht, wie viel Sie ansehen, sondern wie viel Sie ohne Hilfe sicher abrufen und anwenden können.</p>
        <div class="v8-hero-actions"><button class="btn primary" onclick="openToday()">▶ Tagestraining starten</button><button class="btn ghost" onclick="startWordCycle(8)">◆ Wortschatz merken</button><button class="btn ghost" onclick="openWritingAcademy()">✎ Schreiben lernen</button></div>
        <div class="v8-path"><div class="step"><b>1</b>Verstehen</div><div class="step"><b>2</b>Abrufen</div><div class="step"><b>3</b>Anwenden</div><div class="step"><b>4</b>Prüfen</div></div>
      </div>
      <div class="v8-statrow">
        <div class="v8-stat"><span>Gesamtsicherheit</span><b>${acc.attempts?acc.pct+'%':'–'}</b></div>
        <div class="v8-stat"><span>Heute fällig</span><b>${due}</b></div>
        <div class="v8-stat"><span>Wörter sicher</span><b>${learned}</b></div>
        <div class="v8-stat"><span>Lernserie</span><b>${state.streak||0} 🔥</b></div>
      </div>

  function renderWritingStudio(){show('writingStudio');const s=writingSession,type=s.type,isB=type==='beschwerde',key=s.key,saved=state.writing.drafts[key]?.text||'',checks=writeChecklist(type);document.getElementById('writingStudio').innerHTML=`<div class="backrow"><button class="back" onclick="openWritingTrack('${type}')">←</button><div style="flex:1"><h1>${s.examMode?'Prüfungsmodus':'Geführtes Schreiben'} · ${isB?'Beschwerde':'Forumsbeitrag'}</h1><div class="sub">${s.examMode?'Hinweise reduziert. Der Selbstcheck kommt erst am Ende.':'Aufgabe lesen → planen → schreiben → selbst kontrollieren.'}</div></div>${s.examMode?`<span class="tag" id="writeTimer">20:00</span>`:''}</div><div class="write-layout"><div class="v8-stack"><div class="v8-card"><span class="v8-badge purple">${isB?'Originalaufgabe':'Thema aus Ihrer Sammlung'}${s.item.page?' · Seite '+s.item.page:''}</span><h3>Aufgabe</h3><div class="source-box">${esc(writingPromptText())}</div></div><div class="v8-card"><div class="section-head"><div><h2>Ihr Text</h2><p id="wordInfo">0 Wörter</p></div><button class="btn ghost sm" onclick="saveCurrentDraft()">Speichern</button></div><textarea id="writingText" class="writing-area" placeholder="Schreiben Sie hier …" oninput="writingWordCount()">${esc(saved)}</textarea><div class="toolbar"><button class="btn primary" onclick="finishWriting()">Selbstcheck öffnen</button><button class="btn ghost" onclick="saveCurrentDraft()">Entwurf speichern</button></div></div></div><div class="v8-stack">${s.examMode?'':`<div class="v8-card"><h3>Schreibplan</h3>${checks.map((c,i)=>`<div class="check-item"><input type="checkbox" id="plan${i}"><label for="plan${i}">${esc(c)}</label></div>`).join('')}</div><div class="v8-card"><h3>Redemittel</h3><p class="subtle">Antippen fügt die Formulierung in den Text ein.</p><div class="phrase-bank">${phraseItems(type).map(x=>`<div class="phrase" onclick="insertPhraseEncoded('${encodeURIComponent(x).replace(/\'/g,'%27')}')">${esc(x)}</div>`).join('')}<   // ---------------- OFFLINE CHALLENGES ----------------
  let v8Challenge=null;
  function hseed(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
  function rrng(seed){let x=hseed(seed)||123456789;return()=>{x+=0x6D2B79F5;let t=x;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
  function sshuffle(a,seed){a=[...a];const r=rrng(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function challengePool(theme){let p=allGeneratedTasks().filter(t=>!t.input&&Array.isArray(t.options)&&t.options.length>=2);if(theme==='vp')p=p.filter(t=>t.cat==='VerbPräp');if(theme==='vocab')p=p.filter(t=>t.cat==='Wortschatz');if(theme==='grammar')p=p.filter(t=>['Grammatik','Kollokation'].includes(t.cat));if(theme==='sprach'){const blocks=[...(DATA.sprach1||[]),...(DATA.sprach2||[])];p=blocks.flatMap(originalSprachTasks)}return p}
  function challengeTasks(card){return sshuffle(challengePool(card.theme),card.seed).slice(0,card.n).map((t,i)=>({...t,options:sshuffle(t.options,card.seed+'-'+i)}))}
  function themeLabel(t){return({mix:'Gemischt',vp:'Verben + Präpositionen',vocab:'Wortschatz',grammar:'Grammatik',sprach:'Sprachbausteine'})[t]||t}
  window.createChallengeCard=function(target=''){const theme=document.getElementById('challengeTheme')?.value||'mix',n=+(document.getElementById('challengeN')?.value||15),card={v:1,id:'c_'+Math.random().toString(36).slice(2,9),seed:String(Math.floor(100000+Math.random()*900000))+'-'+Date.now().toString(36).slice(-4),theme,n,from:profile().name,fromId:profile().id,target,date:todayISO()},code=encodeCard('B2C1',card);window.__v8PendingChallenge=card;document.getElementById('modalBody').innerHTML=`<span class="tag">Challenge erstellt</span><h2>${esc(themeLabel(theme))} · ${n} Aufgaben</h2>${target?`<p>Für <b>${esc(target)}</b></p>`:''}<textarea id="challengeShare" class="share-code" readonly>${code}</textarea><div class="toolbar"><button class="btn primary" onclick="shareText('B2 Beruf Challenge',document.getElementById('challengeShare').value)">Teilen</button><button class="btn ghost" onclick="copyText(document.getElementById('challengeShare').value)">Kopieren</button><button class="btn dark" onclick="closeModal();startPendingChallenge()">Selbst spielen</button></div>`;openModal()};
  window.startPendingChallenge=function(){if(window.__v8PendingChallenge)startChallengeFromCard(window.__v8PendingChallenge)};
  window.importChallengeCard=function(){openCodeModal('Challenge importieren','Fügen Sie den B2C1-Code ein. Daraus entstehen auf jedem Gerät exakt dieselben Aufgaben.',code=>{const c=decodeCard(code,'B2C1');startChallengeFromCard(c)})};
  window.startChallengeFromCard=function(card){v8Challenge={card,tasks:challengeTasks(card),index:0,score:0,answered:false};show('community');renderV8Challenge()};
  function renderV8Challenge(){const root=document.getElementById('community'),c=v8Challenge;if(c.index>=c.tasks.length)return finishV8Challenge();const t=c.tasks[c.index],ctx=t.context||'';root.innerHTML=`<div class="backrow"><button class="back" onclick="openCommunity()">←</button><div style="flex:1"><h1>Challenge · ${esc(themeLabel(c.card.theme))}</h1><div class="sub">${esc(c.card.from||'Challenge')} · Aufgabe ${c.index+1}/${c.tasks.length}</div></div><span class="tag">${c.score} Punkte</span></div><div class="memory-progress"><span style="width:${Math.round(c.index/c.tasks.length*100)}%"></span></div><div class="qcard" style="margin-top:14px"><div class="qmeta"><span class="qkind">Offline-Duell</span><span class="qcount">${esc(t.cat)}</span></div><div class="question">${esc(t.prompt)}</div>${ctx?`<div class="example smart-context">${esc(ctx)}</div>`:''}<div class="options">${t.options.map((o,i)=>`<button class="opt" onclick="answerV8Challenge(${i})"><span class="ol">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="v8ChFeedback" class="feedback"></div><div id="v8ChNext" class="nextbar"><button class="btn primary" onclick="nextV8Challenge()">Weiter →</button></div></div>`}

  window.importResultCard=function(){openCodeModal('Ergebnis importieren','Fügen Sie den B2R1-Ergebniscode der anderen Person ein. Sie müssen dieselbe Challenge bereits gespielt haben.',code=>{const r=decodeCard(code,'B2R1'),mine=state.social.challenges[r.challenge?.id];if(!mine){toast('Diese Challenge wurde auf diesem Gerät noch nicht gespielt.');return}const exists=state.social.duelHistory.some(x=>x.challengeId===r.challenge.id&&x.otherId===r.playerId);if(!exists)state.social.duelHistory.push({challengeId:r.challenge.id,me:profile().name,other:r.player,myScore:mine.score,otherScore:r.score,otherId:r.playerId,theme:r.challenge.theme,themeLabel:themeLabel(r.challenge.theme),date:todayISO()});save();openCommunity();toast('Ergebnis verglichen.')})};

  // ---------------- PROGRESS OHNE HÖREN ----------------
  openProgress=function(){show('progress');const acc=overallAccuracy(),cats=[['VerbPräp','Verben + Präpositionen'],['Wortschatz','Wortschatz'],['Grammatik','Grammatik'],['Kollokation','Kollokationen'],['Lesen','Lesen'],['Schreiben','Schreiben'],['Sprechen','Sprechen']];document.getElementById('progress').innerHTML=`<div class="backrow"><button class="back" onclick="show('home')">←</button><div><h1>Lernanalyse</h1><div class="sub">Abrufsicherheit, Wiederholungen und aktive Schwächen.</div></div></div><div class="v8-statrow"><div class="v8-stat"><span>Gesamt</span><b>${acc.attempts?acc.pct+'%':'–'}</b></div><div class="v8-stat"><span>Aufgaben</span><b>${acc.attempts}</b></div><div class="v8-stat"><span>Fehler</span><b>${Object.keys(state.wrong).length}</b></div><div class="v8-stat"><span>Fällig</span><b>${dueCount()}</b></div></div><div class="v8-home-grid"><div class="v8-card"><h2>Bereiche</h2>${cats.map(([c,l])=>{const a=catAccuracy(c);return`<div class="skillbar"><span>${l}</span><div class="bar"><span style="width:${a.s?a.pct:0}%"></span></div><b>${a.s?a.pct+'%':'–'}</b></div>`}).join('')}</div><div class="v8-stack"><div class="v8-card"><h2>Wiederholungssystem</h2><p>Richtige Inhalte kommen nach 1, 2, 4, 7 und 10 Tagen zurück. Fehler werden noch am selben Tag priorisiert.</p><button class="btn primary" onclick="startWrongSession()">Fälliges trainieren</button></div><div class="v8-card"><h2>Datensicherheit</h2><p>Fortschritt, Profil, Freunde und Texte liegen lokal auf diesem Gerät.</p><div class="toolbar"><button class="btn ghost sm" onclick="exportProgress()">Backup exportieren</button><button class="btn ghost sm" onclick="resetPlan()">Sprint neu starten</button></div></div></div></div>`};

  // Alte Duell-Ansicht zugunsten der Community umleiten.
  window.openDuel=function(){openCommunity()};

  // App initial aktualisieren.
  refreshTop();refreshAvatar();renderHome();
})();
</script>

  window.copyText=async function(txt,msg='Kopiert.'){
    txt=String(txt||''); let ok=false;
    try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true}}catch(e){}
    if(!ok){
      const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
      try{ok=document.execCommand('copy')}catch(e){};
      if(!ok){ta.style.opacity='1';ta.style.position='fixed';ta.style.left='8px';ta.style.right='8px';ta.style.bottom='80px';ta.style.zIndex='99999';ta.removeAttribute('readonly');toast('Code markiert. Im Browsermenü „Kopieren“ wählen.');setTimeout(()=>{try{ta.remove()}catch(e){}},7000);return}
      ta.remove();
    }
    toast(msg);
  };

  // -------- multilingual help after answers --------
  function baseIdFromTask(t){
    const s=String((t&&t.id)||''); const m=s.match(/(vp\d+|nv\d+|zv\d+|za\d+|zn\d+|v\d+)/); return m?m[1]:null;
  }
  function multiForTask(t){
    if(t&&t.multi)return t.multi;
    const id=baseIdFromTask(t); if(id&&V10_MULTI[id])return V10_MULTI[id];
    const ans=String((t&&t.answer)||'').toLowerCase();
    if(ans){
      const vx=LEARN.vocab.find(x=>x.de.toLowerCase()===ans);if(vx&&V10_MULTI[vx.id])return V10_MULTI[vx.id];
      const nv=LEARN.collocations.find(x=>x.de.toLowerCase()===ans);if(nv&&V10_MULTI[nv.id])return V10_MULTI[nv.id];
      const zz=LEARN.zuInf.find(x=>x.word.toLowerCase()===ans);if(zz&&V10_MULTI[zz.id])return V10_MULTI[zz.id];
    }
    return null;
  }

  // -------- deterministic utilities --------
  function hashSeed(s){let h=2166136261>>>0;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
  function rng(seed){let x=hashSeed(seed)||123456789;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return((x>>>0)%1000000)/1000000}}
  function seededShuffle(arr,seed){const a=[...arr],r=rng(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function choiceDistractors(items,correct,n,seed){return seededShuffle([correct,...seededShuffle(items.filter(x=>x!==correct),seed).slice(0,n-1)],seed+'o')}
  function blankPrep(ex,prep){const re=new RegExp('\\b'+prep.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+'\\b','i');return ex.replace(re,'___')}

  window.startWordPower=function(n=8){
    const words=[...LEARN.vocab].sort((a,b)=>((isDue('mem-'+a.id)?-20:0)+(state.mastery['mem-'+a.id]||0))-((isDue('mem-'+b.id)?-20:0)+(state.mastery['mem-'+b.id]||0))||Math.random()-.5).slice(0,n);

      const masked=x.example.replace(new RegExp(x.de.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&'),'i'),'___');
      tasks.push({id:'mem-'+x.id+'-context',cat:'Wortschatz',kind:'2 · Kontext',prompt:masked===x.example?`Welcher Begriff passt zu dieser Situation? ${x.definition}`:masked,options:choiceDistractors(allWords,x.de,4,x.id+'c'),answer:x.de,explain:`Im beruflichen Kontext passt ${x.de}.`,postExample:x.example});
      tasks.push({id:'mem-'+x.id+'-active',cat:'Wortschatz',kind:'4 · Aktiv abrufen',prompt:`Schreiben Sie den deutschen Begriff: ${x.definition}`,input:true,answer:x.de,explain:`Aktiver Abruf: ${x.de}.`,postExample:x.example});

><div id="hostLiveSteps"></div></div><div class="v8-card"><span class="v8-badge good">Person B</span><h2>Duell beitreten</h2><p>Code von Person A einfügen und Antwortcode zurücksenden.</p><button class="btn dark" onclick="joinLiveOffer()">Angebot einfügen</button><div id="guestLiveSteps"></div></div></div><div class="safe-note" style="margin-top:14px"><span>ℹ</span><div><b>Grenze der kostenlosen P2P-Lösung:</b> In manchen Firmen-, Hotel- oder Mobilfunknetzen blockiert NAT/Firewall direkte Verbindungen. Dann funktionieren weiterhin die normalen Challenge-Codes ohne Live-Verbindung.</div></div>`}`}
  window.createLiveOffer=async function(){try{liveRole='host';livePC=makePC();wireDC(livePC.createDataChannel('b2duel'));const offer=await livePC.createOffer();await livePC.setLocalDescription(offer);await waitIce(livePC);const code='B2LIVE-O.'+enc(livePC.localDescription);const el=document.getElementById('hostLiveSteps');el.innerHTML=`<h3 style="margin-top:14px">1 · Angebot senden</h3><textarea id="liveOfferCode" class="live-code" readonly>${code}</textarea><div class="toolbar"><button class="btn primary sm" onclick="shareText('B2 Live-Duell',document.getElementById('liveOfferCode').value)">Teilen</button><button class="btn ghost sm" onclick="copyText(document.getElementById('liveOfferCode').value)">Kopieren</button></div><h3>2 · Antwort der anderen Person</h3><textarea id="liveAnswerInput" class="live-code" placeholder="B2LIVE-A... hier einfügen"></textarea><button class="btn dark sm" onclick="acceptLiveAnswer()">Antwort verbinden</button>`}catch(e){toast('Live-Verbindung konnte nicht vorbereitet werden.')}};
  window.joinLiveOffer=async function(){document.getElementById('modalBody').innerHTML=`<span class="tag">Live-Duell</span><h2>Angebot einfügen</h2><textarea id="joinOffer" class="live-code" placeholder="B2LIVE-O..."></textarea><div class="toolbar"><button class="btn primary" id="joinOfferBtn">Verbinden</button><button class="btn ghost" onclick="closeModal()">Abbrechen</button></div>`;openModal();document.getElementById('joinOfferBtn').onclick=async()=>{try{const code=document.getElementById('joinOffer').value.trim();if(!code.startsWith('B2LIVE-O.'))throw new Error();closeModal();liveRole='guest';livePC=makePC();livePC.ondatachannel=e=>wireDC(e.channel);await livePC.setRemoteDescription(dec(code.slice(9)));const ans=await livePC.createAnswer();await livePC.setLocalDescription(ans);await waitIce(livePC);const ac='B2LIVE-A.'+enc(livePC.localDescription);const el=document.getElementById('guestLiveSteps');el.innerHTML=`<h3 style="margin-top:14px">Antwort an Person A senden</h3><textarea id="guestAnswerCode" class="live-code" readonly>${ac}</textarea><div class="toolbar"><button class="btn primary sm" onclick="shareText('B2 Live-Duell Antwort',document.getElementById('guestAnswerCode').value)">Teilen</button><button class="btn ghost sm" onclick="copyText(document.getElementById('guestAnswerCode').value)">Kopieren</button></div><p class="subtle">Sobald Person A diesen Code einfügt, wird die Verbindung automatisch hergestellt.</p>`}catch(e){toast('Angebot ungültig oder Verbindung nicht möglich.')}}};
  window.acceptLiveAnswer=async function(){try{const code=document.getElementById('liveAnswerInput').value.trim();if(!code.startsWith('B2LIVE-A.'))throw new Error();await livePC.setRemoteDescription(dec(code.slice(9)));toast('Antwort übernommen – Verbindung wird aufgebaut.')}catch(e){toast('Antwortcode ungültig.')}};

  function makeLiveTasks(theme,n,seed){let tasks=[];const add=x=>tasks.push(x);const r=seededShuffle;const preps=[...new Set(LEARN.verbPrep.map(x=>x.prep))];if(theme==='mix'||theme==='vocab')r(LEARN.vocab,'lv'+seed).slice(0,theme==='vocab'?n:Math.ceil(n/4)).forEach(x=>add({id:x.id,cat:'Wortschatz',prompt:x.definition,options:choiceDistractors(LEARN.vocab.map(y=>y.de),x.de,4,x.id+seed),answer:x.de,postExample:x.example}));if(theme==='mix'||theme==='vp')r(LEARN.verbPrep,'lp'+seed).slice(0,theme==='vp'?n:Math.ceil(n/4)).forEach(x=>add({id:x.id,cat:'Verben + Präp.',prompt:`Welche Präposition gehört zu „${x.verb}“?`,options:choiceDistractors(preps,x.prep,4,x.id+seed),answer:x.prep,postExample:x.example}));if(theme==='mix'||theme==='grammar'||theme==='sprach')r(LEARN.grammar,'lg'+seed).slice(0,(theme==='grammar'||theme==='sprach')?n:Math.ceil(n/4)).forEach(x=>add({id:x.id,cat:'Grammatik',prompt:x.prompt,options:x.options,answer:x.answer}));if(theme==='mix')r(LEARN.collocations,'ln'+seed).slice(0,Math.ceil(n/4)).forEach(x=>add({id:x.id,cat:'Kollokation',prompt:'Welche feste Verbindung passt?',options:choiceDistractors(LEARN.collocations.map(y=>y.de),x.de,4,x.id+seed),answer:x.de,postExample:x.example}));return r(tasks,'final'+seed).slice(0,n)}
  window.startLiveGame=function(){if(!liveConnected()||liveRole!=='host')return;const theme=document.getElementById('liveTheme').value,n=+document.getElementById('liveN').value,seed=Date.now().toString(36),tasks=makeLiveTasks(theme,n,seed);liveGame={tasks,index:0,score:0,oppScore:0,oppIndex:0,answered:false,oppDone:false,theme};sendLive({type:'game',tasks,theme});renderLiveGame()};

  function renderLiveScoreOnly(){const e=document.getElementById('liveScoreBar');if(e)e.innerHTML=liveScoreHtml()}
  window.answerLive=function(i){if(!liveGame||liveGame.answered)return;liveGame.answered=true;const t=liveGame.tasks[liveGame.index],ok=norm(t.options[i])===norm(t.answer);if(ok)liveGame.score++;document.querySelectorAll('#liveDuel .opt').forEach((b,j)=>{b.disabled=true;if(norm(t.options[j])===norm(t.answer))b.classList.add('correct');else if(j===i)b.classList.add('wrong')});const f=document.getElementById('liveFeedback');f.className='feedback show '+(ok?'ok':'no');f.innerHTML=`<b>${ok?'Richtig':'Noch nicht'}</b>Lösung: ${esc(t.answer)}${t.postExample?`<div class="memory-example">${esc(t.postExample)}</div>`:''}${multiPanel(t)}`;document.getElementById('liveNext').classList.add('show');sendLive({type:'progress',score:liveGame.score,index:liveGame.index+1,done:false});record(t.cat,t.id+'-live',ok);renderLiveScoreOnly()};
  window.nextLive=function(){if(!liveGame)return;liveGame.index++;liveGame.answered=false;if(liveGame.index>=liveGame.tasks.length){sendLive({type:'progress',score:liveGame.score,index:liveGame.index,done:true});renderLiveFinish()}else renderLiveGame()};
  function renderLiveFinish(){show('liveDuel');if(!liveGame)return;const both=liveGame.oppDone;document.getElementById('liveDuel').innerHTML=`<div class="qcard" style="max-width:720px;margin:auto;text-align:center"><span class="tag">Live-Duell beendet</span>${liveScoreHtml()}<h2>${both?(liveGame.score>liveGame.oppScore?'Sieg!':liveGame.score<liveGame.oppScore?'Niederlage':'Remis'):'Warten auf den Mitspieler …'}</h2><p class="subtle">${both?'Beide Ergebnisse sind angekommen.':'Sie können diese Ansicht geöffnet lassen; der gegnerische Endstand wird automatisch aktualisiert.'}</p><div class="toolbar" style="justify-content:center"><button class="btn primary" onclick="renderLiveLobby()">Lobby</button><button class="btn ghost" onclick="disconnectLive();openCommunity()">Verbindung trennen</button></div></div>`}

  function p(){state.social=state.social||{};state.social.profile=state.social.profile||{id:'',name:'Deutschlerner',username:'',photo:'',bio:''};return state.social.profile}
  function initials11(name){return (name||'B').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'B'}
  function avatar11(row,cls='online-avatar'){const src=row?.avatar_url||'';return `<div class="${cls}">${src?`<img src="${esc(src)}" alt="Profil">`:esc(initials11(row?.display_name||row?.username||'B'))}</div>`}
  function tlabel(t){return({mix:'Gemischt',vp:'Verben + Präpositionen',vocab:'Wortschatz',grammar:'Grammatik',sprach:'Sprachbausteine'})[t]||t}
  function cloudMeta(){try{return JSON.parse(localStorage.getItem(CLOUD_META_KEY)||'{}')}catch(_){return{}}}
  function setCloudMeta(v){localStorage.setItem(CLOUD_META_KEY,JSON.stringify(v||{}))}
  function isMeaningfulCloudState(x){return !!(x&&typeof x==='object'&&(x.xp>0||Object.keys(x.stats||{}).length||Object.keys(x.mastery||{}).length||Object.keys(x.review||{}).length||Object.keys(x.wrong||{}).length||Object.keys(x.writing?.drafts||{}).length))}
  function isMeaningfulLocalState(){return isMeaningfulCloudState(state)}
  function currentView(){return document.querySelector('.view.active')?.id||''}
  function setSyncStatus(s){syncState=s;refreshCloudBadge()}
  function fmtTime(d){if(!d)return'noch nicht';try{return new Date(d).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}catch(_){return'–'}}

  function refreshCloudBadge(){
    const top=document.querySelector('.topin');if(!top)return;
    let b=document.getElementById('cloudBadge');
    if(!b){b=document.createElement('button');b.id='cloudBadge';b.className='cloud-badge';b.onclick=()=>openDeviceSync();const av=document.getElementById('v8AvatarBtn');top.insertBefore(b,av||null)}
    const cls=syncState==='online'?'on':syncState==='syncing'?'syncing':syncState==='error'?'err':'';
    b.className='cloud-badge '+cls;
    b.innerHTML=`<span class="dot"></span><span class="cloud-label">${cloudUser?(syncState==='syncing'?'Sync…':syncState==='error'?'Cloud-Fehler':'Cloud'):'Anmelden'}</span>`;
    b.title=cloudUser?`Cloud-Sync · ${cloudUser.email||''}`:'Cloud-Konto anmelden';
  }

  function refreshAfterRemote(){
    try{if(typeof refreshTop==='function')refreshTop();if(typeof window.openProfile==='function'&&currentView()==='profile')window.openProfile();if(currentView()==='home')renderHome();if(currentView()==='progress'&&typeof openProgress==='function')openProgress()}catch(_){}
    try{const av=document.getElementById('v8AvatarBtn');if(av)av.innerHTML=p().photo?`<img src="${esc(p().photo)}" alt="Profil">`:esc(initials11(p().name))}catch(_){}
  }

  window.save=save=function(){oldLocalSave();if(!cloudApplying&&cloudUser)scheduleCloudPush()};
  function scheduleCloudPush(delay=900){clearTimeout(syncTimer);syncTimer=setTimeout(()=>pushCloudState(false),delay)}

  async function pushCloudState(interactive=false){
    if(!sb||!cloudUser||cloudApplying)return false;
    clearTimeout(syncTimer);setSyncStatus('syncing');
    try{
      p().id=cloudUser.id;
      const payload=JSON.parse(JSON.stringify(state));
      const {data,error}=await sb.from('app_state').upsert({user_id:cloudUser.id,state:payload,updated_by:deviceId},{onConflict:'user_id'}).select('revision,updated_at').single();
      if(error)throw error;
      setCloudMeta({userId:cloudUser.id,revision:data?.revision||0,updatedAt:data?.updated_at||new Date().toISOString()});
      lastSyncAt=data?.updated_at||new Date().toISOString();
      await syncProfileToCloud(false);
      setSyncStatus('online');
      if(interactive)toast('Cloud synchronisiert.');
      return true;
    }catch(e){console.error('B2 cloud push',e);setSyncStatus('error');if(interactive)toast('Cloud-Synchronisierung fehlgeschlagen.');return false}
  }

  async function pullCloudState(initial=false){
    if(!sb||!cloudUser)return false;
    setSyncStatus('syncing');
    try{
      const {data,error}=await sb.from('app_state').select('state,revision,updated_at,updated_by').eq('user_id',cloudUser.id).single();
      if(error)throw error;
      const remote=data?.state||{};
      if(!isMeaningfulCloudState(remote)&&isMeaningfulLocalState()){
        await pushCloudState(initial);return true;
      }
      if(isMeaningfulCloudState(remote)){
        cloudApplying=true;
        state=Object.assign(defaultState(),remote);
        state.social=state.social||{};state.social.profile=Object.assign({id:cloudUser.id,name:'Deutschlerner',username:'',photo:'',bio:'',visibility:'friends'},state.social.profile||{});state.social.profile.id=cloudUser.id;
        oldLocalSave();
        cloudApplying=false;
        setCloudMeta({userId:cloudUser.id,revision:data.revision||0,updatedAt:data.updated_at});lastSyncAt=data.updated_at;
        refreshAfterRemote();
      }
      await syncProfileToCloud(false);
      setSyncStatus('online');
      if(initial&&isMeaningfulCloudState(remote))toast('Lernstand aus der Cloud geladen.');
      return true;
    }catch(e){cloudApplying=false;console.error('B2 cloud pull',e);setSyncStatus('error');return false}
  }

  async function applyRealtimeState(row){
    if(!row||!cloudUser||row.updated_by===deviceId)return;
    const meta=cloudMeta();if((row.revision||0)<=(meta.revision||0))return;
    if(!row.state||!isMeaningfulCloudState(row.state))return;
    cloudApplying=true;
    state=Object.assign(defaultState(),row.state);
    state.social=state.social||{};state.social.profile=Object.assign({id:cloudUser.id,name:'Deutschlerner',username:'',photo:'',bio:'',visibility:'friends'},state.social.profile||{});state.social.profile.id=cloudUser.id;
    oldLocalSave();cloudApplying=false;
    setCloudMeta({userId:cloudUser.id,revision:row.revision||0,updatedAt:row.updated_at});lastSyncAt=row.updated_at;setSyncStatus('online');refreshAfterRemote();toast('Fortschritt von einem anderen Gerät synchronisiert.');
  }

  async function syncProfileToCloud(interactive=false){
    if(!sb||!cloudUser)return false;
    const pp=p(),a=overallAccuracy();
    const username=(pp.username||'').trim().toLowerCase()||null;
    const payload={display_name:(pp.name||'Deutschlerner').trim()||'Deutschlerner',username,bio:pp.bio||'',avatar_url:pp.photo||null,xp:state.xp||0,streak:state.streak||0,accuracy:a.attempts?a.pct:0,last_seen:new Date().toISOString()};
    const {error}=await sb.from('profiles').update(payload).eq('id',cloudUser.id);
    if(error){console.error('B2 profile sync',error);if(interactive){if(error.code==='23505')toast('Dieser Benutzername ist bereits vergeben.');else toast('Profil konnte nicht online gespeichert werden.')}return false}
    if(interactive)toast('Profil online gespeichert.');
    return true;
  }

  async function initUser(sessionUser,initial=true){
    cloudUser=sessionUser||null;refreshCloudBadge();
    if(!cloudUser){stopRealtime();setSyncStatus('offline');return}
    p().id=cloudUser.id;
    await pullCloudState(initial);await loadCloudCommunity(false);startRealtime();refreshCloudBadge();
  }

  function stopRealtime(){if(cloudChannel&&sb){try{sb.removeChannel(cloudChannel)}catch(_){}}cloudChannel=null}
  function startRealtime(){
    stopRealtime();if(!sb||!cloudUser)return;
    cloudChannel=sb.channel('b2-v11-'+cloudUser.id+'-'+deviceId)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'app_state',filter:`user_id=eq.${cloudUser.id}`},p=>applyRealtimeState(p.new))
      .on('postgres_changes',{event:'*',schema:'public',table:'friend_requests'},()=>communityChanged())
      .on('postgres_changes',{event:'*',schema:'public',table:'friendships'},()=>communityChanged())
      .on('postgres_changes',{event:'*',schema:'public',table:'challenges'},()=>communityChanged())
      .on('postgres_changes',{event:'*',schema:'public',table:'challenge_attempts'},()=>communityChanged())
      .subscribe();
  }
  let communityRefreshTimer=null;
  function communityChanged(){clearTimeout(communityRefreshTimer);communityRefreshTimer=setTimeout(async()=>{await loadCloudCommunity(false);if(currentView()==='community'&&!onlineGame)renderCloudCommunity()},350)}

  async function initCloud(){
    document.querySelector('.brand span').textContent='15-Tage-Intensiv · Lernen · Training · Prüfung · Cloud Sync · V11';
    refreshCloudBadge();
    if(!window.supabase?.createClient){setSyncStatus('error');console.warn('Supabase library unavailable');return}
    try{
      sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'b2-beruf-v11-auth'}});
      sb.auth.onAuthStateChange((event,session)=>{if(event==='INITIAL_SESSION')return;setTimeout(()=>initUser(session?.user||null,event==='SIGNED_IN'),0)});
      const {data}=await sb.auth.getSession();await initUser(data?.session?.user||null,true);try{renderHome()}catch(_){};
    }catch(e){console.error('B2 cloud init',e);setSyncStatus('error')}
  }

  async function loadCloudCommunity(render=true){
    if(!sb||!cloudUser)return;communityLoading=true;
    try{
      const [fr,req,ch,at]=await Promise.all([
        sb.from('friendships').select('friend_id,created_at').order('created_at',{ascending:false}),
        sb.from('friend_requests').select('*').eq('status','pending').order('created_at',{ascending:false}),
        sb.from('challenges').select('*').order('created_at',{ascending:false}).limit(40),
        sb.from('challenge_attempts').select('*').order('submitted_at',{ascending:false}).limit(100)
      ]);
      if(fr.error)throw fr.error;if(req.error)throw req.error;if(ch.error)throw ch.error;if(at.error)throw at.error;
      const ids=new Set([cloudUser.id]);fr.data.forEach(x=>ids.add(x.friend_id));req.data.forEach(x=>{ids.add(x.sender_id);ids.add(x.receiver_id)});ch.data.forEach(x=>{ids.add(x.creator_id);ids.add(x.opponent_id)});
      let profiles=[];if(ids.size){const pr=await sb.from('profiles').select('id,username,display_name,bio,avatar_url,xp,streak,accuracy,last_seen').in('id',[...ids]);if(pr.error)throw pr.error;profiles=pr.data||[]}
      const pm=Object.fromEntries(profiles.map(x=>[x.id,x]));
      cloudData={friends:fr.data.map(x=>pm[x.friend_id]).filter(Boolean),requests:req.data||[],challenges:ch.data||[],attempts:at.data||[],profiles:pm};
    }catch(e){console.error('B2 community load',e);toast('Online-Community konnte nicht geladen werden.')}finally{communityLoading=false}
    if(render&&currentView()==='community'&&!onlineGame)renderCloudCommunity();
  }

  function challengeRow(c,ats){
    const otherId=c.creator_id===cloudUser.id?c.opponent_id:c.creator_id,other=cloudData.profiles[otherId]||{},mine=ats.find(a=>a.user_id===cloudUser.id),theirs=ats.find(a=>a.user_id===otherId),done=mine&&theirs;
    const status=done?`${mine.score}:${theirs.score}`:mine?'wartet auf Gegner':c.status==='pending'?'neu':'offen';
    return `<div class="cloud-challenge"><div><h4>${esc(tlabel(c.theme))} · ${c.question_count} Aufgaben</h4><p>gegen ${esc(other.display_name||other.username||'Freund')} · ${new Date(c.created_at).toLocaleDateString('de-DE')}</p><span class="cloud-pill ${done?'green':mine?'amber':''}">${esc(status)}</span></div><div>${mine?`<button class="btn ghost sm" onclick="cloudShowChallengeResult('${c.id}')">Ergebnis</button>`:`<button class="btn primary sm" onclick="cloudPlayChallenge('${c.id}')">Spielen</button>`}</div></div>`
  }
